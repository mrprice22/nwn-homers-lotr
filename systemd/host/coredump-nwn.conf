# Keep nwserver crashes around long enough to act on a player's bug report.
#
# See systemd/host/README.md in this repo for why, for the companion
# /etc/tmpfiles.d/coredump.conf that lifts the 5-day vacuum, and for the warning
# that a core contains the dm/admin passwords and must not be shared.
#
# Not installed by bin/season-units.sh — this is root-owned system config.
[Coredump]
# Compressed on disk; an nwserver core is ~35-50MB. This box has ONE spinning
# disk shared with the live season, so the cap is deliberate rather than
# generous: check `du -sh /var/lib/systemd/coredump` now and then.
Storage=external
Compress=yes
MaxUse=2G
KeepFree=5G
# nwserver is ~260GB of virtual address space but only ~200-500MB resident;
# these keep a pathological map from writing a core nobody can store.
ProcessSizeMax=4G
ExternalSizeMax=4G
