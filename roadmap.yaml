  - id: faction-rally-rescue
    title: "Faction rally: pre-death muster call + timed rescue quest"
    group: quests-areas
    epic: faction-quest-system
    status: soon
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-23"
    notes: "<div>Today certain landmark defenders shout “Rally Free Peoples of Middle Earth!” / “Rally Servants of Sauron!” only as they <b>die</b> — too late to matter. This refactors the rally so the same NPCs call for aid <b>before</b> they fall: same-faction players get a muster alert + a journal entry, and if they reach the fight in time to help they earn XP, gold, and faction standing. A living, reactive world where your side's landmarks can actually be saved (or lost).</div>"
    impl_notes: "<div><b>Existing system:</b> rally shouts are hardcoded per-creature via the blueprint ScriptDeath field (area-local SpeakString(TALKVOLUME_SHOUT)) — scripts breachdeath4 (Rivendell), dolguldurshout/skinnerdeath/staticspawndol (Dol Guldur), staticspawnisen (Isengard), staticspawncarn (Carn Dum), taticspawnedoras (Edoras), etc. Three (staticspawnhelms/staticspawnminas/staticspawnloth) are orphaned/unwired. <b>Proposed build (reuse, not new engine work):</b> hook the bestiary OnDamaged wrapper bst_ondamage.nss (already rewires every creature's OnDamaged) so a flagged rally creature dropping below a HP% threshold fires ONCE: a server-wide same-faction broadcast (GetFirstPC/GetNextPC + SendMessageToPC, per bst_ondeath/skinnerdeath), AddJournalQuestEntry to aligned players, and marks its area ‘rally-active’ via the shipped worldstate_inc.nss. A rescuer who reaches the area/creature (GetArea/GetDistanceToObject) within the window (DelayCommand, per q_sow_plant) completes for XP + gold + Faction_AdjustStanding(side,+pts) (faction_db, shipped). Reward/muster template: the q_kwn_* Knight-of-Westernesse quest. Alignment side read from faction_db allegiance. Sets up [[pvp-faction-points]] (the rally-active area flag).</div>"
    design_questions:
      - question: "HP threshold + rescue window. Proposed: the pre-death rally fires when the landmark defender drops below 50% HP, and the rescue window is 60s (aligned players who reach the area within 60s and help complete it). Approve 50% / 60s, or set different values?"
        status: open
        answer: null
        question_h: 64
        answer_h: 64
      - question: "Which creatures rally, and how are they flagged? Proposed: reuse the existing set that already rally-shouts on death (keyed by side from their current ScriptDeath), plus re-wire the 3 orphan scripts (Helm's Deep / Minas Tirith / Lothlorien). Flag them with a creature local var (e.g. RALLY_SIDE = Good/Evil) set at spawn so bst_ondamage knows who is a landmark defender. Approve, or should only a hand-picked list of named landmark bosses trigger it (to avoid trash mobs spamming rally calls)?"
        status: open
        answer: null
        question_h: 64
        answer_h: 64
      - question: "Reward + completion rule. Proposed per successful rescue: modest XP + gold scaled to the creature's CR, and +50 faction standing (via Faction_AdjustStanding, so the -25% opposite bleed applies). Completion = the rescuer arrives AND the defender is still alive when the wave is beaten (not merely arriving). Approve the amounts + &lsquo;arrive and win&rsquo; rule, or prefer &lsquo;arrive in time&rsquo; only / different numbers?"
        status: open
        answer: null
        question_h: 64
        answer_h: 64
    manual_steps:
      - step: "On approval this is a scripting build (bst_ondamage hook + a rally include over worldstate_inc + a rescue quest journal category + reward). No new blueprints expected; wave/creature flags are blueprint/spawn edits. Re-promote to confirmed after the design questions are answered."
        status: open
        kind: toolset
        step_h: 64
  - id: pvp-faction-points
    title: "Faction points for PVP kills during active rally calls"
    group: quests-areas
    epic: faction-quest-system
    status: soon
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-23"
    notes: "<div>When a landmark is under attack and its defenders have called for aid, cutting down enemy <b>players</b> who came to sack it should count. This rewards faction standing for slaying opposite-faction players — but only in the heat of an active rally (not open-field ganking), so PVP matters exactly where the war is being fought.</div>"
    impl_notes: "<div><b>Depends on [[faction-rally-rescue]]</b> (the ‘rally-active’ area flag it sets in worldstate_inc). Proposed build: hook the module OnPlayerDeath — if GetLastKiller is a PC whose faction_db allegiance is OPPOSITE the victim's, AND the death area is currently rally-active, award Faction_AdjustStanding(killerSide,+pts). Anti-farm: a per (killer+victim) cooldown via the existing quest_cd_inc.nss so repeatedly killing the same low-level alt does not farm standing; ignore same-allegiance and Neutral kills. Reuses faction_db + quest_cd_inc + the rally-active world-state; no new infra.</div>"
    design_questions:
      - question: "Points + anti-farm. Proposed: +25 faction standing per qualifying PVP kill, with a per-victim cooldown of ~30 real minutes (quest_cd_inc) so the same target cannot be farmed. Approve the amount + cooldown, or set your own?"
        status: open
        answer: null
      - question: "Eligibility. Proposed: both players must be non-Neutral and on opposite sides, the kill must be in a rally-active area, and it respects the server PvP setting (no new PvP rules — if the server disallows PvP there, no kill happens anyway). Approve, or add extra conditions (e.g. both must have the rally quest active, minimum level, no reward for killing much-lower-level players)?"
        status: open
        answer: null
    manual_steps:
      - step: "Blocked until faction-rally-rescue ships the rally-active area flag. Then: wire the OnPlayerDeath check + Faction_AdjustStanding + quest_cd_inc anti-farm. Re-promote once the dependency lands and the design questions are answered."
        status: open
        kind: admin
        blocker: true
