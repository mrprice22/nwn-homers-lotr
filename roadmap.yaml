  - id: gondor-scribe
    title: "Well of Souls Quest: No Gondor Scribe"
    group: quests-areas
    status: implemented
    type: Defect
    player: "Rajmund (Ray)"
    date: "2026-07-11"
    commit: 580bfd30ca4
    notes: "<div><span>Player report: the Well of Souls Quest may be broken as I cannot find any Gondor Scribe.</span></div><div><br></div><div><b>Root cause (confirmed):</b> the quest-giver NPC was designed but never created or placed. The gondorscribe conversation, journal category, condition/action scripts and the boss all exist, but no creature in the module carries the gondorscribe conversation, and ruinsofannuminas.git.json has zero static creatures. A 2026-05-28 pass only fixed a DLG Quest field name and missed the absent NPC.</div><div><br></div><div><b>Intended two-stage arc:</b> Hanee the Loon (Bree, b_oldwoman_con1) gives 'Ruin of Annuminas' -&gt; go north, kill Azagoth (CR 37, carries azagothshead) in the Ruins of Annuminas -&gt; return to Hanee for an intermediate 5,000 XP + a handoff to the Gondor wizards (she does NOT take the head) -&gt; take the head to the Gondor Scribe in the Tower of the High Wizard: Ground Floor (area011) for 10,000 XP (raised from 4,000) + the Annuminas Key, head consumed. Cold-start alt path: reach the scribe without the head and she starts the quest.</div><div><br></div><div><b>Build steps:</b> new gondorscribe.utc.json (base comfemale002, Tag GondorScribe, Conversation gondorscribe, FactionID 6); place one instance in area011.git/.gic near the wizards (use bin/place-helper.py, __struct_id 4 hardcoded); new sc_hanee_head.nss (StartingConditional: has azagothshead and not hanee_head_reward) + at_hanee_head.nss (RewardPartyXP 5000, set flag, journal entry 2, keep head); bump at_008.nss scribe reward 4000 -&gt; 10000; add Ruin of Annuminas journal entry 2 (End 1). Undecided: whether the Annuminas Key is also granted on the Hanee-first path (currently only on the scribe cold-start). Full draft in QUEST_FIX_well_of_souls_plan.md.</div><div><br></div><div><b>Fixed 2026-07-13:</b> built per the plan. New gondorscribe.utc.json (Plot=1 so the quest-giver can't be killed) placed in the Tower of the High Wizard: Ground Floor near the wizards (place-helper verified clear); new sc_hanee_head.nss / at_hanee_head.nss wired into Hanee's conversation (head turn-in: +5,000 XP, head kept, journal stage 2 pointing to the Gondor wizards); Ruin of Annuminas journal entry 2 added; scribe turn-in raised 4,000 → 10,000 XP (head consumed). Cold-start path at the scribe unchanged (accept → journal + Annuminas Key).</div><div><br></div><div><b>UAT:</b> (1) Hanee-first path: accept from Hanee in Bree → kill Azagoth in the Ruins of Annuminas → back to Hanee (+5k XP, keeps head, no repeat on re-talk) → Gondor Scribe in the Tower ground floor (+10k XP, head consumed, Well of Souls stage 2). (2) Cold-start: fresh character talks to the scribe → accept grants journal + Annuminas Key; later head turn-in pays 10k. (3) Regression: Hanee's plain greeting unchanged without the head; scribe is unkillable. <b>Open (non-blocking):</b> on the Hanee-first route the key still only comes from the scribe, so the ruins' four key chests (KeyRequired=0, pickable) are reached before the key exists — leave as-is, grant key at Hanee's handoff, or set KeyRequired=1: admin's call.</div>"
