ic-restricted Censer-Amulet; (3) L8/L15 gates hold; (4) at L8 the reliquary is granted, at L15 consumed and the Mace granted, journal advances 1-&gt;2-&gt;3(End); (5) amulet/mace unusable by non-clerics; (6) regression: Temple leash still fires from the wrapped OnEnter.</div>"
