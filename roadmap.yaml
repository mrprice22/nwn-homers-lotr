  - id: gondor-scribe-key-exploit
    title: "Well of Souls: quest re-acceptable and Annuminas Key farmable"
    group: quests-areas
    status: awarded
    merit_awarded: true
    type: Exploit
    player: "HomelessSon (Server Admin)"
    date: "2026-08-19"
    commit: 5c6f2528ab0
    notes: "<div><b>The Annuminas Key is now a reward for finishing the quest, not for starting it.</b> The Gondor Scribe used to hand it over the moment you agreed to help, before you had done anything at all -- and the whole briefing could be sat through again on the next conversation. She now gives you the key when you set Azagoth's head in front of her, once per character, ever. If you already finished the quest before this change, ask her again: she has your key waiting.</div><div><br></div><div><b>Your progress is remembered properly.</b> Whether you have taken the quest, and whether you have finished it, now survives logging out and server restarts, and your journal is written from the same record -- so the quest cannot be re-accepted, the briefing cannot be replayed, and the journal can no longer be rewound to the start by talking to her again. \"The Well of Souls\" also finally closes as a completed quest instead of sitting open forever. Hanee in Bree got the same treatment: her 5,000 XP for the news is now once per character too.</div><div><br></div><div><b>There are two scribes now.</b> One keeps a fire among the Ruins of Annuminas; the other sits at her desk in the Tower of the High Wizard in Minas Tirith, reading the expedition's dispatches. They no longer share one script of dialogue, so neither of them talks as though she is standing somewhere she is not. You can start the quest with either and turn the head in to either. Details: <a href=\"QuestGuide.html#well-of-souls\">Quest Guide → Well of Souls</a>.</div>"
    impl_notes: "<div><b>Root cause.</b> The only persistent state this quest had was the annu_key stamp (aaf3e1c6f0b). Everything else was a session local int -- azagothdead (at_013), azgiven (at_042, read nowhere at all) and hanee_head_reward -- so it cleared on relog. Worse, gondorscribe.dlg's StartingList fell through to the unconditional briefing entry 0, so the accept chain replayed on every conversation forever, and the key was granted at ACCEPT rather than at turn-in, which is what made re-accepting worth farming. The admin's offline repro was additionally masked by GetObjectUUID returning empty for an unsaved character, which makes every questcddb lookup miss.</div><div><br></div><div><b>New wos_inc.nss.</b> There is no NWScript getter for journal state (nwscript.nss has only AddJournalQuestEntry / RemoveJournalQuestEntry), so the journal cannot be the gate -- the DB is the gate and the journal is the display, written together in one call so they cannot drift. Storage is the existing questcddb / quest_cd table via quest_cd_inc: no new schema, no new init (QCD_InitDb already runs from onmoduleload.nss). Keys: wos_accept -&gt; journal \"The Well of Souls\" 1, wos_done -&gt; entry 2, and the pre-existing annu_key (name deliberately kept so characters who already drew a key are still recognised). API: WOS_Accepted / WOS_Done / WOS_KeyGiven / WOS_Accept / WOS_Complete / WOS_GiveKey / WOS_CanClaimKey. Journal writes pass bAllPartyMembers=FALSE, bAllPlayers=FALSE (matching acquireditem_tag.nss) so a bystander is not dragged into a stage they have not reached. WOS_Complete back-fills wos_accept for a cold-start player who killed Azagoth before ever taking the quest.</div><div><br></div><div><b>quest_cd_inc hardening.</b> New QCD_Ident(oPC): GetObjectUUID, falling back to \"k:\" + GetPCPublicCDKey + \"|\" + GetName when the UUID is empty. Replaces the five bare GetObjectUUID call sites. Additive and backward compatible -- a saved character always has a UUID, so existing rows keep matching -- but an unsaved test character no longer silently defeats every once-ever gate in the module (this include backs ~44 scripts).</div><div><br></div><div><b>Scripts.</b> at_007 no longer creates the key; it only calls WOS_Accept. at_008 (head turn-in) gained a WOS_Done guard so a second head cannot re-pay the 10,000 XP -- Azagoth respawns -- and now calls WOS_Complete + WOS_GiveKey. at_013 and sc_007 swapped the azagothdead local for the persistent stage. sc_003 ANDs !WOS_Done onto the has-head check. sc_annukey repurposed to the grandfather claim gate (WOS_CanClaimKey). New sc_wos_new (!accepted &amp;&amp; !done) and sc_wos_busy (accepted &amp;&amp; !done). New at_007_key for the claim node. at_042 deleted (dead flag, no readers). at_hanee_head / sc_hanee_head moved from the hanee_head_reward local to a questcddb \"hanee_head\" stamp -- Hanee does not take the head, so a relog bought another 5,000 XP off the same trophy.</div><div><br></div><div><b>Dialogue.</b> gondorscribe.dlg StartingList rebuilt, first-TRUE-wins, most specific first: sc_003 -&gt; E10 turn-in; sc_annukey -&gt; new E13 claim-your-key; sc_007 -&gt; E9 post-completion greeting; sc_wos_busy -&gt; E12 short reminder; sc_wos_new -&gt; E0 full briefing; unconditional -&gt; new E14 idle line so she is never mute. E12 was the old \"key is spent\" fallback, retexted as the mid-quest reminder and stripped of Quest/QuestEntry. E8 lost the key paragraph; E10 gained it plus the one-coffer warning. <b>Latent journal-rewind bug fixed:</b> reply 8 carried Quest \"The Well of Souls\" entry 1 and is linked from the reminder and claim nodes, so a completed player could be rewound to stage 1 -- the Quest fields and the dead at_042 were cleared off it, and all journal writes now live on the entry nodes / wos_inc. Link structs were built to the file's own shape (Active + Index + IsChild, __struct_id = list position; StartingList structs carry no IsChild) -- check-dlg-integrity clean.</div><div><br></div><div><b>Two blueprints (explicit deep copy, admin's call).</b> gondorscribe stays the Ruins of Annuminas scribe with the existing ruins-flavoured dialogue. New gondorscribetwr.utc + gondorscribetwr.dlg for the tower: identical node graph, identical scripts and conditionals, only the prose differs (no fireside, no \"these ruins\"; she reads the expedition's dispatches at a desk in Minas Tirith and sends the player north up the Greenway). Tag GondorScribeTwr, which also clears the latent hazard of two live GondorScribe tags in two areas. area011 Creature-List idx 3 repointed (position X33.8/Y47.47 and appearance untouched), area011.gic comment updated, __struct_id 4 preserved. Filed by PaletteID into NPCs &gt; Humans via bin/file-palette-orphans.py --apply.</div><div><br></div><div><b>Regressions from the d1133f240b4 toolset round-trip, repaired:</b> gondorscribe's FactionID had been flipped 6 (Good) -&gt; 3 (Merchant) and ScriptAttacked/ScriptDamaged blanked. Restored on the blueprint and on both placed instances (check_divergent_creatures gates faction). The stale ruinsofannuminas.gic comment still naming the tower was fixed too.</div><div><br></div><div><b>Journal.</b> module.jrl \"The Well of Souls\" entry 2 End 0 -&gt; 1; the quest never showed as completed.</div><div><br></div><div><b>Build.</b> check_divergent_creatures, check_palette_coverage, check_reward_exploit, check_container_keys and check-dlg-integrity all pass; module built and installed to the DEV realm. Module-only -- no hak, TLK or NWSync rebuild. <b>Two PRE-EXISTING gate failures block a clean smoke run and are unrelated to this work</b> (build was done with --no-smoke after running the relevant gates individually): check_ascii_nss fails on the auto-generated nwnmgr_bstamp.nss, which nwn-manager itself writes with an em dash; and check_season_profile fails because d1133f240b4 deleted unpacked/sp_devgate_inc.nss (the round-trip inlined it into sp_devgate.nss, so nothing references it any more and the gate's wiring expectation is now stale). Both need their own decision.</div>"
    manual_steps:
      - step: "UAT re-accept (the core fix): with a fresh character, take the quest from the TOWER scribe. Talk to her again immediately, and again after a full logout/login -- she must give the short reminder + portal directions only. The full briefing must be unreachable and the journal must stay at entry 1."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT no key at accept: after accepting, confirm NO Annuminas Key is in your inventory."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT turn-in grants the key: kill Azagoth, turn the head in at either scribe. Expect +10,000 XP, the head consumed, journal 'The Well of Souls' entry 2, the quest showing as COMPLETED, and exactly one Annuminas Key."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT no second reward: talk to her again after the turn-in and again after a relog -- post-completion greeting only, no second key, no second XP payout. Then kill Azagoth again and bring a second head: it must NOT re-open the turn-in node."
        status: open
        kind: uat
        tester: "level able to kill Azagoth twice"
      - step: "UAT grandfather claim: on a character that finished the quest BEFORE this build, talk to a scribe -- she offers the key once, and never again after that."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT cross-scribe: accept at the tower and turn in at the ruins, and the reverse. Both must work, and the state must be shared."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT prose: the RUINS scribe must talk like she is in the ruins (fireside, 'the portal is at the Library'); the TOWER scribe must talk like she is in Minas Tirith (dispatches at her desk, 'go north up the Greenway'). Neither may refer to standing where she is not."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT one-key-one-chest still holds: open ONE warded coffer in the Ruins of Annuminas, confirm the key is consumed and the OTHER coffer can no longer be opened."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT Hanee: turn the head in to Hanee in Bree for 5,000 XP, then relog and talk to her again carrying the same head -- no second payout."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT both scribes still unkillable (Plot=1) after the blueprint split."
        status: open
        kind: uat
        tester: "any"
      - step: "DB check: sqlite3 questcddb -- SELECT uuid,quest,times_done FROM quest_cd WHERE quest IN ('wos_accept','wos_done','annu_key','hanee_head'); at most one row per character per key, times_done 1."
        status: open
        kind: admin
      - step: "PRE-EXISTING, not caused by this item: check_ascii_nss fails on the auto-generated nwnmgr_bstamp.nss (nwn-manager writes an em dash into it) and check_season_profile fails because commit d1133f240b4 deleted unpacked/sp_devgate_inc.nss during a toolset round-trip. Both block a clean smoke run for every future repack and need a decision."
        status: open
        kind: admin
  - id: banking-duplicate-exploit
    title: "Bank items duplicate exploit"
    group: banking
    status: awarded
    merit_awarded: true
    type: Exploit
    player: "Rajmund (Ray)"
    date: "2026-08-19"
    commit: 0bceec3f52f
    notes: "<div><b>The Bank of Bree vault no longer hands out a second copy of your box.</b> It was possible to open your family vault, take an item out, break off the conversation, and open the vault again -- the banker would hand you a fresh set of boxes still holding everything you had just removed, so the contents could be taken over and over. That is fixed: the banker will not give you a box you are already carrying.</div><div><br></div><div><b>Nothing changes for normal use.</b> You still carry your boxes around with the conversation closed, and your items are still saved when you say you are done, when you leave the bank, and when you log out. If a box failed to appear because your pack was full, you can still ask the banker again and only the missing box is handed over.</div><div><br></div><div><b>Your personal strongbox got the same treatment</b>, along with a related bug: if you had several strongboxes and were carrying only some of them, the banker sometimes forgot you had any and skipped straight past the option to put them away.</div><div><br></div><div><b>Leftover duplicate boxes are cleaned up.</b> If you are still carrying more than one copy of the same box from before this fix, the next time you close your vault the fullest one is kept and stored and the spares are removed. Reported by Rajmund (Ray).</div>"
    impl_notes: "<div><b>Root cause.</b> bank_fam_open.nss / bank_box_open.nss called RetrieveCampaignObject unconditionally. Both vault types are container <i>items</i> in the PC's inventory (az_familybox_&lt;CDKey&gt;_N -&gt; bankdb key fam_box_&lt;CDKey&gt;_N, global; az_strongbox_&lt;CDKey&gt;_N -&gt; bank_box_N, owner-scoped), and RetrieveCampaignObject neither clears nor locks the row -- so the DB stays a stale snapshot for as long as the box is carried, and re-opening minted a second same-tagged box from it. ESC was not required: EntryList[1] loops back to the open reply inside one conversation.</div><div><br></div><div><b>Why the guard is in the scripts, not the dialogue.</b> bank_fam_nobox/bank_box_nobox already existed but were wired as the Active on the <i>failure</i> entry (E22/E5, \"make room in your inventory\"), i.e. evaluated after the open script had already run; ReplyList[44] was gated only by bank_fam_hasacc and ReplyList[4] by nothing at all. A per-index idempotent retrieve was chosen over adding a dialog-level Active: it also covers the loop-back path, still allows topping up a box that failed to spawn on a full pack, and avoids editing npc_banker.dlg.json. Committing in the abort hook was rejected -- EndConverAbort is bank_convexit, which is also EndConversation, so the normal open path (E4/E21 is a leaf) would commit and destroy the box the instant it was handed over.</div><div><br></div><div><b>bank_box_inc.nss.</b> New Bank_CommitBoxTag() drains every copy of a tag instead of the one GetItemPossessedBy returns: the copy with the most items is stored (an arbitrary pick could store an emptied box and destroy the full one), all copies are destroyed, source is suffixed +dupes and a WriteTimestampedLogEntry line is written. The inventory is walked once into an ObjectToString list before anything is counted or destroyed, so no inventory iterator is nested and DestroyObject's end-of-script deferral cannot confuse the scan. New Bank_LogOpen() records opens (open_family/open_strong); no schema change, Bank_InitAudit is already CREATE TABLE IF NOT EXISTS.</div><div><br></div><div><b>Two latent bugs found alongside.</b> bank_box_close.nss detected the box with GetItemPossessedBy but re-resolved it with a module-wide GetObjectByTag (wrong copy with duplicates in play) and wrote no audit row -- it now just calls CommitStrongBoxes(oPC, \"dialog\") like bank_fam_close. bank_box_hasbox.nss tested only the highest box index, so a 3-box account carrying boxes 1-2 fell through the StartingList redirect at E13 to the normal greeting -- the personal-vault half of the same exploit; it now scans 1..5. The illegal-item purge loop in that conditional is load-bearing (it runs on every banker conversation start) and was preserved verbatim.</div><div><br></div><div><b>Forensics.</b> New bin/audit-bank-dupes.py, read-only over bankdb's bankaudit table (immutable open, windows-1252 text factory for NWN character names). <b>Its two historical signatures are weak and should not be treated as evidence:</b> repeat commits of one box in a short window, and item_count dropping then recovering, are exactly what a family vault used as an alt-to-alt transfer chest looks like, and the table holds no per-item detail to separate them. On season 2 (live, 167 commit rows since 2026-08-13) they flag 2 CD keys; the season 1 archive holds 2015 rows and flags 7. Note the three realms keep separate bankdb files and the unnumbered NWN home directory is the <i>season 1 archive</i>, so the script takes --realm s2|dev|s1 and defaults to the live realm. The one conclusive signature -- commits that had to destroy duplicate boxes -- only exists from this build forward.</div><div><br></div><div><b>Build.</b> Module-only; no hak, TLK or NWSync rebuild. 25/25 smoke tests, check-dlg-integrity clean, installed to the DEV realm only.</div>"
    manual_steps:
      - step: "UAT (the reported repro, must now fail): in the Bank of Bree with a family account, open the family vault, take an item out of a box, then press ESC to break the conversation. Talk to the banker again and choose \"Open my family vault please.\" -- NO second set of boxes may appear and the item you took must NOT be back in the box."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (the one-conversation variant): open the family vault, then from \"Is there anything else you need?\" choose \"Open my family vault please.\" again without leaving the conversation. Again no second set of boxes."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (normal use still works): after the ESC above, choose \"I am done with my family vault.\" The boxes leave your inventory. Re-open -- the contents must match what you left, with the withdrawn item absent."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (personal strongbox, same four steps): repeat the repro against \"Open my bank-vault please.\" / \"Are you ready to close your vault?\"."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (bank_box_hasbox fix): with an account of 3+ strongboxes, carry only box 1 and talk to the banker. He must open with \"Are you ready to close your vault?\" rather than the normal greeting."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (top-up still possible): fill your pack so a box cannot spawn, open the vault, then drop something and ask again -- only the missing box should be handed over, not a duplicate of one you hold."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (duplicate cleanup, needs a pre-fix character): if any player is still carrying two copies of the same box, closing the vault must keep the fullest, store it, and remove the spares. Check the server log for the \"BANK: destroyed N duplicate\" line."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (safety nets unchanged): with a box in hand, walk out of the bank area, and separately log out -- items must still be committed as before."
        status: open
        kind: uat
        tester: "any"
      - step: "Admin: run python3 bin/audit-bank-dupes.py against the live bankdb and review the flagged CD keys. Treat signatures 1 and 2 as leads only -- they cannot distinguish the exploit from ordinary alt-to-alt vault use. No automated action is taken."
        status: open
        kind: admin
  - id: smith-can-disenchant-negative-abilities
    title: "smith can disenchant negative abilities"
    group: forge
    status: awarded
    merit_awarded: true
    type: Exploit
    player: "Rajmund (Ray)"
    date: "2026-08-19"
    commit: 4620a3da4d6ff09e1c3c98323f8f8b303fbd11a1
    notes: "<div><b>An item's drawbacks are no longer the forge's business.</b> The penalties a powerful piece was balanced against - reduced ability scores, lowered saves, AC, attack, damage or skill penalties, damage vulnerability, added weight, arcane spell failure - can no longer be struck off at any forge or in the Forge Warden's jail. They simply do not appear in the strip list any more, and the smith says why: the bane laid upon a piece is the price its power was forged against, and no forge will lift it.</div><div><br></div><div><b>They also stop eating your enchantment slots.</b> A drawback is not an enchantment, so it no longer counts toward the property limit. Basilisk Visage carries five of them, so it just gained five usable slots - the same way race and class locks stopped costing slots earlier this season.</div><div><br></div><div><b>Pieces already stripped are contraband.</b> An item a player forged after striking off its bane is now unlawful gear, and the Forge Warden will say so. The only cure is restoring the piece as it was made - a forge cannot lay a bane back on.</div><div><br></div><div><b>One part deferred:</b> drawbacks still count toward an item's assessed worth. In NWN a penalty <i>lowers</i> an item's gold value, so ignoring them would price every cursed piece higher than it is priced today and risk condemning gear that is currently lawful. Left alone deliberately.</div>"
    impl_notes: "<div><b>Root cause.</b> The forge tree had two property classifiers - ForgeIsCosmeticProp (VISUALEFFECT, LIGHT) and ForgeIsRestrictionProp (USE_LIMITATION_*) - and no notion of a detrimental property anywhere. So the twelve penalty types were in COUNTED (ate a slot, counted in the legality verdict) and in REMOVABLE (offered by both strip menus, the Warden's immediate forge_dis_* and the anvil's staged forge_stg_*).</div><div><br></div><div><b>Fix.</b> ForgeIsDetrimentalProp covers DECREASED_ABILITY_SCORE, DECREASED_AC, DECREASED_ATTACK_MODIFIER, DECREASED_DAMAGE, DECREASED_ENHANCEMENT_MODIFIER, DECREASED_SAVING_THROWS, DECREASED_SAVING_THROWS_SPECIFIC, DECREASED_SKILL_MODIFIER, DAMAGE_VULNERABILITY, NO_DAMAGE, WEIGHT_INCREASE and ARCANE_SPELL_FAILURE. ForgePropInSet excludes it from REMOVABLE and COUNTED; every enumeration already routes through the selectors, so the strip menus, the caps, the staged plan's bit indices and ForgeProjectedPropCount all follow with no further edits.</div><div><br></div><div><b>PRICED deliberately untouched.</b> The same reasoning as the restrictions fix: that set drives both ForgeRebuildValue and ForgeItemDeviatesFromBlueprint. Narrowing it would raise the rebuilt value of every drawback item (penalties carry negative cost in NWN's tables) and break the blueprint fingerprint, which is how legitimate gear ends up jailed. No forge_legal_inc regen for the same reason.</div><div><br></div><div><b>Retroactive half.</b> Removing a penalty <i>lowers</i> an item's worth and its property count, so an item stripped before this fix sits comfortably under both caps and no ceiling check would ever notice it. ForgeMissingBlueprintDrawback instantiates the stock blueprint and looks for each of its permanent drawbacks on the item, using the same packed-signature / consume-token technique as ForgeItemDeviatesFromBlueprint (a nested property loop is what blew the instruction cap inside the legality check before). Called from ForgeItemLegality before the within-caps early return, gated on the O(1) ForgeIsPlayerModified stamp so the login scan only pays for the blueprint instantiation on items a player actually forged, and cleared by ForgeIsKnownLegalVariant. Missing blueprint or no holder returns FALSE - never jail on infrastructure failure. ForgeLegalStatus reports the case in the Warden's own words; forge_ward_rvt's revert-to-blueprint is the cure and needed no change.</div><div><br></div><div><b>Stamp + gate.</b> FORGE_CLEAN_VER 5 -&gt; 6: unlike the restrictions fix this change CAN newly condemn an item, so the forced one-time re-scan is what makes the retroactive rule reach gear already in players' hands. tests/check_forge_disenchant.py now asserts the classifier covers all twelve constants, that ForgePropInSet excludes drawbacks in the REMOVABLE branch and again in the COUNTED branch (the removable branch returns early, so each needs its own exclusion), that the PRICED branch is still an unconditional 'return TRUE', that ForgeItemLegality consults ForgeMissingBlueprintDrawback, and that ForgeUnlistedNote explains drawbacks. Verified the gate bites by dropping the REMOVABLE exclusion - it failed as intended. Test build: 25/25 smoke tests, 381 dialogs clean.</div>"
    manual_steps:
      - step: "UAT (the exploit): bring Basilisk Visage to a forge anvil. The strip list must show 15 entries, not 20 - the four -3 ability penalties and the -5 universal saves must be absent - and the smith's status line must say the bane fills no slot and cannot be lifted."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (slots freed): the forge's property count for Basilisk Visage must read five lower than before, and the item must accept five more enchantments than it did."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (pricing frozen): the quoted worth and the value-cap text for a drawback item must be UNCHANGED from before this fix. If they moved, the PRICED set was narrowed by mistake."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (staged plan): tick several properties on a drawback item, page back and forth, then commit. Exactly the ticked properties must be removed - the plan's bit indices run over the removable set, which just got smaller."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (Warden): take a drawback item to the Forge Warden's jail menu - it must offer no drawbacks for removal either."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (retroactive): log in carrying an item whose drawbacks were stripped before this fix. The re-scan (FORGE_CLEAN_VER 6) must flag it, the Warden must say the bane was struck from it, and reverting to blueprint must restore it."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (regression guard - the jailing risk): log in carrying STOCK drawback gear that was never forged. It must pass the forced re-scan untouched and never be quarantined. This is the one way this change could go badly wrong."
        status: open
        kind: uat
        tester: "any"
  - id: curse-song-too-many-instructions
    title: "Cuse Song gives too many instructions error"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Defect
    player: Szescian82
    date: "2026-08-20"
    commit: 6fa35fe0be3
    notes: "<div>Curse Song no longer throws <b>too many instructions</b> errors when you sing into a big fight. The song itself was never really the problem — every effect it applied was quietly dragging the module's spell-duration doubler along with it on the same budget, and a crowded room ran that budget out. The doubler now does its work on its own, a fraction of a second later. <b>Nothing about Curse Song changes for you</b>: same radius, same penalties, same doubled duration. It just stops erroring. Bard Song got the same tidy-up while we were in there.</div>"
    impl_notes: "<div><b>Root cause:</b> eff_dur_x2.nss is subscribed to NWNX_ON_EFFECT_APPLIED_AFTER and did its scan + remove + reapply <b>inline</b>. NWN charges a nested script execution's instructions to the parent frame, so every effect Curse Song applied ran the doubler inside the song's own VM budget. Curse Song walks a RADIUS_SIZE_COLOSSAL sphere applying a <b>7-component linked</b> debuff per hostile (each component is a separate true-effect, each one re-enters the subscriber), and the subscriber was itself O(true-effect count) <b>twice</b> — a guard pass with no early exit plus an apply pass, each doing an NWNX struct unpack per index. Cost was targets x components x 2 x nCount, all on one budget. This is the same overrun that got devcrit_eff deleted in <a href=\"#idea-devcrit-unarmed-save-or-die\">devcrit-unarmed-save-or-die</a>, whose impl notes flagged the real cause as still needing its own item — this is that item. The log signature was always a triple: eff_dur_x2 (level 1), devcrit_eff (level 1), X2_S2_CurseSong (level 0, 73196us).</div><div><b>Fix:</b> main() now does only the cheap event-data guards (busy flag, duration type, PC creator, the Divine Might/Shield and invisibility-family spell-id exclusions) and hands everything expensive to X2Dur_ReTime() via DelayCommand(0.0, ...) — its own script situation with its own fresh instruction budget, the same discipline bpool_eff.nss already uses. Deferring is safe because the effect is identified by UNIQUE_ID, not a handle: if it is gone by then nothing matches and the pass is a no-op. The two scans became one (collect the first matching index, keep scanning for a link-sensitive sibling, decide after the loop — the <a href=\"#idea-improved-invis-issues-part2\">improved-invis</a> link-corruption guard is preserved exactly). x2dur_busy moved <b>inside</b> the deferred function, around the synchronous apply, since that is when the nested event fires. Added an X2DUR_MAX_SCAN = 250 backstop, logged under the existing x2dur_debug flag. Also hoisted the per-iteration GetLocation(OBJECT_SELF) out of the sphere walk in both x2_s2_cursesong.nss and nw_s2_bardsong.nss. Note GetFirstObjectInShape's nObjectFilter already defaults to OBJECT_TYPE_CREATURE, so the sphere was never walking scenery — the multiplier was the nested subscriber, not the loop breadth. Curse Song keeps its doubled duration, and the fix is global: any future mass-effect script benefits.</div><div><b>Regression, same day, and the fix that closes it:</b> deferring the doubler made it SUCCEED where it had always been dying, and what it does on success turned out to be destructive. A <b>linked</b> effect surfaces as several true-effects that <b>all share one id</b>; NWNX_Effect_RemoveEffectById removes every one of them, and the script re-applied NWNX_Effect_PackEffect() of only the <b>first</b> matching index. N components in, 1 out, the rest destroyed. -Methonash- and Sync reported it within minutes: Curse Song applied nothing but its attack decrease (its link is attack → damage → saves → AC → skills), Bard Song nothing but the ledger's attack and damage (it builds its link from the duration VFX and keeps attack/damage <b>outside</b> it, in bonus_pool_inc — so the two effects applied unlinked were exactly what still worked), and Taunt and Wounding Whispers nothing at all. <b>The bug predates the deferral</b>: before it, the doubler was killed by TOO MANY INSTRUCTIONS on these very paths, and dying before the remove+re-apply was the only thing keeping the link whole. <b>Fix</b> (6fa35fe0be3): the collect pass now accumulates <b>every</b> component sharing the id with EffectLinkEffects in index order (= application order) and applies the rebuilt link once. NWNX_Effect_GetTrueEffect resolves with __NWNX_Effect_ResolveUnpack(FALSE) — bLink = FALSE — so each component arrives with its link fields cleared and the link genuinely cannot be recovered from one component; it has to be rebuilt from all of them. Per-component nSubType, nSpellId and creator ride along in the unpacked struct, so ExtraordinaryEffect status, dispel attribution and the GetHasSpellEffect \"already sung on\" guards survive. This is very likely also the cause of </div>"
    manual_steps:
      - step: "UAT (the regression -Methonash- and Sync reported): Curse Song a target and confirm ALL of it lands - attack decrease, damage decrease, all three save penalties, AC penalty and skill penalty. Attack decrease alone means the link is still collapsing."
        status: open
        kind: uat
        tester: "bard 30+"
      - step: "UAT: Bard Song and confirm the saves, AC and skill bonuses appear IN ADDITION to the ledger's attack and damage. Attack+damage alone is the same collapse seen from the other side."
        status: open
        kind: uat
        tester: "bard 30+"
      - step: "UAT: Taunt actually taunts, and Wounding Whispers actually damages. Both are stock precompiled scripts using linked effects, so they were collateral, not bard-specific."
        status: open
        kind: uat
        tester: "bard 30+"
      - step: "UAT (the fix must not quietly stop doubling - it would pass every check above and still be wrong): set the module local int x2dur_debug, sing, and confirm the [x2dur] lines show parts=N with N greater than 1 AND dur doubling. Then confirm a buff really does last twice as long."
        status: open
        kind: uat
        tester: "any caster"
      - step: "UAT regression: an ordinary buff with a duration visual (Bull's Strength) should now keep BOTH the stat bonus and the visual - previously one of the two was eaten every time."
        status: open
        kind: uat
        tester: "any caster"
      - step: "UAT: sing Curse Song into a pack of 8+ hostiles, then grep the dev nwengineLog.txt - there must be no TOO MANY INSTRUCTIONS lines for eff_dur_x2 or X2_S2_CurseSong."
        status: open
        kind: uat
        tester: "bard 30+"
      - step: "UAT (the regression the defer could cause): set the module local int x2dur_debug, sing, and confirm the [x2dur] log lines still show each debuff re-timed to DOUBLE its duration. A debuff landing at natural duration means the doubling was lost."
        status: open
        kind: uat
        tester: "bard 30+"
      - step: "UAT regression: cast Improved Invisibility and Divine Might on yourself and confirm both behave normally - these are the link-sensitive exclusions the rewritten single-pass guard has to keep honouring."
        status: open
        kind: uat
        tester: "any caster"
      - step: "UAT regression: confirm Bard Song still costs exactly one song use and Curse Song exactly one (the GetLocation hoist touched both scripts)."
        status: open
        kind: uat
        tester: "bard 30+"
      - step: "Publish: nwn-manager repack + server restart. Script-only change - no hak, TLK or 2da involved, so no NWSync refresh."
        status: done
        kind: publish
    uat_credits:
      - player: "Shync"
        awarded: true
        date: "2026-08-21"
  - id: petrification-respawn-defect-round-3
    title: "Petrification still not killing after 3 min"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Defect
    player: "Rajmund (Ray)"
    date: "2026-08-20"
    commit: cd9fb48306c
    notes: "<div>Being turned to stone is survivable again. The <a href=\"#idea-petrification-timeout\">2-minute petrification timeout</a> was still not firing at all — the death window you were shown when you turned to stone is one the game itself puts up with the <b>Respawn button greyed out</b>, and the timeout meant to dig you out of it was silently doing nothing. Now the stone is removed first and then you die properly, so after two minutes the death window comes back with <b>Respawn enabled and clickable</b> and you get up at the bind point like any other death. The escalating warnings still count you down in chat and above your head, and a Stone to Flesh mid-countdown still cancels the whole thing.</div><div><br></div><div>The two dragon statues in <b>Castle Homeless (Ground Floor)</b> are now clickable and will turn you to stone on the spot — a deliberate test fixture, so this can be checked on demand instead of by going to find a basilisk. It rolls a real Fortitude save and respects genuine petrification immunity, but the DC is high enough that you should assume clicking one means two minutes as a statue.</div>"
    impl_notes: "<div><b>Root cause (round 2 never worked at all):</b> the watcher shipped in <a href=\"#idea-petrification-timeout-2\">petrification-timeout-2</a> (bleeding.nss, petrifyCheck) opened with if (GetIsDead(pc)) return;. The server runs NWN_DIFFICULTY=3, which takes the bShowPopup branch of stock DoPetrification: a <b>PERMANENT</b> linked EffectPetrify plus PopUpDeathGUIPanel(oTarget, FALSE, TRUE, 40579) — a death panel with bRespawnButtonEnabled = FALSE, i.e. the engine itself disabling the Respawn button. A PC held in that statue state reads as dead, so the guard matched on every single heartbeat, the counter never advanced and nothing was ever killed. That is both halves of the report at once: 'still not killing after 3 min' and a death window whose Respawn button will not click. Corroborating: all four UAT steps on round 2 were still open — that fix was never validated in game. Note the real petrify path is base-game precompiled .ncs, so the module's x0_i0_spells.nss copy of DoPetrification remains dead code and cannot be fixed from source.</div><div><b>Fix:</b> (1) the GetIsDead guard is deleted; kill-once is tracked with our own PETRIFY_KILLED local, cleared alongside the other trackers when the petrify goes away, so a corpse is never re-killed and the guard cannot be defeated by the engine's notion of dead. (2) <b>Order changed at the timeout: strip the stone first, kill second.</b> A new StripPetrify() removes EFFECT_TYPE_PETRIFY (RemoveEffect on any component drops the whole link, taking the VFX_DUR_CESSATE_NEGATIVE with it), leaving an ordinary living PC for EffectDeath to kill through the normal ondeath020 pipeline — EffectDeath on a creature the engine still holds as a statue was the likely no-op, and a corpse still carrying the petrify was the other candidate for the greyed button. (3) ondeath020.nss now calls PopUpDeathGUIPanel(oPC, TRUE, TRUE, 0, \"\") instead of PopUpGUIPanel(oPC, GUI_PANEL_PLAYER_DEATH), so the button states are stated rather than inherited from the disabled panel stock petrification popped moments earlier. (4) An SP_DEV_TOOLS-gated [petrify] trace logs the PC, heartbeat count, strip result and GetIsDead at each decision point — on for dev, off for a live season automatically.</div><div><b>Test rig:</b> the two zep_statues006 instances in castlehomelessgr.git.json are now Static=0, Useable=1, Plot=1, retagged pet_test_statue, with pet_test_stn.nss on OnUsed. That script <b>replicates the stock hardcore branch line for line</b> rather than calling DoPetrification(): the module include is dead code on the real path, and its opening !GetIsReactionTypeFriendly test is not meaningful with a placeable as OBJECT_SELF. It keeps spellsIsImmuneToPetrification and rolls a real MySavingThrow at DC 60, so the rig cannot stone anyone a medusa could not. VFX is VFX_IMP_DUST_EXPLOSION on impact; deliberately <b>no</b> standalone VFX_DUR_PETRIFY, which would be unlinked and would outlive StripPetrify, leaving the player stone-skinned forever. The instances were edited rather than minting a new placeable blueprint, so no palette filing is involved.</div>"
    manual_steps:
      - step: "UAT: click a dragon statue in Castle Homeless (Ground Floor). You should be turned to stone with a dust burst, and the death window with the DISABLED Respawn button should appear - the rig is only correct if it reproduces the original bug."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (this is the step that proves the diagnosis): read the dev log for [petrify] lines. They must show 'tick' lines COUNTING heartbeats. If they are absent the watcher is still returning early and the GetIsDead theory was wrong - reopen with the log."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT: at ~2 minutes the escalating warnings appear in chat AND as floating text, then the PC dies and the death window returns with Respawn ENABLED. Click it and confirm a normal respawn at the bind point with no lingering petrify and no stone appearance."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT: repeat against a real basilisk/medusa (basilisk00x) rather than the statue, to prove the fix is not rig-only."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT: have someone cast Stone to Flesh mid-countdown and confirm the watcher stops with no spurious death afterwards."
        status: open
        kind: uat
        tester: "any caster"
      - step: "UAT regression (ondeath020 runs on EVERY player death): die normally, not petrified, and confirm the death window's Respawn button is still enabled and works."
        status: open
        kind: uat
        tester: "any"
      - step: "Decide whether the two Castle Homeless statues stay clickable after UAT. They are currently open to anyone - a player who clicks one gets two minutes as a statue. Gating them behind Admin_CanAdmin() in pet_test_stn.nss is a two-line change if that becomes a nuisance."
        status: open
        kind: admin
      - step: "Publish: nwn-manager repack + server restart. Script and area-instance change - no hak, TLK or 2da involved, so no NWSync refresh."
        status: open
        kind: publish
