    notes: "<span>Early nodes (L1/8/15) of the Wizard line.</span><div><br></div><div><b>Fixed 2026-07-17:</b> shipped the early nodes (L1/L8/L15) of the Wizard line, <b>The Colour of Power</b>, cloned from the clean rogue-line-early template (q_wiz_* names). Giver <b>Findegil the Grey</b> (q_wiz_find, plot/immortal grey wizard) keeps a study in Bag End (bagend001) and offers the lore only to Wizards (GetLevelByClass(CLASS_TYPE_WIZARD)&gt;=1, value 10 verified); non-wizards get a flavour line. Three-node one-off arc, per-character state in campaign DB wizlinedb key colour_stage (0-&gt;3, advance-only). <b>Node 1 (L1):</b> take up the study -&gt; journal wiz_colour opens + Apprentice's Amulet (+1 INT, Wizard-only). <b>Node 2 (L8):</b> receive the Loremaster's Tome (plot). <b>Node 3 (L15):</b> tome consumed -&gt; Staff of the Grey Study (+2 enhancement / +1 INT quarterstaff, Wizard-only), journal End. Reward properties use verified stock encodings (Use-Limitation:Class subtype 10 = Wizard). Wired end-to-end: Bag End OnEnter wrapped q_wiz_enter (chains the existing leash_to_area) -&gt; q_wiz_spawn; conversation q_wiz_conv on the giver; DLG follows the reply-gate rule (action scripts only in target Script fields, verified no action script in any Active block - the fighter-line bug was NOT repeated). Build passed all gates (6/6 smoke, dialog-integrity 0 failing, boss-registry 78/78). <b>Deferred to wizard-line-endgame:</b> the colour choice (White/Many-Colours/Brown via wizard_colour) and the +2 caster-level capstone - Findegil only foreshadows them here.</div><div><br></div><div><b>Blocked in-game until the admin places waypoint AP_wizardlineearly_1 in bagend001</b> - Findegil is script-spawn-only and no-ops gracefully until then.</div><div><br></div><div><b>UAT (after waypoint placed + deploy/restart):</b> (1) a Wizard entering Bag End sees Findegil's offer, a non-wizard gets only the flavour line; (2) accept -&gt; journal opens + wizard-restricted Apprentice's Amulet; (3) L8/L15 gates hold; (4) at L8 the tome is granted, at L15 consumed and the Staff granted, journal advances 1-&gt;2-&gt;3(End); (5) amulet/staff unusable by non-wizards; (6) regression: Bag End leash still fires from the wrapped OnEnter.</div>"
    manual_steps:
      - "create waypoint tag `AP_wizardlineearly_1` in `bagend001` (Bag End - somewhere sensible by the hearth / the study, clear of the door and any existing NPCs) - spawn point for `q_wiz_find` (Findegil the Grey, the Wizard class-line I giver; plot/immortal grey wizard). Spawned by `q_wiz_spawn` from the Bag End OnEnter wrapper `q_wiz_enter` (which chains the area's existing `leash_to_area` handler); scripts no-op gracefully until the waypoint exists and never double-spawn. Until placed, \"The Colour of Power\" (Wizard line I, nodes L1/8/15) is invisible in-game. Wizard-only offer; non-wizards get a flavour greeting. Tag is hyphen-less and byte-for-byte identical to the literal in q_wiz_inc.nss / q_wiz_spawn.nss."

