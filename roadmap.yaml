ideas:
  - id: combat-dummy
    title: "combat dummy to measure attacks and damage per round"
    group: combat-classes
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-02"
    commit: 579b791588a165ecce308554909fd0cacb558f53
    notes: "<div>A <b>Combat Dummy</b> you can attack to find out what your character actually does in a fight. Hit it and a <b>10-round trial</b> starts automatically: each round it calls out how many attacks you made and how much damage you dealt, and at the end it reports your <b>average attacks per round</b> and <b>average damage per round</b>. Everything is printed to the chat log as well as floating over your head, so you can scroll back if you miss a line. A flash of light marks the start and the end of the ten rounds.</div><div><br></div><div>It exists for the feats that never show up on your character sheet — <b>Flurry of Blows</b>, the legendary monk extra attack, on-hit effects — where counting real swings is the only way to know whether they are working.</div><div><br></div><div>The dummy cannot be killed: it soaks Harm, Drown and anything else you throw at it, and it is hostile, so hostile-only spells like Isaac&#39;s Greater Missile Storm will target it happily. One tester at a time — anyone else who attacks a dummy mid-trial (including summons and henchmen) is frozen for a few seconds and their damage is ignored, so nobody can spoil your numbers.</div><div><br></div><div>A trial only counts if you keep swinging: if you stop attacking for <b>5 seconds</b>, die, or leave the area, it is cancelled and nothing is recorded — so an interrupted run can never post a misleadingly low score.</div><div><br></div><div>Damage per round is recorded to the <b>Hall of Champions</b> sign, which shows your own characters&#39; best results, your ten most recent trials, and a server-wide top 20 — one entry per player, so a single person cannot fill the board. Every line lists the player, the character, the result and the date. Attacks per round is reported after each trial but never stored.</div>"
    impl_notes: "<div><b>Shape.</b> The dummy is a <b>creature</b>, not a placeable, because it has to be Hostile (FactionID 1) for hostile-only spells to target it; it is rooted with a permanent EffectCutsceneImmobilize and has <b>no AI at all</b> (every default handler blank except ScriptSpawn/ScriptDeath). Blueprints cbd_dummy.utc.json + cbd_sign.utp.json, both PaletteID 0 = <i>Special &gt; Custom 1</i>, so they are hand-placeable from the toolset in any area with no waypoint or per-area wiring.</div><div><br></div><div><b>Two measurements, two engine paths.</b> DPR comes from a <b>per-object</b> NWNX Damage <i>damage</i> event handler (cbd_damage) that the dummy registers on itself at OnSpawn — that global slot was unused, and per-object registration costs the rest of the server nothing. It accumulates the damage and then <b>zeroes every damage field</b> before returning it, which is why the dummy is indestructible with no healing loop: HP never moves, so Harm and Drown are no-ops. Death <i>effects</i> are not damage, so OnSpawn also applies IMMUNITY_TYPE_DEATH, and cbd_death is the belt-and-braces respawn.</div><div><br></div><div>APR can only come from the <b>attack</b> event (the only place a MISS is visible), and that slot is global and owned by devcrit_atk.nss. So devcrit_atk gains <b>one line</b> — a single GetLocalInt on the target, ahead of its critical-hit guard because misses must count. A session therefore starts from <i>either</i> path; it has to start from the attack event too, or the opening swing would be lost and every APR reading would be one attack light in round 1.</div><div><br></div><div><b>Session integrity.</b> All state is locals on the dummy, keyed by a <b>session serial</b>: every delayed round tick carries the serial it was scheduled with, so a cancelled, superseded or destroyed session&#39;s pending ticks become no-ops instead of firing into the next trial. Non-owner damage (other PCs, henchmen, summons, resolved through GetMaster) draws a 10s EffectPetrify and a one-off message, and is discarded from both metrics — the same lock-out _attackplaceable.nss uses, with the message corrected to reach the attacker. Destroying the dummy cancels the trial and records nothing.</div><div><br></div><div><b>UAT round 1 (2026-08-02) found three faults, all fixed.</b> (1) The blueprint was flagged <b>Plot</b>, and the engine zeroes damage to a plot creature <i>before</i> the NWNX damage event fires — so every attack measured 0, DPR read 0, and (2) the leaderboard insert was skipped by the &quot;don&#39;t record an idle trial&quot; guard. Plot is now off and the build gate asserts it stays off; indestructibility never needed it, it comes from cbd_damage zeroing the damage <i>after</i> counting it plus the death immunity. (3) Only the floating text arrived, so every figure was gone once it faded. Reports now go out three ways: the float, a tagged and coloured SendMessageToPC, and the dummy <i>speaking</i> the line — the Talk-channel copy is the one guaranteed to still be in the log to scroll back to. Attacks per round was correct on the first run and confirmed the legendary feat.</div><div><br></div><div><b>Abandonment.</b> A 1s watchdog (running only while a session is open) cancels the trial after 5 seconds with no attack and no damage, and immediately if the owner dies or leaves the area. Without it an abandoned run would still count ten rounds, most of them empty, and write that average as a score. Both the attack and the damage handler reset the idle clock, so a caster mid-cast is not treated as idle.</div><div><br></div><div><b>Leaderboard.</b> Campaign DB <code>combatdummydb</code>, one row per completed trial (cdkey + player_name = account, GetObjectUUID + char_name = character, dpr, total_damage, rounds, at). Identity split copied from bst_db.nss. The two high-score views collapse to a single winning row per partition via a correlated NOT EXISTS (per uuid for the personal board, per <b>cdkey</b> for the server-wide top 20) — GROUP BY + MAX(dpr) cannot promise the char_name and date belong to the winning row. Browsed 10 to a page in cbd_sign.dlg, tokens 6400-6411, built on the Recent Updates sign pattern.</div><div><br></div><div><b>Gate.</b> tests/check_combat_dummy.py (14th smoke gate) asserts the devcrit_atk hook is present, cheap and ahead of the critical guard; that cbd_spawn still registers the per-object handler, immobilizes and grants death immunity; that cbd_damage writes the zeroed data back; that the blueprint is still Hostile and still points at its spawn/death scripts; and that every token cbd_db fills is actually shown by the conversation. Also fixed bin/gen-palette-map.py, which read <code>LocalizedName</code> only and so showed every placeable in the Palette Finder by resref instead of by name.</div><div><br></div><div><b>UAT round 2 (2026-08-02, <code>9ccb12a7087</code>).</b> Three findings, all addressed. (1) <b>A devastating critical killed the dummy outright</b> despite cbd_damage zeroing the damage AND the permanent IMMUNITY_TYPE_DEATH — two independent death defences failing on one hit. That is a global engine problem, not a dummy problem, and is fixed at source in <a href=\"#idea-devcrit-roll\">devcrit-roll</a>; the dummy is unchanged. (2) <b>Self-destruct at the end of a set.</b> The admin liked the destruction visual enough to make it the intended end-of-set cue: CBD_SelfDestruct now runs 1.5s after the final report (long enough for the spoken summary to get out), strips the death immunity, applies a spectacular EffectDeath and ClearAllActions on the tester so they stop swinging. Everything else about the end of a session — the round lines, the averages, the VFX_FNF_TIME_STOP flash, the DB write — is unchanged; this is purely additive. cbd_death needs no new guard: CBD_EndSession has already cleared CBD_ACTIVE, so a planned death skips the cancel branch and only the 6s respawn runs. (3) <b>Reported damage read low</b> with no damage-reduction lines in the combat log, and the blueprint has no DR of any kind — so it is a measurement question, not a defence. Shipped a diagnostic rather than a guess: CBD_DEBUG (per dummy or module-wide) echoes every attack and every damage packet with its raw event fields and its source, which distinguishes damage discarded as non-owner, damage lost between the attack and damage events, and packets landing outside an active session. Toggle both this and the devcrit diagnostic together from the rest menu, Admin Options -&gt; <b>[Admin] Combat diagnostics on/off</b> (<code>dbg_combat</code>, admindb-gated, off at every reboot); that menu entry is the ONLY switch - an earlier build also armed the dump automatically for an admin owner, which made the toggle lie (turning it off left the admin still seeing the dump), so the auto-arm was removed. Readout palette: yellow per-round lines, <b>green end-of-set summary</b> (the numbers the tester came for, findable in a log full of combat spam), red diagnostics. Every line is now <b>chat log only</b> - the floating text and the dummy's SpeakString copy were dropped, since the colours do the job the belt-and-braces was added for and the duplicates just stacked the same sentence over the dummy's head (FloatingTextStringOnCreature echoes into the log too, which is why a one-off notice read twice). The dummy's portrait is <code>PortraitId 397</code> (<code>PLC_F08_</code>) - the portrait placeables.2da row 39 <i>CmbtDummy</i> uses - on the blueprint AND the Bree placement, instead of the stock female dwarf it inherited from PortraitId 1.</div><div><br></div><div><b>UAT round 3 (2026-08-02) - the damage measurement was broken, not merely low.</b> Rounds reported <code>6 attacks, 0 damage</code> for a 48-STR fighter landing nearly every swing. Cause: <code>data.oDamager</code> in the NWNX <i>damage</i> event does not reliably name the damager for weapon hits, so <code>CBD_OwnerPC</code> resolved nobody, the packet fell into the &quot;not the owner&quot; branch, and <code>CBD_Reject</code> returned immediately because the source was invalid - discarded with no petrify and no message, i.e. silently. The recorded DPRs (6.5 / 9.1 / 18.0 / 52.3) were the few packets that happened to carry a source. Fixed with <code>CBD_ResolveSrc</code>: the attack event stashes the attacker (always valid there) in <code>CBD_LAST_SRC</code> and the damage handler falls back to it; and the intruder branch is now only reachable when the source resolves to a <i>real, different</i> player, so unattributable damage can never be thrown away again.</div><div><br></div><div><b>The dummy no longer zeroes damage.</b> Zeroing made it indestructible, but it also meant the engine printed no damage line and no &quot;damage reduction absorbs&quot; feedback, so a test could not be checked against the combat log at all. Damage now LANDS and <code>CBD_Restore</code> heals the dummy back to full on the next pulse via <code>NWNX_Object_SetCurrentHitPoints</code> (<code>DelayCommand(0.0)</code> - restoring inside the event script would be undone by the very hit being reported). Death immunity and the OnDeath respawn stay behind it for a hit big enough to outrun the restore. The build gate was inverted to match: zeroing the fields again is now a FAILURE.</div><div><br></div><div><br></div><div><b>UAT round 4 (2026-08-02) - root cause of the wrong figures, from the dump: <code>NWNX reports a damage type that was not dealt as -1, not as 0</code>.</b> A plain sum of the 32 damage fields is therefore the real damage MINUS the number of unused types (31 of them for a single-type weapon hit): a 33-point greatsword hit measured as <b>2</b>, a 28-point hit as <b>-3</b> and was then dropped by the <code>nDmg &gt; 0</code> guard as &quot;packet carried no damage&quot;. Every field now goes through <code>CBD_Amt</code>, which floors a field at 0. The same trap was quietly costing the Devastating Critical rework a point per hit - <code>data.iSlash += nDamage</code> on an unused type gives <code>-1 + 15 = 14</code>, seen in the dump as <code>base=96 slash=14</code> for a 15-point roll - so <code>DevCrit_AddDamage</code> assigns when the field is unset and adds when it is not. Diagnostic lines are now bright red (<code>COLOR_RED</code>) so they read apart from the tool's yellow output and the combat log.</div><div><br></div><div><b>Sign.</b> The 10-most-recent view shows date <i>and</i> time; the two high-score views keep the date only. All three now render through <code>datetime(at,'localtime')</code> - <code>at</code> is stored as <code>datetime('now')</code>, which is UTC, so the board had been showing tomorrow's date. The <code>&acirc;&euro;&quot;</code> garbage on the header was a UTF-8 em dash in an NWScript string; see the module-wide purge in the notes for <code>bin/ascii-clean-nss.py</code> / <code>tests/check_ascii_nss.py</code> (20th smoke gate).</div>"
    manual_steps:
      - step: "PLACE: open the toolset and drop the two blueprints where you want them — Creature palette <i>Special &gt; Custom 1 &gt; Combat Dummy</i>, Placeable palette <i>Special &gt; Custom 1 &gt; Hall of Champions</i>. They work in any area and need no waypoint. Repack + restart after placing."
        status: open
        kind: toolset
        blocker: true
        step_h: 64
      - step: "UAT (the point of the feature): run a 10-round trial on the level-60 monk with Flurry of Blows OFF, then ON, and compare attacks per round. Repeat with the legendary extra-attack feat. DONE 2026-08-02 - attacks per round read correctly and confirmed the legendary feat fires."
        status: done
        kind: uat
        blocker: true
        step_h: 64
      - step: "UAT (indestructible): cast Harm and Drown at the dummy, and hit it with a devastating critical. It must stay at full HP and keep counting."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT (one tester): have a second character (and a summon) attack a dummy mid-trial. Both should be frozen ~10s with a message, and the owner's totals must be unaffected."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT (abandoned run): start a trial, then stop attacking. It must cancel after ~5s with a message and record nothing. Repeat by walking to another area mid-trial, and by dying mid-trial."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT (destroy/respawn): kill a dummy by whatever means still works (DM kill). The trial must be cancelled and unrecorded, and a fresh dummy must stand up in the same spot ~6s later."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT (re-test after the Plot fix, BLOCKER): damage per round must now be non-zero and the trial must appear on the sign. The first run measured 0 for every attack because the blueprint was Plot. Also confirm the round lines and the final averages are still in the chat log after the floating text fades."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT (self-destruct, round 2): run a full 10 rounds. After the averages are reported the dummy must blow apart, your character must stop attacking on its own, and a fresh dummy must stand up in the same spot ~6s later. Starting a new trial on the replacement must work."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT (round 3 refix, BLOCKER): run one 10-round set. Round lines must report damage in the hundreds, not 0, and the recorded DPR must be in the same ballpark as attacks x average hit. The combat log must show per-hit damage again, plus any damage reduction or resistance lines, while the dummy stays at full HP."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT (round 3, sign): the header no longer shows the garbage character, the 10-most-recent view shows date AND time in local time, and the two high-score views show the date only (and no longer read a day ahead)."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT (low damage, round 2): run 'dm_runscript dbg_combat' to turn the diagnostics on, run one 10-round set, and compare the [CBD_DEBUG] per-packet lines against the combat log. Report which case it is: damage attributed to a source that is not you, damage present in the attack event but missing from the damage event, or packets arriving while the session is not active. Turn it back off with the same command."
        status: open
