    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-07-25"
    commit: 23487788730240fbac4e4304f925272a07f88dba
    notes: "<div>Housekeeping under the hood: the login and logout handling has been separated from the old legendary-leveler code it had grown into. Nothing changes for you — your journals, merit login credit, bestiary, teleport unlocks, faction allegiance, XP boosts, bank storage boxes and the bleeding-out survival roll all behave exactly as before. The change clears the way for the retired leveler to be removed without disturbing login.</div>"
    impl_notes: "<div>Split hgll_cliententer.nss / hgll_client_exit.nss into neutrally-named handlers unpacked/mod_cliententer.nss and unpacked/mod_clientexit.nss, and re-pointed Mod_OnClientEntr (module.ifo.json:2285) and Mod_OnClientLeav (:2289) at them. The new enter handler carries the whole general login flow verbatim: Merit_InitDb/RecordLogin/LoginMessage, Bst_InitDb + GetObjectUUID, Tele_InitDb, Faction_InitDb + delayed Faction_ApplyLive, Boost_InitDb + Boost_LoginReport, the nine server-info AddJournalQuestEntry calls (guilds still deliberately omitted), FRK_LoginCheck, the death-amulet / bleeding-out resolution (HgllPostEnter renamed ModPostEnter), the nwnmgr_bstamp build stamp and ForgeBeginScan. The new exit handler carries EpicSummon_Dismiss, CommitStrongBoxes/CommitFamilyBoxes, PersState_Snapshot and ExportSingleCharacter. All delay timings and statement order are unchanged.</div><div>The two HGLL-specific steps were <b>not</b> copy-pasted: hgll_cliententer.nss is reduced to the pre-port Letoscript locals wipe and hgll_client_exit.nss to HGLL_ClearPendingPicks, both now OBJECT_SELF-based and reached by one ExecuteScript call each — so <a href=\"#idea-ll-hgll-remove-scripts\">ll-hgll-remove-scripts</a> deletes two files and one line per handler. Keeping hgll_client_exit.nss alive also keeps tests/check_hgll_transactional.py valid until <a href=\"#idea-ll-hgll-retire-gate\">ll-hgll-retire-gate</a> lands. Comment/doc references updated in unpacked/pers_state_inc.nss, unpacked/q_frk_inc.nss, CLAUDE-gff-format.md, CLAUDE-nwscript.md, CLAUDE-merit.md, README.md, QuestGuide-DM-Notes.md and docs.manual/Draft/Gem-Socketing.html. Gates: 12/12 smoke tests (incl. hgll transactional, dialog integrity, palette coverage, season brand), 12 scripts compiled 0 errors.</div>"
    manual_steps:
      - step: "UAT login: log in an existing character and confirm the server-info journals (Rules, Website, Module Customizations, Character Progression, Death, Forge, Systems, Factions, Combat) are all present in the Completed section."
