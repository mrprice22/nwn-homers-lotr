  - id: wildshape-shifter-item-merge
    title: "including other items into druid/shifter shapes"
    group: combat-classes
    status: awarded
    type: Enhancement
    player: McGondy
    date: "2026-07-02"
    commit: ed70869c581
    notes: "<div>In stock standard NWN:</div><div><ul><li>For <a href=\"https://nwn.fandom.com/wiki/Shifter#Shifter_forms\" target=\"_blank\" rel=\"noopener\">Shifter Forms</a>: the shape determines which items are merged</li><li>For <a href=\"https://nwn.fandom.com/wiki/Wild_shape\" target=\"_blank\" rel=\"noopener\">Wildshape</a>: Only magical properties of armor, helmet and shield merge<i>d</i></li></ul></div><div>This request is to include more (or all equipped) item's for every shifter form and wildshape.. and/or improve stats on the shapes to be more competitive with bosses on this module.. <b><br></b></div><div><b>Currently Defensive stats are competitive but damage output is not.</b></div><div><br></div><div><b>Implemented 2026-07-02:</b> Every polymorph form now merges <b>all</b> equipped item properties. Your weapon's properties (or your gloves' when unarmed) land on the form's claw/bite/slam attacks as well as its right-hand weapon — this is the damage fix, since vanilla never merged anything onto natural attacks. Armor, helmet, shield, both rings, amulet, cloak, boots, belt and gloves merge onto the form's hide. Covers druid Wild Shape and Elemental Shape, all Shifter shapes (Greater Wildshape I–IV, Humanoid, Undead, Dragon, Outsider, Construct), plus the arcane self-polymorphs Polymorph Self, Shapechange and Tenser's Transformation, which previously merged nothing. Balance: duplicate property types merged onto one item take the highest value only (no stacking six AC rings), and damage is bounded by the same forge-capped weapons every melee class uses. Form base stats are unchanged.</div>"
