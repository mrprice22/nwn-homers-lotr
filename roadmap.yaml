  - id: lumber-ent-tugofwar
    title: "Quest pair: Lumber Runners (Evil) vs Ent-Watch (Good), Fangorn dailies"
    group: quests-areas
    epic: quest-overhaul
    status: design
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-05"
    commit: b0eae765777
    notes: "<span>T2 (L15+). A linked server-state tug-of-war — a shared isengard_warmachine var scales the Helm's Deep event. Ship the pair together. Depends on cooldown helper + world-state tick logic.</span><div><br></div><div><b>2026-08-05:</b> the groundwork is in. A single server-wide struggle meter now tracks who is winning the fight over Fangorn -- Isengard's war machine or the Ents -- persists across reboots, and drifts back toward stalemate by 1% an hour when nobody pushes it. <b>Nothing about it is visible or reachable in normal play yet</b>: the Lumber Runners and Ent-Watch dailies that move it, and what it changes at Helm's Deep, are still being designed.</div>"
    impl_notes: "<div><b>Dependency audit (autopilot 2026-07-23):</b> the item's note 'Depends on cooldown helper + world-state tick logic' is now half-stale. The <b>quest-cooldown helper already exists</b> — quest_cd_inc.nss (QCD_IsOnCooldown / QCD_IsDoneToday / QCD_IsDoneThisWeek / QCD_Stamp, backed by the questcddb campaign DB, real wall-clock, survives reboots) — so carndum-ledger, faramir-watch and palantir-watch are NOT blocked on cooldowns, only on world-state. The genuinely-missing infra is a shared <b>world-state</b> layer: server-wide persistent variables (not per-character) that several players read/affect and that change over time. See the design question for the proposed shared helper; once approved it unblocks this pair plus claim-the-deeps (deeps_control), goblin-town-throne (7-day halved-orc-spawn buff), and the Helm's Deep scaling here.</div><div><br></div><div><b>Shared world-state helper BUILT 2026-07-23 (commit 0b17611), independent of this quest:</b> worldstate_inc.nss over campaign DB worldstatedb — WS_GetInt/WS_SetInt/WS_AdjustInt (server-wide int globals, optional clamp), WS_GetStr/WS_SetStr (e.g. a weekly-claim owner pckey), WS_RegisterDecay(key,rate,target,period) / WS_RegisterWeekly(key,resetTo) / WS_ClearRule, and a self-throttled WS_Tick() (~1/min) wired into the module heartbeat bleeding.nss (after the existing PC loop, petrify/bleed logic untouched). Real wall-clock via strftime, survives reboots. This resolves the infra dependency for this quest AND for claim-the-deeps (deeps_control), goblin-town-throne (7-day buff via period=604800), and mithril-seam (weekly claim). What remains open for THIS item is only the tug-of-war mechanic below.</div><div><br></div><div><b>METER LAYER BUILT 2026-08-05 (commit b0eae765777)</b> -- the approved back-end numbers only; no quest content. New warmeter_inc.nss, a thin wrapper over the existing worldstate_inc.nss / worldstatedb (no second world-state layer): key isengard_warmachine, WM_MIN 0 / WM_NEUTRAL 100 / WM_MAX 200, WM_STEP 5 applied in exactly one place (WM_Adjust) with WM_PushIsengard() / WM_PushFangorn() as the two callable verbs, and WS_RegisterDecay(key, 1, 100, 3600). <b>Arithmetic confirmed:</b> neutral 100 sits exactly halfway, so each side's half is exactly 100 back-end points and exactly 100% of that side's scale -- 1 back-end point is 1 display point, and the approved 1-point/hour back-end decay IS the 1%/hour display decay, with no scaling factor anywhere. Back-end 0 = 100% to Fangorn, 100 = neutral, 200 = 100% to Isengard. Five bands as named constants (WM_BAND_FANGORN_ASCENDANT &lt;=25, WM_BAND_FANGORN_RISING 26-74, WM_BAND_BALANCED 75-125, WM_BAND_ISENGARD_RISING 126-174, WM_BAND_ISENGARD_ASCENDANT &gt;=175) plus WM_GetBand / WM_GetBandOf / WM_GetBandName. Normalization: WM_GetPercent (0-100 magnitude), WM_GetLeader, WM_GetStatusText (the canonical sentence) -- the raw 0-200 value is never exposed on any player-reachable path. WM_Init() is called from onmoduleload.nss next to the other DB inits, idempotent via a -1 sentinel (seeds 100 only on a virgin key) and upserts the decay rule so it exists on a fresh server; decay rides the already-wired WS_Tick() off bleeding.nss, nothing new on the heartbeat. Wired to a real read-only in-game reader with no creative content: wm_report.nss on new reply 140 of emotewand.dlg.json, under the same _cdkey-gated Admin Options entry that already carries legfeat_reset and dbg_combat; it prints the normalized sentence plus the band, and (admin-only surface) the raw value for tuning. Reply-link struct_ids renumbered positionally; the dialog-integrity gate passed. No waypoints, no blueprints, no palette work, and docs.manual/ deliberately untouched -- no player can see this yet, so there is nothing honest to document.</div>"
    design_questions:
      - question: "SHARED WORLD-STATE HELPER (the real second infra unblocker; the cooldown helper already exists as quest_cd_inc.nss). Proposed: a thin include 'worldstate_inc.nss' over a 'worldstatedb' campaign DB — WS_GetInt/WS_SetInt/WS_Adjust for server-wide persistent globals plus a ~1/min WS_Tick for per-key decay/weekly reset."
        status: answered
        answer: "Approved: Campaign DB + heartbeat tick + decay. Build worldstate_inc.nss + worldstatedb + WS_Tick as shared infra (autopilot is building this independently of the tug-of-war quest, which still needs its mechanic decision below)."
        question_h: 64
        answer_h: 64
      - question: "LUMBER/ENT TUG-OF-WAR MECHANIC (creative/balance, needs your call). Concept: a shared isengard_warmachine world-state var that both sides push — players felling trees / aiding Isengard raise it, players defending Fangorn / doing Ent objectives lower it — and its value scales the difficulty/rewards of the linked Helm's Deep event ('ship the pair together'). Open: what raises/lowers it and by how much per action, the min/max clamp, whether it decays toward centre over time (via WS_Tick), and what the Helm's Deep event does at each band. Proposed starting point: range 0-100, start 50, +/-5 per qualifying action, decay 1/hour toward 50, three difficulty bands (<=25 / 26-74 / >=75). Approve/tweak, and confirm the two areas (Fangorn + Helm's Deep) to wire."
        status: answered
        answer: "back-end calcs use range 0-200, start 100, +/-5 per qualifying action, decay 1/hour toward 100, five difficulty bands (<=25 / 26-74 / 75-125 /126-174 / >=175).\nHowever, any in-game mentions of this progress should be normalizes to %, as  0 to 100% for one side or the other, so the progress % decay's at a fixed rate of 1% per hour, and 100% for one faction means either back end value of 0 or 200"
        question_h: 120
        answer_h: 90
      - question: "QUALIFYING ACTIONS -- what pushes the meter, and which way? The +/-5 step is approved but the triggers were never named. Proposed: Ent-Watch daily completed -> -5 (toward Fangorn); Lumber Runners daily completed -> +5 (toward Isengard); felling a marked tree in Fangorn -> +5; driving off or wiping a lumber crew -> -5; escorting an Isengard log-cart out of the forest -> +5; planting or warding a sapling for the Ent-Watch -> -5. Each daily sits behind the existing quest_cd_inc daily cooldown so one player cannot swing the world alone, while the world-side actions (trees, crews) stay uncapped but on a slow respawn. Approve this list, or replace it."
        status: open
        answer: null
      - question: "WHAT DOES THE HELM'S DEEP EVENT DO AT EACH OF THE FIVE BANDS? The boundaries are approved, the effects are not. Proposed symmetrical table (band -> attacker count multiplier / boss tier / reward multiplier): Fangorn Ascendant 0.6x enemies, no siege boss, 0.8x reward; Fangorn Rising 0.8x / lieutenant boss / 0.9x; Balanced 1.0x / standard boss / 1.0x; Isengard Rising 1.3x / lieutenant + siege engine / 1.25x; Isengard Ascendant 1.6x / full Uruk warlord + siege engine / 1.5x. All of it is scriptable off WM_GetBand() with no new content per band. Approve, or give the numbers you want."
        status: open
        answer: null
      - question: "CONFIRM THE TWO AREAS TO WIRE. From module-index/area_index.json -- Fangorn side: Fangorn Forest (fangornforest), with Fangorn: Outskirts (fangornoutskirts) as the likely lumber-camp/staging area; Helm's Deep side: Helm's Deep (helmsdeep001), with Helm's Deep: Keep (area008), Helm's Deep: Cave (area013) and Path To Helm's Deep (pathtohelmsdeep) adjacent. Proposed: the dailies live in Fangorn Forest and Fangorn: Outskirts, and the scaled event fires in Helm's Deep (helmsdeep001). Confirm these are the intended areas."
        status: open
        answer: null
      - question: "ENT-WATCH GIVER -- Leaflock, or a new NPC? The thirteenth-ent item just placed the quest-giving Ent Leaflock in Fangorn Forest (fangornforest). Recommendation: hang Ent-Watch off Leaflock -- he is already the forest's voice, it costs no new blueprint, appearance or placement, and it makes the good side feel like one continuous relationship rather than two unrelated Ents. The Lumber Runners (evil) side does need a new giver, which should sit at the Isengard-facing edge (Fangorn: Outskirts) rather than inside the forest. Approve, or say you want a separate Ent-Watch NPC."
        status: open
        answer: null
    manual_steps:
      - step: "DONE: shared world-state helper built (commit 0b17611 — worldstate_inc.nss + worldstatedb + WS_Tick heartbeat). Remaining for this quest: build the tug-of-war scripts + Helm's Deep scaling once the mechanic below is approved, then re-promote to confirmed. The cooldown half needs nothing new (quest_cd_inc.nss exists)."
