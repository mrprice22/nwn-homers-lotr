  - id: summons-boost
    title: "Scale druid summons/companions (HP, saves, AB, AC) with level, Animal Empathy and epic Conjuration"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "Piskan (Alek Cain)"
    date: "2026-07-03"
    commit: fd5a1bccdf0
    notes: "<div>Druid and ranger summons and animal companions now scale with their master's power the moment they spawn, so late-game pets stay relevant on this high-magic server. The boost grows with your class level, your Animal Empathy, and the Conjuration spell-focus feat line — up to +20 attack, +12 dodge AC, +20 all saves and +24 to every ability score. It is permanent and cannot be dispelled. Other classes' summons are unaffected. Details: <a href=\"Customizations.html#scaled-summons\">Customizations → Scaled Summons &amp; Animal Companions</a>.</div>"
    impl_notes: "<div>New summon_boost script, run from the associate OnSpawn (nw_ch_ac9 / ww_ch_ac9), applies one permanent <b>supernatural</b> (undispellable) effect to the master's own summoned creatures and animal companions. Bonuses scale off class level (druid, or the greater of druid/ranger for a companion), the Animal Empathy skill, and the existing Spell Focus -&gt; Greater -&gt; Epic Spell Focus: Conjuration feat line — no new feats were added. CON carries the HP growth; STR/DEX/mentals add damage, reflex and mind-effect resistance. Non-druid/ranger summons are left unboosted.</div><div><br></div><div><b>Follow-up fix 2026-07-03:</b> hardened against an OnSpawn timing race — the pet's master/associate link is often not wired up the instant OnSpawn fires, which was silently skipping the whole boost. The script now classifies itself via GetAssociateType and retries briefly until the link resolves; also hooked nw_ch_summon_9 for full OnSpawn coverage. Existing pets need a re-summon to pick it up.</div>"
    manual_steps:
      - step: "UAT: re-summon an existing pet and confirm the boost applies (the timing-race fix means pets summoned before it may not have it)."
        status: open
        kind: uat
