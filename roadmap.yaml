    notes: "<div>Withdrawn for redesign, along with the rest of the prestige-order trials. Halmir the Grey stays at the Well of Eru, but as a general quest guide rather than the keeper of the orders.</div>"
    impl_notes: "<div>Journal pc_blackguard; prestigedb key 'blackg', one-off, relog-safe. Cloned exactly from the Divine Champion skeleton (prsg_inc framework, prestigedb stage idiom). Offer requires 1+ Blackguard level (CLASS_TYPE_BLACKGUARD = 31); non-Blackguards at L14+ get the existing pointer line.</div><div><br></div><div>Uses existing placed instance 94 of plc_torture1 in the Keep of Barad-dûr, retagged BkgFallAltar with Static cleared and OnUsed q_bkg_altar added; it had no prior script or tag references so nothing was chained or broken. The wounded check is GetCurrentHitPoints &lt; max, deterministic, no dice.</div><div><br></div><div>The alignment shift is the order's signature mechanic: AdjustAlignment(oPC, ALIGNMENT_EVIL, 50, FALSE) applied on the stage 1-&gt;2 transition only, so it is non-farmable and the re-give-brand path never re-shifts. Brand of the Fall is plot+cursed. Reward skills distinct from the eleven siblings, no AB/damage so forge-cap-safe. No new waypoint or placement. Build passed all gates.</div><div><br></div><div><b>Faction oath-lock (2026-07-23, commit da33a3c):</b> the Black Oath fall (q_bkg_altar, stage 1-&gt;2) now also calls Faction_SetOath(oPC,\"Evil\") — it commits the character to the Evil (Sauron) faction and locks them out of the Good/Free-Peoples Well of Eru light-shaft. Optional, one-time, non-farmable (same stage guard as the alignment shift). See [[faction-scaffolding]].</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>manual</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Fall</b> — the Blackguard initiation, and the twelfth and final order, completing Halmir's hub. Swear the Black Oath at the torture-rack in the Keep of Barad-dûr while wounded. <b>This one marks you: it shifts your alignment permanently toward evil</b>, once and only once. Pays 1,000 XP and the <b>Sigil of the Fallen</b> (Bluff +3, UMD +3, saves vs. negative +3). Details: <a href=\"QuestGuide.html#blackguard\">Quest Guide → Blackguard</a>.</div><div><br></div><div><br></div><div>-- This module (normally) allows FREE alignment changes in bree appearance changing area, and free faction shifts to evil or good from well of eru</div><div>--&gt; update 'this one marks you' so that you can NO LONGER use the good teleporter in well of eru and no longer use the alignment adjuster</div><div><br></div><div><b>Archived manual steps</b> — reinstate these when the line is redesigned:</div><ul><li>[uat] UAT faction oath-lock: after the Black Oath fall, confirm the character is Evil-aligned by faction and that the GOOD Well of Eru light-shaft (zep_lightshft009) now refuses to switch them (message, no change); the EVIL shaft still works.</li><li>[uat] UAT: Verify the Barad-dur rack is actually clickable in-game. The instance follows the shipped-sibling retag shape (Static:0 + OnUsed, no explicit Useable override, exactly like the RDD Forge-of-Durin anvil). If the CEP plc_torture1 base is not useable-by-default the rack will not be clickable and the quest cannot be completed &amp;mdash; if so, add a single Useable:1 field to that instance, and note the same one-line fix would apply to the sibling anvil/altar retags.</li><li>[uat] UAT gating: non-Blackguard L14+ character at Halmir gets only the pointer line. (Halmir needs AP_prestigehub_1 placed to appear; this quest adds no new waypoint of its own.)</li><li>[uat] UAT: a character with 1+ Blackguard level accepts -&gt; journal 1, stage survives relog.</li><li>[uat] UAT at the rack: clean-handed click fails with the flavor message; a wounded click shifts alignment noticeably toward evil and grants the Brand + journal 2.</li><li>[uat] UAT turn-in: Brand consumed, XP + Sigil granted, journal ends.</li><li>[uat] UAT non-farmability: re-clicking the rack after the fall must NOT shift alignment again, and re-running Halmir must NOT re-award.</li><li>[uat] UAT regression: the other eleven Halmir branches and the summary line are unchanged.</li></ul>"

