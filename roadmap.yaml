    notes: "<div>baseitems.2da: Shuriken, Katana and Quarterstaff are now monk weapons (IsMonkWeapon=1, like Kama), so they get monk attack-bonus progression. Katana and Quarterstaff are now finessable (WeaponFinesseMinimumCreatureSize=2) for <em>any</em> class with the Weapon Finesse feat — not just monks, and small races included.</div><div><br></div><div>Note on flurry: NWN has a single IsMonkWeapon flag that governs both monk-weapon benefits and Flurry of Blows — there is no per-weapon flurry toggle. Kama itself is flurry-compatible, so these weapons are too (the original “not compatible with flurry” ask was dropped after confirming Kama allows flurry).</div><div><br></div><div>Live deployment requires repacking lotr_rules.hak with the new baseitems.2da, then refresh-nwsync + server restart.</div>"

