  - id: item-slot-tokens
    title: "Increase an item's property slots using boss-drop 'tokens' or a rare boss drop"
    group: forge
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "dc0960 (Dungeon_Crawler)"
    date: "2026-07-23"
    commit: c79fe8ab669, 7688f1c5cb9, a2e6123fa5c
    notes: "<div>The <b>Rune of Expansion</b> is a consumable reagent that permanently widens a single item so a Forge of Wonders smith can bind one enchantment more into it than the common law of the forge allows — up to three runes per item. Lay the piece on a smith's anvil, keep a rune in your pack, and choose <b>“Expand a property slot”</b>; the smith folds the rune in and it is spent. The extra enchantment is fully legal, so an expanded item is never seized as contraband. Runes are a rare drop from certain powerful bosses. Details: <a href=\"Customizations.html#forge\">Customizations → Forge of Wonders</a>.</div>"
    impl_notes: "<div>Item tag SlotToken, resref slot_token; hard cap FORGE_TOKEN_MAX_SLOTS = 3, a single admin-tunable constant in forge_inc.nss. The earned count is the item-local int FORGE_EXTRA_SLOTS (persists with the item in the .bic, like FORGE_CEIL) — intrinsic to the item, travels on trade.</div><div><br></div><div><b>Reagent flow (commit a2e6123fa5c):</b> the rune is an inert item — no activation. Each Forge of Wonders smith dlg (forge_item_mid, kimli_forge, bellnius_smith, kallrist_forge) carries an isitemonanvil-gated “Expand a property slot (&lt;CUSTOM6120&gt;/3 used)” reply next to “Strip enchantments”, running forge_exp_go.nss → ForgeExpandDo(): with an item on the anvil and a SlotToken in the PC's pack it consumes exactly one rune and binds +1 slot via ForgeBindExtraSlot; a no-op (no item / maxed / no rune) speaks an explanation and consumes nothing. Token 6120 (the N/3 label) is primed by ForgeRefreshAnvilContext. The earlier targeted Unique-Power widget — slot_token.nss, the dmfi_activate SlotToken branch, and the Cast Spell prop on the blueprint + baked instances — was removed.</div><div><br></div><div>forge_inc.nss exposes <b>ForgeItemMaxProps(oItem) = ForgeLegalMaxProps() + ForgeItemExtraSlots(oItem)</b>, and every prop-count ceiling (modifyitem apply loop, anvil legality/contraband scan, projected-count guard) routes through it — extra slots honored AND never jailed. Only the slot-COUNT ceiling changes; value pricing/cap and disenchant staging are untouched. Wiki item pages now render DescIdentified (nwn_manager render_item_page fix). Build: 10/10 smoke, dialog-integrity 0 failing (377 dialogs), scripts compiled 0 errors. No CR&gt;60 boss blueprint was modified.</div>"
    design_questions:
      - question: "Which boss(es) should drop the Rune of Expansion, and at what rarity? The mechanic ships fully wired and DM-testable but the rune is in no loot table yet, because drop source and rarity are a taste call."
        status: answered
        answer: "Gandalf the Gray, Summanus, and Theoden's Chosen"
    manual_steps:
      - step: "LOOT PLACEMENT: add slot_token to the chosen boss loot via the toolset / the module's loot system once the drop-source design question is answered. Until then the rune is unobtainable in normal play."
        status: done
        kind: toolset
        blocker: true
      - step: "UAT: DM-spawn a Rune of Expansion (resref slot_token / tag SlotToken)."
        status: open
        kind: uat
      - step: "UAT binding: at any Forge of Wonders, lay an item on the anvil, keep a Rune of Expansion in your pack, and choose &ldquo;Expand a property slot&rdquo; &mdash; the item's allowed forge property count rises by 1 (a forge capped at 4/5/6 now allows 5/6/7 on that item) and one rune is consumed. Repeat up to 3; the 4th attempt refuses without consuming. With no rune in pack, the smith asks for one as reagent (nothing consumed)."
        status: open
        kind: uat
      - step: "UAT legality: forge the newly-allowed extra property onto the item, then confirm the contraband/legality scan does NOT jail it."
        status: open
        kind: uat
      - step: "UAT regression: an un-attuned item still caps at the normal per-forge limit, and the forge value cap, pricing and disenchant behavior are unchanged."
        status: open
        kind: uat
      - step: "Retune FORGE_TOKEN_MAX_SLOTS in unpacked/forge_inc.nss if +3 proves too generous or too stingy (a fully-runed item at a top-tier forge can reach 10 enchantments)."
        status: open
        kind: admin
  - id: forge-limits-progressive
    title: "Tie forge limits to boss-kill progress (kill more bosses to earn a slight gear edge)"
    group: forge
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: Tukwut
    date: "2026-07-16"
    commit: 9d5519b
    notes: "<div>Forge limits now scale with how many Roll-of-the-Fallen bosses your character has slain. Ten distinct bosses raises your forge value cap by 5%, 25 by 10%, 50 by 15%, and clearing all 78 gives 20% <b>plus a seventh property slot</b> at the Moria and Kallrist forges. Crucially, gear forged under a boss-slayer's raised cap can be traded freely — the contraband law now judges everyone against the maximum achievable ceiling, so a fresh character holding a veteran's gift will never be jailed for it. The anvil shows your current tier when you use it. Details: <a href=\"Customizations.html#forge\">Customizations → Forge of Wonders</a>.</div>"
    impl_notes: "<div>Progress is distinct Roll-of-the-Fallen bosses slain per character (solo or party credit; bestiarydb joined against the boss registry). Tiers live in one tunable table in forge_inc.nss: 10+ -&gt; +5% value cap; 25+ -&gt; +10%; 50+ -&gt; +15%; all 78 -&gt; +20% plus a 7th property slot at the top-tier forges.</div><div><br></div><div>Bonuses apply at forge time only; the contraband law judges everyone against the maximum-achievable ceiling (900,000 gp / 7 props), which is what makes boss-slayer gear safely transferable — exactly the transferability the original ask wanted. Staged disenchant lawfulness uses the same ceiling functions, so it still cannot mint an illegal item. Existing FORGE_CLEAN stamps stay valid (the ceiling was only loosened, so no rescan). Customizations.html updated with the tier table and the new 900k/7-prop law.</div><div><br></div><div>Related: <a href=\"#idea-bestiary-tracking\">bestiary kill-tracking</a>, <a href=\"#idea-wiki-kill-counts\">wiki kill counts</a>, <a href=\"#idea-wiki-top-killers\">wiki top killers</a>.</div>"
    dupe_of: achievements
    manual_steps:
      - step: "UAT low tier: a character with under 10 registry boss kills sees a progress hint and unchanged caps."
        status: open
        kind: uat
      - step: "UAT tier 1: a 10+ distinct-boss character sees the +5% floating text and the raised ceiling quoted by the smith (Tagget 262,500)."
        status: open
        kind: uat
      - step: "UAT transferability: trade an above-750k forged piece to a fresh character and walk into the Well of Eru &mdash; it must NOT jail them."
        status: open
        kind: uat
      - step: "UAT enforcement: the Warden still jails genuinely tampered gear above 900k / 7 props."
        status: open
        kind: uat
      - step: "UAT: disenchant status lines cite the 900k figure."
        status: open
        kind: uat

