      - step: "UAT Legendary Juggernaut's disarm half specifically - the four immunities are ordinary effects, but disarm is a skipped NWNX event and is the part that can silently not fire. Have an NPC disarmer (or a PvP partner) attempt a disarm and confirm the weapon stays in hand and the message prints. Confirm disarm still works normally on a character WITHOUT the feat, i.e. legfeat_disarm did not break disarm_catch."
