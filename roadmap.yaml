    date: "2026-07-16"
    commit: deeab60ea7c, 62272db
    notes: "<span>T1 (L1+). A 7-riddle Tolkien-trivia minigame; win 5/7. Content-heavy dialogue — author the riddle bank incrementally. Depends on cooldown helper.</span><div><br></div><div><b>Fixed 2026-07-14:</b> shipped, journal tag riddle_game. The <b>Whispering Wretch</b> — a plot, friendly CR-1 clone of the Gollum blueprint, strongly implied to be but never named him (the placed CR-1029 Gollum boss is untouched and still Roll-of-the-Fallen tracked) — lurks in Bree Cave and challenges players to the old game: seven riddles, win at 5/7. The bank holds 16 riddles (8 classic Hobbit riddles reworded + 8 originals in the same voice), served via a token-driven generic riddle node; the weekly set is server-wide (ISO-week seed, 128 weekly variants) and answer order rotates. One attempt per calendar week win or lose (stamp + payout land on the seventh answer so window-closing can't dodge either); mid-game relogs just restart the same weekly set without spending the week. Win: 100-300 gp + 250 XP + one random trinket-tier item (verified existing resrefs). Fourth consumer of the quest-cooldown library (QCD_IsDoneThisWeek). <b>Admin must place waypoint AP_riddle-game_1 in breecave</b> — until then the cave behaves exactly as before. Docs: card moved from Quest Ideas.html into QuestGuide.html.</div><div><br></div><div><b>UAT:</b> (1) place the waypoint, deploy; (2) enter Bree Cave → wretch present → play: 5+/7 pays gold/XP/trinket on the seventh answer and closes the journal; (3) lose path — taunts, nothing paid, week stamped; (4) re-challenge — refusal with time to Monday 00:00 UTC; (5) relog mid-game → fresh game, same weekly set, week not spent; (6) regression — boss Gollum still spawns and tracks on the Roll of the Fallen; Bree Cave leash/OnEnter unchanged without the waypoint.</div><div><br></div><div><b>7/15/26 UAT Result:</b> I can see gollumn now (Whispering Wretch) but when I start the riddle game, it says \"Riddle &lt;UNRECOGNIZED TOKEN&gt; of seven, precious, listen listen: &lt;UNRECOGNIZED TOKEN&gt;\" and my only response option is \"1. &lt;UNRECOGNIZED TOKEN&gt;\"</div><div><br></div><div><b>Fixed 2026-07-16:</b> root cause of the UNRECOGNIZED TOKEN screen — the token-setting StartingConditional q_rid_c_show (sets riddle number/verse/answer tokens 6361–6366) compiled and shipped but was never attached as the Active script on any of the four dialogue links into the riddle node, so it never ran and the tokens were never set. Attached it to all four links (commit 62272db); as a side benefit its guards now properly gate the node so a stale \"Next riddle\" click after game end can't show a garbage riddle. Token range 6360–6368 verified collision-free. Build + dialog-integrity + smoke tests pass. Waypoint lookup confirmed correct (AP_riddlegame_1, hyphen-stripped).</div><div><br></div><div><b>UAT re-test (after next deploy/restart):</b> start the game — expect \"Riddle 1 of seven…\" with a real verse and four distinct answers; play all seven (right/wrong quips render, answer letters rotate); win/lose finale shows the score; a second attempt the same week gets the countdown refusal.</div>"

  - id: concerning-hobbits
    title: "Quest: Concerning Hobbits (Shire genealogy)"
    group: quests-areas
    status: design
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-17"
    commit: 7ed910b39b3
    notes: "<span>T1 (L5). A genealogy dispute via skill checks; the correct answer rotates by season; reward = Bag End housing access (owner-check workaround, no instancing).</span><div><br></div><div><b>Fixed 2026-07-17:</b> shipped as a T1 (L5) daily dialogue trivia quest built on the established riddle-game pattern (token-driven dialogue, StartingConditional Active scripts, the shared quest_cd_inc/questcddb cooldown library, journal wiring). Odo Proudfoot (q_hob_odo), a Hobbiton genealogist, puts five Shire-lineage questions (from a bank of 16 canon Tolkien-genealogy questions) to the PC; the question set and answer order are seeded from the in-game calendar season (GetCalendarYear()*4 + season, stride walk over the bank), so the correct answer rotates each season and the whole server shares one seasonal dispute. 4-of-5 right pays 40-100 gp + 100 XP + a pouch of pipe-weed (witchbud); a perfect 5/5 upgrades the keepsake to a Greater Ring of Scholars (grscholar) - both verified existing module blueprints. Daily gate (QCD_IsDoneToday), win or lose, finalized atomically on the fifth answer so escape-closing can't dodge the stamp or double-pay. Journal tag concern_hob; custom tokens 6420-6428; all logic in q_hob_inc.nss. Wired end-to-end: Hobbiton OnEnter wrapped (q_hob_enter chains leash_to_area then q_hob_spawn), giver spawns at waypoint AP_concerninghobbits_1, conversation q_hob_conv on the blueprint. Build passed all gates. <b>Design deviation:</b> the original \"Bag End housing access (owner-check workaround)\" reward was design-sensitive (which door/interior, persistent housing entry vs campaign flag, eviction semantics), so per autopilot guidance that piece was deferred as a design question and a concrete gold/XP/keepsake reward shipped instead; housing access can be added later as a win-hook in QHOB_PayOut.</div><div><br></div><div><b>Blocked in-game until admin places waypoint AP_concerninghobbits_1 in shirehobbiton001</b> - Odo is script-spawn-only and the scripts no-op gracefully until the waypoint exists.</div><div><br></div><div><b>UAT (after waypoint placed + deploy/restart):</b> (1) enter Hobbiton, talk to Odo, accept - journal concern_hob opens; (2) answer 5 questions - 4/5 pays 40-100 gp + 100 XP + pipe-weed, perfect 5/5 gives the Greater Ring of Scholars; (3) journal closes on finish; (4) re-ask same day - \"come back tomorrow\" countdown to 00:00 UTC, resets next UTC day; (5) seasonal rotation - offered question set/answer positions differ across in-game seasons; (6) escape-close on the fifth answer still stamps/pays exactly once (no double-pay). DM can reset with QCD_Clear.</div>"
    notes_h: 353
    design_questions:
      - question: "The original idea called for the reward to be Bag End housing access via an owner-check workaround (single shared Bag End interior, OnEnter kicks non-owners) rather than instancing. That is design-sensitive and was NOT wired - it needs your calls: which door/interior gates the reward (`bagend001` vs `shirebilbohouse` back room / FancyDoor), whether winning grants a persistent housing entry (and in which table - the player-houses `housing:` system, or a bespoke campaign flag), and the owner-check/eviction semantics for a shared interior. The quest ships now with a concrete gold/XP/pipe-weed reward instead (working, waypoint-gated). If you want the housing unlock, decide the above and it can be added as a follow-up win-hook in `q_hob_inc.nss` (`QHOB_PayOut`)."
        status: open
        answer: null
    manual_steps:
      - "create waypoint tag `AP_concerninghobbits_1` in `shirehobbiton001` (Hobbiton - somewhere sensible near the village green / the Ivy Bush, clear of the existing hobbit NPCs and Gandalf) - spawn point for `q_hob_odo` (Odo Proudfoot, the genealogist quiz-giver). Spawned by `q_hob_spawn` from the area OnEnter wrapper `q_hob_enter` whenever a PC enters; scripts no-op gracefully until the waypoint exists and never double-spawn. Until placed, the \"Concerning Hobbits\" daily quiz is invisible in-game. Tag is hyphen-less and byte-for-byte identical to the GetWaypointByTag literal in q_hob_spawn.nss."

