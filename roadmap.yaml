    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    notes: "<div>Rounds out the new tier with two existing areas that only need a link-in and named bosses: Moria Deep Caverns (area020, descent from the Abyss of Moria — naturally gated by the Balrog) and the Temple of Nazgûl (area010, linked from Dol Guldur, already contains 7 encounters). Candidate bosses are all currently unspawned: Angmar the Evocator (capstone), Thuringwethil, Shadow Lord of Dol Guldur, Morgrond Captain, the Mutated Basilisks, Sewer Master. Design: <a href=\"https://homerslotr.com/manual/boss-updates#tier-other\">boss-updates#tier-other</a>.</div><div><br></div><div>Second slice of <a href=\"#idea-unlock-more-inacessible-creature\">Unlock Inacessible creatures</a>; follows <a href=\"#idea-forbidden-realms-key-tier\">the Forbidden Realms Key tier</a>. Tune each boss on placement per <a href=\"#idea-boss-stat-tuning-pass\">the tuning pass</a>.</div>"
  - id: wandering-adaptive-boss
    title: "The Wandering One: a roaming boss that adaptively builds damage-type immunity as it is hit, punishing mono-damage parties"
    group: bosses
    status: later
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    notes: "<div>Two ideas fused: it roams the module (no fixed wiki area — players must hunt it) and it learns to resist whatever hits it, drawing from a shared 500% immunity pool in 5–10% increments per damage type, stealing from the least-recently-received type when the pool is empty — so a party that rotates damage types keeps it off-balance. Design + feasibility: <a href=\"https://homerslotr.com/manual/boss-updates#gimmick-borg\">boss-updates#gimmick-borg</a>.</div><div><br></div><div>Build notes: reuses the unused wandering.nss state machine; must set NO_LEASH=1 or leash_to_area snaps it home; OnDamaged juggles percentage-immunity item properties across its gear slots; still qualifies as a single-instance registry boss (board attribution \"roaming\").</div>"
  - id: elemental-swarm-waves
    title: "Elemental swarm arena: waves of 24 elementals trickle-spawned to surround the party, the element rotating each cleared wave"
    group: bosses
    status: later
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    notes: "<div>An attrition arena, not a single boss: 4 spawns every 10 seconds over ~1 minute per wave, element rotating (fire → cold → acid → …) so players must re-gear resistances and swap tactics mid-fight. Reusable elemental blueprints exist; the timed trickle-wave controller is new script. These are trash adds, not registry bosses. Design: <a href=\"https://homerslotr.com/manual/boss-updates#gimmick-swarm\">boss-updates#gimmick-swarm</a>.</div><div><br></div><div>Honesty guardrail: keep waves short and lethal so each element rotation forces a real counter-swap — the surround also pressures the <a href=\"#idea-heal-soul-fatigue\">healing economy</a>.</div>"
  - id: clone-parent-boss
    title: "Clone/parent boss: a chance an existing boss fight is gate-crashed by the boss's 'Mom' — modest stat boost, better gear, two-front surprise"
