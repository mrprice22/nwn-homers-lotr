  - id: legendary-caster-spell-slots
    title: "casters gain no new spell slots past level 40"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-07-29"
    commit: 192f9dde8b6019f21ba4468bd0eaad0a8ac4be55
    notes: "<div>Casters now gain <b>real spell slots per day</b> all the way to level 60 instead of stopping at the level-20 table. Every fourth legendary level — <b>44, 48, 52, 56 and 60</b> — grants <b>one extra slot at every spell level you can cast</b>. A wizard goes from 4 slots per spell level to 9; a cleric from 6/6/6/6/6/6/5/5/5/5 to 11/11/11/11/11/11/10/10/10/10; a sorcerer from 6 to 11. Bards get the same schedule. Paladins and rangers, whose legendary levels are mostly a martial payoff already, gain a slot at 50 and again at 60 (3 to 5).</div><div><br></div><div>This applies to <b>existing</b> legendary characters retroactively — rest and count, no relevel needed. Levels 1-40 are completely unchanged.</div><div><br></div><div>Full table in <a href=\"Customizations.html#legendary-levels\">Customizations → Legendary Levels</a>.</div><div><br></div><div>Note this covers casting <i>more</i> spells per day. <i>Learning new spells</i> past level 40 is a separate problem and is tracked on its own as <b>casters not getting spells after level 40</b>.</div>"
    impl_notes: "<div><b>Root cause.</b> Not our code: the stock cls_spgn_* tables carry 60 rows but are <b>flat from level 20</b>. Verified against the live install with nwn_resman_cat (row index = level - 1) — cls_spgn_wiz reads 4 4 4 4 4 4 4 4 4 4 at levels 20, 40 <i>and</i> 60; same for sorc (6), cler (6/../5), dru (6/5/../4), bard (4), pal/rang (****/3). So twenty levels granted zero slots. README.md and ll-class-progression-41-60's impl notes had recorded this as \"the intended design\", which <b>contradicted the design answer recorded on that same item</b>: \"yes caster level keep scaling in all the regular ways: spell slots, caster DC, duration, damage caps.\" Both have been corrected.</div><div><br></div><div><b>Fix.</b> Ship all seven cls_spgn_*.2da in lotr_rules.hak — the path the NWNX MaxLevel readme names outright (\"Spell counts gained can be configured for the additional levels ... These are cls_spgn_???.2da\"). <b>classes.2da needed no change</b>: SpellGainTable already points at these stock table names, so a same-named 2DA in the hak overrides it. Cadence: +1 slot at every castable spell level at 44/48/52/56/60 (wiz/sorc/cler/dru/bard, +5 by 60) and at 50/60 (pal/rang, +2). Rows 0-39 are <b>byte-identical to stock</b>, so the sub-40 band is provably untouched; max slots are computed from the table at rest rather than stored per level in the .bic, hence the retroactive grant.</div><div><br></div><div><b>New tooling.</b> bin/gen-caster-slots.py owns rows 40-59 from a single cadence table (dry-run default, --apply, idempotent). Two traps it handles: paladin/ranger SpellLevel0 is **** and must never become a number, and it uses byte-level IO because Path.read_text's universal-newline translation silently rewrote every CRLF in the file on the first pass, turning a 170-cell diff into a whole-file diff. bin/build-lotr-rules-hak's RULES_2DA went 4 -&gt; 11 entries.</div><div><br></div><div><b>Gate.</b> tests/check_epic_tables.py gains check_caster_slots(), which <i>imports</i> the generator's cadence table rather than transcribing the numbers a second time (item 2 of that file's own docstring is about exactly that trap), and also asserts row 39 == row 19 so a hand edit to the sub-40 band is caught. Confirmed it fails on all three realistic drifts: a stock re-extraction, a tampered level-40 row, and a missing table. 13/13 smoke gates pass.</div><div><br></div><div><b>Published</b> 2026-07-29 19:42 (hak, all 11 2DAs) + nwsync 20:03 (manifest d3f09ca35, confirmed to carry cls_spgn_wiz/sorc + exptable) + server restart 21:04. <b>Still unverified in game:</b> the level-41 UAT could not exercise this at all, because the first increment is at <b>44</b>. See manual steps.</div>"
    design_questions:
      - question: "Spell slot cadence for 41-60 (answered before implementation)."
        status: answered
        answer: "Every 4 levels: +1 slot at every castable spell level at 44/48/52/56/60, i.e. +5 by level 60. Bard gets the full cadence; paladin and ranger get a gentler 50/60 (+2), since 41-60 is mostly a martial payoff for them already."
        question_h: 64
        answer_h: 64
    manual_steps:
      - step: "PUBLISH: bin/build-lotr-rules-hak --install, bin/refresh-nwsync, restart. DONE 2026-07-29 — hak 19:42 (all 11 2DAs), nwsync 20:03 (manifest d3f09ca35 carries cls_spgn_wiz/sorc + exptable), restart 21:04."
        status: done
        kind: publish
        step_h: 64
      - step: "UAT (threshold, STILL OUTSTANDING — this is the whole verification): level a wizard to 43, rest, count slots per spell level; then to 44, rest, count again — expect exactly +1 at every spell level. Then repeat at 48 and 60 (a wizard should read 9 across at 60). Level 41 cannot show this: the first increment is at 44, which is why the 2026-07-29 level-41 test proved nothing either way."
        status: done
        kind: uat
        blocker: true
        step_h: 64
      - step: "UAT (no regression): a level 20 and a level 40 caster must show exactly their pre-change slots. This is the check that the sub-40 band really is untouched."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT (half cadence): paladin/ranger unchanged at 49, +1 at 50, +2 at 60, and spell level 0 still shows no cantrips (the **** column)."
        status: open
        kind: uat
        step_h: 64
