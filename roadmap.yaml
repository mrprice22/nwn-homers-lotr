        status: open
        kind: admin
        step_h: 64
      - step: "UAT: at level 40+ open the character sheet and confirm \"Next Level\" shows the exptable figure (828,800 at level 40) on one line with no second number visible. Check again at 41 and at 60, where it should read \"Max\"."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT: drain a level 40 character below 40 (death XP loss or Ping Pong) and confirm the sheet goes back to the stock \"Next Level\" display rather than sticking on the override."
