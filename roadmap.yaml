        status: open
        kind: uat
      - step: "UAT login: on a character with an active 2x gold/XP boost, confirm the boost login report still prints."
        status: open
        kind: uat
      - step: "UAT logout/login: log out while bleeding out (HP 0 to -9) and log back in — the Constitution DC 12 survival message must still fire and resolve (2 HP on success, death on failure)."
        status: open
        kind: uat
      - step: "UAT logout: log out carrying a Bank of Bree storage box mid-transaction, log back in, and confirm the contents were committed and nothing was lost."
        status: open
        kind: uat
      - step: "UAT logout: summon an epic summon, log out, log back in and confirm no lingering henchman-slot summon remains."
        status: open
        kind: uat
      - step: "UAT logout: start a legendary level-up, log out mid-picks, log back in and confirm no staged skill/feat/stat picks were committed (the HGLL residue call still runs ahead of the character export)."
        status: open
