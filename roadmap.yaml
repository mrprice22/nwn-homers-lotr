    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    notes: "<div>Rounds out the new tier with two existing areas that only need a link-in and named bosses: Moria Deep Caverns (area020, descent from the Abyss of Moria — naturally gated by the Balrog) and the Temple of Nazgûl (area010, linked from Dol Guldur, already contains 7 encounters). Candidate bosses are all currently unspawned: Angmar the Evocator (capstone), Thuringwethil, Shadow Lord of Dol Guldur, Morgrond Captain, the Mutated Basilisks, Sewer Master. Design: <a href=\"https://homerslotr.com/manual/boss-updates#tier-other\">boss-updates#tier-other</a>.</div><div><br></div><div>Second slice of <a href=\"#idea-unlock-more-inacessible-creature\">Unlock Inacessible creatures</a>; follows <a href=\"#idea-forbidden-realms-key-tier\">the Forbidden Realms Key tier</a>. Tune each boss on placement per <a href=\"#idea-boss-stat-tuning-pass\">the tuning pass</a>.</div>"
  - id: wandering-adaptive-boss
    title: "The Wandering One: a roaming boss that adaptively builds damage-type immunity as it is hit, punishing mono-damage parties"
    group: bosses
    epic: difficulty-increase
    status: later
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    notes: "<div><b>The Wandering One</b> — a proposed boss with no fixed home: it roams the module, so players have to hunt it rather than look it up. It also learns, building resistance to whatever damage type you keep hitting it with and shedding resistance to types you have stopped using — so a party that rotates its damage keeps it off balance, and a mono-damage party grinds to a halt. Design and feasibility: <a href=\"https://homerslotr.com/manual/boss-updates#gimmick-borg\">boss-updates#gimmick-borg</a>.</div>"
    impl_notes: "<div>Two ideas fused: roaming (no fixed wiki area) and adaptive immunity drawing from a shared 500% pool in 5-10% increments per damage type, stealing from the least-recently-received type when the pool is empty.</div><div><br></div><div>Build notes: reuses the unused wandering.nss state machine; must set NO_LEASH=1 or leash_to_area snaps it home; OnDamaged juggles percentage-immunity item properties across its gear slots; still qualifies as a single-instance registry boss (board attribution 'roaming').</div>"
  - id: elemental-swarm-waves
    title: "Elemental swarm arena: waves of 24 elementals trickle-spawned to surround the party, the element rotating each cleared wave"
    group: bosses
    epic: difficulty-increase
    status: later
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    notes: "<div>An elemental swarm arena: not one boss but waves of two dozen elementals trickling in to surround the party, with the element rotating each time a wave is cleared — fire, then cold, then acid, and on. You cannot pre-gear for it; you have to re-resist and change tactics mid-fight. Design: <a href=\"https://homerslotr.com/manual/boss-updates#gimmick-swarm\">boss-updates#gimmick-swarm</a>.</div>"
    impl_notes: "<div>4 spawns every 10 seconds over ~1 minute per wave, element rotating per cleared wave. Reusable elemental blueprints already exist; the timed trickle-wave controller is new script. These are trash adds, not registry bosses.</div><div><br></div><div>Honesty guardrail: keep waves short and lethal so each element rotation forces a real counter-swap — the surround also pressures the <a href=\"#idea-heal-soul-fatigue\">healing economy</a>.</div>"
  - id: clone-parent-boss
    title: "Clone/parent boss: a chance an existing boss fight is gate-crashed by the boss's 'Mom' — modest stat boost, better gear, two-front surprise"
    group: bosses
    epic: difficulty-increase
    status: planned
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    notes: "<div>A chance that a boss fight you thought you knew gets gate-crashed by the boss's <i>mother</i> — a modestly tougher version with better gear, arriving mid-fight and forcing a snap decision about which one to deal with first. A threat multiplier and a surprise, not a second damage sponge. Design: <a href=\"https://homerslotr.com/manual/boss-updates#gimmick-parent\">boss-updates#gimmick-parent</a>.</div>"
    impl_notes: "<div>Keep the parent's boost modest. Its better drops must be real item blueprints registered via bin/gen-forge-legal.py so the Forge login sweep does not jail looters.</div>"
  - id: optin-curse-gem-loot
    title: "Opt-in curse: volunteer for extra damage taken and doubled soul-fatigue in exchange for better rarity-tiered socketed-gem drops"
    group: bosses
    epic: difficulty-increase
    status: planned
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    notes: "<div>Difficulty as a player choice instead of a wall: take the curse (≈50% more damage taken and/or doubled <a href=\"#idea-heal-soul-fatigue\">soul-fatigue</a>) for a materially better reward roll. The reward vehicle rides on the gem-socketing system (<a href=\"#idea-Socket-system-for-weapons\">Socket system for weapons</a>) — the curse just bumps the gem rarity band / drop chance, no separate loot system. Design: <a href=\"https://homerslotr.com/manual/boss-updates#curse\">boss-updates#curse</a>.</div><div><br></div><div>Depends on both the healing-economy levers and the socket/gem system shipping first; chance-based loot itself is greenfield for the module.</div>"
  - id: boss-ability-ac-bump
    title: "Endgame NPCs get +12 to every ability score and +10 natural armour class, answering the flat +10 attack bonus every level-60 build gained"
    group: bosses
    epic: difficulty-increase
    status: implemented
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    commit: 657d522a479
    notes: "<div>Real character levels 41-60 (<a href=\"#idea-ll-cls-progression\">class progression 41-60</a>) handed every level-60 build twenty more levels of attack bonus — roughly <b>+10 to hit</b> — while the world stayed exactly as it was in season 1. Raising the cap did nothing for the creatures that already stood at 60+ class levels, so the hardest content quietly got easier.</div><div><br></div><div>Every creature at 60 or more class levels now gains <b>+12 to all six ability scores and +10 natural armour class</b>. In practice that is about <b>16 harder to hit</b>, several points more attack bonus and damage, better saving throws all round, and higher save DCs on the spells the creature itself casts. Expect the endgame roster to punish a mediocre build again. Design: <a href=\"https://homerslotr.com/manual/boss-updates\">Endgame Difficulty — Tactical, Not Spongy</a>.</div><div><br></div><div>Your own side is untouched: the creatures <i>you</i> summon — the Dragon Knight, Mummy Dust's reaper, the summon-monster line, the Pet Rock and the Fell Beast — are all deliberately left at their old numbers. Nothing about your health, your gear or the experience you earn has changed either; the bosses simply hit harder and are harder to hit.</div>"
    impl_notes: "<div><b>Why abilities and not gear:</b> season 1 raised the enchantment ability-bonus cap from 12 to 24 but boss-only gear was never re-enchanted, so none of that headroom is in use. Re-enchanting dozens of boss items is far more churn (and Forge-legality risk) than editing the creature's own numbers, so the ability scores and NaturalAC are edited directly. The gear headroom stays available as a later lever.</div><div><br></div><div><b>Rule (deliberately simple):</b> sum of ClassList[].ClassLevel &gt;= 60. No faction filter — friendly NPCs, merchants, Meaningwave guides and DM/test creatures are bumped too; the noise is accepted in exchange for a rule with no exceptions to maintain.</div><div><br></div><div><b>Measured scope (2026-07-30):</b> 217 of 776 .utc.json blueprints qualify (107 have a single class at 60); 201 placed instances across 54 areas, 77 distinct resrefs. ulmothevalar is placed with no local blueprint (stock base — all of its placements must stay identical to each other). Current module maxima for context: Str 100, NaturalAC 232 (factionadjust002), 60 per class, 180 total levels.</div><div><br></div><div><b>Shipped as bin/bump-legendary-npcs.py</b> — house style (dry-run default, --apply writes, --diff, per-file change summary). Mutations: Str/Dex/Con/Int/Wis/Cha +12 and NaturalAC +10, both byte, clamped at 255 with every clamp reported; adds NaturalAC if the field is absent. Applied with <b>--no-monk</b>: <b>213 blueprints and 201 placements across 54 area files</b>, <b>zero clamps</b> (worst cases Str 100 -&gt; 112 and NaturalAC 232 -&gt; 242, both well short of 255). 213 rather than 212 because the baked ulmothevalar_2 (below) is itself a qualifying blueprint. Build passed 13/13 smoke tests.</div><div><br></div><div><b>Player summons excluded — a hole the \"no exceptions\" rule had.</b> Five qualifying blueprints are creatures players <i>summon</i>, not fight, so the rule as written would have handed the bonus to the player side and worked against the whole point: epicdragonknight (Dragon Knight epic spell, x2_s2_dragknght.nss), mummyreaper (Mummy Dust, x2_s2_mumdust.nss), wwp_wizardslayer (nw_s0_summon.nss), petrock (sum_petrock.nss) and fellbeast_h (<a href=\"#idea-fellbeast-companion\">Horn of the Fell Beast</a>, horn_summon.nss). Hard-coded PLAYER_SUMMONS skip list, each entry commented with the script that summons it, reported as \"skipped (player-summonable)\". summon_boost.nss stays the lever for the player side.</div><div><br></div><div><b>ulmothevalar got a baked blueprint.</b> It was the only qualifying placement on a stock (non-local) blueprint — one placement, area022#0 — so bumping the instance alone would have reverted the first time it died, se_respawn_inc.nss rebuilding it from the untouched stock blueprint. Baked ulmothevalar_2.utc.json from the placement (bake_blueprint / resref-assignment logic shared with bin/split-divergent-creatures.py), repointed area022#0, bumped both sides, then filed with bin/file-palette-orphans.py --apply (NPCs &gt; Humans) to keep check_palette_coverage green.</div><div><br></div><div><b>Lockstep is mandatory:</b> tests/check_divergent_creatures.py compares abilities, ClassList, NaturalAC, feats, special abilities, equipment and inventory between a blueprint and every static placement of it, and nwn-manager repack aborts on a mismatch. Bumping only one side breaks the build; bumping only the instance also reverts on first death, because se_respawn_inc.nss rebuilds from the blueprint. Encounter-spawned creatures need no instance work (Encounter List → CreatureList slots carry only ResRef, stats come from the blueprint).</div><div><br></div><div><b>Two idempotency markers, not one.</b> The spec called for a single VarTable int BOSS_BUMP_V = 1; shipped as <b>BOSS_BUMP_V</b> (abilities/AC) plus a separate <b>BOSS_MONK_V</b> (monk levels), both written on <i>both</i> sides. With one shared marker, shipping this half under --no-monk would have stamped every qualifying creature and permanently locked <a href=\"#idea-boss-monk-sr-levels\">the monk half</a> out of the very creatures it targets. BOSS_MONK_V is only stamped when there was a monk entry to grow, so a monk-less creature stays unstamped and is re-evaluated if the rule ever changes. VarTable is not part of the gate's identity_key, so both markers are gate-neutral. Idioms reused rather than reinvented: fld()/loc()/list_items()/load_git_files()/bake_blueprint() from bin/split-divergent-creatures.py, and the load-mutate-write-only-if-changed shape plus dump_json() from bin/season-brand.py; each area file is written once.</div><div><br></div><div>HitPoints and ChallengeRating are deliberately untouched — no HP inflation, and the CR-keyed boss registry / bosses.html do not move. Follows <a href=\"#idea-boss-stat-tuning-pass\">the per-boss stat tuning pass</a>, which closed individual holes; this is the across-the-board correction for the level cap.</div>"
    manual_steps:
      - step: "Build bin/bump-legendary-npcs.py per the spec above, review the dry-run report, then --apply. DONE: 213 blueprints / 201 placements across 54 areas / 1 baked blueprint / 5 skipped as player-summonable / 0 clamps."
        status: done
        kind: toolset
        blocker: true
      - step: "Confirm the repack passes tests/check_divergent_creatures.py — blueprint and every static placement must match after the bump. DONE: 1002 static placements across 342 blueprints all respawn faithfully; full repack green at 13/13 smoke tests."
        status: done
        kind: publish
        blocker: true
      - step: "Re-run the script with --apply a second time and confirm zero diff (idempotence). DONE: reports \"up to date — nothing to change\", git diff clean."
        status: done
        kind: admin
      - step: "UAT: examine a bumped boss in game and confirm armour class is ~16 higher and saves ~6 higher than the season-1 figure."
        status: open
        kind: uat
      - step: "UAT persistence: kill and respawn a bumped boss (e.g. the Witch King) and confirm the respawned copy keeps the bump."
        status: open
        kind: uat
      - step: "UAT ulmothevalar: it now runs on the baked ulmothevalar_2 blueprint in area022 — confirm it spawns, examines as bumped, and is still bumped after a death and respawn (this is the one creature whose bump depended on a new blueprint)."
        status: open
        kind: uat
      - step: "UAT collateral: confirm a bumped friendly/merchant NPC (methonashmart, mw_jocko, modreddm) still converses, sells and behaves normally."
        status: open
        kind: uat
      - step: "UAT player-side regression: cast Dragon Knight and Mummy Dust and sound the Horn of the Fell Beast — all three summons must examine exactly as they did before this pass."
        status: open
        kind: uat
  - id: boss-monk-sr-levels
    title: "+15 monk levels for endgame NPCs that already have monk, raising Diamond Soul spell resistance on the server's main spell-resistant bosses"
    group: bosses
    epic: difficulty-increase
    status: confirmed
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    notes: "<div>Level-60 casters gained twenty levels of caster level and higher save DCs, which means spell penetration now punches through boss spell resistance far more often than it did in season 1. The monk-classed creatures are effectively the only ones on the server carrying meaningful spell resistance, and a monk's resistance scales with monk level — so the endgame monks gain <b>15 monk levels</b>, pushing their spell resistance back ahead of a maxed caster. Ability scores and armour class are handled separately by <a href=\"#idea-boss-ability-ac-bump\">the +12 / +10 bump</a>.</div>"
    impl_notes: "<div><b>Rule:</b> total class levels &gt;= 60 AND at least one existing monk entry (Class 5, CLASS_TYPE_MONK per hak_2da/classes.2da row 5) → that entry's ClassLevel += 15. Never adds a monk entry to a creature that has none, so the 3-class engine limit is never touched. 44 blueprints match, plus their placed instances.</div><div><br></div><div><b>Deliberate decision: no 60 cap.</b> Nine of the 44 already sit at monk 60 and go to 75 — bettie, creature011, creature016, gwathdorlord001, halfling002, modreddm, stinkfestthepeac, surgdm, zep_brownie002 (the Gwathdor Lord being the one that matters most). <b>Known risk:</b> the stock class tables carry exactly 60 rows (cls_atk_2, cls_savthr_monk, cls_bfeat_monk — verified while shipping <a href=\"#idea-ll-cls-progression\">class progression 41-60</a>), so monk 61-75 is off the end of the tables. The engine may clamp, ignore the surplus, or behave oddly; that is what the blocking UAT step below is for, and it is why this is split from the ability bump.</div><div><br></div><div><b>Fallback levers if monk &gt; 60 does not deliver:</b> a spell-resistance item property on the existing npcbuffgear skin (hak_2da/iprp_srcost.2da is present, and the skin pattern is already used by <a href=\"#idea-boss-stat-tuning-pass\">the tuning pass</a>), or an OnSpawn EffectSpellResistanceIncrease in the style of summon_boost.nss. Either would also cover the nine already-60 monks. Broader spell-resistance strategy sits in <a href=\"#idea-boss-caster-dc-spellpen\">the caster-DC compensation item</a>.</div><div><br></div><div>Same lockstep constraint as the ability bump: ClassList is part of check_divergent_creatures.py's combat_key, so blueprint and every static placement must be edited together.</div><div><br></div><div><b>Already coded, deliberately not applied (2026-07-30, commit 657d522a479).</b> This half is implemented and live in bin/bump-legendary-npcs.py as the default-on path that --no-monk suppresses; <a href=\"#idea-boss-ability-ac-bump\">the ability/AC bump</a> shipped with --no-monk, so no ClassList in the tree has moved. A dry run without --no-monk confirms the predicted <b>44 blueprints</b>. It stamps its own <b>BOSS_MONK_V</b> marker rather than sharing BOSS_BUMP_V — with one shared marker the ability half would have stamped every qualifying creature and locked this one out — and only stamps where a monk entry actually existed to grow. So the remaining work is the blocking UAT below, not code: pass it and this ships with a plain <tt>python3 bin/bump-legendary-npcs.py --apply</tt>, which re-walks the same creatures and moves only the monk levels.</div>"
    manual_steps:
      - step: "Before applying anywhere: hand-set ONE monk boss to monk 75 on a test build and confirm in game that spell resistance actually rises (examine, then cast through it with a level-60 caster). If it clamps at 60, stop and switch to the npcbuffgear / OnSpawn-effect fallback."
        status: open
        kind: uat
        blocker: true
      - step: "Same test build: confirm attack bonus, saves and skills did not go haywire on the out-of-range levels, and that the creature still spawns without engine complaints."
        status: open
        kind: admin
        blocker: true
      - step: "Decide whether the nine already-60 monks stay at 75 or move to the gear/effect lever, and record the answer here."
        status: open
        kind: admin
      - step: "UAT: a maxed level-60 caster with Greater Spell Penetration should now fail to land a meaningful share of spells on the Gwathdor Lord and the other monk bosses."
        status: open
        kind: uat
  - id: boss-feat-parity
    title: "Decide the NPC answer to the extra class bonus feats level-60 builds now get"
    group: bosses
    epic: difficulty-increase
    status: design
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    notes: "<div>Ability scores and armour class can answer the raw attack-bonus gain from levels 41-60, but not the extra <i>feats</i> — level-60 builds now collect class bonus feats on top of the normal general feat every three levels. What the endgame roster gets in exchange is still an open design call; the options are recorded on this item rather than guessed at.</div>"
    impl_notes: "<div>Split out of <a href=\"#idea-boss-ability-ac-bump\">the ability/AC bump</a>, which covers only the numeric side. Nothing is committed here yet — see the design questions.</div>"
    design_questions:
      - question: "Which lever should answer the PCs' extra feats? (a) Bake epic feats straight into FeatList — Great Strength/Constitution stacks, Epic Weapon Focus, Armor Skin, Epic Toughness, Improved Evasion — scriptable exactly like the ability bump, but FeatList is part of check_divergent_creatures.py's combat_key so blueprint and instance must move in lockstep. (b) A runtime OnSpawn buff package in the style of summon_boost.nss / npcbuffgear — gate-neutral and far easier to retune per tier, at the cost of being invisible in the blueprint. (c) Tactical rather than numeric, per the 'Tactical, Not Spongy' brief: scripted counters (dispel, timed area effects, adds) instead of more passive feats. Proposal: (b) for the broad pass because it is retunable, with (c) reserved for named bosses."
        status: open
        answer: null
      - question: "Explicit call to make before any feat list is written: Epic Dodge on bosses. It converts a melee fight into near-total whiffing and is probably the wrong answer for a server whose difficulty brief is 'tactical, not spongy'. Proposal: ban Epic Dodge from the compensation set and use Improved Evasion / Armor Skin instead. Agreed?"
        status: open
        answer: null
      - question: "Should the feat compensation apply to the same population as the ability bump (everything at 60+ class levels, friendlies included), or only to hostiles / only to the CR>60 registry bosses? Proposal: registry bosses and hostiles only — feats change behaviour, not just numbers, so bumping merchants and guides buys nothing."
        status: open
        answer: null
  - id: boss-caster-dc-spellpen
    title: "Decide the NPC answer to level-60 caster save DCs and spell penetration"
    group: bosses
    epic: difficulty-increase
    status: design
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    notes: "<div>The other half of the level-60 power jump that raw armour class cannot answer: casters gained twenty levels of caster level, higher save DCs, and enough spell penetration to push through resistances that used to hold. <a href=\"#idea-boss-monk-sr-levels\">The monk spell-resistance bump</a> covers the monk bosses; everything else — and the target numbers — is still an open design call.</div>"
    impl_notes: "<div>Split out of <a href=\"#idea-boss-ability-ac-bump\">the ability/AC bump</a>. Note that the +12 ability bump already delivers about +6 to every saving throw, so whatever is decided here is on top of that. Nothing committed yet — see the design questions.</div>"
    design_questions:
      - question: "How should spell resistance be raised on non-monk bosses? (a) A spell-resistance item property on the existing npcbuffgear skin — hak_2da/iprp_srcost.2da is present and the skin pattern is already in use from the boss tuning pass; (b) an OnSpawn EffectSpellResistanceIncrease in the style of summon_boost.nss, retunable per tier without touching blueprints. Proposal: (b) for the broad pass, (a) for named bosses where the resistance should be visible on examine. Either way, what number is the target — it has to beat Greater Spell Penetration plus Assay Resistance at caster level 60."
        status: open
        answer: null
      - question: "Do the endgame NPCs also need a flat saving-throw bump on top of the +6 the ability bump gives, using the fortbonus / refbonus / willbonus blueprint fields? The per-boss tuning pass already set the precedent of closing dumped saves individually. Proposal: no blanket bump — re-measure after the ability bump lands and only patch bosses still failing save-or-die effects on a natural 2."
        status: open
        answer: null
      - question: "Should some of the answer be absorption/immunity rather than resistance — spell mantles (EffectSpellLevelAbsorption), mind/death/paralysis immunity where it is lore-appropriate, or percentage spell-damage immunity? Proposal: yes, sparingly and only on named bosses, because blanket immunity makes whole caster builds useless rather than merely challenged."
        status: open
        answer: null
      - question: "The number everything else follows from: what success rate should a maxed level-60 caster see against a tier-1 boss — how often should a save-or-die land, and how often should a spell be resisted outright? Proposal: roughly 40-50% of DC-based spells land, and spell resistance stops about a third of them, so casters stay effective but cannot trivialise a boss with two spells."
        status: open
        answer: null

