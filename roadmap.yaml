      - step: "UAT appearance: same for pw_hornblower (palette Miscellaneous > Other)."
        status: open
        kind: uat
      - step: "UAT appearance: item118 'Witch Weed' (palette Miscellaneous > Other) -- confirm the new description, that it prices around 2000 gp rather than 32769, and that its tag is now pw_witchweed."
        status: open
        kind: uat
      - step: "UAT store blueprint: pw_odostore 'Odo Proudfoot's Leaf Counter' is filed under Module Specific* in the store palette; it is created at runtime, so nothing needs placing in an area."
