  - id: ll-feats-tlk
    title: "Legendary Feats: build a custom lotr.tlk"
    group: combat-classes
    epic: legendary-levels
    status: implemented
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    commit: 4dcefac07cd
    notes: "<div>Behind-the-scenes groundwork for Legendary Feats. Nothing player-visible ships with this one — it only makes it possible for the server to carry its own custom text for names and descriptions that the base game and CEP don't provide. Everything you already see in game reads exactly as before.</div>"
    impl_notes: "<div><b>Phase 1 of the Legendary Feats build order</b> (full architecture: <code>CLAUDE-legendary-feats.md</code>). A hard prerequisite — no feat row can land before this does, and it must ship and be verified <i>on its own</i>.</div><div><br></div><div><b>Why.</b> feat.2da's NAME and DESCRIPTION columns are <b>strref-only</b>, so the repo's standing \"use inline strings, skip the TLK\" policy (CLAUDE-gotchas.md) does not help. NWN allows exactly one custom TLK and the module uses CEP's (module.ifo.json &rarr; Mod_CustomTlk: \"cep\"), so ours must be built <i>from</i> cep.tlk rather than alongside it.</div><div><br></div><div><b>Work.</b> New <code>bin/build-lotr-tlk</code> in house generator style (dry-run default, --apply, idempotent, owned string table at the top, modelled on bin/gen-caster-slots.py), using <code>~/.nimble/bin/nwn_tlk</code> — present, same toolchain as the nwn_erf that build-lotr-rules-hak already uses. Converts tlk/cep.tlk to JSON, appends strictly above CEP's last index, writes tlk/lotr.tlk. Then flip Mod_CustomTlk to \"lotr\".</div><div><br></div><div><b>CORRECTION, measured 2026-07-30 — the block starts at 41101, not 7213.</b> cep.tlk is <b>sparse</b>: its header declares StringCount = <b>41101</b> (indices 0-41100) while only <b>7213</b> of those entries carry text, at index 0 and then 30000-41100. The earlier note took that 7213 as the entry <i>range</i>; appending there would have landed inside CEP's own block and silently repointed roughly 7000 CEP names and descriptions. First owned strref is <b>16777216 + 41101 = 16818317</b>. bin/build-lotr-tlk re-reads StringCount at build time and hard-errors rather than re-basing if cep.tlk ever changes.</div><div><br></div><div><b>Shipped 2026-07-30.</b> bin/build-lotr-tlk (dry-run default, --apply, --install, idempotent; writes via a temp file and re-reads what it wrote before installing). OWNED_STRINGS is <b>append-only</b> — index = BLOCK_START + position, so inserting or deleting an entry moves every strref after it. Phase 1 ships one boundary-marker string at 41101 so lotr.tlk is provably different from cep.tlk and the gate is not vacuous.</div><div><br></div><div><b>Invariant + gate.</b> Every pre-existing CEP index must keep its value; a one-entry shift silently repoints CEP-sourced names and descriptions across the <i>entire</i> module, and nothing else would catch it. <code>tests/check_lotr_tlk.py</code> (wired into tests/smoke-test, so it aborts the repack) asserts lotr.tlk[0..41100] == cep.tlk, that our block matches the generator's table, that nothing sits above it, and that Mod_CustomTlk reads \"lotr\" — <b>importing</b> the generator rather than re-transcribing, the lesson tests/check_epic_tables.py already encodes. Where tlk/ (gitignored) or nwn_tlk is absent it warns and passes instead of blocking the build on game data it cannot reach.</div><div><br></div><div><b>Needs a .mod repack:</b> bin/refresh-nwsync runs without --with-module and only reads the .mod to discover its hak/tlk dependency list, so the manifest won't carry lotr.tlk until the module is repacked. Mod_CustomTlk is already flipped in unpacked/, so from the next repack onward the module hard-depends on lotr.tlk being installed and synced.</div>"
    manual_steps:
      - step: "Publish: build and install tlk/lotr.tlk, bin/refresh-nwsync, nwn-manager repack (the .mod is what names the TLK — nwsync will not carry it otherwise), bin/server-restart."
        status: done
        kind: publish
      - step: "UAT: with the TLK swapped and BEFORE any feat row existed, confirm CEP item and creature names still read correctly. PASSED 2026-08-01 — no index slip, phase 2 unblocked."
        status: done
        kind: uat
  - id: ll-feats-2da
    title: "Legendary Feats: feat.2da plumbing and the first proof feats"
    group: combat-classes
    epic: legendary-levels
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-01"
    commit: 39be46d2c6d
    notes: "<div>The plumbing that lets the server define its own <b>Legendary Feats</b> — feats you can only take at <b>level 60</b>. This step ships the machinery plus the six <b>Ability Score</b> feats (Legendary Strength, Dexterity, Constitution, Intelligence, Wisdom and Charisma — +6 to a stat) as the first real content; the rest of the pool follows one category at a time.</div><div><br></div><div><b>Nothing to see in game yet.</b> The feats now exist with their names, descriptions and icons, but there is no way to choose one and they do not yet do anything — the level-60 chooser and the bonuses themselves are the next step.</div>"
    impl_notes: "<div><b>Phase 2 of the Legendary Feats build order</b> (full architecture: <code>CLAUDE-legendary-feats.md</code>). <a href=\"#idea-ll-feats-tlk\">ll-feats-tlk</a> (phase 1) shipped and passed UAT first.</div><div><br></div><div><b>Architecture: feats are inert tokens.</b> A legendary feat row carries name, description and icon only, with no engine mechanic. Every effect is applied server-side by script — ability bonuses as item properties on the PC's skin, other effects as permanent supernatural effects re-applied at login, spell upgrades as a branch in the relevant spell script on GetHasFeat(). This is what makes the draft's \"NWN can't express that in a 2DA\" entries tractable: <i>Legendary Onslaught</i>'s bonus attack is EffectModifyAttacks(1), not a 2DA column. It also means feat.2da gates nothing — prereqs, class gating and the allotment all live in the picker.</div><div><br></div><div><b>CORRECTION, measured 2026-07-30 — do not build on hak_2da/feat.2da.</b> That file is byte-identical to the one inside <code>cep2_add_feats.hak</code>, <b>a hak the module does not load</b> (Mod_HakList has no cep2_add_feats). It is a reference extract: 24,771 rows, 44 columns. The module actually resolves the <b>stock</b> feat.2da — <b>1116 rows (0-1115, last PLAYER_TOOL_10) and 43 columns</b>. Building on the CEP copy would silently add ~23,000 CEP weapon-of-choice feats and change the column count. Extract the real base with the nwn_resman_extract recipe in README.md (\"Rebuild from scratch\"). <b>Our rows append at 1116.</b></div><div><br></div><div><b>Shipped 2026-08-01.</b> hak_2da/feat.2da is now the stock-based generated table (1122 rows); the CEP copy it replaced stays recoverable from cep2_add_feats.hak. <code>bin/gen-legendary-feats.py</code> owns rows 1116+ from one feat-definition table, which also feeds bin/build-lotr-tlk via <code>tlk_strings()</code> — and each row's NAME/DESCRIPTION strrefs are <i>derived</i> from where the TLK builder actually places the string, so a feat name is typed once and the 2DA cannot drift from the TLK. <code>--from-stock PATH</code> reseeds the base while keeping our rows. Base rows stay byte-identical <b>including CRLF</b> — the table uses CRLF and rewriting it with bare LF makes all 1116 base rows differ. feat.2da added to RULES_2DA; the \"ALL ELEVEN\" prose in build-lotr-rules-hak and in README.md's rebuild recipe now says twelve.</div><div><br></div><div><b>Rows 1116-1121:</b> Legendary Strength / Dexterity / Constitution / Intelligence / Wisdom / Charisma, strrefs 16818318-16818329, stock epic-ability icons (ife_X2Gr*1). <b>Inert by design</b> — the row carries name, description and icon only; the +6 lands in phase 3 with the picker that grants the feat and the login hook that re-applies it.</div><div><br></div><div><b>Easiest bug to ship, closed:</b> every owned row carries <b>ALLCLASSESCANUSE = 0</b> and no cls_feat_*.2da lists one, so the engine's own level-up page can never offer a legendary feat. The picker (NWNX_Creature_AddFeat) is the only grant path; a feat reachable from both is a double-grant.</div><div><br></div><div><b>Gate.</b> <code>tests/check_legendary_feats.py</code> (in tests/smoke-test) asserts the stock base shape, that our rows match the generator, ALLCLASSESCANUSE on every row, that no cls_feat_*.2da lists one, that the strrefs match the TLK block, and that feat.2da is in the hak's content list. Negative-tested against a re-extraction over the generated file, the CEP copy coming back, and a flipped ALLCLASSESCANUSE.</div><div><br></div><div><b>Extraction note:</b> <code>nwn_resman_extract -p feat</code> sweeps thousands of unrelated resources and takes minutes; <code>nwn_resman_cat ... feat.2da</code> returns the one table in seconds.</div>"
    design_questions:
      - question: "The draft's Class Allotments assume a pure-class bonus pool, but the roadmap note on Legendary-Feats says 'reuse same pool of feats and just not give as many to mixed classes.' Confirm the mixed-class allotment rule — a flat reduction, a per-class-level formula, or pure-class-only for some tiers?"
        status: answered
        answer: "At level 60, mixed classes get 1 legendary feat (it's like a super epic class augment). At level 60, PURE classes get 2 legendary feats (pay off for their dedication), except pure Fighters who get 3 (fighter is the feat-based archetype).\n\nSUPERSEDED 2026-07-30 on the second half of this answer: the legendary picks are ADDITIONAL, not a replacement. The PC takes the normal level-60 feat through the standard engine level-up UI, and the legendary pick(s) land on top. The earlier wording here — 'This replaces the standard/epic feat selection that would normally be available at level 60' — is no longer the design. Docs corrected: CLAUDE-legendary-feats.md and docs.manual/Draft/LegendaryFeats.html (#allotments plus the Overview implementation note, which also still described the old auto-granted 'Pure <Classname>' HAK feat)."
        question_h: 64
        answer_h: 180
      - question: "Selectable at exactly level 60, not 'past 40' — confirm."
        status: answered
        answer: "Confirmed. Legendary feats are ONLY selectable AT level 60."
        question_h: 64
        answer_h: 64
    manual_steps:
      - step: "Publish: python3 bin/gen-legendary-feats.py --apply, bin/build-lotr-tlk --apply --install, bin/build-lotr-rules-hak --install, bin/refresh-nwsync, nwn-manager repack, bin/server-restart. The hak and the TLK must go out together — the rows point at strrefs only lotr.tlk has, so a client with one and not the other reads blank feat names."
        status: open
        kind: publish
        blocker: true
      - step: "UAT: grant a legendary feat to a test character by console/toolset (nothing in game hands them out yet) and confirm the name, description and icon all read correctly on the character sheet. A blank name means the hak and TLK are out of step."
        status: open
        kind: uat
      - step: "UAT: on a level-up at any level, confirm no Legendary feat appears on the engine's own feat-selection page. ALLCLASSESCANUSE=0 should make that impossible, but it is the failure this whole design exists to avoid and it is cheap to eyeball once."
        status: open
        kind: uat
  - id: ll-feats-picker
    title: "Legendary Feats: the level-60 picker window"
    group: combat-classes
    epic: legendary-levels
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-01"
    commit: 5e7b1f05b04
    notes: "<div>Hit <b>level 60</b> and, after you take your normal level-60 feat as usual, a <b>picker window</b> opens offering the Legendary Feat pool. Your legendary picks are <b>on top of</b> the normal feat — you give up nothing for them.</div><div><br></div><div><b>Pure Fighter gets 3 picks, any other pure class 2, and a mixed-class character 1.</b> \"Pure\" means all 60 levels in a single class.</div><div><br></div><div>Closed the window, or logged out halfway through? <b>Rest</b> and it comes back, any time you still have picks left.</div><div><br></div><div><b>Changed your mind?</b> Talk to <b>Ping Pong</b> and ask to choose your legendary feats again — any time, at no cost, without changing your level. Your old picks (and their bonuses) are handed back and you choose fresh. Meant for following new feats as they are added, and for rebuilding around new gear, instead of rerolling a character and levelling to 60 all over again.</div><div><br></div><div><b>Your picks belong to a level-60 character of that build.</b> Change your class makeup, or drop below level 60, and your legendary feats are handed back for you to choose again. Temporary level drain does not count — a wraith cannot cost you a feat.</div>"
    impl_notes: "<div><b>Phase 3 of the Legendary Feats build order</b> (full architecture: <code>CLAUDE-legendary-feats.md</code>). <a href=\"#idea-ll-feats-2da\">ll-feats-2da</a> shipped first. Every category story is blocked on this one's UAT.</div><div><br></div><div><b>Why a custom picker at all:</b> the engine's own level-up feat page hands out exactly one general feat at 60 to everyone, so the 1 / 2 / 3 allotment cannot be expressed to it. Decided 2026-07-30 in favour of a NUI over a conversation.</div><div><br></div><div><b>Work.</b> <code>legfeat_nui_*.nss</code> (open / event / include), following the repo's two NUI precedents — pl_nui_evt.nss (party loot roll) and dye_nui_* — and respecting the two traps already recorded against them: the <b>16-character resref limit</b> and <b>no &amp; reference parameters</b> in nw_inc_nui.</div><ul><li><b>Trigger:</b> NWNX_ON_LEVEL_UP_AFTER, already subscribed in unpacked/onmoduleload.nss, firing when GetHitDice() == 60.</li><li><b>Re-entry:</b> a rest-menu option (the _restemo_*.nss StartingConditional pattern) shown only while unspent picks remain.</li><li><b>Allotment</b> computed from class levels; feats granted with NWNX_Creature_AddFeat.</li><li><b>Persistence:</b> campaign DB <code>legfeatdb</code> keyed on GetObjectUUID(), holding picks granted and picks remaining. Shape it like bestiarydb / meritdb. A relog must not re-grant.</li><li><b>Re-apply effects at login.</b> The <i>feat</i> persists in the .bic; its <i>effects</i> do not. Every legendary feat a PC holds needs its effect or skin property re-applied on client enter. This is the piece most likely to be forgotten, and it fails silently — the sheet just quietly stops showing the bonus.</li></ul><div>Prereq checking lives here, in script — that is the whole point of the inert-token model.</div><div><br></div><div><b>Shipped 2026-08-01.</b> Files: <code>legfeat_ids_inc.nss</code> (GENERATED by bin/gen-legendary-feats.py — feat ids, names, descriptions, and each ability feat's ability + bonus, so no script hand-types a row number), <code>legfeat_db.nss</code>, <code>legfeat_inc.nss</code>, <code>legfeat_nui.nss</code>, <code>legfeat_evt.nss</code>, <code>legfeat_open.nss</code>, <code>legfeat_lvl.nss</code>, <code>_restemo_lfeat.nss</code>. All eight resrefs are inside the 16-character cap and the gate asserts it.</div><div><br></div><div><b>DECISION REVERSED — effects are permanent supernatural effects, not skin item properties.</b> The plan had ability bonuses as item properties on the PC's skin (the npcbuffgear pattern). Two things found while building: PCs in this module have <b>no creature-armour skin</b> (nothing creates one), and <code>sd_filter_inc.nss</code> <b>destroys</b> the creature-armour item on shapeshift — a druid or shifter would have silently lost every legendary bonus on their first shift and got it back only on relog. A permanent supernatural EffectAbilityIncrease survives rest and dispel, shows on the sheet, and is rebuilt at login. Every effect is tagged LEGFEAT_EFF and LegFeat_ApplyAll clears that tag before re-applying, so it is idempotent.</div><div><br></div><div><b>Level-up trigger is delayed 2 seconds.</b> At NWNX_ON_LEVEL_UP_AFTER the engine is still finishing the level-up with its own UI on screen, and a NUI window opened into that is one the player cannot interact with.</div><div><br></div><div><b>Rest-menu re-entry</b> is reply 138 in emotewand.dlg, gated by _restemo_lfeat. Shown while picks remain <b>or</b> when the character has no allotment row at all — that second case is how a character who reached 60 before this shipped gets its picks. The conditional deliberately writes nothing (it runs on every rest); legfeat_open grants when the option is actually chosen. The edited dialog round-trips byte-identically through nwn_gff.</div><div><br></div><div><b>Gate additions.</b> tests/check_legendary_feats.py now also asserts legfeat_ids_inc.nss matches the generator, that every hook exists (level up/down subscription, login re-apply, rest reopen), that LegFeat_ApplyAll skips base-score feats, and the 16-char resref cap. The wiring checks <b>strip // comments first</b> — the first version of the login-re-apply check passed a deliberately broken tree because it matched the comment explaining the call.</div><div><br></div><div><b>UAT round 1 (2026-08-01) found four defects; all fixed in 725941dbae4.</b></div><ol><li><b>The allotment was never re-checked.</b> Written once at 60 and never revisited, so a pure barbarian who took 2 picks and relevelled to 59 barb / 1 bard kept both — a two-minute exploit with Ping Pong. LegFeat_EnsureAllotment now re-derives on every level up, level down, login, rest and picker open, and <b>revokes every pick</b> when the class makeup changes (compared via a sorted class-id signature that excludes levels, so 59-&gt;60 is not a change) or the character is no longer level 60. Revoking removes the feat and subtracts the base-score points, floored at 3. <b>Energy drain must never trigger it:</b> the level is read from class levels (LegFeat_TrueLevel), not GetHitDice, and any EFFECT_TYPE_NEGATIVELEVEL defers the whole decision to the next login or level event.</li><li><b>Rest did not reopen the picker.</b> It shipped as a rest-menu conversation node; the wanted behaviour was the window coming back on rest. on_mod_rest now fires it on REST_FINISHED (Force Rest included — ForceRest raises the same event) with a 2s delay. The dialog node is reverted: emotewand.dlg.json is byte-identical to its pre-phase-3 state and _restemo_lfeat.nss is deleted. A login nudge covers characters already at 60.</li><li><b>The ability bonus was a buff, not a base-score change.</b> An EffectAbilityIncrease renders green with a buff icon and <b>counts against the server maximum enchantment ability bonus</b>, so a character already at the gear cap gained nothing at all from the feat. Ability feats now write the BASE score via NWNX_Creature_SetRawAbilityScore + ExportSingleCharacter (the mw_mixtape_con.nss route). The generator tags each feat LEGFEAT_KIND_RAW or _EFFECT; RAW is applied exactly once and <b>never at login</b> — the bonus lives in the .bic, so re-applying would stack another +6 every session.</li><li><b>The picker was cramped.</b> An unsized list group with an unconstrained description label sized itself to the description text: a fraction of the window, a horizontal scrollbar, and a header clipped to \"You may choose 2 leg\". Every child now has an explicit width, the group an explicit size and vertical-only scrollbars, and the description moved to the tooltip with a short generated effect summary in its place.</li></ol><div><br></div><div><b>UAT round 2 (2026-08-01), fixed in 5e7b1f05b04.</b> \"sqlite error: not prepared\" on every level-up, and no picker. <b>A missing schema migration</b>, not the DB wipe or the layout work: class_sig was added to legfeat_alloc after the first build, and CREATE TABLE IF NOT EXISTS does not add a column to an existing table, so every statement naming it failed to PREPARE — no allotment written, picker never opened. LegFeat_InitDb now ALTERs it behind a pragma_table_info guard (the bst_db.nss idiom). Relying on a DB wipe was the wrong call; the schema self-heals.</div><div><br></div><div><b>Added same round: a player-facing re-pick.</b> Ping Pong node \"Let me choose my legendary feats again\", gated by <code>legfeat_cond</code> (level 60 only), running <code>legfeat_respec</code>. Hands every legendary feat back and reopens the picker with the full allotment, <b>without changing the character's level</b> — so players follow a growing feat pool and changing gear without rerolling. Parked on Ping Pong; the scripts do not care where the node lives, so moving it to the rest menu or another NPC is a dialog edit and nothing else.</div><div><br></div><div><b>The exploit that shape must not become:</b> handing a feat back has to be exactly as complete as taking it — the feat AND the base ability points. LegFeat_Respec goes through LegFeat_RevokeAll, which undoes both from the pick records, so swapping Legendary Strength for Legendary Wisdom leaves +6 WIS and not +6 to both. A path that removed the feat and kept the points would be a repeatable stat farm, so the gate asserts the call is still there. Adding or subtracting base points is also refused while <b>polymorphed</b> (both on the re-pick and on the pick): ability scores are swapped out in that state, so the write would land on a body about to be replaced.</div><div><br></div><div><b>Admin test tool</b> (184e72a060d): rest menu &rarr; [Admin Options] &rarr; \"[Admin] Reset my legendary feats\". A feat added by NWNX lives in the .bic and nothing else in game removes one, so wiping legfeatdb clears records and leaves the feats. The tool removes them, subtracts base points for recorded picks, and clears the records. A feat with no pick record keeps its ability score — nothing recorded granting those points. README.md \"Legendary feats (level 60)\".</div>"
    manual_steps:
      - step: "UAT round 1 (2026-08-01): pure-class allotment correct, and no legendary feat on the engine's own level-up feat page. Four defects found — multiclass allotment, rest re-entry, buff-vs-base-score, picker layout — all fixed in 725941dbae4."
        status: done
        kind: uat
      - step: "UAT round 2 (2026-08-01): admin reset tool works. Level 59->60 threw \"sqlite error: not prepared\" and no picker — a missing class_sig schema migration, fixed in 5e7b1f05b04. No DB wipe is needed now; the schema self-heals on load."
        status: done
        kind: uat
      - step: "UAT: re-pick. As a level-60 character with picks taken, ask Ping Pong to choose them again — old feats gone, base scores back to their pre-pick values, full allotment offered, level unchanged. Pick different feats and confirm ONLY the new bonuses are on the sheet. Repeat the swap three or four times and confirm the scores return to exactly the same numbers each time (a drift upward is the stat farm this must not be)."
        status: open
        kind: uat
      - step: "UAT: the re-pick node does NOT appear for a character below level 60, and re-picking is refused while polymorphed (shift, then try)."
        status: open
        kind: uat
      - step: "Publish: nwn-manager repack and bin/server-restart. Scripts and a dialog changed; the hak and TLK are already live and need no rebuild or nwsync."
