    commit: 74803a6f53a
    notes: "<div>Hundreds of items across the module shared a tag with a different item, which broke tag-based lookups and confused the Forge's legality whitelist — the cause behind the Longsword of Elrond false-jailing. 361 of 369 conflicts are now resolved, with each variant given its own identity. Items you already carry were protected across the rename: nothing you own gets jailed because of it.</div>"
    impl_notes: "<div>Surfaced by the Longsword of Elrond false-jailing bug: Elrond's Rivendell copy and Card Mennard's Edoras copy both used resref/tag handofpaladine/LongswordofElrond with different properties, which is why that item needed a whitelist entry at all.</div><div><br></div><div>New reusable tool bin/dedupe-item-tags.py scans unpacked/ directly, groups each shared tag's members by property signature, keeps one canonical signature on the tag and gives every other the cheapest safe rewrite: retag blueprint (367), promote an inline override to its own .uti (211), re-point to a same-signature blueprint (11), retag-in-place for creature-equipped overrides so respawns stay faithful (90), and retag module blueprints that borrowed a base-game resref as their tag (13).</div><div><br></div><div>Because promotions change an item's resref, bin/gen-forge-legal.py now re-whitelists each migration's pre-dedup fingerprint from the committed map, so items players already carry are never jailed after the rename lands (no player .bic edit required). Verified: 0 remaining source-scan conflicts besides the deferred 8, idempotent re-apply, all build gates pass, and every one of the 750 changed resources round-trips through nwn_gff.</div>"
    manual_steps:
      - step: "Manually reconcile the 8 deferred conflicts, per quest: BossRing, DyeKit, DenethorsPlate, EpicRing, witchbud, nw_wplmsc004, BlackGalvornPlate, X2_IT_MGLOVE018. Their tag is used as a live quest/script lookup key, so renaming the item would break a quest &mdash; the tool detects and defers these deliberately."
        status: open
