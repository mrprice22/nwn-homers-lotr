        answer: "Neither — the premise was wrong. The two Ferny quests are distinct (Ring = cave/ring/ambush; Return = the later impostor plot) and both stay. The thing to retire was journal category p000, a stock BioWare plot-wizard template whose creatures are placed nowhere, so it could never fire; it is now @hidden. Flip to answered to confirm."
        question_h: 64
        answer_h: 64
