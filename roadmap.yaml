  - id: MW-Bardsong-Bug
    title: "MW Companions/Henchmen can get stuck trying to use Bard Song over and over"
    group: meaningwave
    status: awarded
    type: Defect
    player: "Fugdish (Try_this)"
    date: "2026-07-07"
    commit: e745a3f4c60
    notes: "<div>this happens even when you ask them to attack (<span>the dialogue questions under tactics -- </span>\nWhen you speak to him, He doesn’t seem to respond to the menu options when I click on him)</div><div>screen shot shows server log messages indicating MW henchmen is out of bard song uses and keeps trying to use it anyway, but also has confusing verbiage as if it consumes the PC's own bard song uses instead of the henchmen's bard song uses.</div><div><br></div><div><strong>Root cause:</strong> <em>mw_sup_er</em> (Campbell/McKenna OnEndCombatRound) issued song feats every combat round with no guards. Style 1 gated Curse Song on <em>FEAT_CURSE_SONG</em>, but Curse Song actually spends the <em>Bard Song</em> pool (x2_s2_cursesong decrements/checks FEAT_BARD_SONGS) -- so the gate never tripped and it re-queued Curse Song every round, flooding the \"no more bardsong uses left\" message (which names <em>bard</em> song, hence the confusing verbiage). Style 2 re-sang Bard Song every round with no \"already singing\" guard, burning all daily uses in seconds; the constant feat attempts also monopolized the henchman's action queue, pre-empting attack/tactics orders. <strong>Fix:</strong> gate Curse Song on the real FEAT_BARD_SONGS pool and skip an already-cursed enemy; add <em>!GetHasSpellEffect(411)</em> to Bard Song so it isn't re-sung while the buff is up (mirroring the module's canonical TalentBardSong()).</div>"
