        status: open
        kind: uat
        step_h: 64
      - step: "UAT: on a Sorcerer 1, take the naming — journal Blood of Elder Days opens at entry 1 and the Signet of the Drowned House appears (+1 CHA, unusable by non-Sorcerers)."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT: re-speak at Sorcerer 1-7 — expect the holding node, no second signet."
        status: open
        kind: uat
