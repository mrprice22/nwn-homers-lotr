  - id: ll-bonus-feat-lists
    title: "legendary levels bonus feats list not in sync"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    merit_awarded: true
    type: Defect
    player: "Rajmund (Ray)"
    date: "2026-08-17"
    notes: "<div>Rajmund\n —  Possible bug: when levelling wizard beyond 40, I cannot choose feats like auto still or auto quicken spell\nIf it is not a bug, then a feature request 😃 </div><div>HomelessSon — \nquick check, do you have the 27+ spellcraft ranks? </div><div>Rajmund\n — <span>Indeed I do (character names is Fireberry)</span></div><div><div><div><div><span><div></div></span></div></div><div><div></div></div></div><div><div><span><span>HomelessSon</span><span><span> </span></span></span><span><span><i>— o</i></span></span><span>k yeah I was expecting the normal class bonus feats list to apply past level 40, that's what it did for me with fighter and monk, will log as a defect (reproduced by copying character into test realm under my cd key)</span></div></div><br></div><div><br></div><div><b>Fixed 2026-08-17.</b></div><div><br></div><div><b>Casters can pick their feats again past level 40.</b> A wizard at 47 was being offered exactly three: Brew Potion, Craft Wand and Epic Spell. Spell Focus, Silent Spell, Automatic Still Spell, Automatic Quicken Spell and Epic Spell Focus had all quietly vanished from both the class bonus feat list and the general feat pick. They are back.</div><div><br></div><div><b>Nothing became cheaper.</b> Every requirement is unchanged - Automatic Still Spell still wants Still Spell and 27 ranks of Spellcraft, Epic Spell Focus still wants Greater Spell Focus in that school. The feats were impossible to reach, not expensive; only the reaching was fixed.</div><div><br></div><div><b>Levels 1-40 are untouched.</b> Below 41 you pick from exactly the list you always did.</div><div><br></div><div><b>You will see the feat twice on your character sheet</b> - once as the replacement entry you picked, once as the real feat it granted. That is deliberate: it is what stops the level-up screen offering you a feat you already own and letting you waste the pick. The benefit applies once.</div><div><br></div><div><b>All seven casting classes are covered</b> - wizard, sorcerer, cleric, druid, bard, paladin and ranger. A class is only offered the feats it can actually reach: bard tops out at 6th-level spells and paladin/ranger at 4th, so they correctly get no Epic Spell Focus and no Automatic metamagic.</div><div><br></div><div><b>Two things to know.</b> Some feats will show <b>twice</b> on the character sheet once a casting class passes 40 - that is deliberate, it is not a double benefit, and it can appear without you picking anything. And this keys on your CLASS level, not your caster level: prestige-class caster levels do not count toward the 41 (Pale Master is the only class that advances casting at all; Dragon Disciple does not). Detail: <a href=\"Customizations.html#duplicate-caster-feats\">Customizations - Why a feat can show twice</a>.</div>"
    impl_notes: "<div><b>Root cause, confirmed from data rather than inferred.</b> feat.2da's <i>MINSPELLLVL</i> column means \"must be able to cast spells of this level\" and the CLIENT filters the level-up list on it. Under NWNX MaxLevel the client resolves a caster's maximum castable spell level as 0 once that class passes 40 - the same clamp README.md \"Levels 41-60\" already records for the spell-known picker. Reading the reporter's own .bic (pure Wizard 46) gave a perfect match with no counterexamples either way: the three feats still offered are the three with a blank MINSPELLLVL, and every feat he qualified for but could not see had 1 or 9. Feats lost per class once that class passes 40: wizard 34, sorcerer/cleric/druid/bard 26, paladin/ranger 16, and <b>zero</b> for barbarian/fighter/monk/rogue - which is exactly why fighter and monk looked healthy. Only 33 rows in the whole 1116-row table carry MINSPELLLVL 1-9, so the surface is small and enumerable; Sap's 100 is a never-selectable sentinel and is left alone.</div><div><br></div><div><b>Why the obvious fixes are wrong.</b> Clearing the column fixes 41+ by breaking 1-40 (a level-3 wizard would be offered Maximize Spell). Restating the rule in 2DA terms is impossible: <i>MinLevel</i>+<i>MinLevelClass</i> name exactly ONE class per row (stock uses them for Weapon Specialization, MinLevel 4 / MinLevelClass 4), and there is no way to write \"Wizard 17 or Sorcerer 18 or Cleric 17\". Duplicating the feat per class is a dead end for a different reason - Automatic Still Spell is implemented inside the engine against that exact feat id, so a copy would be inert. And a server-side strip on LEVEL_UP_AFTER is exploit-proof but costs the player the pick and needs a rejection path the UI does not have.</div><div><br></div><div><b>The shape that works: inert per-class proxy rows that grant the real feat.</b> The stock rows are not touched at all, so 1-40 keeps using them. For the band where the stock row is unreachable, bin/spellfeat_proxies.py derives one proxy row per (feat, class): MINSPELLLVL blank so the broken filter cannot see it, MinLevelClass/MinLevel = the class at 41 as a BAND SELECTOR (not a restatement of the requirement - a class at 41 is at its own table's maximum spell level by construction, so no exploit exists), and <b>every other requirement column copied verbatim</b>. SUCCESSOR is remapped three ways: to this class's proxy if the next rank has one, kept as the stock value if that rank is not gated (Spell Focus succeeds to Greater Spell Focus, which needs no proxy), blank only if it is gated and the class cannot cast high enough. Same inert-token-plus-script-grant architecture as the legendary feats, with the opposite selectability rule.</div><div><br></div><div><b>The pairing invariant - hold either row, hold both.</b> A proxy and its stock row are different feat ids, so the engine would offer one to a character holding the other and let them waste a pick; both directions are real. unpacked/castfeat_inc.nss walks the map BOTH ways - proxy without real grants the real, real without proxy grants the inert proxy - and since the engine never offers a feat you already have, that alone closes it with nothing stripped off a player. The login sweep in mod_cliententer.nss is load-bearing, not belt-and-braces: a legacy holder must already have the proxy BEFORE the level-up to 41, because the client builds that level's list before any server script runs. Also hooked on NWNX_ON_LEVEL_UP_AFTER (castfeat_lvl.nss). Guarded by a Get2DAString probe so a server without the hak grants nothing rather than a feat id that does not exist.</div><div><br></div><div><b>No TLK change, deliberately.</b> A proxy points FEAT and DESCRIPTION at the stock row's own strrefs, so it reads as the feat it stands in for. That removes the hak/TLK co-publish coupling that would otherwise render 178 blank feat names on a stale client, and avoids hand-transcribing 178 Bioware names nothing could check. Cost is the duplicate sheet entry, which the pairing invariant wanted anyway.</div><div><br></div><div><b>Scope this pass: Wizard only, 33 rows at 1134-1166.</b> SHIPPED_CLASSES is the one line that widens it to all seven (178 rows). Wizard first because it fixes the reporting character outright and settles the single open risk - whether the client honours MinLevel above 40 at all, which stock never exercises. PROXY_CLASSES fixes emission order, so widening appends and never renumbers.</div><div><br></div><div><b>Also shipped:</b> the seven casting classes' cls_feat_*.2da are now vendored in hak_2da/ and packed (the class bonus list is drawn STRICTLY from those, so feat.2da alone would have fixed only the general pick - the reported half would have stayed broken). Seeded from stock, NOT from cep2_add_feats.hak, which Mod_HakList does not load. Stock rows stay byte-identical; ours append. New gate check_caster_proxies in tests/check_legendary_feats.py asserts every requirement column matches the stock row, that the stock rows still carry their MINSPELLLVL, that each proxy is listed in its class table, and that castfeat_ids.nss is the same one-to-one map - negative-tested five ways (loosened Spellcraft, restored MINSPELLLVL, cleared a stock MINSPELLLVL, dropped a class-table row, mispaired the include). Fixed a pre-existing latent bug in check_not_selectable while there: it read cells[1] (FeatLabel) as a feat id, so it could never fire - dormant only because no cls_feat table was vendored until now. 26/26 smoke tests, 3154 scripts compile.</div>"
    manual_steps:
      - step: "Publish: bin/build-lotr-rules-hak --install (feat.2da + the seven new cls_feat_*.2da), then bin/refresh-nwsync DETACHED (10+ min), then repack, then arm bin/reboot-on-empty. BLOCKER - the proxy rows only exist in the hak, so nothing works until clients have it. No TLK rebuild needed: the rows point at stock strrefs."
        status: done
        kind: publish
        blocker: true
      - step: "UAT (the reported case): on the Fireberry copy in the dev servervault (pure Wizard 47, Spellcraft 48). At the next level the bonus feat list must offer Automatic Still Spell I, Automatic Quicken Spell I, Silent Spell and the eight Spell Focus schools alongside Brew Potion / Craft Wand / Epic Spell."
        status: open
        kind: uat
        tester: "wizard 41+"
      - step: "UAT (the control that proves prerequisites still bite): Automatic SILENT Spell I must still be ABSENT - he has Quicken and Still Spell but not Silent Spell (feat 33). If it appears, the requirement columns were not copied faithfully and the fix is a cheat."
        status: open
        kind: uat
        tester: "wizard 41+"
      - step: "UAT (the grant): take one proxy, confirm the real feat lands on the character sheet (you should see the feat twice - that is correct), that the effect actually works in play, and that it survives a relog."
        status: open
        kind: uat
        tester: "wizard 41+"
      - step: "UAT (sub-40 control - THIS IS THE OPEN RISK): a fresh wizard at level 3 must see NO duplicate entries in either the general or the bonus list. Stock only ever uses MinLevel at value 4 and never above the level-40 boundary where this client clamps, so whether it is honoured at 41 is unproven. If duplicates appear at low level, MinLevel is being ignored and the fallback is a NUI picker (one row per class) instead of 178 rows."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (pairing invariant, both directions): on a caster who already holds one of the 33 stock feats from the 21-40 band, logging in must add the matching proxy, and the next 41+ level-up must NOT offer it. Then the forward direction: after taking a proxy, it is never offered again either."
        status: open
        kind: uat
        tester: "wizard 41+"
      - step: "Widen to the other six casting classes once the sub-40 control passes: set SHIPPED_CLASSES in bin/spellfeat_proxies.py to all seven, re-run bin/gen-legendary-feats.py --apply (33 rows becomes 178, appended - nothing renumbers), re-run the gate, republish the hak. Sorcerer/cleric/druid get 33 each, bard 16, paladin/ranger 15."
        status: open
        kind: admin
      - step: "Reply to Rajmund - he reported it, confirmed it again at 48, and supplied the character that made the root cause provable."
        status: open
        kind: admin
