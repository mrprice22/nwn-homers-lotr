  - id: petrification-timeout-2
    title: "Petrification timeout not working as expected"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Defect
    player: Szescian82
    date: "2026-07-23"
    commit: "45167215955"
    notes: "<div>The <a href=\"#idea-petrification-timeout\">2-minute petrification timeout</a> now actually fires. If any enemy turns you to stone, escalating warnings appear <b>both in your chat log and as floating text above your character</b> every 15 seconds, and after 2 minutes you die and get the normal respawn option instead of being stuck as a statue. Being cured (Stone to Flesh) mid-countdown cancels it, as expected.</div>"
    impl_notes: "<div><b>Root cause:</b> the original fix (commit 46aa7efaa1e) added a bounded-timeout chain inside DoPetrification() in the module's x0_i0_spells.nss include. But in-game petrification comes from <b>base-game precompiled gaze / flesh-to-stone scripts</b> whose .ncs already inline the <i>stock</i> DoPetrification — no module script recompiles that include on the petrify path. So the edited include was dead code and the stock behavior (indefinite petrify / no-op death GUI) still ran. Secondary flaw: the timeout DelayCommand chain was queued on OBJECT_SELF (the petrifying NPC), so it was cancelled if that NPC died mid-window.</div><div><b>Fix:</b> replaced it with a source-independent watcher in the module heartbeat bleeding.nss (petrifyCheck(), called from the existing GetFirstPC()/GetNextPC() loop). Per PC it scans for EFFECT_TYPE_PETRIFY (same idiom as mw_hench_hb.nss::MW_HasPetrify), counts heartbeats (PETRIFY_HB, ~6s each), emits the seven original escalating messages once per 15s bucket via <b>both</b> SendMessageToPC and FloatingTextStringOnCreature(..., FALSE), and at 120s applies EffectDeath — routing through ondeath020 to the respawn GUI (same pipeline the bleed-out path already uses). Trackers cleared when the effect is gone, so a cure stops it. Removed the now-dead LOTR_PetrifyTimeoutTick + DelayCommand edits from x0_i0_spells.nss (restored the stock PopUpDeathGUIPanel line) so there is a single source of truth.</div>"
    manual_steps:
      - step: "UAT: get a low-level PC petrified by a basilisk/medusa (basilisk00x spawn); confirm escalating warnings appear both in the chat log AND as floating text above the character roughly every 15s."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT: confirm that at ~2 minutes the petrified PC dies and the respawn GUI panel appears (not a stuck statue)."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT: kill the petrifying creature BEFORE the 2 minutes elapse and confirm the timeout still fires (proves the OBJECT_SELF-cancellation bug is gone)."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT: have a MeaningWave guide (or any Stone-to-Flesh) cure the PC mid-countdown and confirm the watcher stops (no spurious death after cure)."
        status: open
        kind: uat
        step_h: 64
