  - id: faction-scaffolding
    title: "Faction scaffolding: persist Good/Evil allegiance + let quests move standing"
    group: quests-areas
    epic: faction-quest-system
    status: implemented
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-23"
    commit: da33a3c3548d30e2ece9143617dc201711052189
    notes: "<span>The module already runs a 2-faction Good/Evil allegiance system (Well of Eru teleporters call goodadjuster/eviladjuster to AdjustReputation the PC toward the Goodfaction/Evilfaction anchor NPCs), but it is session-only and faction quests cannot grant durable standing. Make that allegiance persist per-character and re-apply on login, so faction quests can move real Good/Evil standing. NOT tied to character alignment.</span>"
    impl_notes: "<div><b>Scope pivoted 2026-07-23 (admin decision): NOT 10-15 named factions.</b> The admin wants to keep the existing 2-faction Good vs Evil model that the Well of Eru teleporters already use, decoupled from character alignment (a Neutral druid may pick either side's quests). Existing mechanic: anchor NPCs tagged Goodfaction/Evilfaction/Neutralfaction + scripts goodadjuster/goodadjuster2/eviladjuster call AdjustReputation(oPC, GetObjectByTag(\"Goodfaction\"), 1000) etc. The gap: AdjustReputation toward the PC is session-only, so allegiance resets on relog and quests can't bank standing. Build: (1) a factiondb campaign DB storing per-character (GetObjectUUID/CD-key) allegiance = Good|Evil|Neutral + a numeric standing; (2) a small include the adjusters/quests call to SET+persist allegiance (wrap the existing AdjustReputation calls so every teleport/quest write also stamps factiondb); (3) an OnClientEnter re-apply hook that reads factiondb and re-runs the AdjustReputation against the anchors so hostility survives relog/reboot. Enemy side is <b>hostile-on-sight</b> (the -100 adjust already drops the opposite faction below the attack threshold). Alignment is untouched.</div><div><br></div><div><b>Built 2026-07-23 (commit c3e2888):</b> new key-free include faction_db.nss (DB factiondb, table faction_standing(uuid PK, cdkey, char_name, allegiance, standing, updated_at), identity GetObjectUUID) with Faction_InitDb / SetAllegiance / ApplyLive / GetAllegiance / GetStanding / AdjustStanding. Faction_ApplyLive is the single source of truth (AdjustReputation against capital-cased anchors Goodfaction=invisobj001 / Evilfaction=invisobj002, both already placed). Wired Faction_InitDb() into onmoduleload.nss and a delayed Faction_ApplyLive(oPC) into the module OnClientEnter handler hgll_cliententer.nss. Routed the LIVE teleport adjusters through Faction_SetAllegiance: goodadjuster (GOOD, OnUsed placeable zep_lightshft009) and eiladjust (EVIL, OnUsed placeable solred) — placed in The Well of Eru / Castle Homeless Green / House of Despair; also routed the orphaned dupes goodadjuster2/eviladjuster/eviladjust2, fixing a pre-existing lowercase-tag (goodfaction/evilfaction) no-op bug. No Neutralfaction anchor is placed (the -100 against it no-ops harmlessly, fine for the 2-faction model). factiondb is created lazily on first server run of onmoduleload. 10/10 smoke gates green.</div><div><br></div><div><b>Extended 2026-07-23 (commit da33a3c) per admin design decision:</b> the model is <b>free-switching Good/Evil with dual, independent progress</b>. (1) Players switch their live allegiance freely at the Well of Eru light-shafts (goodadjuster/eiladjust) any time. (2) Standing is now tracked <b>per side</b> — good_standing and evil_standing (0-1000 each) — so playing both factions is not punished; Faction_AdjustStanding(oPC,side,delta) grows one side and applies a small <b>reversible loyalty bleed</b> of FACTION_BLEED_PCT=25% of the gain to the other side (floored at 0, <b>never a full reset</b>), so consistent one-faction play simply pulls ahead. (3) New optional <b>oath lock</b>: a class oath (Faction_SetOath) commits the character to its side and locks them out of the opposite shaft (Faction_CanSwitchTo — the adjusters refuse with an in-character message). Wired to the Paladin Oath of the West (PLD_TakeOath -&gt; Good) and the Blackguard Black Oath (q_bkg_altar fall -&gt; Evil); the helper is general for future classes. Schema migrates in place (PRAGMA-guarded ADD COLUMN). Faction quests should award standing via Faction_AdjustStanding.</div>"
    design_questions:
      - question: "FACTION ROSTER."
        status: answered
        answer: "Do NOT add 10-15 named factions. Keep just 2 (Good and Evil), aligning with how the Well of Eru teleporters already set faction hostility. This is NOT tied to character alignment, so e.g. druids stay Neutral (alignment) and can still pick either faction's quests."
      - question: "Enemy default stance toward the PC."
        status: answered
        answer: "Hostile on sight (0) - the opposing faction attacks immediately; standing must be earned. (Already the effect of the existing -100 AdjustReputation.)"
      - question: "Persistence of standing."
        status: answered
        answer: "Persist per-character in a factiondb campaign DB, re-applied on login, so allegiance/standing survives relog and reboot."
    manual_steps:
      - step: "UAT persistence: use a Well of Eru Good (or Evil) teleporter to take that allegiance, confirm the opposing faction's NPCs turn hostile, relog, and confirm the allegiance + hostility PERSIST (previously they reset). Then use the opposite teleporter and confirm the flip also persists."
        status: open
        kind: uat
      - step: "UAT alignment independence: on a True-Neutral-alignment character, take a Good allegiance and confirm it works (allegiance is faction-based, not GetAlignment)."
        status: open
        kind: uat
      - step: "Confirm the anchor NPCs tagged Goodfaction/Evilfaction/Neutralfaction exist and are placed (the whole system keys off them). Note their area(s) at build time."
        status: open
        kind: uat
      - step: "UAT oath-lock: swear the Paladin Oath of the West (Hallas, Minas Tirith Keep / area005) and confirm the EVIL light-shaft (solred) now refuses with a message and does not switch you, while the GOOD shaft still works. Symmetric: swear the Blackguard Black Oath (rack in Keep of Barad-dur / baraddurkeep) and confirm the GOOD shaft (zep_lightshft009) refuses."
        status: open
        kind: uat
      - step: "UAT dual standing + bleed: as DM, Faction_AdjustStanding(oPC,\"Good\",100) then Faction_AdjustStanding(oPC,\"Evil\",100) and confirm BOTH good_standing and evil_standing are non-zero (playing both sides is not punished), and that the Evil grant reduced good_standing by ~25 (25% bleed) but never below 0 / never reset."
        status: open
        kind: uat

  - id: faction-rally-rescue
    title: "Faction rally: pre-death muster call + timed rescue quest"
    group: quests-areas
    epic: faction-quest-system
    status: soon
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-23"
    notes: "<div>Today certain landmark defenders shout “Rally Free Peoples of Middle Earth!” / “Rally Servants of Sauron!” only as they <b>die</b> — too late to matter. This refactors the rally so the same NPCs call for aid <b>before</b> they fall: same-faction players get a muster alert + a journal entry, and if they reach the fight in time to help they earn XP, gold, and faction standing. A living, reactive world where your side's landmarks can actually be saved (or lost).</div>"
    impl_notes: "<div><b>Existing system:</b> rally shouts are hardcoded per-creature via the blueprint ScriptDeath field (area-local SpeakString(TALKVOLUME_SHOUT)) — scripts breachdeath4 (Rivendell), dolguldurshout/skinnerdeath/staticspawndol (Dol Guldur), staticspawnisen (Isengard), staticspawncarn (Carn Dum), taticspawnedoras (Edoras), etc. Three (staticspawnhelms/staticspawnminas/staticspawnloth) are orphaned/unwired. <b>Proposed build (reuse, not new engine work):</b> hook the bestiary OnDamaged wrapper bst_ondamage.nss (already rewires every creature's OnDamaged) so a flagged rally creature dropping below a HP% threshold fires ONCE: a server-wide same-faction broadcast (GetFirstPC/GetNextPC + SendMessageToPC, per bst_ondeath/skinnerdeath), AddJournalQuestEntry to aligned players, and marks its area ‘rally-active’ via the shipped worldstate_inc.nss. A rescuer who reaches the area/creature (GetArea/GetDistanceToObject) within the window (DelayCommand, per q_sow_plant) completes for XP + gold + Faction_AdjustStanding(side,+pts) (faction_db, shipped). Reward/muster template: the q_kwn_* Knight-of-Westernesse quest. Alignment side read from faction_db allegiance. Sets up [[pvp-faction-points]] (the rally-active area flag).</div>"
    design_questions:
      - question: "HP threshold + rescue window. Proposed: the pre-death rally fires when the landmark defender drops below 50% HP, and the rescue window is 60s (aligned players who reach the area within 60s and help complete it). Approve 50% / 60s, or set different values?"
        status: open
        answer: null
      - question: "Which creatures rally, and how are they flagged? Proposed: reuse the existing set that already rally-shouts on death (keyed by side from their current ScriptDeath), plus re-wire the 3 orphan scripts (Helm's Deep / Minas Tirith / Lothlorien). Flag them with a creature local var (e.g. RALLY_SIDE = Good/Evil) set at spawn so bst_ondamage knows who is a landmark defender. Approve, or should only a hand-picked list of named landmark bosses trigger it (to avoid trash mobs spamming rally calls)?"
        status: open
        answer: null
      - question: "Reward + completion rule. Proposed per successful rescue: modest XP + gold scaled to the creature's CR, and +50 faction standing (via Faction_AdjustStanding, so the -25% opposite bleed applies). Completion = the rescuer arrives AND the defender is still alive when the wave is beaten (not merely arriving). Approve the amounts + &lsquo;arrive and win&rsquo; rule, or prefer &lsquo;arrive in time&rsquo; only / different numbers?"
        status: open
        answer: null
    manual_steps:
      - step: "On approval this is a scripting build (bst_ondamage hook + a rally include over worldstate_inc + a rescue quest journal category + reward). No new blueprints expected; wave/creature flags are blueprint/spawn edits. Re-promote to confirmed after the design questions are answered."
        status: open
        kind: toolset
  - id: pvp-faction-points
    title: "Faction points for PVP kills during active rally calls"
    group: quests-areas
    epic: faction-quest-system
    status: soon
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-23"
    notes: "<div>When a landmark is under attack and its defenders have called for aid, cutting down enemy <b>players</b> who came to sack it should count. This rewards faction standing for slaying opposite-faction players — but only in the heat of an active rally (not open-field ganking), so PVP matters exactly where the war is being fought.</div>"
    impl_notes: "<div><b>Depends on [[faction-rally-rescue]]</b> (the ‘rally-active’ area flag it sets in worldstate_inc). Proposed build: hook the module OnPlayerDeath — if GetLastKiller is a PC whose faction_db allegiance is OPPOSITE the victim's, AND the death area is currently rally-active, award Faction_AdjustStanding(killerSide,+pts). Anti-farm: a per (killer+victim) cooldown via the existing quest_cd_inc.nss so repeatedly killing the same low-level alt does not farm standing; ignore same-allegiance and Neutral kills. Reuses faction_db + quest_cd_inc + the rally-active world-state; no new infra.</div>"
    design_questions:
      - question: "Points + anti-farm. Proposed: +25 faction standing per qualifying PVP kill, with a per-victim cooldown of ~30 real minutes (quest_cd_inc) so the same target cannot be farmed. Approve the amount + cooldown, or set your own?"
        status: open
        answer: null
      - question: "Eligibility. Proposed: both players must be non-Neutral and on opposite sides, the kill must be in a rally-active area, and it respects the server PvP setting (no new PvP rules — if the server disallows PvP there, no kill happens anyway). Approve, or add extra conditions (e.g. both must have the rally quest active, minimum level, no reward for killing much-lower-level players)?"
        status: open
        answer: null
    manual_steps:
      - step: "Blocked until faction-rally-rescue ships the rally-active area flag. Then: wire the OnPlayerDeath check + Faction_AdjustStanding + quest_cd_inc anti-farm. Re-promote once the dependency lands and the design questions are answered."
        status: open
        kind: admin
        blocker: true
