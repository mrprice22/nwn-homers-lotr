    notes: "<div>Withdrawn for redesign. The class quest lines went out as one large batch and lean on each other too heavily — each line is being reworked individually, with its rewards retuned, before any of it returns.</div>"
    impl_notes: "<div>Journal category clr_anor (@group 'Class Lines' @order 6). Giver q_clr_keep, plot/immortal, in templeofilluvata; offer gated on GetLevelByClass(CLASS_TYPE_CLERIC) &gt;= 1 (value 2 verified), non-clerics get a flavour blessing. Cloned from the clean wizard-line-early template (q_clr_* names).</div><div><br></div><div>Three-node one-off arc; per-character state in the clrlinedb campaign DB (key flame_stage 0-&gt;3, advance-only). Reward properties use verified stock encodings (Use-Limitation:Class subtype 2 = Cleric, confirmed against 42 existing cleric-restricted items).</div><div><br></div><div>Temple OnEnter wrapped q_clr_enter (chains the existing leash_to_area) -&gt; q_clr_spawn; conversation q_clr_conv. DLG follows the reply-gate rule (action scripts only in target Script fields, verified no action script in any Active block). Build passed all gates. No capstone built — deferred to cleric-line-mid/later.</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>implemented</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Flame of Anor</b> — the first three chapters (L1, L8, L15) of the Cleric class line. Aldamir, Keeper of the Flame, tends the Secret Fire in the Temple of Illúvatar and calls only those who serve: the <b>Acolyte's Censer-Amulet</b> at L1, the Reliquary of the Kindled Ember at L8, and the <b>Mace of the Kindled Flame</b> at L15. Details: <a href=\"QuestGuide.html#flame-of-anor\">Quest Guide → The Flame of Anor</a>.</div><div><br></div><div><b>Archived manual steps</b> — reinstate these when the line is redesigned:</div><ul><li>[toolset · done] Place waypoint AP_clericlineearly_1 in templeofilluvata. Aldamir is script-spawn-only and no-ops gracefully until then.</li><li>[uat] UAT gating: a Cleric in the Temple sees Aldamir's offer; a non-cleric gets only the flavour blessing.</li><li>[uat] UAT node 1: accept -&gt; journal clr_anor opens + the cleric-restricted Censer-Amulet.</li><li>[uat] UAT level gates: L8 and L15 gates hold.</li><li>[uat] UAT nodes 2-3: at L8 the reliquary is granted; at L15 it is consumed and the Mace granted; journal advances 1-&gt;2-&gt;3(End).</li><li>[uat] UAT restrictions: amulet and mace are unusable by non-clerics.</li><li>[uat] UAT regression: the Temple leash still fires from the wrapped OnEnter.</li></ul>"
