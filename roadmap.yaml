  - id: hobbit-post
    title: "Quest: Hobbit Post (Shire, daily deliveries)"
    group: quests-areas
    epic: quest-overhaul
    status: implemented
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-14"
    commit: 765fb4e3546
    notes: "<div><b>Hobbit Post</b> — a new T1 Shire daily. Posco Whitfoot, Hobbiton's new post-master, hands you one sealed parcel a day, addressed to a different neighbour depending on the day. Pays 60 gp and 50 XP, plus 40 gp if you make the run in under five minutes — and once in a while the parcel is misaddressed, which pays better if you chase down the true owner. Details: <a href=\"QuestGuide.html#hobbit-post\">Quest Guide → Hobbit Post</a>.</div>"
    impl_notes: "<div>Journal tag hobbit_post. Second consumer of the quest-cooldown library. Posco is a renamed existing hobbit instance — zero new placements.</div><div><br></div><div>Recipient rotates by game-calendar day across five existing NPCs: Daddy Twofoot (Hobbiton), Old Noakes (Bywater), the Green Dragon's Keeper, Salvia Brockhouse and Milo Burrows (Whitfurrow Inn). Speed bonus uses real-world epoch timing that survives relogs — the design's GetTimeSecond idea was not relog-safe. 8% misdelivery twist: the labelled recipient redirects to the true owner for +60 gp and a random small item.</div><div><br></div><div>The parcel is plot+cursed and carries its own day/timestamp state so calendar flips cannot strand it; re-offers replace rather than duplicate. Renamed instances blueprint-split so respawns keep names (build gate verified). Design deviations: recipients kept within the reachable Shire (Bilbo's House unreachable, Maggot is a CR 436 boss), and the treasure_post chest became a random-loot payout script. Docs: card moved from Quest Ideas.html into QuestGuide.html.</div>"
    manual_steps:
      - step: "UAT happy path: accept from Posco in Hobbiton, deliver to the named recipient -> 60 gp + 50 XP, +40 gp if under 5 minutes."
        status: open
        kind: uat
      - step: "UAT cooldown: re-ask -> come-back line with time to UTC midnight; resets the next UTC day."
        status: open
        kind: uat
      - step: "UAT rotation: the addressee changes with the game calendar day, and only that recipient accepts."
        status: open
        kind: uat
      - step: "UAT misdelivery (8%): refusal + redirect; the true owner pays extra plus a random item."
        status: open
        kind: uat
      - step: "UAT duplication guard: re-talking to Posco replaces the parcel, the payout destroys it, and there is no double pay."
        status: open
        kind: uat
      - step: "UAT regression: Green Dragon room rental still works parcel-free; renamed NPCs keep names after respawn; the Frogmorton quest is untouched."
        status: open
        kind: uat

  - id: riddle-game
    title: "Quest: The Riddle Game (weekly, vs Gollum)"
    group: quests-areas
    epic: quest-overhaul
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-16"
    commit: deeab60ea7c, 62272db
    notes: "<div><b>The Riddle Game</b> — a new weekly minigame, open to any level. Something wretched and whispering lurks in the Bree Cave and wants to play the old game: seven riddles, and you must answer five to win. The set changes every week and everyone on the server faces the same one. Winning pays 100-300 gp, 250 XP and a trinket. One attempt a week, win or lose. Details: <a href=\"QuestGuide.html#riddle-game\">Quest Guide → The Riddle Game</a>.</div>"
    impl_notes: "<div>Journal tag riddle_game. Fourth consumer of the quest-cooldown library (QCD_IsDoneThisWeek). The Whispering Wretch is a plot, friendly CR-1 clone of the Gollum blueprint, strongly implied to be but never named him; the placed CR-1029 Gollum boss is untouched and still Roll-of-the-Fallen tracked.</div><div><br></div><div>Bank of 16 riddles (8 classic Hobbit riddles reworded + 8 originals in the same voice), served via a token-driven generic riddle node. The weekly set is server-wide (ISO-week seed, 128 weekly variants) and answer order rotates. One attempt per calendar week: the stamp and payout both land on the seventh answer so closing the window cannot dodge either; mid-game relogs restart the same weekly set without spending the week. Waypoint AP_riddle-game_1 in breecave (looked up hyphen-stripped as AP_riddlegame_1).</div><div><br></div><div><b>Follow-up fix (commit 62272db):</b> the first UAT hit an UNRECOGNIZED TOKEN screen. Root cause: the token-setting StartingConditional q_rid_c_show (sets riddle number/verse/answer tokens 6361-6366) compiled and shipped but was never attached as the Active script on any of the four dialogue links into the riddle node, so it never ran and the tokens were never set. Attached it to all four links; as a side benefit its guards now properly gate the node so a stale 'Next riddle' click after game end cannot show a garbage riddle. Token range 6360-6368 verified collision-free.</div>"
    manual_steps:
      - step: "Place waypoint AP_riddle-game_1 in breecave. Until then the cave behaves exactly as before."
        status: done
        kind: toolset
      - step: "UAT re-test after the token fix (needs a deploy/restart): start the game and expect 'Riddle 1 of seven...' with a real verse and four distinct answers; play all seven (right/wrong quips render, answer letters rotate); the win/lose finale shows the score; a second attempt the same week gets the countdown refusal."
        status: open
        kind: uat
      - step: "UAT win path: 5+/7 pays gold/XP/trinket on the seventh answer and closes the journal."
        status: open
        kind: uat
      - step: "UAT lose path: taunts, nothing paid, week still stamped."
        status: open
        kind: uat
      - step: "UAT relog: relogging mid-game gives a fresh game on the same weekly set without spending the week."
        status: open
        kind: uat
      - step: "UAT regression: boss Gollum still spawns and tracks on the Roll of the Fallen; Bree Cave leash/OnEnter unchanged."
        status: open
        kind: uat

  - id: concerning-hobbits
    title: "Quest: Concerning Hobbits (Shire genealogy)"
    group: quests-areas
    epic: quest-overhaul
    status: confirmed
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    commit: 7ed910b39b3
    notes: "<div><b>Concerning Hobbits</b> — a new T1 daily (L5). Odo Proudfoot keeps a counter at the <b>Green Dragon Inn</b>, one door off the Hobbiton green, and he is deep in a genealogy dispute that wants five questions of Shire lineage settled. Four right pays <b>500 gp, 500 XP</b> and a pouch of Longbottom Leaf; a perfect five upgrades the keepsake to a <b>Greater Ring of Scholars</b>. The dispute — and the answers — change with the season, and the whole server argues over the same one.</div><div><br></div><div>Win once and you have proved yourself hobbit-knowledgeable, and Odo will thereafter <b>sell you pipe-weed</b> — see <a href=\"#idea-concerning-pipeweed\">Concerning Pipeweed</a>, which also brings fast travel to the Shire. Details: <a href=\"QuestGuide.html#concerning-hobbits\">Quest Guide → Concerning Hobbits</a>.</div>"
    impl_notes: "<div>Journal tag concern_hob; custom tokens 6420-6428; all logic in q_hob_inc.nss. Built on the established riddle-game pattern (token-driven dialogue, StartingConditional Active scripts, quest_cd_inc/questcddb, journal wiring).</div><div><br></div><div>Odo Proudfoot (q_hob_odo) draws five questions from a bank of 16 canon Tolkien-genealogy questions; question set and answer order are seeded from the in-game calendar season (GetCalendarYear()*4 + season, stride walk over the bank), so the correct answer rotates each season and the whole server shares one seasonal dispute. Daily gate (QCD_IsDoneToday) applies win or lose, finalized atomically on the fifth answer so escape-closing cannot dodge the stamp or double-pay. Giver spawns at AP_concerninghobbits_1; conversation q_hob_conv on the blueprint.</div><div><br></div><div><b>STILL TO BUILD — agreed 2026-07-30, three changes on top of commit 7ed910b39b3:</b></div><div><br></div><div><b>1. Reward.</b> QHOB_PayOut becomes a flat GiveGoldToCreature(oPC, 500) and QHOB_XP goes 100 -&gt; 500 (was 40 + Random(61) gp and 100 XP). Keepsake logic is unchanged in shape: grscholar at a perfect 5/5, otherwise the pouch — but the pouch resref moves from witchbud to the new <b>pw_longbottom</b> from <a href=\"#idea-concerning-pipeweed\">Concerning Pipeweed</a>, so the quest reward and the shop stock are the same item. This closes the item's design question: the original card's Bag End housing reward is dropped in favour of gold, XP and pipe-weed-shop access.</div><div><br></div><div><b>2. A persistent \"has ever won\" flag.</b> The shop gate needs to know you <i>won</i>, and the existing concern_hob questcddb key is stamped win or lose, so it cannot serve. On a win, additionally QCD_Stamp(oPC, \"concern_hob_won\"); the test is QCD_LastStamp(oPC, \"concern_hob_won\") != 0. Same trick <a href=\"#idea-spider-silk-harvest\">Spider Silk Harvest</a> uses — a second calendar key as an item-free persistent flag — so no new table and no new library.</div><div><br></div><div><b>3. Odo moves to the Green Dragon Inn</b>, behind the merchant counter, because a shopkeeper belongs at a counter and because he was never placed in Hobbiton in the first place. Mechanically: move the q_hob_enter wrapper off shirehobbiton001.are.json OnEnter and onto <b>greendragoninn.are.json</b>, whose OnEnter is currently a bare leash_to_area — so the wrapper chains identically to how it does in Hobbiton today — and restore Hobbiton's OnEnter to plain leash_to_area. q_hob_spawn itself needs no change: it keys on waypoint tag AP_concerninghobbits_1, which simply gets placed in the inn instead. Note greendragoninn is one door off shirehobbiton001, which is where the new fast travel lands.</div><div><br></div><div><b>Docs to follow:</b> docs.manual/QuestGuide.html#concerning-hobbits says \"Hobbiton\" and \"40-100 gp + 100 XP\" in three places — the TOC row, the summary table row, and the quest card itself.</div>"
    design_questions:
      - question: "The original card's reward was 'Bag End housing access (owner-check workaround, no instancing)'. That is design-sensitive &mdash; which door and interior, persistent housing entry vs. a campaign flag, and what eviction semantics apply &mdash; so a concrete gold/XP/keepsake reward shipped instead and the housing piece was deferred. Should housing access be added later as a win-hook in QHOB_PayOut, and if so on what terms?"
        status: answered
        answer: "Replace reward with new access to pipeweed shop as described in concerning-pipeweed idea. Increase reward from 100gp/xp to 500gp/xp."
        answer_h: 135
      - question: "This is a daily quest with a bank of 16 questions, 5 asked per game. What is the pool per season, and are questions re-used within a season? Should it be weekly or one-off instead if the pool is too shallow?"
        status: answered
        answer: "Answered by the shipped design: the bank is 16, five are drawn per game, and both the drawn set and the position of the correct answer are seeded from (year, season) — so within a season the dispute is fixed and server-wide, and it rotates every season. Stays a daily; one attempt per UTC day, win or lose. No change needed."
        answer_h: 135
    manual_steps:
      - step: "Place waypoint AP_concerninghobbits_1 in greendragoninn, behind the merchant counter. Odo is script-spawn-only and the scripts no-op gracefully until the waypoint exists, so the quest is unreachable without it. (Supersedes the earlier plan to place it in shirehobbiton001 — do not place it there.)"
        status: open
        kind: toolset
        blocker: true
      - step: "UAT: enter the Green Dragon Inn, talk to Odo, accept -> journal concern_hob opens. Confirm Hobbiton's own OnEnter still runs the leash after the wrapper is moved off it."
        status: open
        kind: uat
      - step: "UAT rewards: answer the five questions — 4/5 pays 500 gp + 500 XP + a pouch of Longbottom Leaf; a perfect 5/5 gives the Greater Ring of Scholars; the journal closes on finish."
        status: open
        kind: uat
      - step: "UAT shop unlock: after a first win, Odo's leaf branch appears and survives a relog; after a loss-only day it does not appear."
        status: open
        kind: uat
      - step: "UAT cooldown: re-ask the same day -> 'come back tomorrow' countdown to 00:00 UTC; resets the next UTC day. DM can reset with QCD_Clear."
        status: open
        kind: uat
      - step: "UAT rotation: the offered question set and answer positions differ across in-game seasons."
        status: open
        kind: uat
      - step: "UAT exploit guard: escape-closing on the fifth answer still stamps and pays exactly once (no double-pay)."
        status: open
        kind: uat

  - id: pipeweed-npc-reactions
    title: "NPCs notice when you are under the influence of pipe-weed"
    group: quests-areas
    epic: quest-overhaul
    status: wip
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    notes: "<div>Walk into a conversation with a pipe still on you and people will say so. Barliman, the hobbits of the Shire, the guides at the Well of Eru, the quest-givers of the great lines — they all get a word for the state you are in, and which leaf you are on, before the usual talk begins. Follows on from <a href=\"#idea-concerning-pipeweed\">Concerning Pipeweed</a>.</div>"
    impl_notes: "<div>Split out of <a href=\"#idea-concerning-pipeweed\">concerning-pipeweed</a> on 2026-07-30 so that item could ship without waiting on a pass over ~40 conversation files.</div><div><br></div><div><b>Mechanism (agreed):</b> a conditional greeting node, not ambient floating text. New StartingConditional <b>pw_is_high.nss</b> returns TRUE while the PC's PW_EXPIRY (set by pw_inc, see concerning-pipeweed) is still in the future, and sets a custom token carrying the strain name so one node covers all four strains. Then a <b>repeatable, idempotent</b> bin/add-pipeweed-remarks.py inserts <b>exactly one</b> StartingList entry at index 0 of each targeted .dlg.json — remark text drawn from the token, a single \"...\" reply linking to the conversation's existing root — leaving every existing start untouched below it. Idempotency keyed on the inserted node so a re-run is a no-op.</div><div><br></div><div><b>Target list (per the admin):</b> Well of Eru hub — New Player's Guide, Well-Mart, Guardian of Light, Guardian of Darkness. Shire — Odo Proudfoot, Posco Whitfoot, both Green Dragon Inn Keepers, the Green Dragon Cook. Bree — Barliman and the merit NPC in theprancingpo001. Plus every main-quest-line and prestige-class quest giver, Old Maggot, Bill Ferny, Old Tagget, and every Meaningwave quiz giver (see <a href=\"MeaningWave.html\">MeaningWave</a> / CLAUDE-meaningwave.md for that roster).</div><div><br></div><div><b>Risk to respect:</b> link-only fields (IsChild/Index) on DLG nodes make the engine refuse to load the whole conversation — the NPC turns to face you and no window opens. nwn-manager repack gates on tests/check_dialog_integrity.py, so the generator must emit fully-formed nodes, and the gate must be green before this ships. Patch a couple of files by hand first and prove them in-game before running the script over the whole list.</div>"
    manual_steps:
      - step: "UAT patched NPC: talk to a patched NPC while high — the remark fires and names the strain; talk sober — the normal greeting is unchanged."
        status: open
        kind: uat
      - step: "UAT unpatched NPC: an NPC not on the list behaves exactly as before, high or sober."
        status: open
        kind: uat
      - step: "UAT idempotency: re-run bin/add-pipeweed-remarks.py --apply and confirm no duplicate node is added and the dialog-integrity gate stays green."
        status: open
        kind: uat
      - step: "Confirm the Meaningwave quiz-giver roster is complete before the bulk run — those conversations are the ones most likely to break unnoticed."
        status: open
        kind: uat

  - id: pipeweed-supply-line
    title: "Quest: The Leaf Runs Short (Shire supply line)"
    group: quests-areas
    epic: quest-overhaul
    status: later
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    notes: "<div>Buy from Odo Proudfoot often enough and he will admit, a little sheepishly, that his stores are running low — and that it is not his growing that is at fault, but what has been happening on the road the leaf travels. A Shire quest to put the Southfarthing supply back in order. Follows on from <a href=\"#idea-concerning-pipeweed\">Concerning Pipeweed</a>.</div>"
    impl_notes: "<div>Drafted 2026-07-30 from the concerning-pipeweed card, recorded as its own item so it is tracked and creditable without blocking that one. <b>Depends on concerning-pipeweed's shop shipping first.</b></div><div><br></div><div><b>Trigger:</b> count the number of <b>distinct real-world calendar days</b> on which the PC has bought leaf from Odo — a questcddb-style per-day key, so the count cannot be farmed in a single sitting. On the <b>third</b> such day, the purchase conversation ends with Odo admitting his stores are low, which opens the quest. Counting purchases rather than days would let a player buy three pouches in a row and skip the whole point.</div><div><br></div><div><b>Shape:</b> a one-off (not daily) Shire quest to clear whatever is choking the Southfarthing crop — hostiles on the growing land, or on the road the leaf travels from the Southfarthing to Bywater. Sits on the same quest_cd_inc / journal skeleton as its siblings (<a href=\"#idea-hobbit-post\">Hobbit Post</a>, <a href=\"#idea-concerning-hobbits\">Concerning Hobbits</a>). Reward should be leaf-flavoured rather than gold. Note that \"a strain he does not otherwise sell\" is no longer available as a reward — Witch Weed, the obvious candidate, went onto Odo's counter when the Dirty Hippie store was merged in. So: a standing discount at the counter, a strain that is genuinely new, or restoring a strain that has gone out of stock while the supply line is broken.</div><div><br></div><div><b>Open design points</b> — which area hosts the trouble (Frogmorton and Bywater are the reachable Shire neighbours), whether it reuses existing hostile blueprints or needs new ones, and and whether the reward is a discount, a brand-new strain, or both.</div>"

