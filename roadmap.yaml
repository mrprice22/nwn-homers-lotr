    impl_notes: "<div>Journal pc_palemaster; prestigedb order key 'pale', one-off. Gated on 1+ Pale Master level; the hub line is visible at L11+.</div><div><br></div><div>Reuses the existing placed Coffin in breecryptlowerle — its OnOpen chains the old treasure script so normal loot still drops. Pale Grave-Dust is plot+cursed and re-given if lost. No new placements or waypoints: rides the already-pending AP_prestigehub_1 from the hub item. Commits 30f3e1b + 6c4d105.</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>implemented</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Twenty-First Tomb</b> — the Pale Master initiation, the hub's third order. Open the unmarked sarcophagus in the Bree Crypt, take up the grave-dust and bring it back to Halmir for 1,000 XP and the <b>Talisman of the Twenty-First Tomb</b> (Lore +3, Spellcraft +3, saves vs. death +3). Details: <a href=\"QuestGuide.html#pale-master\">Quest Guide → Pale Master</a>.</div><div><br></div><div><b>Archived manual steps</b> — reinstate these when the line is redesigned:</div><ul><li>[uat] UAT gating: non-PM L11+ character sees the branch but gets only the pointer line, no quest.</li><li>[uat] UAT: a character with 1+ PM level can accept; journal entry 1 appears and the stage survives relog.</li><li>[uat] UAT: opening the Coffin in breecryptlowerle still gives treasure, plus dust + journal 2 when on the quest; the dust cannot be dropped or sold.</li><li>[uat] UAT turn-in: dust consumed, XP + talisman granted, journal ends; epilogue only on re-talk, no second reward.</li></ul>"

