    notes: "<div>Characters past level 40 log in cleanly. The server does not re-validate characters against the rules tables on connect, so a legendary character is never rejected or quietly reset back to 40 when the cap moves. Item level restrictions stay off as well — your gear keeps working at every level.</div><div><br></div><div>(Blocked pending go live/enablement of level 41-60 through nwnxee)</div>"
    impl_notes: "<div>Verified 2026-07-25 — no login-validation change needed: server.env runs NWN_ELC=0 and NWN_ILR=0, so no connecting character is re-validated and a level 41+ character cannot be rejected or clamped. hak_2da/classes.2da was diffed field-by-field against stock: all 11 player base classes already carry MaxLevel 0 and EpicLevel -1, so no 2DA edit is needed for a 60 cap; the remaining non-zero MaxLevel values are stock prestige-class limits unreachable inside a 60-level budget. The README's claim that those columns were part of the cap lever was wrong and has been corrected.</div><div><b>Update 2026-07-27:</b> the <b>NWNX_ELC plugin is now loaded</b> (NWNX_ELC_SKIP=n) — not for validation, but because NWNX_MaxLevel requires it to bypass the engine's level-40 restriction. Loading the plugin is not NWN_ELC=1: the server still does not re-validate characters, nothing in unpacked/ subscribes to NWNX_ON_ELC_VALIDATE_CHARACTER_BEFORE/_AFTER, and no custom validation script exists. This is the one thing to watch in UAT — if a legendary character is ever refused at login, this plugin is the first suspect. Rolled out on season 2, whose servervault is the isolated test vault (2 accounts), not the season 1 vault.</div>"
