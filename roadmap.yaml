  - id: missing-map-markers
    title: "Missing map markers (add build gate)"
    group: quests-areas
    status: awarded
    merit_awarded: true
    type: Defect
    player: Szescian82
    date: "2026-08-20"
    commit: 754815dd5d6
    notes: "<div>Weathertop area and related have no area transition map makers</div><div>current code for placing map markers would produce duplicates ,need to lax the radius check for existing map markers, and then add a build gate to check for missing markers, and a way in the toolset to flag area transitions as map marker hidden when the need arises, so that map markers are not included and do not throw errors in the build gate (maybe as a key-word in the comments field on the door or trigger or waypoint?)</div><div><br></div><div><b>Fixed 2026-08-20.</b></div><div><br></div><div><b>Weathertop is on the map.</b> All three crossings between Weather Hills and Weather Top now carry a pin, in both directions, as does the wolf cave into the Forbidden Realms and the door back out of it. Nine crossings in all had no marker; they were invisible on the area map, so there was no way to tell from the map where any of them led.</div><div><br></div><div><b>The three Weather Hills crossings stayed three pins.</b> They are separate ways up, 27 to 42 metres apart, and each is marked. Only pins that genuinely sit on top of one another were merged - five across the whole module, in Tharbad, Carn Dum, Cirith Ungol, Angmar and the Well of Eru portal room, where two markers were reading the same words in the same spot.</div><div><br></div><div><b>Thirty-odd markers now name the right place.</b> Pins that had drifted out of date were corrected against where the transition actually goes - Minas Tirith's four inner doors, Lothlorien's tree level, the Ithilien forest quadrants, Bree's shops and gates among them.</div><div><br></div><div><b>It cannot silently rot again.</b> The build now refuses to pack the module while any area transition is missing its marker.</div>"
    impl_notes: "<div><b>Three defects, only one of which was the reported one.</b> bin/gen-map-notes.py already knew about all nine missing pins - they had simply never been applied, because the tool could not be run safely.</div><div><br></div><div><b>(1) The churn bug that made the tool unrunnable.</b> upsert() compared a stored pin position against the recomputed one for EXACT equality at round-5. But unpacked/ is regenerated by nwn_gff on every `nwn-manager unpack`, which re-serialises floats at ~6 significant digits - a pin written as 10.76286 comes back as 10.7629. The comparison therefore could never hold for a trigger, so every run reported all 245 trigger pins as 'updated' and --apply rewrote 135 .git/.gic pairs with no semantic change. Now compared with a 1cm tolerance (POS_EPSILON); updated went 245 -&gt; 0 and areas touched 135 -&gt; 10.</div><div><br></div><div><b>(2) Duplicate suppression, keyed on TEXT not destination.</b> MANUAL_RADIUS 8m -&gt; 12m, and a pin duplicating one already within that radius is now SKIPPED if new and REMOVED if a previous run created it (index-parallel .gic struct deleted with it; refused outright when that area's git/gic lists are already desynced). Keying on the destination instead was the obvious implementation and is wrong: Weather Hills' three crossings share a destination and must each keep a pin. Tie-break is fixed rather than order-dependent - a hand-placed pin always outranks an auto one, and between two auto pins the lower-sorting tag stays. Exactly 5 pins removed, all enumerated in the commit message.</div><div><br></div><div><b>(3) The gate + the toolset escape hatch.</b> tests/check_map_notes.py imports gen-map-notes.py's own scan() (same arrangement as check_door_autoclose.py / fix-door-autoclose.py) so the gate can never disagree with the tool about what counts as covered. Registered in tests/smoke-test; 23/23 local, 26/26 under repack. Directives are read from the object's toolset Comment box, which lives in the parallel &lt;area&gt;.gic.json struct at the same index - @nomapnote suppresses a pin (and removes an existing one, and satisfies the gate), @mapnote Some Text relabels it. Both case-insensitive, anywhere in the comment, rest of the comment untouched. No such directive convention existed in .git/.gic before this.</div><div><br></div><div><b>The gate stands down rather than blocks in two cases</b>, because module-index/area_graph.json is a gitignored WIKI artefact it may not rebuild: graph missing (fresh clone) skips; graph predating an area that exists in unpacked/ warns. Staleness compares AREA SETS, not mtimes - a git checkout, an unpack and --apply itself all restamp unpacked/, so an mtime test would read 'stale' constantly, including immediately after the tool had brought the tree fully up to date, quietly disarming the gate.</div><div><br></div><div><b>Deliberately NOT done: stripping colour codes.</b> Some area names embed &lt;c..&gt; tokens, so a few pins read like &lt;c?o?&gt; \"Well of Eru\". That is NWN's own colour markup and renders as colour in game - stripping it would be the regression, not the fix. Admin's call. Stray leading/trailing whitespace IS trimmed ('Bank of Bree ').</div><div><br></div><div><b>Also surfaced, report-only:</b> 52 placed transitions whose LinkedTo names a tag that exists nowhere in the module - they lead nowhere in game and can never be pinned. Two are in the reported area: weatherhills' weatherhills2amonsul -&gt; whills2amonsul, and gravesofthelostk's gravestoweather -&gt; WP_Weathertop1. Printed by every run, not a gate failure, not fixed here.</div>"
    manual_steps:
      - step: "UAT (the reported case): walk Weather Hills <-> Weather Top. All THREE crossings must show a pin on each side (Weather Hills shows 'Weather Top (Amon Sul)' x3, Weather Top shows 'Weather Hills' x3), plus the wolf cave -> 'Forbidden Realms: Enter' and the door back -> 'Weather Top (Amon Sul)'."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (the five merged pins): confirm no crossing lost its label where a duplicate was removed - thardbadeast (Temple of Illuvatar), carndumcity (Carn Dum: Throne), cirithungol (Orc Armory), theangmarmountai (Angmar Dungeon), area042 (Well of Eru portal). Each should still show exactly one marker, not zero."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (relabelled hand pins): ~30 hand-placed markers were corrected to the true destination. A few read blunter than the hand text they replaced - Bree's 'Appearance Changer and Character Modifying Area' (was 'Bree Merchant'), 'Taggets Smith Shop' (lost its apostrophe), 'The Prancing Pony Ground Floor' (was 'The Prancing Pony Inn'). If any read worse in game, put '@mapnote <preferred text>' in that door/trigger's Comment box in the toolset - that is what the directive is for."
        status: open
        kind: toolset
        step_h: 96
      - step: "Backlog, not this item: 52 area transitions have a LinkedTo pointing at a waypoint tag that exists nowhere, so they lead nowhere in game. Listed by every `python3 bin/gen-map-notes.py` run. Includes weatherhills2amonsul and gravesofthelostk's gravestoweather. Decide per case whether to repoint or delete."
        status: open
        kind: toolset
        step_h: 240
