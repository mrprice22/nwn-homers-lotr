    impl_notes: "<div>Journal in module.jrl.json; logic in q_pass_inc.nss. Modeled on the canonical daily-quest skeleton (concerning-hobbits / hobbit-post). Baldor spawns in foothillsofthemi, Wilrun the Quartermaster in mistymountainsb; reward scales as nDiff*200 gold + nDiff*150 XP.</div><div><br></div><div>On accept a difficulty-scaled ambush spawns mid-pass in mistymountainsa from existing goblin/warg blueprints; the Hard tier adds q_pass_gnt, a plot-safe CR-25 clone of the ordinary mgiant — deliberately NOT a boss, registry gate still 78/78.</div><div><br></div><div><b>Escort AI deliberately avoided</b> per the too-big risk: no walking companion and no hard fail-state — reaching the far side is the objective, the ambush is the danger. Daily-gated via quest_cd_inc/questcddb (QCD_IsDoneToday gates the offer, QCD_Stamp on turn-in); naturally rate-limited to one accept per day with no re-accept while an escort is active. Both area OnEnter hooks wrapped (q_pass_enter preserves the original d_cleartrash then runs q_pass_spawn). Build passed all gates.</div>"
    manual_steps:
      - step: "Place waypoint AP_passthepass_1 in foothillsofthemi (Baldor, the giver). He is script-spawn-only, so the quest cannot be accepted until this exists. Place it together with _3."
