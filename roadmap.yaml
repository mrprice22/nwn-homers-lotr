    notes: "<div>Behind-the-scenes groundwork for Legendary Feats. Nothing player-visible ships with this one — it only makes it possible for the server to carry its own custom text for names and descriptions that the base game and CEP don't provide. Everything you already see in game reads exactly as before.</div>"
    impl_notes: "<div><b>Phase 1 of the Legendary Feats build order</b> (full architecture: CLAUDE-legendary-feats.md). A hard prerequisite — no feat row can land before this does, and it must ship and be verified <i>on its own</i>.</div><div><br></div><div><b>Why.</b> feat.2da's NAME and DESCRIPTION columns are <b>strref-only</b>, so the repo's standing \"use inline strings, skip the TLK\" policy (CLAUDE-gotchas.md) does not help. NWN allows exactly one custom TLK and the module uses CEP's (module.ifo.json → Mod_CustomTlk: \"cep\"), so ours must be built <i>from</i> cep.tlk rather than alongside it.</div><div><br></div><div><b>Work.</b> New bin/build-lotr-tlk in house generator style (dry-run default, --apply, idempotent, owned string table at the top, modelled on bin/gen-caster-slots.py), using ~/.nimble/bin/nwn_tlk — present, same toolchain as the nwn_erf that build-lotr-rules-hak already uses. Converts tlk/cep.tlk to JSON, appends strictly above CEP's last index, writes tlk/lotr.tlk. Then flip Mod_CustomTlk to \"lotr\".</div><div><br></div><div><b>CORRECTION, measured 2026-07-30 — the block starts at 41101, not 7213.</b> cep.tlk is <b>sparse</b>: its header declares StringCount = <b>41101</b> (indices 0-41100) while only <b>7213</b> of those entries carry text, at index 0 and then 30000-41100. The earlier note took that 7213 as the entry <i>range</i>; appending there would have landed inside CEP's own block and silently repointed roughly 7000 CEP names and descriptions. First owned strref is <b>16777216 + 41101 = 16818317</b>. bin/build-lotr-tlk re-reads StringCount at build time and hard-errors rather than re-basing if cep.tlk ever changes.</div><div><br></div><div><b>Shipped 2026-07-30.</b> bin/build-lotr-tlk (dry-run default, --apply, --install, idempotent; writes via a temp file and re-reads what it wrote before installing). OWNED_STRINGS is <b>append-only</b> — index = BLOCK_START + position, so inserting or deleting an entry moves every strref after it. Phase 1 ships one boundary-marker string at 41101 so lotr.tlk is provably different from cep.tlk and the gate is not vacuous.</div><div><br></div><div><b>Invariant + gate.</b> Every pre-existing CEP index must keep its value; a one-entry shift silently repoints CEP-sourced names and descriptions across the <i>entire</i> module, and nothing else would catch it. tests/check_lotr_tlk.py (wired into tests/smoke-test, so it aborts the repack) asserts lotr.tlk[0..41100] == cep.tlk, that our block matches the generator's table, that nothing sits above it, and that Mod_CustomTlk reads \"lotr\" — <b>importing</b> the generator rather than re-transcribing, the lesson tests/check_epic_tables.py already encodes. Where tlk/ (gitignored) or nwn_tlk is absent it warns and passes instead of blocking the build on game data it cannot reach.</div><div><br></div><div><b>Needs a .mod repack:</b> bin/refresh-nwsync runs without --with-module and only reads the .mod to discover its hak/tlk dependency list, so the manifest won't carry lotr.tlk until the module is repacked. Mod_CustomTlk is already flipped in unpacked/, so from the next repack onward the module hard-depends on lotr.tlk being installed and synced.</div>"
    manual_steps:
      - step: "Publish: build and install tlk/lotr.tlk, bin/refresh-nwsync, nwn-manager repack (the .mod is what names the TLK — nwsync will not carry it otherwise), bin/server-restart."
        status: done
        kind: publish
      - step: "UAT: with the TLK swapped and BEFORE any feat row existed, confirm CEP item and creature names still read correctly. PASSED 2026-08-01 — no index slip, phase 2 unblocked."
        status: done
        kind: uat
  - id: ll-feats-2da
    title: "Legendary Feats: feat.2da plumbing and the first proof feats"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-01"
    commit: 39be46d2c6d
    notes: "<div>The plumbing that lets the server define its own <b>Legendary Feats</b> — feats you can only take at <b>level 60</b>. This step ships the machinery plus the six <b>Ability Score</b> feats (Legendary Strength, Dexterity, Constitution, Intelligence, Wisdom and Charisma — +6 to a stat) as the first real content; the rest of the pool follows one category at a time.</div><div><br></div><div><b>Nothing to see in game yet.</b> The feats now exist with their names, descriptions and icons, but there is no way to choose one and they do not yet do anything — the level-60 chooser and the bonuses themselves are the next step.</div>"
    impl_notes: "<div><b>Phase 2 of the Legendary Feats build order</b> (full architecture: CLAUDE-legendary-feats.md). <a href=\"#idea-ll-feats-tlk\">ll-feats-tlk</a> (phase 1) shipped and passed UAT first.</div><div><br></div><div><b>Architecture: feats are inert tokens.</b> A legendary feat row carries name, description and icon only, with no engine mechanic. Every effect is applied server-side by script — ability bonuses as item properties on the PC's skin, other effects as permanent supernatural effects re-applied at login, spell upgrades as a branch in the relevant spell script on GetHasFeat(). This is what makes the draft's \"NWN can't express that in a 2DA\" entries tractable: <i>Legendary Onslaught</i>'s bonus attack is EffectModifyAttacks(1), not a 2DA column. It also means feat.2da gates nothing — prereqs, class gating and the allotment all live in the picker.</div><div><br></div><div><b>CORRECTION, measured 2026-07-30 — do not build on hak_2da/feat.2da.</b> That file is byte-identical to the one inside cep2_add_feats.hak, <b>a hak the module does not load</b> (Mod_HakList has no cep2_add_feats). It is a reference extract: 24,771 rows, 44 columns. The module actually resolves the <b>stock</b> feat.2da — <b>1116 rows (0-1115, last PLAYER_TOOL_10) and 43 columns</b>. Building on the CEP copy would silently add ~23,000 CEP weapon-of-choice feats and change the column count. Extract the real base with the nwn_resman_extract recipe in README.md (\"Rebuild from scratch\"). <b>Our rows append at 1116.</b></div><div><br></div><div><b>Shipped 2026-08-01.</b> hak_2da/feat.2da is now the stock-based generated table (1122 rows); the CEP copy it replaced stays recoverable from cep2_add_feats.hak. bin/gen-legendary-feats.py owns rows 1116+ from one feat-definition table, which also feeds bin/build-lotr-tlk via tlk_strings() — and each row's NAME/DESCRIPTION strrefs are <i>derived</i> from where the TLK builder actually places the string, so a feat name is typed once and the 2DA cannot drift from the TLK. --from-stock PATH reseeds the base while keeping our rows. Base rows stay byte-identical <b>including CRLF</b> — the table uses CRLF and rewriting it with bare LF makes all 1116 base rows differ. feat.2da added to RULES_2DA; the \"ALL ELEVEN\" prose in build-lotr-rules-hak and in README.md's rebuild recipe now says twelve.</div><div><br></div><div><b>Rows 1116-1121:</b> Legendary Strength / Dexterity / Constitution / Intelligence / Wisdom / Charisma, strrefs 16818318-16818329, stock epic-ability icons (ife_X2Gr*1). <b>Inert by design</b> — the row carries name, description and icon only; the +6 lands in phase 3 with the picker that grants the feat and the login hook that re-applies it.</div><div><br></div><div><b>Easiest bug to ship, closed:</b> every owned row carries <b>ALLCLASSESCANUSE = 0</b> and no cls_feat_*.2da lists one, so the engine's own level-up page can never offer a legendary feat. The picker (NWNX_Creature_AddFeat) is the only grant path; a feat reachable from both is a double-grant.</div><div><br></div><div><b>Gate.</b> tests/check_legendary_feats.py (in tests/smoke-test) asserts the stock base shape, that our rows match the generator, ALLCLASSESCANUSE on every row, that no cls_feat_*.2da lists one, that the strrefs match the TLK block, and that feat.2da is in the hak's content list. Negative-tested against a re-extraction over the generated file, the CEP copy coming back, and a flipped ALLCLASSESCANUSE.</div><div><br></div><div><b>Extraction note:</b> nwn_resman_extract -p feat sweeps thousands of unrelated resources and takes minutes; nwn_resman_cat ... feat.2da returns the one table in seconds.</div>"
    design_questions:
      - question: "The draft's Class Allotments assume a pure-class bonus pool, but the roadmap note on Legendary-Feats says 'reuse same pool of feats and just not give as many to mixed classes.' Confirm the mixed-class allotment rule — a flat reduction, a per-class-level formula, or pure-class-only for some tiers?"
        status: answered
        answer: "At level 60, mixed classes get 1 legendary feat (it's like a super epic class augment). At level 60, PURE classes get 2 legendary feats (pay off for their dedication), except pure Fighters who get 3 (fighter is the feat-based archetype).\n\nSUPERSEDED 2026-07-30 on the second half of this answer: the legendary picks are ADDITIONAL, not a replacement. The PC takes the normal level-60 feat through the standard engine level-up UI, and the legendary pick(s) land on top. The earlier wording here — 'This replaces the standard/epic feat selection that would normally be available at level 60' — is no longer the design. Docs corrected: CLAUDE-legendary-feats.md and docs.manual/Draft/LegendaryFeats.html (#allotments plus the Overview implementation note, which also still described the old auto-granted 'Pure <Classname>' HAK feat)."
        answer_h: 180
      - question: "Selectable at exactly level 60, not 'past 40' — confirm."
        status: answered
        answer: "Confirmed. Legendary feats are ONLY selectable AT level 60."
    manual_steps:
      - step: "Publish: python3 bin/gen-legendary-feats.py --apply, bin/build-lotr-tlk --apply --install, bin/build-lotr-rules-hak --install, bin/refresh-nwsync, nwn-manager repack, bin/server-restart. The hak and the TLK must go out together — the rows point at strrefs only lotr.tlk has, so a client with one and not the other reads blank feat names."
        status: done
        kind: publish
        blocker: true
      - step: "UAT: grant a legendary feat to a test character by console/toolset (nothing in game hands them out yet) and confirm the name, description and icon all read correctly on the character sheet. A blank name means the hak and TLK are out of step."
        status: done
        kind: uat
      - step: "UAT: on a level-up at any level, confirm no Legendary feat appears on the engine's own feat-selection page. ALLCLASSESCANUSE=0 should make that impossible, but it is the failure this whole design exists to avoid and it is cheap to eyeball once."
        status: done
        kind: uat
  - id: ll-feats-picker
    title: "Legendary Feats: the level-60 picker window"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-01"
    commit: 5e7b1f05b04
    notes: "<div>Hit <b>level 60</b> and, after you take your normal level-60 feat as usual, a <b>picker window</b> opens offering the Legendary Feat pool. Your legendary picks are <b>on top of</b> the normal feat — you give up nothing for them.</div><div><br></div><div><b>Pure Fighter gets 3 picks, any other pure class 2, and a mixed-class character 1.</b> \"Pure\" means all 60 levels in a single class.</div><div><br></div><div>Closed the window, or logged out halfway through? <b>Rest</b> and it comes back, any time you still have picks left.</div><div><br></div><div><b>Changed your mind?</b> Talk to <b>Ping Pong</b> and ask to choose your legendary feats again — any time, at no cost, without changing your level. Your old picks (and their bonuses) are handed back and you choose fresh. Meant for following new feats as they are added, and for rebuilding around new gear, instead of rerolling a character and levelling to 60 all over again.</div><div><br></div><div><b>Your picks belong to a level-60 character of that build.</b> Change your class makeup, or drop below level 60, and your legendary feats are handed back for you to choose again. Temporary level drain does not count — a wraith cannot cost you a feat.</div>"
    impl_notes: "<div><b>Phase 3 of the Legendary Feats build order</b> (full architecture: CLAUDE-legendary-feats.md). <a href=\"#idea-ll-feats-2da\">ll-feats-2da</a> shipped first. Every category story is blocked on this one's UAT.</div><div><br></div><div><b>Why a custom picker at all:</b> the engine's own level-up feat page hands out exactly one general feat at 60 to everyone, so the 1 / 2 / 3 allotment cannot be expressed to it. Decided 2026-07-30 in favour of a NUI over a conversation.</div><div><br></div><div><b>Work.</b> legfeat_nui_*.nss (open / event / include), following the repo's two NUI precedents — pl_nui_evt.nss (party loot roll) and dye_nui_* — and respecting the two traps already recorded against them: the <b>16-character resref limit</b> and <b>no &amp; reference parameters</b> in nw_inc_nui.</div><ul><li><b>Trigger:</b> NWNX_ON_LEVEL_UP_AFTER, already subscribed in unpacked/onmoduleload.nss, firing when GetHitDice() == 60.</li><li><b>Re-entry:</b> a rest-menu option (the _restemo_*.nss StartingConditional pattern) shown only while unspent picks remain.</li><li><b>Allotment</b> computed from class levels; feats granted with NWNX_Creature_AddFeat.</li><li><b>Persistence:</b> campaign DB legfeatdb keyed on GetObjectUUID(), holding picks granted and picks remaining. Shape it like bestiarydb / meritdb. A relog must not re-grant.</li><li><b>Re-apply effects at login.</b> The <i>feat</i> persists in the .bic; its <i>effects</i> do not. Every legendary feat a PC holds needs its effect or skin property re-applied on client enter. This is the piece most likely to be forgotten, and it fails silently — the sheet just quietly stops showing the bonus.</li></ul><div>Prereq checking lives here, in script — that is the whole point of the inert-token model.</div><div><br></div><div><b>Shipped 2026-08-01.</b> Files: legfeat_ids_inc.nss (GENERATED by bin/gen-legendary-feats.py — feat ids, names, descriptions, and each ability feat's ability + bonus, so no script hand-types a row number), legfeat_db.nss, legfeat_inc.nss, legfeat_nui.nss, legfeat_evt.nss, legfeat_open.nss, legfeat_lvl.nss, _restemo_lfeat.nss. All eight resrefs are inside the 16-character cap and the gate asserts it.</div><div><br></div><div><b>DECISION REVERSED — effects are permanent supernatural effects, not skin item properties.</b> The plan had ability bonuses as item properties on the PC's skin (the npcbuffgear pattern). Two things found while building: PCs in this module have <b>no creature-armour skin</b> (nothing creates one), and sd_filter_inc.nss <b>destroys</b> the creature-armour item on shapeshift — a druid or shifter would have silently lost every legendary bonus on their first shift and got it back only on relog. A permanent supernatural EffectAbilityIncrease survives rest and dispel, shows on the sheet, and is rebuilt at login. Every effect is tagged LEGFEAT_EFF and LegFeat_ApplyAll clears that tag before re-applying, so it is idempotent.</div><div><br></div><div><b>Level-up trigger is delayed 2 seconds.</b> At NWNX_ON_LEVEL_UP_AFTER the engine is still finishing the level-up with its own UI on screen, and a NUI window opened into that is one the player cannot interact with.</div><div><br></div><div><b>Rest-menu re-entry</b> is reply 138 in emotewand.dlg, gated by _restemo_lfeat. Shown while picks remain <b>or</b> when the character has no allotment row at all — that second case is how a character who reached 60 before this shipped gets its picks. The conditional deliberately writes nothing (it runs on every rest); legfeat_open grants when the option is actually chosen. The edited dialog round-trips byte-identically through nwn_gff.</div><div><br></div><div><b>Gate additions.</b> tests/check_legendary_feats.py now also asserts legfeat_ids_inc.nss matches the generator, that every hook exists (level up/down subscription, login re-apply, rest reopen), that LegFeat_ApplyAll skips base-score feats, and the 16-char resref cap. The wiring checks <b>strip // comments first</b> — the first version of the login-re-apply check passed a deliberately broken tree because it matched the comment explaining the call.</div><div><br></div><div><b>UAT round 1 (2026-08-01) found four defects; all fixed in 725941dbae4.</b></div><ol><li><b>The allotment was never re-checked.</b> Written once at 60 and never revisited, so a pure barbarian who took 2 picks and relevelled to 59 barb / 1 bard kept both — a two-minute exploit with Ping Pong. LegFeat_EnsureAllotment now re-derives on every level up, level down, login, rest and picker open, and <b>revokes every pick</b> when the class makeup changes (compared via a sorted class-id signature that excludes levels, so 59-&gt;60 is not a change) or the character is no longer level 60. Revoking removes the feat and subtracts the base-score points, floored at 3. <b>Energy drain must never trigger it:</b> the level is read from class levels (LegFeat_TrueLevel), not GetHitDice, and any EFFECT_TYPE_NEGATIVELEVEL defers the whole decision to the next login or level event.</li><li><b>Rest did not reopen the picker.</b> It shipped as a rest-menu conversation node; the wanted behaviour was the window coming back on rest. on_mod_rest now fires it on REST_FINISHED (Force Rest included — ForceRest raises the same event) with a 2s delay. The dialog node is reverted: emotewand.dlg.json is byte-identical to its pre-phase-3 state and _restemo_lfeat.nss is deleted. A login nudge covers characters already at 60.</li><li><b>The ability bonus was a buff, not a base-score change.</b> An EffectAbilityIncrease renders green with a buff icon and <b>counts against the server maximum enchantment ability bonus</b>, so a character already at the gear cap gained nothing at all from the feat. Ability feats now write the BASE score via NWNX_Creature_SetRawAbilityScore + ExportSingleCharacter (the mw_mixtape_con.nss route). The generator tags each feat LEGFEAT_KIND_RAW or _EFFECT; RAW is applied exactly once and <b>never at login</b> — the bonus lives in the .bic, so re-applying would stack another +6 every session.</li><li><b>The picker was cramped.</b> An unsized list group with an unconstrained description label sized itself to the description text: a fraction of the window, a horizontal scrollbar, and a header clipped to \"You may choose 2 leg\". Every child now has an explicit width, the group an explicit size and vertical-only scrollbars, and the description moved to the tooltip with a short generated effect summary in its place.</li></ol><div><br></div><div><b>UAT round 2 (2026-08-01), fixed in 5e7b1f05b04.</b> \"sqlite error: not prepared\" on every level-up, and no picker. <b>A missing schema migration</b>, not the DB wipe or the layout work: class_sig was added to legfeat_alloc after the first build, and CREATE TABLE IF NOT EXISTS does not add a column to an existing table, so every statement naming it failed to PREPARE — no allotment written, picker never opened. LegFeat_InitDb now ALTERs it behind a pragma_table_info guard (the bst_db.nss idiom). Relying on a DB wipe was the wrong call; the schema self-heals.</div><div><br></div><div><b>Added same round: a player-facing re-pick.</b> Ping Pong node \"Let me choose my legendary feats again\", gated by legfeat_cond (level 60 only), running legfeat_respec. Hands every legendary feat back and reopens the picker with the full allotment, <b>without changing the character's level</b> — so players follow a growing feat pool and changing gear without rerolling. Parked on Ping Pong; the scripts do not care where the node lives, so moving it to the rest menu or another NPC is a dialog edit and nothing else.</div><div><br></div><div><b>The exploit that shape must not become:</b> handing a feat back has to be exactly as complete as taking it — the feat AND the base ability points. LegFeat_Respec goes through LegFeat_RevokeAll, which undoes both from the pick records, so swapping Legendary Strength for Legendary Wisdom leaves +6 WIS and not +6 to both. A path that removed the feat and kept the points would be a repeatable stat farm, so the gate asserts the call is still there. Adding or subtracting base points is also refused while <b>polymorphed</b> (both on the re-pick and on the pick): ability scores are swapped out in that state, so the write would land on a body about to be replaced.</div><div><br></div><div><b>Admin test tool</b> (184e72a060d): rest menu → [Admin Options] → \"[Admin] Reset my legendary feats\". A feat added by NWNX lives in the .bic and nothing else in game removes one, so wiping legfeatdb clears records and leaves the feats. The tool removes them, subtracts base points for recorded picks, and clears the records. A feat with no pick record keeps its ability score — nothing recorded granting those points. README.md \"Legendary feats (level 60)\".</div>"
    manual_steps:
      - step: "UAT round 1 (2026-08-01): pure-class allotment correct, and no legendary feat on the engine's own level-up feat page. Four defects found — multiclass allotment, rest re-entry, buff-vs-base-score, picker layout — all fixed in 725941dbae4."
        status: done
        kind: uat
      - step: "UAT round 2 (2026-08-01): admin reset tool works. Level 59->60 threw \"sqlite error: not prepared\" and no picker — a missing class_sig schema migration, fixed in 5e7b1f05b04. No DB wipe is needed now; the schema self-heals on load."
        status: done
        kind: uat
      - step: "UAT: re-pick. As a level-60 character with picks taken, ask Ping Pong to choose them again — old feats gone, base scores back to their pre-pick values, full allotment offered, level unchanged. Pick different feats and confirm ONLY the new bonuses are on the sheet. Repeat the swap three or four times and confirm the scores return to exactly the same numbers each time (a drift upward is the stat farm this must not be)."
        status: done
        kind: uat
      - step: "UAT: the re-pick node does NOT appear for a character below level 60, and re-picking is refused while polymorphed (shift, then try)."
        status: open
        kind: uat
      - step: "Publish: nwn-manager repack and bin/server-restart. Scripts and a dialog changed; the hak and TLK are already live and need no rebuild or nwsync."
        status: done
        kind: publish
        blocker: true
      - step: "UAT: allotment is 3 pure Fighter / 2 pure other / 1 mixed. Take a pick and confirm the character sheet's BASE score rose in plain text — no green tint, no buff icon — and that it stacks on a character already at the gear enchantment cap."
        status: open
        kind: uat
      - step: "UAT: relog and confirm the score is unchanged and NOT doubled. A second +6 after one relog means the login path is re-applying a base-score feat, which is permanent and cumulative."
        status: open
        kind: uat
      - step: "UAT, revoke on relevel: as a pure class take both picks, then relevel to 59/1 via Ping Pong. Both feats gone, base scores back to their pre-pick values, 1 pick offered, and a message explaining it. Check no ability score was driven below its true base."
        status: open
        kind: uat
      - step: "UAT, revoke on level loss: at 60 with picks taken, drop to 59 (die for the XP loss, or Ping Pong down). Feats gone, scores restored, nothing offered at 59; return to 60 and confirm the picks come back."
        status: open
        kind: uat
      - step: "UAT, energy drain does NOT revoke — the case this must not get wrong. At 60 with picks taken, take negative levels (a draining creature or a DM-applied EffectNegativeLevel): the feats and their base-score bonuses stay. Log in while drained and confirm the login check leaves them alone too."
        status: open
        kind: uat
      - step: "UAT: cancel the picker, then Force Rest — the window reopens. Spend the last pick and rest again — it does not. With picks outstanding, log in and see the nudge message."
        status: open
        kind: uat
      - step: "UAT: the picker reads cleanly — all six rows visible with no horizontal scrollbar, header not clipped, name/effect/tooltip correct. This doubles as the ll-feats-2da hak/TLK check: a blank name means the hak and TLK are out of step."
        status: open
        kind: uat
  - id: ll-feats-ability-martial
    title: "Legendary Feats: ability score and martial feats"
    group: combat-classes
    epic: legendary-levels
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-03"
    notes: "<div>Ability-score and martial Legendary Feats.</div>"
    impl_notes: "<div>Draft sections <a>Ability Score Feats</a> and <a>Martial Feats</a>.</div><div><b>Blocked on <a href=\"#idea-ll-feats-picker\">ll-feats-picker</a></b> (phases 1-3 of the build order: lotr.tlk → feat.2da → picker NUI). Once that lands this is a pure content job: add rows to the feat table at the top of bin/gen-legendary-feats.py, then write the behaviour script. Full architecture and the content ordering: CLAUDE-legendary-feats.md.</div><div><br></div><div><b>Content order position: 1 of 7.</b> The six Ability Score feats ship earlier as the proof payload on ll-feats-2da; this item is the 23 Martial feats.</div><div><br></div><div><b>Do the triage pass first</b>, once, over the whole draft: classify every feat as plain effect / item property / spell-script branch / needs NWNX / cut, and dedupe (Legendary Shadow Step appears in both Ki and Exotic with different prereqs; the four Bard hybrid feats are duplicated verbatim in Performance &amp; Support).</div><div><br></div><div><b>Triage pass: done 2026-08-01</b> — CLAUDE-legendary-feats-triage.md. Every one of the draft's 139 entries has a route (RAW / plain effect / combat hook / spell-script branch / cut), the duplicates are resolved (Legendary Shadow Step is one feat, not two; the four Bard feats are one set, not two), and the pool lands at <b>133 distinct feats, ~119 after cuts, 34 of them a single permanent effect</b>. It also revises the content order: <b>defence next, not arcane</b> — 13 of its 16 feats are one effect each.</div><div><br></div><div><b>Shipped 2026-08-01: prerequisites, plus the first two effect feats.</b> <i>Legendary Prowess</i> (+5 AB, EffectAttackIncrease, prereq <b>BAB 35+ and Epic Prowess</b>) and <i>Legendary Onslaught</i> (+1 attack/round <b>in melee or unarmed only</b>, EffectModifyAttacks, prereq <b>BAB 30+ and Monk level 30+</b>) — rows 1122-1123, the first LEGFEAT_KIND_EFFECT feats in the pool and therefore the first real exercise of the login re-apply path. <b>Retuned 2026-08-01 before publishing:</b> originally Legendary Assault at BAB 20+, which is no prerequisite at all when levels 21-60 hand out +1 BAB every 2 levels. <b>Neither feat has final sign-off yet</b> and neither is published, so both are still freely changeable.</div><div><br></div><div><b>The pool's first CONDITIONAL feat</b>, and it needed new machinery: Legendary Onslaught's extra attack applies to melee and unarmed but not to a bow, so it goes stale the moment the player swaps weapons — silently, in the player's favour. legfeat_equip.nss (NWNX_ON_ITEM_EQUIP_AFTER / _UNEQUIP_AFTER) re-runs LegFeat_ApplyAll on a 0.5s delay, which rebuilds every effect from the pick records. The delay is load-bearing: at _AFTER the engine may not have finished moving the item, so an immediate check answers about the state being left rather than the one being entered. The handler exits early on the spent-picks count, because it fires on every item swap by every player and almost nobody holds a legendary feat. A gate asserts the subscription.</div><div><br></div><div><b>Prerequisite machinery.</b> A Feat now carries prereq (an NWScript boolean expression over oPC, rendered verbatim into the generated LegFeat_MeetsPrereq) and prereq_text; the generator refuses to run with one and not the other, since prose with no test behind it is a prerequisite that is not enforced. <b>Checked twice:</b> the picker greys the row and shows \"Requires: ...\" in the effect column, and LegFeat_Take re-checks — the window is a client-side snapshot, so the server-side check is the one that binds. Ability prerequisites read BASE scores; a requirement met by swapping a belt on for one button press is not a requirement.</div><div><br></div><div><b>Gate additions</b> (tests/check_legendary_feats.py, both negative-tested): LegFeat_Take must call LegFeat_MeetsPrereq, and <b>every EFFECT-kind feat with no ability payload must have a case in LegFeat_ApplyOne</b> — without one the pick is spent, the feat appears on the sheet with its real name, and the benefit simply never arrives, with no error anywhere.</div><div><br></div><div><b>Remaining in this item:</b> the other 21 martial feats. Six are engine-owned and cut (Cleave, Ambidexterity, Devastating Critical DC, Knockdown size, Precision, Parry); the rest need a combat hook or a spell script — per-feat routes in the triage doc.</div><div><br></div><div><b>SHIPPED 2026-08-03: the martial replacement set, nine feats, admin-approved that day.</b> Rows 1125-1133, taking the pool from 9 to 18. <i>Juggernaut</i> (four immunity effects + a disarm hook), <i>Grip</i> (+4 AB/+6 dodge AC, CONDITIONAL on a weapon in each hand), <i>Marksman</i> (+1 attack, CONDITIONAL on a bow or crossbow — the mirror of Onslaught), <i>Bulwark</i> (-10 damage behind a shield), <i>Riposte</i> (1/round counter-attack), <i>Reaping</i> (+2/+2 per kill, stacks 5), <i>Wrath</i> (+1 damage per 5% health missing, max +20), <i>Quarry</i> (+50% vs a favoured enemy below half health), <i>Sundering</i> (-3 target AC per hit, stacks 3, capped at its real armour+shield AC).</div><div><br></div><div><b>Three new pieces of machinery, and the cost model is the point.</b> legfeat_atk_inc.nss carries the attacker-side feats and is called from devcrit_atk.nss — the module's only sight of an attack result — behind ONE GetLocalInt on the attacker (LEGFEAT_ATK_VAR), because that script runs on every attack on the server. It treats the damage struct as READ-ONLY and adds its bonuses as separate EffectDamage: devcrit_atk owns the struct and only writes it back on the critical path, so a bonus written here would be dropped on every ordinary hit. legfeat_dmg.nss carries the defender-side feats and is registered PER CHARACTER (NWNX_Damage_SetDamageEventScript) only on someone holding Bulwark or Riposte; everyone else has no damage script at all. legfeat_disarm.nss exists because the engine has no IMMUNITY_TYPE_ for disarm — the only way to make a weapon unstrikable is to skip NWNX_ON_DISARM_BEFORE. All three are switched on and off by the new LegFeat_ArmHooks, called at the end of LegFeat_ApplyAll, which clears as readily as it sets so a respec takes the hook with it.</div><div><br></div><div><b>New gate</b> (negative-tested): every HOOK feat read by a GATED hook must be named in LegFeat_ArmHooks. The existing gate proves a reader exists; this one proves the reader is ever reached. Without it a feat can have a perfectly good handler that never runs, which looks exactly like the handler not existing.</div>"
    design_questions:
      - question: "Legendary Warcry, as designed, triggers on a passed INTIMIDATE check - but Intimidate is not an activated skill in NWN, and NWNX's use-skill event only fires for skills a player actually activates (Taunt, Heal, Animal Empathy, and so on). There is nothing to hook. Proposed: re-base it on TAUNT, which is the activated skill Intimidate feeds in this game, keep the +4 AB / +4 saves to allies within 10m for 3 rounds and the 60s cooldown, and keep Intimidate 25+ as the prerequisite. The alternative is to make it a bound token item the player activates, which costs ~2 in-game turns and is unusable mid-fight."
        status: open
        answer: null
      - question: "Legendary Called Shot's first clause - 'Called Shot loses its -4 attack penalty' - is engine-owned and cannot be scripted away: the penalty is applied inside the engine's own Called Shot resolution, and no NWNX event exposes it. The doubled-and-extended effects on a failed Discipline check ARE buildable on NWNX_ON_USE_FEAT_AFTER. Proposed: ship the second half only and reword the feat to promise just that, or cut the feat and let Legendary Sundering carry the armour-shredding role it overlaps with. Which?"
        status: open
        answer: null
