  - id: doors-auto-close-and-methshop-broken
    title: "Doors should auto close themselves and shop in methonash's place is broken."
    group: quests-areas
    status: awarded
    merit_awarded: true
    type: Defect
    player: "-Methonash-"
    date: "2026-08-14"
    commit: 6d7375bf457
    notes: "<div><b>Doors shut themselves behind you again, right across the world.</b> Every door that leads from one area to another now swings closed a few seconds after it is opened - the door out of your house, the Appearance Changer, Tagget's Smith and about three hundred more that had never been given the behaviour at all.</div><div><br></div><div>A door that had somebody standing in the doorway used to lose its one chance to close and then stay open for the rest of the reboot. That is why the same door could behave differently on a busy realm and a quiet one. Doors now keep trying for about half a minute, so a crowded doorway just delays the close instead of cancelling it.</div><div><br></div><div><b>Locked doors re-lock only when you keep the key.</b> Where the key is taken from you on the way in, or where there is no key at all and the lock has to be picked, the door closes but stays unlocked - you can never be shut out of, or into, somewhere you already earned your way into. A small number of one-shot reward vaults deliberately keep their old behaviour.</div><div><br></div><div><b>The Well-Mart in Methonash's Place sells again.</b> It greeted you and then closed without ever showing its wares; it now asks whether you want to browse, and opens properly.</div>"
    impl_notes: "<div><b>Two unrelated defects filed as one report; both turned out to be timing, not drift.</b> Door wiring and the whole Well-Mart chain are byte-identical across the season 1 archive, season 2 and dev, and no commit had touched either since the realms last rebooted - so neither was a regression and neither could be explained by a stale realm. That ruled out the obvious story and pointed at silently-failing actions instead.</div><div><br></div><div><b>1. Door coverage.</b> NWScript has no module-level door hook, so this module closes doors with a per-instance OnOpen one-liner. 637 of 830 placed doors had an empty OnOpen; 335 of those were area transitions (LinkedTo set). New <b>bin/fix-door-autoclose.py</b> (dry-run by default, idempotent, preserves each file's own JSON indent so the diff is one field per door) wired all 335: <b>328 close_door + 7 close_door_lock</b>. Interior/decorative doors (302) are out of scope by design. An EXEMPT_TAGS set, discovered by scanning every .nss that calls ActionOpenDoor or SetLocked(...,FALSE) for its Get(Nearest)ObjectByTag targets (53 tags: GladiatorDoor1-12, Legendoor, wellport001, M34G06_LeverDoor, M3Q2D_VAULT*, ...), protects script-opened doors; current overlap with the 335 is zero.</div><div><br></div><div><b>The re-lock rule.</b> Of the 12 locked/KeyRequired doors in scope, only 7 re-lock - those whose key survives the unlock. Plain close_door goes on the 2 with AutoRemoveKey=1 (area010 BPtempleboss1/BPkey DC 18, dolguldurcast001 Dolskin2khan/DemonicKey DC 23) and the 3 keyless pick-only doors (theangmarmountai Angm1exit + Angm2exit, woodoflegolas Legodoor). <b>Deliberately NOT touched:</b> falseheaven EnterHeavenHeavensFoundry (sc_delay_lock, SummanusKey, pick DC 250) and thebalrogofmoria abyss2wonders (close_door_lock, Forgekey, DC 28) already re-lock after eating their key - that is intended one-shot access to reward areas, so a future audit must leave them alone.</div><div><br></div><div><b>2. The close itself - this is the half that explains the realm-to-realm difference.</b> close_door was a bare DelayCommand(5.0, ActionCloseDoor(OBJECT_SELF)). ActionCloseDoor is an action on the door and <b>fails silently when a creature is standing in the frame</b>; it was queued exactly once, so a blocked close was lost permanently. A populated Bree blocks doorways, an empty dev realm does not - same data, different outcome. Both scripts now retry until GetIsOpen is FALSE, bounded (first attempt at 5s / 2s, then up to 5 more at 6s apart). close_door_lock's SetLocked now hangs off the confirmed close instead of a fixed 2.5s delay, so it can no longer leave a door standing open AND locked - a state that then refuses to close normally. Because close_door was already on 120 doors, this repairs those too.</div><div><br></div><div><b>3. The Well-Mart.</b> methmart.dlg.json was the only conversation in the module opening a store from a terminal ENTRY node (one entry, zero replies, Script=openstoremeth): the entry is spoken and the conversation tears down in the same frame the Actions-Taken script runs, so OpenStore raises a window that dies with the dialogue. All 64 other stores put the opener on a REPLY node. Restructured to match store061.dlg.json (the Bree Well-Mart openstoremeth was cloned from): greeting entry with no script, reply 0 'Yes, show me your wares.' -&gt; openstoremeth, reply 1 'No thanks.' -&gt; end. Struct shapes copied verbatim so no link-only IsChild/Index node reaches the engine; check-dlg-integrity clean, 380 dialogs 0 failing.</div><div><br></div><div><b>Blueprint drift cleared in the same pass:</b> methmart.utm was still tagged <i>wellshop</i> from the Bree copy-paste, a three-way collision with the two placed stores genuinely tagged wellshop (bree MaxBuy 20000, thewelloferu 60000). Inert today because the GIT instance owns its tag, but any CreateObject(OBJECT_TYPE_STORE, \"methmart\") would have minted a store openstoremeth could never find. Tag -&gt; methmart, MaxBuyPrice 200000 -&gt; 100000, MarkDown 65 -&gt; 50, matching the placed instance. Caps confirmed as intended: Methonash's Well-Mart 100k, Well of Eru Well-Mart 60k.</div><div><br></div><div><b>New build gate:</b> tests/check_door_autoclose.py fails the repack if a placed transition door ships with an empty OnOpen, importing EXEMPT_TAGS and the script-choice rule from the fixer so there is one source of truth. Registered in tests/smoke-test; 25/25 pass. Script and data only - no hak, no TLK, no NWSync.</div><div><br></div><div><b>Latent, not actioned:</b> OpenStoreAppr copies the store with CopyObject, so the copy shares the methmart tag until store_appr_cls destroys it (1800s fallback) - a lingering copy could shadow the real store for the next GetNearestObjectByTag. Shared with the working Bree store, so not the cause here.</div>"
    manual_steps:
      - step: "Repack the dev/test realm and restart it (or arm reboot-on-empty). Script and data only - no hak, TLK or NWSync rebuild. DONE: repacked 2026-08-14, 25/25 smoke tests."
        status: done
        kind: publish
      - step: "UAT - the reported doors. Walk from Bree into Methonash's Place and back out; the inside door must swing shut a few seconds behind you. Same for the Appearance Changer door (BOTH sides - it was unscripted on both) and the inside of Tagget's Smith."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT - the blocked-doorway case, which is the actual root cause of the season-2-vs-test difference. Open a door, then STAND IN THE DOORWAY. The close must fail and then retry, shutting the door once you step clear (within ~35s). This is what a bare ActionCloseDoor could never do."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT - locked doors re-lock only where the key survives. blackgatge MorannonTempleDoor (key TempleKey, pick DC 8) must close AND re-lock. area010 BPtempleboss1 (key BPkey, CONSUMED on use) must close and stay UNLOCKED - if it re-locks, a player who spent the key is sealed out."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT - script-opened doors must NOT slam shut. Pull the fire-giant bridge lever (M34G06_LeverDoor) and confirm the door it opens stays open. Same for a Gladiator arena gate if convenient."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT - closes the store half. Talk to the Well-Mart NPC in Methonash's Place: the greeting must now offer 'Yes, show me your wares.' and the store window must OPEN, with the Appraise-scaled buy cap (100k base). Record what it did BEFORE the fix too if you get the chance - the old behaviour was a race and may not reproduce every time."
        status: open
        kind: uat
        tester: "any"
      - step: "Promotion to season 2 is NOT done and must not happen without the admin's explicit word. When it does, pair it with reboot-on-empty and a release note - the live realm is where -Methonash- actually reported this."
        status: done
        kind: publish
  - id: legendary-nui-wrapping
    title: "Text goes off the screen for the Legendary Feat Picker UI (both in main feat descriptions and in popup tooltips)"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    merit_awarded: true
    type: Defect
    player: Szescian82
    date: "2026-08-07"
    commit: 8082d3efb34
    notes: "<div><b>Nothing in the Legendary Feat picker runs off the screen any more.</b> The effect column wraps onto a second line instead of quietly dropping the end of the sentence, so the feats with the longest text finally read in full. The name column gave up the width to pay for it; no feat name was ever close to needing what it had.</div><div><br></div><div><b>There is a new \"?\" button on every row</b>, and a panel at the bottom of the window that it fills in. Click it and you get that feat's whole description, plus its requirements measured against your own character - which one you meet, which one you do not, and by how much. It works on greyed-out rows too, which is exactly when you most want to know whether a feat is worth qualifying for.</div><div><br></div><div>That panel replaces the hover text, which the game insisted on drawing as one enormous line off the side of the screen and could not be persuaded to break up. What is left on hover is short enough to always fit.</div><div><br></div><div>The Spellbook Study picker got the same \"?\" button and panel - its spell descriptions come out of the game's own text and are longer still.</div>"
    impl_notes: "<div><b>A NUI TOOLTIP CANNOT HOLD A LONG STRING, AND CANNOT BE MADE TO.</b> This shipped twice. The first attempt pre-wrapped every tooltip with a word-wrapper (nui_wrap_inc.nss) on the assumption that the client honours \\n there; in-game testing came back \"works for the row descriptions, not the tooltips\" - the newlines are SILENTLY STRIPPED. So a tooltip neither wraps nor clips nor accepts a break: it draws one line as wide as it likes, off the edge of the viewport, and there is no string transformation that fixes it. The wrapper was deleted rather than left as dead code; the finding is recorded in both picker headers so it is not rediscovered a third time.</div><div><br></div><div><b>Final shape: a detail pane.</b> Each row gets a \"?\" button (id \"i&lt;index&gt;\", 40px, ALWAYS enabled - a greyed row is exactly when you want to read the feat) that selects it into a bordered NuiText pane below the list. LegFeat_DetailText renders name + full DescAt + \"Requires: \" + the measured PrereqStatusAt + a \"you have taken this\" line, using \\n freely because a text widget honours it. Selection is a PC local stored +1 (LEGFEAT_SEL, the CSP_SEL convention) and the window is REBUILT on click, reusing the existing rebuild-on-take path rather than binding the pane. Cleared on close. The pane is NUI_SCROLLBARS_AUTO, not NONE, because it is now the only place the description exists - anything it drops is gone. Tooltips are reduced to the row's own short effect string, bounded by the same 62-character worst case as the column.</div><div><br></div><div><b>Two unrelated causes reported as one defect.</b> NUI offers three ways to show a string and each fails differently: a <i>label</i> aligns but never wraps - it clips its tail with no visual cue; <i>text</i> wraps but takes no alignment; a <i>tooltip</i> does neither, rendering one line with no width limit and no clipping. The picker used a label where it needed text, and a tooltip as though it were a paragraph.</div><div><br></div><div><b>The effect column</b> (legfeat_nui.nss LegFeat_Row) was NuiLabel in a 340px cell. LegFeat_EffectAt tops out at 62 characters (row 17, \"-3 target AC per hit, stacks 3, capped at its armour+shield AC\"), about 430px - so roughly a third of it was gone. It is now NuiText, borderless, NUI_SCROLLBARS_NONE. Geometry: name 240 -&gt; 200, effect 340 -&gt; 380 (longest name is 22 chars, so 200 is ample), row 30 -&gt; 46 for the second line, list 320 -&gt; 380 and window 470 -&gt; 530 to keep the same rows on screen. Columns still sum to 660 &lt; LEGFEAT_LIST_W 680 - the invariant that keeps the horizontal scrollbar away. NUI_SCROLLBARS_NONE means the row height, not a scrollbar, is what guarantees line two is visible.</div><div><br></div><div><b>The tooltip</b> was built flat as DescAt + \"  (Requires: \" + PrereqStatusAt + \")\" - 79-263 chars plus clauses, worst case ~300 on one line. The comment asserting \"the tooltip has no width limit, so it carries every clause\" was the false premise that produced it, and it is corrected in place rather than deleted.</div><div><br></div><div><b>csp_nui.nss</b> (Spellbook Study) had the tooltip half in a worse form - CSP_SpellDesc returns full TLK spell descriptions, which have no length bound at all - so it gets the same \"?\" button (id \"i&lt;spellid&gt;\", CSP_DTL local) and a 150px detail pane. Its columns hold short strings, so no column geometry change; window 500 -&gt; 640 for the pane. CSP_SEL (the spell level tab) deliberately survives a close, CSP_DTL does not.</div><div><br></div><div><b>The detail pane is BOUND, not baked in.</b> The first cut of the pane rebuilt the window on every \"?\" click, which threw away the list scroll position - and inconsistently, because the client caches that position too: some clicks snapped to the top of the pool, some restored the last offset, and the offset tracked further scrolling. It read as the button yanking the list at random. The pane is now NuiText(NuiBind(...)) updated with NuiSetBind from the handler (the inc_partyloot.nss results-panel pattern), so a click touches one bind and nothing else. A bound widget starts empty, so LegFeat_Open/CSP_Open seed it after NuiCreate - which also means the rebuild after taking a feat returns showing what the player was reading. Switching spell-level tabs clears CSP_DTL instead, since that spell is leaving the list.</div><div><br></div><div><b>Scope:</b> presentation only. bin/gen-legendary-feats.py and the generated legfeat_ids_inc.nss are untouched - the strings were fine, their rendering was not. No hak, no feat.2da, no lotr.tlk, no nwsync. Repack passed 22/22 smoke tests including the LegFeat_FirstUnmetAt call-site gate (the effect column still calls it) and the ASCII gate; legfeat_evt and csp_evt compile clean against the new include.</div>"
    manual_steps:
      - step: "Repack and restart the server. Script-side only - no hak, TLK or nwsync rebuild is needed."
        status: open
        kind: admin
      - step: "UAT (closes the report): open the picker via the Ping Pong re-pick node in the Well of Eru. The effect column must wrap onto a second line with nothing cut off. Check the Legendary Onslaught row specifically - '-3 target AC per hit, stacks 3, capped at its armour+shield AC' is the 62-character worst case that was being truncated."
        status: open
        kind: uat
        tester: "level 60, any class"
      - step: "UAT (the second fix - closes the tooltip half of the report): click the new '?' button on a row. The panel at the bottom of the window must fill with that feat's full description AND its requirements measured against your character. Nothing should now run off the screen on hover - what is left on hover is only the short effect line. Check the '?' works on a GREYED row too, since that is when it matters most."
        status: open
        kind: uat
        tester: "level 60, any class"
      - step: "UAT (longest text): use '?' on Legendary Butcher - the 263-character description, the worst case the detail pane has to hold. All of it must be readable; the pane has a scrollbar if it overflows, so confirm you can reach the end of the sentence one way or the other."
        status: open
        kind: uat
        tester: "level 60, any class"
      - step: "UAT (no scroll jump): scroll part-way down the feat list, then click a '?'. The list must NOT move - not to the top, not to a remembered offset. Only the panel at the bottom changes. Do it several times at different scroll positions; the earlier build alternated between the two and this is the check that it no longer rebuilds the window."
        status: open
        kind: uat
        tester: "level 60, any class"
      - step: "UAT (layout not regressed): confirm the list has no horizontal scrollbar, the header still reads in full (not clipped to 'You may choose 2 leg'), and taking a feat still turns its row to 'taken' and drops the header count - i.e. the window rebuild works with the extra column and the detail pane."
        status: open
        kind: uat
        tester: "level 60 with an unspent legendary pick"
      - step: "UAT (Spellbook Study): on a level-41+ caster, rest with picks remaining to open the Spellbook Study picker. It has the same new '?' button and detail pane - spell descriptions come from the TLK and are the longest strings either window shows. Confirm '?' fills the pane, that switching spell-level tabs still works, and that Learn still works."
        status: open
        kind: uat
        tester: "wizard or sorcerer, class level 41+"
  - id: legendary-feat-prereq-defect-1
    title: "Legendary Feats Prereqs not clear which one is missing/failing"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: Szescian82
    date: "2026-08-07"
    commit: 35bffb76ef3
    notes: "<div><b>The legendary feat picker now shows you your own numbers.</b> A requirement you do not yet meet is spelled out against your character - \"BAB 35+ (you have 34)\" - and each part of it is marked met or unmet, so a feat that wants two or three things tells you exactly which one you are short of instead of listing them all and leaving you to guess. The greyed row names the first thing you need; hover it for the full list, and clicking it puts the whole breakdown in your chat log.</div><div><br></div><div>Every requirement that names a number - class levels, ability scores, skill ranks, attack bonus - counts <b>that number or better</b> as qualifying. That was already true, but it is now impossible to write it any other way, so it cannot quietly stop being true.</div><div><br></div><div>Refusals are honest now too: being under level 60, or being polymorphed, used to be reported as \"you already have that legendary feat\", which sent you looking for a feat you did not have.</div>"
    impl_notes: "<div><b>The reported cause was not the cause.</b> Every prerequisite in LegFeat_MeetsPrereq was already &gt;=; there is no &gt; and no &lt; anywhere in the generated test, so there was no off-by-one to remove. Read the reporter's character straight out of the season-2 vault (servervault/QRMRR4NU/pictesterrrr.bic - Monk 13 / Bard 30 / WeaponMaster 7 / Dragon Disciple 10, total level 60): its FeatList does <b>not</b> contain feat 584 FEAT_EPIC_PROWESS. Legendary Prowess is BAB 35+ <i>and</i> Epic Prowess, so the BAB clause passed and the second one failed - invisible behind a single flat \"Requires: BAB 35+, Epic Prowess\" on a greyed row. (The same .bic holds feat 1128 = row 1116+12 = Legendary Bulwark, so the picker grants correctly.) A diagnosis defect, not a comparison defect.</div><div><br></div><div><b>Shape of the fix.</b> A prerequisite was two independent hand-typed strings on Feat - prereq (an NWScript expression rendered verbatim) and prereq_text (display) - with the generator checking only that both were set or both empty. Nothing verified the text described the comparison, and nothing forced the comparison direction. Both are now one tuple of Req clauses. A numeric clause carries a label, a getter and a minimum, and <b>the generator emits the operator</b>, so &gt; is not expressible; a boolean clause is the whole test plus how to name it. One declaration now yields the test, the display text and a measured readout.</div><div><br></div><div><b>New generated functions</b> in legfeat_ids_inc.nss: LegFeat_PrereqStatusAt(oPC, n) renders every clause with the player's value and an ASCII [ok]/[X] marker (ASCII on purpose - a non-ASCII byte in a .nss is a recorded trap in this repo), and LegFeat_FirstUnmetAt(oPC, n) renders only the first failing clause for the picker's effect column, which clips silently rather than wrapping. legfeat_nui.nss uses both; legfeat_evt.nss reports the full status and now mirrors LegFeat_Take's complete rejection order, which previously stopped after two branches and fell through to \"you already have that feat\" for the level-60 and polymorph refusals.</div><div><br></div><div><b>Four gates</b> added to tests/check_legendary_feats.py, each negative-tested by breaking it deliberately: no bare &gt; or &lt; in a generated test; every threshold in a test appears in that same feat's player-facing text; legfeat_nui.nss and legfeat_evt.nss actually call the two readouts; the generated include stays ASCII. Note the body extractor has to anchor on the definition - a plain split on the function name finds the forward declaration and silently reports every feat as textless.</div><div><br></div><div><b>Thresholds deliberately unchanged.</b> Stock cls_atk_2 row 59 gives a pure 3/4-BAB level-60 character (rogue, monk, bard, cleric, druid) exactly BAB 35, so the three BAB 35+ gates - Prowess, Reaping, Sundering - are cleared by a margin of zero and lost to any multiclass split. Full BAB reaches 40, half BAB 30. Retune only against a number the new readout has actually shown in game.</div><div><br></div><div><b>Scope:</b> prerequisites are script-side only (feat.2da gates nothing), so hak_2da/feat.2da and lotr.tlk came out byte-identical - --apply reported the 2DA unchanged. No hak rebuild, no TLK rebuild, no nwsync: repack and restart only. Repack passed 22/22 smoke tests.</div>"
    manual_steps:
      - step: "Repack and restart the server. No hak, TLK or nwsync rebuild is needed - the change is script-side only."
        status: open
        kind: publish
      - step: "UAT (closes the report): on PiC Testerrrr, open the picker via the Ping Pong re-pick node in the Well of Eru. The Legendary Prowess row must read 'Needs: Epic Prowess' - NOT a BAB number - and clicking it must put 'BAB 35+ (you have N) [ok], Epic Prowess [X]' in the chat log. That names the clause the character's .bic actually lacks."
        status: open
        kind: uat
        tester: "PiC Testerrrr (level 60)"
      - step: "UAT (measured numbers): check a row that fails on a NUMBER rather than a feat - Legendary Riposte wants Parry 60+ ranks. It must show the character's own rank, e.g. 'Needs: Parry 60+ ranks (you have 12)'. Report the BAB figure the Prowess tooltip prints: that number decides whether the three BAB 35+ gates get retuned."
        status: open
        kind: uat
        tester: "any level 60"
      - step: "UAT (honest refusals): confirm no refusal misreports itself any more. Take a feat legitimately, then click its row again - 'You already have that legendary feat' must appear only when the feat is genuinely already held, never for an unmet prerequisite."
        status: open
        kind: uat
        tester: "any level 60"
  - id: forge-caps-only-apply-to-forged-items
    title: "Powerful stock gear was jailed as contraband after a blueprint rebalance"
    group: forge
    status: awarded
    merit_awarded: true
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-08-15"
    commit: 6c6f213447f
    notes: "<div><b>You can no longer be jailed for gear you never forged.</b> Walking into the world with a legitimately-obtained item could land you in the Pit Prison accused of unlawful enchantment - even if you had never taken that item to a forge in your life. Powerful drops, quest rewards and boss loot were all at risk.</div><div><br></div><div><b>What was really going on.</b> The law was never meant to cap how good an item can be - plenty of the server's own gear carries dozens of enchantments and is worth a fortune, and all of it is legitimate. The ceiling exists for one purpose: to stop a player forging a piece past it. But the check worked out whether you had forged something by comparing the item against its current blueprint - so whenever a rebalance changed that blueprint, every copy already in players' hands suddenly looked \"modified\", and anything above the ceiling was treated as contraband. The August crit-immunity pass and the earlier attack/enhancement cleanup each rewrote several high-end items, which is what set this off.</div><div><br></div><div>The forge now remembers, on the item itself, whether a player actually changed it. The caps apply to those pieces and to nothing else, so rebalancing an item can never again criminalise the copies already out in the world.</div>"
    impl_notes: "<div><b>Root cause.</b> ForgeItemLegality used ForgeItemDeviatesFromBlueprint as a proxy for \"a player made this what it is\". The proxy is invalidated by any blueprint edit: f82a9e882b5 (crit immunity, 2026-08-02) stripped 31 lines each from bossring001 and superdeluxering; a026a118b6f / abf8a18f222 (2026-06-23) collapsed AB+Enhancement on item061, item082, it_crewpsp024 and jubmaghica001. Every instance minted before those commits deviates from current stock through no act of the player, and every one of them is far over ForgeLegalMaxProps() (7) / ForgeLegalMaxValue() (900,000) - the cheat-chest set alone runs 15-72 properties and 170M-1.3B gp - so all of them read FORGE_LEG_ILLEGAL.</div><div><br></div><div><b>Fix.</b> New FORGE_TOUCHED item-local stamp plus ForgeIsPlayerModified(oItem), and ForgeItemLegality now returns LEGAL for anything over the caps that is not player-modified, checked BEFORE the blueprint compare (O(1), and the compare instantiates the blueprint). Stamped by every path that lets a player change an item: modifyitem.nss (enchant), forge_dis_go.nss (Warden strip) and ForgeStageCommit (staged anvil strip). FORGE_GP_INVESTED &gt; 0 is honoured as the legacy signal, covering items enchanted before the stamp existed. ForgeRevertToBlueprint mints a fresh item so it carries no stamp - reverting still makes a piece lawful. The blueprint compare is retained as a second conjunct so a hand-reverted forged item also reads legal.</div><div><br></div><div><b>Known trade-off (deliberate):</b> an item forged before FORGE_GP_INVESTED existed, or enchanted at zero net cost, carries no marker and is now grandfathered legal. Accepted in exchange for zero false positives - jailing an innocent player is far worse than missing an old exploit item, and the Warden can still strip anything found by hand.</div><div><br></div><div>FORGE_CLEAN_VER 4 -&gt; 5 forces one re-scan under the new rules. The change only ever loosens the law, so nothing can newly become contraband and anyone already wrongly jailed is cleared on next login.</div>"
    manual_steps:
      - step: "UAT (the report): take cheat-chest gear (superdeluxering, bossring001, theuntouchable, denethorsplat001, zomgwtfbbqhax - all rewritten by the Aug 2 crit-immunity pass) and log in. You must NOT be sent to the Pit Prison."
        status: open
        kind: uat
        tester: "admin with cheat-chest access"
      - step: "UAT (the law still bites): forge an item past the ceiling at a forge, then log out and back in. That item MUST still jail you - the caps have to keep working for genuinely forged gear."
        status: open
        kind: uat
        tester: "any character with forge gold"
      - step: "UAT (revert clears it): with a genuinely over-cap forged item, use the Forge Warden's revert-to-stock. The replacement must read lawful and release you."
        status: open
        kind: uat
        tester: "any"
      - step: "Grandfathering hole reviewed and CLEARED BY AUDIT (2026-08-15). Reasoning first: the FORGE_GP_INVESTED marker landed 2026-06-04 and the contraband system only went live 2026-06-14, so every item forged while the caps existed carries a mark, and the old (stricter) rule had two months to catch anything older. Then verified rather than assumed, with the new bin/audit-character-drift.py over all 35 dev characters (587 items): 274 CLEAN, 272 UNKNOWN_BP (stock Bioware/CEP resrefs, not judgeable offline), 33 FORGED (carry a stamp, as expected), 4 PLACED_VARIANT, 3 REBALANCED, and exactly 1 SUSPECT - orb_lvldrain, 0 properties and 0 cost, i.e. an item that LOST properties and gained no power. No SUSPECT item is over the caps. Nothing in circulation looks like gear forged past the ceiling before the stamps existed."
        status: done
        kind: admin
      - step: "Re-run bin/audit-character-drift.py against the LIVE season-2 vault before this rule reaches production - the audit above covers the dev vault only, and production has the real player population."
        status: open
        kind: admin
  - id: forge-blueprint-compare-instruction-cap
    title: "Legality check silently aborted on items carrying many enchantments"
    group: forge
    status: awarded
    merit_awarded: true
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-08-15"
    commit: 6c6f213447f
    notes: "<div><b>The contraband check could quietly give up half way through your inventory.</b> On an item carrying a large number of enchantments the check was so expensive that the engine cut the script off mid-calculation. Nothing was reported: the scan simply stopped, leaving the rest of the inventory unexamined. It also made the results look arbitrary - a mid-sized item would be flagged while a far more extreme one was passed over, purely because the bigger one aborted before it could finish.</div>"
    impl_notes: "<div><b>Root cause.</b> ForgeItemDeviatesFromBlueprint was O(n^3) in property count: for each property on the item it looped over every stock property index, and called ForgeGetPropByIndexSel per candidate, which re-walks the stock list from the start. superdeluxering carries 72 priced properties, giving roughly 72 x 36 x 36 inner steps with engine calls on each - into the millions of instructions, well past the 524,288 cap. TMI aborts the script, so the failure was invisible: the item never got a FORGE_CLEAN stamp and forge_scan_step's reschedule never ran, silently killing the scan chain part-way through the queue. This is why one item jailed the player while larger ones passed unnoticed.</div><div><br></div><div><b>Fix.</b> The stock side is packed ONCE into a \"|sig|sig|sig|\" string keyed on the same (type, subtype, costtablevalue, param1value) tuple, via the new ForgePropSig helper; each item property looks its signature up with FindSubString and consumes that one token. O(n) property walks plus O(n) string searches. The rewrite also closed a real gap: the old code only guarded on counts being equal up front, so it is now explicit that an item with FEWER priced properties than stock deviates too.</div>"
    manual_steps:
      - step: "UAT: carry several 40+ property items at once (superdeluxering has 72, theuntouchable 70, denethorsplat001 65) and log in. The scan must run to completion over the whole inventory - no silent stop, and no TOO MANY INSTRUCTIONS in the log."
        status: open
        kind: uat
        tester: "admin with cheat-chest access"
      - step: "UAT (deviation still detected): forge a property onto an item, then confirm the Warden still reports it as differing from stock - the faster compare must not have made it blind."
        status: open
        kind: uat
        tester: "any"
  - id: forge-warden-revert-all-instruction-cap
    title: "Forge Warden's revert-all failed with a script error, stranding jailed players"
    group: forge
    status: awarded
    merit_awarded: true
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-08-15"
    commit: b80238bce06
    notes: "<div><b>The way out of the Pit Prison could fail.</b> Asking the Forge Warden to revert all your gear to stock would die with a script error if you were carrying a large inventory - and since that is the one action that frees a jailed player, failing it left you locked up with no way out at all.</div><div><br></div><div>The Warden now works through your gear a piece at a time and lets you out when it is done.</div>"
    impl_notes: "<div><b>Root cause.</b> ForgeRevertAllIllegal was a synchronous while-loop calling ForgeFindIllegalItem once per revert, re-evaluating the whole unscanned inventory on every iteration - O(items^2) on top of an already expensive per-item legality check. Its comment claimed FORGE_CLEAN stamps made this cheap, but the LOGIN scan stops at the first illegal item, so almost nothing is stamped by the time a jailed player reaches the Warden and the short-circuit never applies.</div><div><br></div><div><b>Fix.</b> Replaced with ForgeBeginRevertAll plus a third mode in forge_scan_step, reusing the queue machinery that already fixed this exact trap for the dialog gates (ForgeBeginWardenScan, see forge_ward_c_il's comment). Mode 2 reverts ONE item per delayed step so each step gets a fresh instruction budget. Unlike the scan modes it does not stop at the first illegal item: it drains the queue, tallying blueprint-less items into FORGE_RVT_FAIL, and at drain either releases the player (tally zero) or leaves the dirty verdict standing for forge_ward_c_il. The jail-release jump moved out of forge_ward_rva into a shared ForgeReleaseFromJail so the drain step can perform it.</div>"
    manual_steps:
      - step: "UAT: get jailed with a large inventory of forged gear, then use the Warden's 'revert all to stock'. It must complete without a script error and drop you at the Well of Eru."
        status: open
        kind: uat
        tester: "any character with a full inventory"
      - step: "UAT (partial failure path): carry an item whose blueprint no longer exists alongside revertible gear. Revert-all must fix what it can, keep you in the prison, and show the 'remains unlawful' branch rather than releasing you."
        status: open
        kind: uat
        tester: "any"
  - id: forge-glove-damage-bonus
    title: "Damage enchantments could not be forged onto gloves; Tagget's forge offered options the item could not use"
    group: forge
    status: awarded
    merit_awarded: true
    type: Defect
    player: "-Methonash-"
    date: "2026-08-15"
    commit: 44fdbf4f203ef322f73c193fd30e436d5bedd775
    notes: "<div><b>Gloves can now be given damage.</b> You could always take a pair of gloves to a forge and put a plain enchantment on them - a +10 pair was never a problem - but the smiths would not offer <i>Damage Bonus</i> at all, so there was no way to put 1d6 fire (or any other damage) on them. Unarmed fighters were quietly locked out of the one enchantment that mattered most to them. Gloves are now treated as the unarmed fighter's weapon at every forge, and take damage on the same terms a sword does.</div><div><br></div><div><b>Bows and crossbows too.</b> The same menu had drifted to melee-only at Rivendell and in Moria, so archers could not forge damage onto a bow or crossbow there either. That is fixed in the same pass.</div><div><br></div><div><b>Each forge keeps its own limits.</b> Nothing about the damage tiers changed - gloves and bows get exactly what that forge already offered: Tagget's 1, 2, 3, 1d4, 1d6 (slashing, bludgeoning, piercing); Rivendell 1d8, 1d10, 1d12 (adds fire, cold); Moria and Methonash's Place 2d6, 2d8, 2d10 (adds acid, lightning, sonic); the Kallrist Crypt +4, 2d4, 1d6, 1d10, 1d12 of negative energy.</div><div><br></div><div><b>One tightening.</b> Tagget's and the Kallrist Crypt were previously offering damage on <i>anything</i> laid on the anvil - rings, cloaks, amulets, belts, boots, helms, armour. Damage is now a weapons-and-gloves enchantment everywhere, so those slots no longer take it at any forge.</div><div><br></div><div><b>Tagget's now only offers what your item can actually use.</b> The other forges have long hidden enchantments that make no sense for the piece on the anvil - no Unlimited Ammo on a helmet, no Keen on a cloak. Tagget's never got that treatment and would list every option for every item, so a new player could pay for an enchantment that did nothing. Tagget's menu now filters by item type exactly as Rivendell and Moria do: Attack Bonus and Massive Criticals on weapons, Keen, On-Hit and Vampiric Regeneration on melee weapons, Mighty and Unlimited Ammo on ranged weapons. Its low-tier damage dice and its lack of Damage Immunity are unchanged.</div><div><br></div><div><b>Slings are ranged weapons.</b> A sling was listed among the melee weapons, so it could be given Keen, On-Hit Properties and Vampiric Regeneration - all of which are melee-only enchantments. It is now treated as the ranged weapon it is, and still takes Mighty, Unlimited Ammo and a damage bonus as before.</div>"
    impl_notes: "<div><b>Root cause.</b> The forge never checks base-item type in NWScript at all. itemprocs.nss dispatches \"Damage Bonus\" -&gt; ItemPropertyDamageBonus() and modifyitem.nss applies whatever the dialog staged; a scripted AddItemProperty is not validated against baseitems.2da, so the only thing deciding which items may take a property is which StartingConditional sits on the dialog menu link. ismeleeweapon.nss lists 31 base types and has no BASE_ITEM_GLOVES (36) - that single omission was the whole bug.</div><div><br></div><div><b>The trap.</b> The authoritative gate is the <b>link-level</b> Active on the reply link inside the parent entry's RepliesList, NOT the Active on the top-level ReplyList node. All four forge dlgs carry stale node-level mirrors left behind by 0558395c7ed (\"FORGE x 3 revisions balancing\", 2026-06-04) that disagree with the live link value - reading the node Active tells you \"isweapon\" on a link that actually says \"ismeleeweapon\". Only 73 of the module's 5,998 replies carry a node Active at all; the forge dlgs and npc_banker are the whole set.</div><div><br></div><div><b>Audit before the fix</b> - the rule was different at every forge: forge_item_mid (Tagget's) entry 5 -&gt; R99 ungated (anything on the anvil); kimli_forge (Rivendell) entry 4 -&gt; R156 ismeleeweapon; bellnius_smith (Moria + Methonash's Place) entry 4 -&gt; R156 ismeleeweapon; kallrist_forge entry 4 -&gt; R251 (Negative-Energy, its only damage path) ungated. kallrist_forge R156 \"Damage Bonus.\" is orphaned - no entry links it - left from the menu trim in 8cbb321f68c.</div><div><br></div><div><b>Fix.</b> New conditional isweaponorglove.nss = isweapon.nss's 35 base types (melee + crossbows/bows/sling) plus BASE_ITEM_GLOVES, set as the link Active on the damage reply in all four dlgs, unifying the rule. Kept separate from isweapon.nss deliberately: that one also gates Attack Bonus and Massive Criticals, which stay weapons-only. The stale node mirrors on those three nodes were set to the same value so the JSON stops contradicting the live gate; no IsChild/Index link-only field was added to any node (the dialog-integrity corruption mode).</div><div><br></div><div><b>Nothing else needed changing.</b> Per-forge dice ceilings are already fixed by each dlg's own damage-amount entry with out-of-tier dice suppressed by forge_never, so gloves and bows inherit the tier for free. calcmodvalue2.nss prices the delta off ForgeItemValue() on a probe copy and forge_inc.nss / modifyitem.nss enforce FORGE_MAX_VALUE / FORGE_MAX_PROPS from the area - none of it is base-item aware. forge_blank_36.uti.json (gloves) already exists so the probe-copy path works, and forge_legal_inc.nss has no base-item or damage-type rules, so a damage-forged glove cannot be flagged contraband by the Warden.</div><div><br></div><div><b>Second pass - Tagget's brought to parity.</b> forge_item_mid entry 5 had empty link Actives on every option: the June-2026 balancing pass (0558395c7ed) re-gated kimli/bellnius but never Tagget's. Seven links now carry the same conditional the other two forges use - R132 Attack Bonus and R62 Massive Criticals isweapon; R39 On Hit, R63 Keen and R11 Vampiric Regeneration ismeleeweapon; R61 Mighty and R12 Unlimited Ammo israngedweapon. Verified by diffing all three menus option-by-option: the only remaining difference is R176 Damage Immunity forge_never at Tagget's, which is correct tier suppression (the low tier has no damage immunity). Link Actives only - the reply-node mirrors were left exactly as kimli/bellnius have them so all three trees stay consistent, including the pre-existing node/link disagreement on Keen and On Hit.</div><div><br></div><div><b>Third pass - sling reclassified.</b> ismeleeweapon.nss listed BASE_ITEM_SLING among the 31 melee types, so slings were eligible for Keen, On-Hit Properties and Vampiric Regeneration. Removed (30 types now), with a comment recording why. Slings were already in israngedweapon.nss, so Mighty and Unlimited Ammo are unaffected, and isweaponorglove still includes them for damage. Note this narrows what a sling can be given at Rivendell and Moria as well as Tagget's.</div>"
    manual_steps:
      - step: "UAT (the report): lay gloves on the anvil at Tagget's, Rivendell, Moria/Methonash's Place and the Kallrist Crypt. 'Damage Bonus.' (at Kallrist, 'Negative-Energy Damage') must now be offered at all four, and the dice list must be that forge's usual tier - Tagget's 1/2/3/1d4/1d6, Rivendell 1d8/1d10/1d12, Moria 2d6/2d8/2d10, Kallrist +4/2d4/1d6/1d10/1d12."
        status: open
        kind: uat
        tester: "any character with a pair of gloves and forge gold"
      - step: "UAT (ranged regression fix): lay a longbow or crossbow on the anvil at Rivendell and in Moria. Damage Bonus must now be offered - ismeleeweapon was blocking it at both."
        status: open
        kind: uat
        tester: "any archer with forge gold"
      - step: "UAT (no regression on weapons): lay a longsword on the anvil at all four forges. Damage Bonus must still be offered, with the same dice and damage types as before."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (the tightening): lay a ring, cloak or suit of armour on the anvil at Tagget's and at the Kallrist Crypt. Damage Bonus must now be ABSENT - both were previously offering it on any base item. Confirm no other menu option disappeared at either forge."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (forge law): take a glove that has been given damage to the Forge Warden and confirm it is not flagged as contraband, and that the damage actually applies while fighting unarmed."
        status: open
        kind: uat
        tester: "any monk or unarmed build"
      - step: "UAT (Tagget's parity): at Tagget's, lay a helmet or cloak on the anvil - Attack Bonus, Massive Criticals, Keen, On-Hit, Vampiric Regeneration, Mighty and Unlimited Ammo must all now be ABSENT. Then lay a longsword (Attack/Massive/Keen/On-Hit/Vampiric appear, Mighty and Unlimited Ammo do not) and a longbow (Mighty and Unlimited Ammo appear, Keen/On-Hit/Vampiric do not). Confirm the low-tier dice and the absence of Damage Immunity are unchanged."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (sling): lay a sling on the anvil at any forge. Keen, On-Hit Properties and Vampiric Regeneration must now be ABSENT; Mighty, Unlimited Ammo and Damage Bonus must still be offered. Check an existing sling that already carries one of the removed enchantments still works - this change only gates the menu, it does not strip anything already forged."
        status: open
        kind: uat
        tester: "any"
  - id: forge-restrictrion-properties-exploit
    title: "Forge can counts restrictions as properties that can be removed"
    group: forge
    status: awarded
    merit_awarded: true
    type: Exploit
    player: Szescian82
    date: "2026-08-07"
    commit: f04935c409760f0e1668fa9972128e1d198a9785
    notes: "<div><b>Race, class and alignment locks are no longer enchantments.</b> A restriction on a piece of gear - \"usable by dwarves only\", \"fighters only\", \"good characters only\" - used to eat one of your item's enchantment slots, and the forge would happily strike it off for you. Both halves of that are gone. A restricted item now has its <b>full</b> allowance of enchantments free (so a class-locked sword with three locks on it just gained three usable slots), and no forge and no Forge Warden will unmake a lock: the restrictions no longer appear in the list of things you can strip.</div><div><br></div><div><b>Light is free, and can now be unmade.</b> Light never counted toward the limit, but nothing said so and there was no way to remove it once added. The forge's Light enchant now says outright that it does not count toward the limit, and Light appears in the strip list marked <i>(free - no slot)</i> - striking it costs you nothing and frees nothing. Weapon visual effects from the Bree appearance station are unchanged: still free, still not the forge's business.</div><div><br></div><div>The smith tells you which is which. When you bring in a piece carrying either, the forge master's own words now explain that the bindings of blood, creed and calling cost it no slot and cannot be unmade, and that its light is a free gift.</div>"
    impl_notes: "<div><b>Root cause.</b> The forge tree had exactly one property classifier, ForgeIsCosmeticProp (VISUALEFFECT + LIGHT), and every enumeration in forge_inc.nss repeated the same inline predicate permanent &amp;&amp; !cosmetic. Nothing anywhere filtered ITEM_PROPERTY_USE_LIMITATION_* (types 62-66), so restrictions were counted by ForgeCountProps (the cap, enforced in modifyitem.nss) and listed by ForgeGetPermPropByIndex, which is the list-builder for BOTH strip paths - the Warden's immediate forge_dis_* menu and the staged anvil forge_stg_* menu.</div><div><br></div><div><b>Shape of the fix.</b> The one predicate was three different questions wearing a trenchcoat. They are now three named sets resolved by a single ForgePropInSet(ip, nSel), with ForgeCountPropsSel / ForgeGetPropByIndexSel as the only enumerators: <b>COUNTED</b> (fills a slot - cap, legality verdict, \"bears N enchantments\"), <b>REMOVABLE</b> (what a player may strike, and therefore what the staged plan's bit indices run over - Light in, restrictions and visual effects out), <b>PRICED</b> (rebuilt gold value + the blueprint tamper check; deliberately identical to the old rule, restrictions included). ForgeCountProps / ForgeGetPermPropByIndex survive as thin COUNTED wrappers so the 15 existing call sites keep their meaning.</div><div><br></div><div><b>The dangerous one.</b> ForgeItemDeviatesFromBlueprint had to go to PRICED on BOTH its outer walk and its oStock indexing. Narrowing it to the counted set would have left a stock item's restrictions unmatchable against its own blueprint's, flagged every class/race-locked drop in the module as deviant, and started jailing legitimate gear through the contraband scan. Same reason forge_legal_inc.nss and bin/gen-forge-legal.py were left alone - the whitelist fingerprint must keep seeing restrictions, so no regen and no whitelist churn.</div><div><br></div><div><b>The subtle one.</b> ForgeProjectedValue prices a blank from PRICED but its n indexes the plan bitmask, which runs over REMOVABLE - two lists that are no longer the same. It now advances the index only on a removable property, always copies restrictions (never droppable, never indexed), and lets Light consume an index without reaching the blank, so planning a Light removal moves the projected worth by exactly zero. ForgeProjectedPropCount was rewritten to walk REMOVABLE while tallying only COUNTED, so a planned Light removal does not fake a drop in the projected property count and cannot make an over-cap plan read as lawful.</div><div><br></div><div><b>Player-facing.</b> ForgeSlotLabel suffixes a cosmetic slot with \"(free - no slot)\"; ForgeUnlistedNote emits one clause per case actually present on the item and is appended to both status strings that render through custom token 6119 (ForgeLegalStatus for the Warden, ForgeProjectedStatus for the anvil), so a player who cannot find a restriction in the list is told why. The setproplight reply in kimli_forge / bellnius_smith / kallrist_forge now reads \"Light. (illumination only - does not count toward the enchantment limit)\"; the ammo \"1d6 Light.\" reply is the Light DAMAGE type and was left alone.</div><div><br></div><div><b>Stamp + gate.</b> FORGE_CLEAN_VER 3 -&gt; 4 forces one re-scan per item under the new counting rules (the change only ever loosens legality, so nothing can newly become contraband). tests/check_forge_disenchant.py was purely structural and would not have caught any of this - it now asserts the restriction classifier covers all five constants, the three selectors exist, no inline \"permanent &amp;&amp; !cosmetic\" enumeration survives, each function uses the right selector, and the Light reply still carries its note. Verified the gate bites by reverting ForgeDisenchantSetup to the old calls - it failed as intended.</div><div><br></div><div><b>Known limitation (pre-existing):</b> the Warden's immediate strip menu has 8 unpaginated slots, so an item with more than 8 removable properties still shows only the first 8 there. The anvil's staged menu paginates.</div>"
    manual_steps:
      - step: "UAT (the exploit): take an item with a race/class/alignment restriction to a forge anvil. The restriction must NOT appear in the strip list, and the smith's status line must say the bindings cost it no slot and cannot be unmade."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (slots freed): enchant that same restricted item up to the cap. It must now accept one more enchantment per restriction it carries than it did before this fix."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (Light): add Light at Kimli, Bellnius or Kallrist - the reply text must say it does not count toward the limit. Then strip it at the anvil: it must be listed as '(free - no slot)', and both the projected worth and the property count must not move."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (staged plan): plan a mix of Light plus two real enchantments. The [planned] markers, the projected worth and the 'within the law' verdict must all track the real enchantments only, and the commit must remove exactly the ticked properties - no more, no fewer."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (regression guard - the jailing risk): log in carrying a STOCK restricted item, e.g. a class-locked drop. The FORGE_CLEAN_VER bump forces a re-scan; the item must pass untouched, not be flagged deviant or quarantined. This is the one way this change could go badly wrong."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (Warden jail path): on a genuinely over-cap item, the Forge Warden's strip menu must still work and must list no restrictions."
        status: open
        kind: uat
        tester: "any"
  - id: combat-dummy
    title: "combat dummy to measure attacks and damage per round"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-02"
    commit: 579b791588a165ecce308554909fd0cacb558f53
    notes: "<div>A <b>Combat Dummy</b> you can attack to find out what your character actually does in a fight. Hit it and a <b>10-round trial</b> starts automatically: each round it calls out how many attacks you made and how much damage you dealt, and at the end it reports your <b>average attacks per round</b> and <b>average damage per round</b>. Everything is printed to the chat log as well as floating over your head, so you can scroll back if you miss a line. A flash of light marks the start and the end of the ten rounds.</div><div><br></div><div>It exists for the feats that never show up on your character sheet — <b>Flurry of Blows</b>, the legendary monk extra attack, on-hit effects — where counting real swings is the only way to know whether they are working.</div><div><br></div><div>The dummy cannot be killed: it soaks Harm, Drown and anything else you throw at it, and it is hostile, so hostile-only spells like Isaac's Greater Missile Storm will target it happily. One tester at a time — anyone else who attacks a dummy mid-trial (including summons and henchmen) is frozen for a few seconds and their damage is ignored, so nobody can spoil your numbers.</div><div><br></div><div>A trial only counts if you keep swinging: if you stop attacking for <b>5 seconds</b>, die, or leave the area, it is cancelled and nothing is recorded — so an interrupted run can never post a misleadingly low score.</div><div><br></div><div>Damage per round is recorded to the <b>Hall of Champions</b> sign, which shows your own characters' best results, your ten most recent trials, and a server-wide top 20 — one entry per player, so a single person cannot fill the board. Every line lists the player, the character, the result and the date. Attacks per round is reported after each trial but never stored.</div>"
    impl_notes: "<div><b>Shape.</b> The dummy is a <b>creature</b>, not a placeable, because it has to be Hostile (FactionID 1) for hostile-only spells to target it; it is rooted with a permanent EffectCutsceneImmobilize and has <b>no AI at all</b> (every default handler blank except ScriptSpawn/ScriptDeath). Blueprints cbd_dummy.utc.json + cbd_sign.utp.json, both PaletteID 0 = <i>Special &gt; Custom 1</i>, so they are hand-placeable from the toolset in any area with no waypoint or per-area wiring.</div><div><br></div><div><b>Two measurements, two engine paths.</b> DPR comes from a <b>per-object</b> NWNX Damage <i>damage</i> event handler (cbd_damage) that the dummy registers on itself at OnSpawn — that global slot was unused, and per-object registration costs the rest of the server nothing. It accumulates the damage and then <b>zeroes every damage field</b> before returning it, which is why the dummy is indestructible with no healing loop: HP never moves, so Harm and Drown are no-ops. Death <i>effects</i> are not damage, so OnSpawn also applies IMMUNITY_TYPE_DEATH, and cbd_death is the belt-and-braces respawn.</div><div><br></div><div>APR can only come from the <b>attack</b> event (the only place a MISS is visible), and that slot is global and owned by devcrit_atk.nss. So devcrit_atk gains <b>one line</b> — a single GetLocalInt on the target, ahead of its critical-hit guard because misses must count. A session therefore starts from <i>either</i> path; it has to start from the attack event too, or the opening swing would be lost and every APR reading would be one attack light in round 1.</div><div><br></div><div><b>Session integrity.</b> All state is locals on the dummy, keyed by a <b>session serial</b>: every delayed round tick carries the serial it was scheduled with, so a cancelled, superseded or destroyed session's pending ticks become no-ops instead of firing into the next trial. Non-owner damage (other PCs, henchmen, summons, resolved through GetMaster) draws a 10s EffectPetrify and a one-off message, and is discarded from both metrics — the same lock-out _attackplaceable.nss uses, with the message corrected to reach the attacker. Destroying the dummy cancels the trial and records nothing.</div><div><br></div><div><b>UAT round 1 (2026-08-02) found three faults, all fixed.</b> (1) The blueprint was flagged <b>Plot</b>, and the engine zeroes damage to a plot creature <i>before</i> the NWNX damage event fires — so every attack measured 0, DPR read 0, and (2) the leaderboard insert was skipped by the \"don't record an idle trial\" guard. Plot is now off and the build gate asserts it stays off; indestructibility never needed it, it comes from cbd_damage zeroing the damage <i>after</i> counting it plus the death immunity. (3) Only the floating text arrived, so every figure was gone once it faded. Reports now go out three ways: the float, a tagged and coloured SendMessageToPC, and the dummy <i>speaking</i> the line — the Talk-channel copy is the one guaranteed to still be in the log to scroll back to. Attacks per round was correct on the first run and confirmed the legendary feat.</div><div><br></div><div><b>Abandonment.</b> A 1s watchdog (running only while a session is open) cancels the trial after 5 seconds with no attack and no damage, and immediately if the owner dies or leaves the area. Without it an abandoned run would still count ten rounds, most of them empty, and write that average as a score. Both the attack and the damage handler reset the idle clock, so a caster mid-cast is not treated as idle.</div><div><br></div><div><b>Leaderboard.</b> Campaign DB combatdummydb, one row per completed trial (cdkey + player_name = account, GetObjectUUID + char_name = character, dpr, total_damage, rounds, at). Identity split copied from bst_db.nss. The two high-score views collapse to a single winning row per partition via a correlated NOT EXISTS (per uuid for the personal board, per <b>cdkey</b> for the server-wide top 20) — GROUP BY + MAX(dpr) cannot promise the char_name and date belong to the winning row. Browsed 10 to a page in cbd_sign.dlg, tokens 6400-6411, built on the Recent Updates sign pattern.</div><div><br></div><div><b>Gate.</b> tests/check_combat_dummy.py (14th smoke gate) asserts the devcrit_atk hook is present, cheap and ahead of the critical guard; that cbd_spawn still registers the per-object handler, immobilizes and grants death immunity; that cbd_damage writes the zeroed data back; that the blueprint is still Hostile and still points at its spawn/death scripts; and that every token cbd_db fills is actually shown by the conversation. Also fixed bin/gen-palette-map.py, which read LocalizedName only and so showed every placeable in the Palette Finder by resref instead of by name.</div><div><br></div><div><b>UAT round 2 (2026-08-02, 9ccb12a7087).</b> Three findings, all addressed. (1) <b>A devastating critical killed the dummy outright</b> despite cbd_damage zeroing the damage AND the permanent IMMUNITY_TYPE_DEATH — two independent death defences failing on one hit. That is a global engine problem, not a dummy problem, and is fixed at source in <a href=\"#idea-devcrit-roll\">devcrit-roll</a>; the dummy is unchanged. (2) <b>Self-destruct at the end of a set.</b> The admin liked the destruction visual enough to make it the intended end-of-set cue: CBD_SelfDestruct now runs 1.5s after the final report (long enough for the spoken summary to get out), strips the death immunity, applies a spectacular EffectDeath and ClearAllActions on the tester so they stop swinging. Everything else about the end of a session — the round lines, the averages, the VFX_FNF_TIME_STOP flash, the DB write — is unchanged; this is purely additive. cbd_death needs no new guard: CBD_EndSession has already cleared CBD_ACTIVE, so a planned death skips the cancel branch and only the 6s respawn runs. (3) <b>Reported damage read low</b> with no damage-reduction lines in the combat log, and the blueprint has no DR of any kind — so it is a measurement question, not a defence. Shipped a diagnostic rather than a guess: CBD_DEBUG (per dummy or module-wide) echoes every attack and every damage packet with its raw event fields and its source, which distinguishes damage discarded as non-owner, damage lost between the attack and damage events, and packets landing outside an active session. Toggle both this and the devcrit diagnostic together from the rest menu, Admin Options -&gt; <b>[Admin] Combat diagnostics on/off</b> (dbg_combat, admindb-gated, off at every reboot); that menu entry is the ONLY switch - an earlier build also armed the dump automatically for an admin owner, which made the toggle lie (turning it off left the admin still seeing the dump), so the auto-arm was removed. Readout palette: yellow per-round lines, <b>green end-of-set summary</b> (the numbers the tester came for, findable in a log full of combat spam), red diagnostics. Every line is now <b>chat log only</b> - the floating text and the dummy's SpeakString copy were dropped, since the colours do the job the belt-and-braces was added for and the duplicates just stacked the same sentence over the dummy's head (FloatingTextStringOnCreature echoes into the log too, which is why a one-off notice read twice). The dummy's portrait is PortraitId 397 (PLC_F08_) - the portrait placeables.2da row 39 <i>CmbtDummy</i> uses - on the blueprint AND the Bree placement, instead of the stock female dwarf it inherited from PortraitId 1.</div><div><br></div><div><b>UAT round 3 (2026-08-02) - the damage measurement was broken, not merely low.</b> Rounds reported 6 attacks, 0 damage for a 48-STR fighter landing nearly every swing. Cause: data.oDamager in the NWNX <i>damage</i> event does not reliably name the damager for weapon hits, so CBD_OwnerPC resolved nobody, the packet fell into the \"not the owner\" branch, and CBD_Reject returned immediately because the source was invalid - discarded with no petrify and no message, i.e. silently. The recorded DPRs (6.5 / 9.1 / 18.0 / 52.3) were the few packets that happened to carry a source. Fixed with CBD_ResolveSrc: the attack event stashes the attacker (always valid there) in CBD_LAST_SRC and the damage handler falls back to it; and the intruder branch is now only reachable when the source resolves to a <i>real, different</i> player, so unattributable damage can never be thrown away again.</div><div><br></div><div><b>The dummy no longer zeroes damage.</b> Zeroing made it indestructible, but it also meant the engine printed no damage line and no \"damage reduction absorbs\" feedback, so a test could not be checked against the combat log at all. Damage now LANDS and CBD_Restore heals the dummy back to full on the next pulse via NWNX_Object_SetCurrentHitPoints (DelayCommand(0.0) - restoring inside the event script would be undone by the very hit being reported). Death immunity and the OnDeath respawn stay behind it for a hit big enough to outrun the restore. The build gate was inverted to match: zeroing the fields again is now a FAILURE.</div><div><br></div><div><br></div><div><b>UAT round 4 (2026-08-02) - root cause of the wrong figures, from the dump: NWNX reports a damage type that was not dealt as -1, not as 0.</b> A plain sum of the 32 damage fields is therefore the real damage MINUS the number of unused types (31 of them for a single-type weapon hit): a 33-point greatsword hit measured as <b>2</b>, a 28-point hit as <b>-3</b> and was then dropped by the nDmg &gt; 0 guard as \"packet carried no damage\". Every field now goes through CBD_Amt, which floors a field at 0. The same trap was quietly costing the Devastating Critical rework a point per hit - data.iSlash += nDamage on an unused type gives -1 + 15 = 14, seen in the dump as base=96 slash=14 for a 15-point roll - so DevCrit_AddDamage assigns when the field is unset and adds when it is not. Diagnostic lines are now bright red (COLOR_RED) so they read apart from the tool's yellow output and the combat log.</div><div><br></div><div><b>Sign.</b> The 10-most-recent view shows date <i>and</i> time; the two high-score views keep the date only. All three now render through datetime(at,'localtime') - at is stored as datetime('now'), which is UTC, so the board had been showing tomorrow's date. The â€\" garbage on the header was a UTF-8 em dash in an NWScript string; see the module-wide purge in the notes for bin/ascii-clean-nss.py / tests/check_ascii_nss.py (20th smoke gate).</div>"
    manual_steps:
      - step: "PLACE: open the toolset and drop the two blueprints where you want them — Creature palette <i>Special &gt; Custom 1 &gt; Combat Dummy</i>, Placeable palette <i>Special &gt; Custom 1 &gt; Hall of Champions</i>. They work in any area and need no waypoint. Repack + restart after placing."
        status: done
        kind: toolset
        blocker: true
      - step: "UAT (the point of the feature): run a 10-round trial on the level-60 monk with Flurry of Blows OFF, then ON, and compare attacks per round. Repeat with the legendary extra-attack feat. DONE 2026-08-02 - attacks per round read correctly and confirmed the legendary feat fires."
        status: done
        kind: uat
        blocker: true
      - step: "UAT (indestructible): cast Harm and Drown at the dummy, and hit it with a devastating critical. It must stay at full HP and keep counting."
        status: done
        kind: uat
      - step: "UAT (one tester): have a second character (and a summon) attack a dummy mid-trial. Both should be frozen ~10s with a message, and the owner's totals must be unaffected."
        status: open
        kind: uat
      - step: "UAT (abandoned run): start a trial, then stop attacking. It must cancel after ~5s with a message and record nothing. Repeat by walking to another area mid-trial, and by dying mid-trial."
        status: open
        kind: uat
      - step: "UAT (destroy/respawn): kill a dummy by whatever means still works (DM kill). The trial must be cancelled and unrecorded, and a fresh dummy must stand up in the same spot ~6s later."
        status: open
        kind: uat
      - step: "UAT (re-test after the Plot fix, BLOCKER): damage per round must now be non-zero and the trial must appear on the sign. The first run measured 0 for every attack because the blueprint was Plot. Also confirm the round lines and the final averages are still in the chat log after the floating text fades."
        status: open
        kind: uat
      - step: "UAT (self-destruct, round 2): run a full 10 rounds. After the averages are reported the dummy must blow apart, your character must stop attacking on its own, and a fresh dummy must stand up in the same spot ~6s later. Starting a new trial on the replacement must work."
        status: open
        kind: uat
      - step: "UAT (round 3 refix, BLOCKER): run one 10-round set. Round lines must report damage in the hundreds, not 0, and the recorded DPR must be in the same ballpark as attacks x average hit. The combat log must show per-hit damage again, plus any damage reduction or resistance lines, while the dummy stays at full HP."
        status: open
