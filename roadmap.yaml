  - id: encounter-density-reused-mobs
    title: "Encounter density: bump per-instance spawn counts 1 to 2 for creatures used by more than one encounter (cap 2, never solo boss encounters)"
    group: bosses
    status: awarded
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-15"
    commit: 5243c14abc0
    notes: "<div>The world is a little more crowded. Rank-and-file creatures that appear across several encounters now spawn in pairs rather than singly, in nine areas — Alterwald, Bill Ferny's House, Greenway North, the three Kallrist shores, Old Back Road, The Wold and Wold South. One-off set-pieces and every solo boss encounter were deliberately left alone. Design: <a href=\"https://homerslotr.com/manual/boss-updates#density\">boss-updates#density</a>.</div>"
    impl_notes: "<div>Must edit the placed encounter <i>instances</i> in the area .git.json files — the .ute templates are inert at runtime — and never touch solo (MaxCreatures == 1) encounters, which would silently drop a boss from the Roll of the Fallen tracker.</div><div><br></div><div>Data pass applied per the brief: 144 of 382 encounter creatures qualify as genuinely reused; 32 placed encounter instances across 9 areas had their per-instance spawn count bumped 1 -&gt; 2 (23 creatures thickened; nothing already &gt;=2 touched, MaxCreatures never changed, .ute templates untouched).</div><div><br></div><div><b>Exclusion note:</b> the brief says 19 solo encounters, but the module actually has 61 solo instances (9 of them registry encounter-bosses) — all 61 were excluded, the strictly safer superset. Boss-registry gate confirmed unchanged (78 bosses) before and after. Sequenced after the two healing-economy levers because it acts as a throughput multiplier on them (more incoming damage -&gt; more heals -&gt; faster <a href=\"#idea-heal-soul-fatigue\">soul-fatigue</a>).</div>"
    manual_steps:
      - step: "Correct the design brief's solo-encounter figure at the next design edit: it says 19, the module actually has 61 solo instances (9 registry encounter-bosses)."
        status: open
        kind: admin
        step_h: 64
      - step: "UAT: look for pairs of giant spiders in Alterwald and Old Back Road, and denser packs in The Wold, Wold South and the Kallrist shores."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT regression: the Balrog of Moria and Summanus still spawn exactly one each and track normally on the Roll of the Fallen."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT perf: impact should be negligible (+1 creature on 32 triggers module-wide)."
        status: open
        kind: uat
        step_h: 64
  - id: forbidden-realms-key-tier
    title: "Forbidden Realms Key tier: journal quest and a Númenor gate opening the orphaned Tombs of the Lost Souls as the Weathertop court's barrow"
    group: bosses
    epic: difficulty-increase
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-18"
    commit: 6b2999e550b
    notes: "<div>The Forbidden Realms Key has been stealable from Summanus for as long as anyone can remember, and until now it opened precisely nothing. It opens something now. Come by the key and a journal opens telling you what the seven marks cut into its ward actually are — grave-wards. The stone that answers it is a sealed slab in Númenor: Noirinan, and beyond it lie the <b>Tombs of the Lost Souls</b>: not a ruin but a court, whose lords have not gone quiet. The Weathertop King, his Queen and their Archer still hold their places. Bring a party. Full walkthrough: <a href=\"QuestGuide.html#forbidden-realms\">QuestGuide → The Forbidden Realms</a>.</div>"
    impl_notes: "<div>Opens gravesofthelostk, which had zero connections of any kind, and spawns three previously-unspawned blueprints. New: q_frk_inc.nss (all logic), q_frk_enter/q_frk_tomb (OnEnter wrappers on falseheaven/gravesofthelostk, chaining ent and leash_to_area), q_frk_gate.utp + q_frk_gate.nss (one gate blueprint serving both ends; direction via local string FRK_DEST; the return leg deliberately does not demand the key so a lost key cannot entomb a player), q_frk_death.nss (ScriptDeath on weathertopkin003/que003/arc002, chaining x2_def_ondeath, party-credited). Journal category frk_tombs (@group 'Lord of the Rings', @order 90), entries 1/2/3/10. Hooks: acquireditem_tag on Tag ForbiddenRealmsKey, plus a retroactive FRK_LoginCheck in hgll_cliententer for characters who stole the key before this shipped. Persistence: campaign DB forbiddendb, per character (frk_stage 0-3, advance-only).</div><div><br></div><div>Court picked as the highest non-outlier CR variant of each: King weathertopkin003 (454, rejecting the CR-1514 kin004), Queen weathertopque003 (594), Archer weathertoparc002 (337) — one-line constants at the top of q_frk_inc.nss. Spawn guards are area-scoped by resref, not module-wide by tag, because the court tags are shared with the placed Weathertop variants. Script-spawned creatures are not in gen-boss-registry.py's placed-instance registry, so the court does not appear on the Roll of the Fallen. No new loot was authored — the court drops whatever is on the blueprints, which may be thin for an end-game tier. Gates passed: 7/7 smoke tests, check_boss_registry unchanged at 78, dialog integrity clean. Admin half documented in QuestGuide-DM-Notes.md.</div>"
    design_questions:
      - question: "Should the barrow-court respawn? It currently re-forms whenever a PC enters and that member is not standing — so the fight is farmable, though the journal completes only once. One guard swap in FRK_SpawnCourtMember makes it a once-per-server or once-per-character kill instead."
        status: answered
        answer: "1.5 hr respawn"
        question_h: 64
        answer_h: 64
      - question: "Should the court appear on the Roll of the Fallen board? Script-spawned creatures are invisible to the boss registry; tracking them needs real placed instances (toolset work) instead of waypoint spawns."
        status: answered
        answer: "Add the king and queen to the board; they should be made strong enough to well overpass requirements to be on the board, and be tougher than summunus boss. \nThere should be multiple other minions (archers/fighters) supporting the king and queen, but their multiplicity will prevent them from showing up on the board."
        question_h: 64
        answer_h: 64
      - question: "Are the CR picks right? The highest non-outlier variant of each was taken (King 454 / Queen 594 / Archer 337), skipping the CR-1514 King. Related: no new loot was authored for the tier."
        status: answered
        answer: "CR-1514 King sounds more appropriate than the 454 king.. Going for a TOUGH boss fight, new end-game tier\nPropose new boss loot."
        question_h: 64
        answer_h: 64
