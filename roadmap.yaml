  - id: ll-maxlevel-cap
    title: "Raise the server level cap to 60"
    group: combat-classes
    epic: legendary-levels
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-27"
    commit: b922e25d38a
    notes: "<div>The server accepts characters above level 40 natively — levels 41-60 are real levels the client understands, not a separate track.</div>"
    impl_notes: "<div>server.env: NWNX_MAXLEVEL_SKIP flipped y-&gt;n with NWNX_MAXLEVEL_MAX=60 (the plugin's env var, valid range 41-60; cached readme at ~/Documents/nwn_docs/NWNX_EE_ MaxLevel.html). The env-flag lever was chosen over NWNX_Administration_SetMaxLevel() so there is exactly one writer — unpacked/nwnx_admin.nss:173 warns about the conflict. Needs a container restart, which is fine.</div><div><b>Undocumented dependency found:</b> MaxLevel also requires the <b>NWNX_ELC plugin to be loaded</b> to bypass the engine's level-40 restriction (\"merely loading this plugin is sufficient\", no configuration). Added NWNX_ELC_SKIP=n. This is <i>not</i> the server's own character validation: NWN_ELC/NWN_ILR stay 0 and nothing in unpacked/ subscribes to the NWNX ELC validation events, so no connecting character is re-validated — see ll-elc-validation. Both plugins are present in the Anvil image (NWNX_MaxLevel.so, NWNX_ELC.so).</div><div><b>classes.2da needs no change</b> — the earlier claim in these notes and in the README was wrong and has been retracted: all 11 player base classes already carry MaxLevel 0 / EpicLevel -1.</div><div><b>Known upstream quirks.</b> (1) The character sheet's \"Next Level\" XP figure is wrong from 40 up — the engine extrapolates its own hardcoded curve instead of reading exptable.2da. <b>Worked around</b> in unpacked/nextlvl_inc.nss (commit b922e25d38a): NextLevel_FixTlk() sets a per-player TLK override on strref 315 (\"Next Level\", confirmed against dialog.tlk) to \"Next Level: &lt;real requirement&gt;\\n\", the trailing newline pushing the engine's wrong figure onto an unseen second line. The number is read live from exptable.2da row nLevel, so it cannot disagree with what the server levels off; the override is cleared below level 40, shows \"Max\" at 60, and no-ops if the row is unreadable (missing hak) rather than printing 0. Applied at login (mod_cliententer.nss, 2s delay) and re-applied on NWNX_ON_LEVEL_UP_AFTER / NWNX_ON_LEVEL_DOWN_AFTER (nextlvl_evt.nss, subscribed in onmoduleload.nss) — death XP loss can drain a level back below 40. (2) Spellcasters may be unable to re-pick known spells on an epic level-up: not worked around.</div>"
    design_questions:
      - question: "Which lever raises the cap — the MaxLevel plugin (NWNX_MAXLEVEL_SKIP=n in server.env) or NWNX_Administration_SetMaxLevel(60) from onmoduleload.nss? They write the same value, so using both is a conflict waiting to happen. Proposal: the plugin env flag, because server.env already documents the enabled plugin set in one place and it takes effect without a script change; the tradeoff is that it lives outside git-tracked module source and needs a container restart to apply."
        status: answered
        answer: "I only found docs for NWNX_MAXLEVEL_MAX, cached locally as \"/home/james/Documents/nwn_docs/NWNX_EE_ MaxLevel.html\"\ncontainer restart is fine\nI want to use the normal level up screen that players get for levels 2-40 already\nI want the in-game server browser to advertise max level 60 using the native nwn level range display on servers.. I have seen others with 60 so I know this is possible."
        question_h: 64
        answer_h: 99
