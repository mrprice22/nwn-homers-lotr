  - id: bard-legendary-prowess-conflict
    title: "Bard Song grants no attack bonus when Legendary Prowess is taken"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Defect
    player: Szescian82
    date: "2026-08-05"
    commit: 429d2e07ae4e8d46cfae4a76cbef48ca0fc5be09
    notes: "<div><b>Attack and damage bonuses now add up instead of cancelling each other out.</b> Taking <b>Legendary Prowess</b> used to make your <b>Bard Song</b> stop granting attack bonus altogether - the game only ever applied the single largest bonus of a kind, so the permanent +5 hid everything smaller behind it.</div><div><br></div><div>The same rule was quietly costing you more than the song:</div><ul><li><b>Legendary Grip</b>'s +4 attack was worth <i>nothing at all</i> if you also had Legendary Prowess.</li><li><b>Legendary Reaping</b>'s first two kill stacks did nothing, and its 4th and 5th stacks were rolling dice instead of the flat damage they promise.</li><li>A druid's or ranger's <b>empowered pet</b> standing in a bard's song got the larger of the two bonuses, never both.</li></ul><div>All of these now stack properly. A singing bard with Legendary Prowess gets the song's attack bonus <b>on top of</b> the feat, exactly as you would expect. Spells from the core game (Bless, Aid, Prayer and the like) follow the game's own rule as before.</div>"
    impl_notes: "<div><b>Root cause.</b> Same-type attack-bonus effects do not stack in NWN: the engine applies the HIGHEST and discards the rest. Every attack bonus the module handed out went through EffectAttackIncrease with the default ATTACK_BONUS_MISC, so Legendary Prowess's permanent +5 (legfeat_inc.nss) suppressed Bard Song (nw_s2_bardsong.nss), the attack half of Legendary Grip, and Legendary Reaping's first two stacks. Damage bonuses have the identical rule, where the song and Reaping collided with each other.</div><div><br></div><div><b>Fix: a per-creature ledger, not an effect per source</b> (bonus_pool_inc.nss, new). Each source registers an AMOUNT under its own key; the ledger sums the live entries and applies ONE effect built from the total, so sources stack in practice without fighting the engine rule. Two channels, attack and damage. This generalizes the pattern legfeat_atk_inc.nss already ran for a single feat - a running total in a local int, a tagged effect stripped and rebuilt from it, and <b>generation counters</b> so an earlier application's expiry cannot cut a refresh short. An effect's magnitude cannot be read back, which is why the total lives in the local and the effect is only ever a render of it.</div><div><br></div><div><b>Pooled sources (5):</b> Legendary Prowess (+5), Legendary Grip (+4, dual-wield), Legendary Reaping (+2..+10 attack AND damage, 12s refreshing), Bard Song (+1..+6 attack and damage, self and allies), the summon/companion boost. <b>Storage is local ints</b>, deliberately: nothing needs to persist, because effects do not survive a logout and a PC's locals die with the object - ledger and effects reset together, so there is no stale-ledger case. Locals also work on NPCs, henchmen and summons, which a PC-keyed campaign DB would not, and the song buffs allies of every kind (nifty_i0_bard.nss is dead code, so NPC bards sing through the same script). LegFeat_ApplyAll clears the two feat-owned entries before rebuilding, so a respec or an unequipped off-hand takes the bonus with it; BPool_Resync runs at login beside it.</div><div><br></div><div><b>Fixed on the way through: Legendary Reaping was rolling dice.</b> EffectDamageIncrease takes a DAMAGE_BONUS_* CONSTANT, not a flat int (raw 7 is 1d6, raw 10 is 2d6). nw_s2_bardsong documented that trap and converted; legfeat_atk_inc passed the raw amount, so Reaping's 4th and 5th stacks (+8, +10) landed as 1d8 and 2d6. The ledger converts once, on the total, so pooling fixed it by construction. The engine ceiling is +20 flat (DAMAGE_BONUS_20) and the mapping clamps there.</div><div><br></div><div><b>Accepted trade-offs.</b> (1) Only pooled sources stack - stock spells (Bless, Aid, Prayer) and item attack bonus stay engine-typed and still take max-of-two against the pooled total; this makes OUR sources stack with each other and does not rewrite the game's rule. (2) The pooled effect is permanent and supernatural (one effect has to stand in for sources with different remaining durations, so expiry is the ledger's job), which means dispelling a bard song no longer strips its share - the ledger's timer does. (3) This is a deliberate power increase: a level-60 bard with Prowess goes from +6 to +11 attack while singing, and Grip's +4 starts paying for the first time. No cap on the attack total, per the admin's call.</div><div><br></div><div><b>Not pooled, deliberately:</b> Tenser's Transformation links its attack bonus to EffectPolymorph so the two end together - pooled, it would outlive a polymorph that ended early. Shayan's subrace engine uses slot-typed ONHAND/OFFHAND bonuses and symmetric decreases the flat ledger does not model. Stock BioWare/CEP libraries and sas_include's dice-based bonuses are out by nature. Every one of these is an explicit, reasoned entry in the gate's exemption table.</div><div><br></div><div><b>Gate.</b> tests/check_bonus_pool.py (22nd smoke gate): no module-owned script may call EffectAttackIncrease/EffectDamageIncrease outside the ledger without a stated exemption; the damage channel must convert through BPool_DamageConst; and every source key must appear in the BPool_SourceAt walk with BPOOL_SRC_COUNT matching. That last one matters because a key that is stored but not walked is a bonus that is recorded and never applied. An unpooled bonus is invisible in review - it compiles, it runs, and it suppresses every pooled bonus smaller than itself in a different file.</div>"
    design_questions:
      - question: "Legendary Prowess's +5 does not stack with any other attack-bonus EFFECT - Bard Song, Legendary Grip (+4, worth nothing to a Prowess holder), Legendary Reaping's first three stacks, Tenser's. Which way do we go? (a) ACCEPT: leave the code alone and rewrite the feat description to say it does not stack with other attack bonuses. Zero risk, but it leaves Legendary Grip's AB half permanently dead for the builds most likely to take it. (b) RE-SCOPE Prowess to a benefit that cannot collide - e.g. flat +5 DAMAGE, or a smaller AB plus something else. One table edit in bin/gen-legendary-feats.py plus the effect in legfeat_inc.nss; no TLK or 2da churn, and existing picks keep working. (c) MAKE IT STACK by moving the bonus off effects entirely (an attack-bonus item property on a hidden creature-hide item, the usual PW trick). This is real new plumbing - hide creation, re-apply on login, unwind on respec - and it touches every character's equipment, so it is the expensive answer. MY RECOMMENDATION: (b). It fixes the bard report and the Grip overlap in one move, keeps the feat's fantasy ('every blow finds its mark' reads fine as damage), and needs no new subsystem. If you want to keep it as attack bonus, (a) is honest and (c) is not worth the surface area."
        status: answered
        answer: "Option (d), the admin's own proposal and better than the three offered: keep applying the bonus, but stop expressing each source as its own effect. Every module-owned source registers an amount in a per-creature ledger and one effect is built from the sum. No cap on the attack total. Built as bonus_pool_inc.nss."
      - question: "If we go with (b) or (c): does the same rule apply to Legendary Grip's +4 attack bonus, which collides with Prowess for exactly the same reason and is the more invisible of the two (it is conditional on dual-wielding, so a player cannot even A/B test it easily)? I would fix both together or neither - fixing only Prowess leaves Grip silently worthless."
        status: answered
        answer: "Yes - Grip is pooled in the same change, along with Reaping, Bard Song and the summon boost. Fixing Prowess alone would have left Grip's attack half silently worthless."
    manual_steps:
      - step: "UAT, THE REPORTED BUG: on a level-60 bard holding Legendary Prowess, note the character sheet attack bonus, then sing. It must rise by the song's FULL amount (+1 to +6 by tier), not by 1 and not by 0."
        status: open
        kind: uat
        tester: "level 60 bard with Legendary Prowess"
      - step: "UAT the baseline did not move: on a bard WITHOUT Legendary Prowess, the song's attack and damage bonuses read exactly as they did before this change. The fix must not change what a bard alone gets."
        status: open
        kind: uat
        tester: "any bard"
      - step: "UAT Legendary Grip, which was worth nothing before: dual-wielding with both Grip and Prowess, attack must show +9 from the two feats together. Sheathe the off-hand weapon and it must drop back to +5 (LegFeat_ApplyAll clears the ledger entry on the equip hook)."
        status: open
        kind: uat
        tester: "level 60 dual-wielder with Grip + Prowess"
      - step: "UAT Legendary Reaping stacks: kill five things inside 12s of each other and confirm attack AND damage climb +2 per kill on top of any other bonus. Watch the combat log on stacks 4 and 5 - the damage must be FLAT (+8, +10), not a dice roll. It was rolling 1d8/2d6 before this change."
        status: open
        kind: uat
        tester: "level 60 with Legendary Reaping"
      - step: "UAT expiry, the case generation counters exist for: with a song running AND Reaping stacks up, let the Reaping stacks lapse (12s without a kill). The total must drop by exactly Reaping's share and the song's share must survive to its own end. Then let the song end and confirm only the permanent feat bonuses remain."
        status: open
        kind: uat
        tester: "level 60 bard with Reaping"
      - step: "UAT relog: log out mid-song and back in. The song is gone (unchanged - effects never survived a logout), Legendary Prowess/Grip come back, and attack reads the pre-logout value minus the song. Specifically confirm it is NOT doubled - the ledger must not be re-added on top of itself."
        status: open
        kind: uat
        tester: "level 60 bard with Legendary Prowess"
      - step: "UAT non-PCs, since the ledger runs on any creature: a druid/ranger pet still gets its empowerment message and bonus at spawn, and standing in a bard's song it gets BOTH (the pet's attack bonus should rise while the song plays)."
        status: open
        kind: uat
        tester: "druid or ranger"
      - step: "UAT respec: take Prowess, confirm +5, then re-pick it away via Ping Pong and confirm the +5 is gone immediately - not lingering until logout."
        status: open
        kind: uat
        tester: "level 60 with picks to spend"
      - step: "Publish: nwn-manager repack + server restart. Scripts only - no hak, TLK or 2da involved."
        status: open
        kind: publish
  - id: spell-ab-prowess-stack
    title: "Attack bonus from spells (War Cry, Bless, Prayer...) does nothing when Legendary Prowess is taken"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Defect
    player: Szescian82
    date: "2026-08-06"
    commit: 8ddcf262f88
    notes: "<div>Follow-up to <a href=\"#idea-bard-legendary-prowess-conflict\">the Bard Song report</a>: the same cancelling-out still happened with <b>spells</b>. Casting <b>War Cry</b>, <b>Bless</b>, <b>Aid</b>, <b>Prayer</b>, <b>Divine Favor</b>, <b>Divine Power</b> or a Divine Champion's <b>Divine Wrath</b> moved your attack bonus by <b>nothing at all</b> if you were carrying Legendary Prowess's permanent +5 - the game only ever applies the single largest attack bonus, and the feat was always the largest.</div><div><br></div><div>These spells now add on top of your feats, your bard song <b>and each other</b>. Bless, Prayer and Divine Favor on the same character are all felt in full, and every one of them is felt alongside Legendary Prowess, Legendary Grip and the song - buffing before a fight is worth doing again.</div>"
    impl_notes: "<div><b>Same root cause as <a href=\"#idea-bard-legendary-prowess-conflict\">bard-legendary-prowess-conflict</a>, the half that was deliberately left out.</b> That fix pooled the module's OWN attack-bonus sources (Prowess, Grip, Reaping, Bard Song, the summon boost) and explicitly accepted that stock spells stay engine-typed and take max-of-two against the pooled total. Szescian82's follow-up is that from a player's seat that acceptance IS the bug: a +5 permanent feat makes every buff spell in the game read as +0.</div><div><br></div><div><b>Every pooled source simply adds, spells included</b> (bonus_pool_inc.nss). The first cut of this fix put the seven spells in one max-of GROUP so Bless and Prayer kept giving the better of the two, as the engine did; <b>the admin ruled on 2026-08-06 that they should stack</b>, so the group layer came out again rather than being left in place degenerate (one source per group), and BPool_Total is the plain sum it always was. Everything else about the ledger - the render, the generation counters, the BPOOL_LIVE hot-path guard - is untouched. <b>This is a real power increase and it is intended:</b> a cleric who lands Bless + Prayer + Divine Favor carries +7 attack from spells alone, on top of Legendary Prowess and a bard song.</div><div><br></div><div><b>Seven stock spell scripts are now forked into unpacked/</b>: nw_s0_bless, nw_s0_aid, nw_s0_prayer, nw_s0_warcry, nw_s0_divpower, x0_s0_divfav, x2_s2_divwrath. Each one is the stock BioWare script with ONE change: the EffectAttackIncrease comes out of the effect link and the amount is registered through the new BPool_SpellAttack instead. Each carries a MODULE FORK header saying so. Everything else in them - durations, metamagic, VFX, the bolt branch in Bless, the whole hostile half of Prayer - is stock and must stay that way.</div><div><br></div><div><b>Witnesses are now a table, not a special case.</b> BPool_Revalidate used to hard-code Bard Song's spell id; it now walks BPool_WitnessAt for every source, so a spell's entry ends when the spell's own effect does - dispelled, ended early, stripped by death. Each fork deliberately leaves a NON-attack effect in its link (the save bonus, the damage bonus, the duration VFX) precisely so the witness has something to be. The registered duration is a 3x BACKSTOP only, for the same reason Bard Song's is: eff_dur_x2 doubles player-applied temporary effects, so a 1x timer would drop the bonus mid-buff. BPool_ClearTransient is table-driven for the same reason.</div><div><br></div><div><b>Divine Wrath's witness is spell id 622, not the 621 the stock script signals</b> - row 621 in spells.2da is PADDING. Verified against the game's own spells.2da (nwn_resman_cat), as was every other id here; the stock SignalEvent is left as found.</div><div><br></div><div><b>Attack channel only.</b> The damage halves of these spells stay engine-typed: damage-bonus effects of DIFFERENT damage types already stack, so there is no defect on that channel, and pooling would flatten slashing/magical/divine into the pool's bludgeoning and change what damage reduction eats. The four forks that still call EffectDamageIncrease are a new DAMAGE-ONLY exemption class in the gate, which still refuses them an unpooled attack bonus.</div><div><br></div><div><b>Gate additions</b> (tests/check_bonus_pool.py, negative-tested): each of the seven forks must register through BPool_SpellAttack under its own key AND have a witness id. That last pair is the new silent failure: a fork that removed the bonus from the link but stopped registering grants NOTHING, which is worse than the bug it fixed.</div>"
    design_questions:
      - question: "Pooling the spells raises the obvious balance question: should they stack with EACH OTHER too? MY IMPLEMENTATION (and recommendation) is NO - the ledger grows a GROUP concept: sources in the same group contribute max(entries), groups sum. Every pooled spell sits in one 'spell' group, so Bless + Prayer still gives the better of the two (exactly what the engine did), while the group total adds to Prowess/Grip/Song. That fixes the report without handing out a stacking rule D&D never had. The alternative, giving every spell its own group, would let a cleric stack Bless + Aid + Prayer + Divine Favor + Divine Power for +9ish before any feat - a much bigger power increase than the report asks for. Say the word if you want that instead; it is a one-line table change per spell."
        status: answered
        answer: "Stack them - the admin's call, 2026-08-06: a pooled bonus is a pooled bonus, and a cleric who spends four rounds buffing should feel all four spells. The group layer built for the max-of behaviour was removed again rather than left in place degenerate (one source per group); the ledger is back to a plain sum of every live entry."
      - question: "Which sources are in scope? I have pooled the seven that grant an ATTACK bonus and are reachable by a player: Bless, Aid, Prayer, War Cry, Divine Favor, Divine Power and Divine Wrath (Divine Champion). Deliberately NOT pooled: (a) the DAMAGE halves of those same spells - damage bonuses of DIFFERENT damage types already stack in the engine, so there is no defect there, and pooling them would flatten slashing/magical/divine into the pool's bludgeoning and change what damage reduction eats; (b) Divine Might (damage only, same reason); (c) Tenser's Transformation (its bonus is tied to the polymorph and must end with it); (d) item attack bonus, which is a property, not an effect. Anything you want added or removed from that list?"
        status: open
        answer: null
    manual_steps:
      - step: "UAT, THE REPORTED BUG: on a character holding Legendary Prowess, note the character sheet attack bonus, cast/sing War Cry, and confirm attack rises by the FULL +2 (it moved by 0 before). Repeat with Bless (+1) and Divine Favor (+1..+5)."
        status: open
        kind: uat
        tester: "level 60 with Legendary Prowess; bard for War Cry, cleric/paladin for Bless/Divine Favor"
      - step: "UAT the spells DO stack with each other (admin's call, 2026-08-06): cast Bless (+1) then Prayer (+1) on the same character - attack must rise by 2, not 1. Add Divine Favor at +5 and the three together must read +7, on top of any feat or song bonus."
        status: open
        kind: uat
        tester: "any cleric with Bless, Prayer and Divine Favor"
      - step: "UAT the baseline for a character with NO legendary feats: every one of the seven spells grants exactly what it always did. This fix must not change what an unfeated character gets from a buff."
        status: open
        kind: uat
        tester: "any low/mid-level caster"
      - step: "UAT expiry: cast War Cry, let it run out, and confirm the attack bonus drops by exactly its share and the feat bonus survives. Then cast it again and die - on respawn the spell share must be gone and the feat share back."
        status: open
        kind: uat
        tester: "any character with Legendary Prowess"
      - step: "UAT the NPC side, since these scripts run for monsters too: a hostile cleric casting Bless/Prayer on its allies must still visibly buff them (watch the combat log to-hit rolls), and nothing in the log should show a doubled bonus."
        status: open
        kind: uat
        tester: "any"
      - step: "Publish: nwn-manager repack + server restart. Scripts only - no hak, TLK or 2da involved."
        status: done
        kind: publish
  - id: bard-song-consumes-2-uses
    title: "Bard Song consumes two uses per activation"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Defect
    player: "-Methonash-"
    date: "2026-08-05"
    commit: 9a6227b12e9b6a3da8ac41f45d8be7d274032e9e
    notes: "<div><b>Bard Song no longer costs two uses.</b> Singing spent two of your daily bard song uses instead of one, so a bard had effectively half the songs the character sheet promised. Curse Song was always correct and is unchanged.</div><div><br></div><div>Nothing else about the song changed - same bonuses, same duration, same range. You simply get twice as many of them as you did yesterday.</div>"
    impl_notes: "<div><b>Root cause: a copied line.</b> nw_s2_bardsong.nss was written by copying the customized Curse Song (8c762f5c412, \"Boost Bard Song to mirror customized Curse Song\") and inherited its closing DecrementRemainingFeatUses(OBJECT_SELF, FEAT_BARD_SONGS).</div><div><br></div><div><b>The two abilities sit on opposite sides of one engine rule.</b> Bard Song IS the FEAT_BARD_SONGS feat, so the engine spends the use when the feat is activated - stock nw_s2_bardsong ends with no decrement at all. Curse Song is its own feat (FEAT_CURSE_SONG) that is meant to draw from the bard song pool, so stock x2_s2_cursesong decrements FEAT_BARD_SONGS explicitly - and ours must keep doing so. Verified against the stock scripts in the game data (nwn_resman_cat), not from memory. That asymmetry is exactly why the report reads \"Bard Song takes two, Curse Song takes one\".</div><div><br></div><div><b>Gate.</b> tests/check_bard_song.py (21st smoke gate) asserts bard song has zero explicit FEAT_BARD_SONGS decrements and curse song exactly one. Neither script is wrong when read alone, and the only symptom is \"my uses ran out faster than they should\", so review would not have caught a re-copy.</div><div><br></div><div><b>Also in this commit, unrelated but blocking it:</b> bin/season-brand.py matched the wiki host as a bare substring, so the archive wikis for the two forked modules (lotr.homerslotr.com / 2009.homerslotr.com, added to index.html in a819138bb1d) were being rewritten to lotr.season2.homerslotr.com. check_season_brand was therefore failing and aborting EVERY repack, while the fix it suggested would have broken those links. The host pattern is now whole-host; neither archive host appears in unpacked/ or server.env, so nothing the branding owns is affected.</div>"
    manual_steps:
      - step: "UAT: on a bard, note the remaining Bard Song uses, sing once, and confirm exactly ONE use is spent (rest to refill and repeat). The song's bonuses, duration and radius must be unchanged."
        status: open
        kind: uat
        tester: "bard"
      - step: "UAT: Curse Song still spends exactly one bard song use - it shares the same pool and its script was deliberately left alone, so this is the check that the fix did not overshoot."
        status: open
        kind: uat
        tester: "bard 4+ (Curse Song)"
      - step: "Publish: nwn-manager repack + server restart. Script-only change, no hak, TLK or 2da involved."
        status: done
        kind: publish
  - id: halmir-quest-guide
