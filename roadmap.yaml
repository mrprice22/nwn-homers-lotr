      - step: "UAT Legendary Bulwark: with a shield equipped, take a hit and confirm the damage is 10 lower than the same hit without the feat, INCLUDING against a source the character has damage reduction or resistance against (the whole point is that it lands after those). Then unequip the shield and confirm the reduction stops."
