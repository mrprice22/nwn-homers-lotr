  - id: ll-cls-progression
    title: "Class progression tables for levels 41-60"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-27"
    commit: 5828f534322
    notes: "<div>Levels past 40 advance your class properly: attack bonus, saves and the feat / ability-score cadence all keep going, and your caster level keeps rising with every level — so spell DCs, durations and damage caps keep scaling too. Spell slots stay where they were at 40, the same way epic levels 21-40 already work; the extra casting power will be sold through Legendary Feats instead.</div>"
    impl_notes: "<div><b>No 2DA work needed for MARTIAL progression</b> — the earlier scope (\"needs cls_*.2da work in hak_2da/\") was wrong for BAB/saves/feats. Stock NWN:EE tables already carry 60 rows, so classes.2da keeps pointing at them and 41-60 progresses on its own. Verified against the live install with nwn_resman_cat (row index = level - 1):</div><ul><li>cls_atk_1: BAB 30 at level 39 → 40 at level 59; cls_atk_3: 20 → 30. +0.5/level continues.</li><li>cls_savthr_fight: 21/15/15 → 31/25/25. Saves keep climbing.</li><li>cls_bfeat_fight: the 1/0 epic alternation runs through row 58.</li></ul><div>General feats (1 per 3 levels) and ability increases (+1 per 4) are engine-side and continue past 40 per the MaxLevel readme (\"Feats and Ability Points follow their normal progression\") — the one part that must be confirmed empirically. Findings recorded in README.md \"Levels 41-60\".</div><div><br></div><div><b>RETRACTED 2026-07-29 — casters DID need 2DA work.</b> This item originally concluded \"cls_spgn_wiz and cls_spkn_sorc are identical at levels 39 and 59 — no new slots past 20, which is exactly the agreed 'caster level scales, slots don't' answer.\" The observation was right but the conclusion was not: the design answer recorded on this very item says caster level keeps scaling \"in all the regular ways: <b>spell slots</b>, caster DC, duration, damage caps.\" Shipping flat tables meant casters gained nothing for twenty levels, which players then reported. Fixed in <b>legendary-caster-spells-on-level-up</b> (commit 192f9dde8b6): all seven cls_spgn_*.2da now ship in lotr_rules.hak on a +1-per-castable-spell-level cadence at 44/48/52/56/60 (50/60 for paladin/ranger).</div>"
    design_questions:
      - question: "Does caster level keep scaling from 41 to 60? Spell DCs, durations and damage caps all key off it, so 20 more caster levels is the single biggest balance lever in the whole epic. Proposal: caster level keeps rising but spell slots stop at the level-40 table, so casters gain reach and reliability without another 20 levels of raw slots — and the extra power gets sold through Legendary Feats instead, where it can be priced per feat."
        status: answered
        answer: "yes caster level keep scaling in all the regular ways: spell slots, caster DC, duration, damage caps."
        question_h: 64
        answer_h: 64
      - question: "What cadence do bonus feats and ability-score increases follow from 41 to 60? HGLL gave 1 feat per level and let you buy stat points. Proposal: keep the stock epic cadence (a feat every 3 levels, +1 ability every 4) rather than HGLL's 1-per-level, so the Legendary Feat pool stays scarce enough to matter."
        status: answered
        answer: "HGLL did NOT give 1 feat ever level: it followed the stock epic cadence (a feat every 3 levels, +1 ability every 4) which is what we will do for 41-59. \n\nThe Legendary feats can ONLY be taking at exactly level 60 though, not simply levels 41-60 at every 3 levels frequency (those use the normal /epic feat pool)"
        question_h: 64
        answer_h: 64
    manual_steps:
      - step: "UAT: with the cap live, level a test character 40 → 41 → 45 → 60 with Ping Pong and record per level: BAB, the three saves, hit points, skill points, caster level, bonus feats and ability increases. Compare against the stock tables in the impl notes."
