  - id: encounter-spawns-levels-41-60
    title: "Encounter Spawns start breaking from level 41-60 (not spawning strong enough mobs)"
    group: combat-classes
    status: manual
    type: Defect
    player: "-Methonash-"
    date: "2026-08-24"
    commit: dcf4361f24d
    notes: "<span>once you're level 60, some encounters isn't working properly, like not giving the right enemies. In Dimholt for example the </span><a href=\"https://homerslotr.com/creatures/thingofthedark\" target=\"_blank\" rel=\"noreferrer noopener\"><span>Thing of the Dark</span></a><span> doesn't spawn with it's encounter.\n\nIn Mirkwood Central South, the high level spiders doesn't spawn, instead you get only Giant Spiders and a Spider-Queen, CR 21 and CR 27.\nMost definitely happens after level 41+, I imagine.</span> <span><span></span></span><div><br></div><div><b>Fixed 2026-08-24.</b> The encounters were reading stale numbers about their own creatures. Every encounter keeps its own note of how tough each creature in its pool is, written down once when the creature was added and never updated since. The creatures were rebalanced for levels 41-60; those notes were not.</div><div><br></div><div>The game fills an encounter by working down from the toughest creature it thinks is in the pool until it has spent the difficulty budget for your level. In Mirkwood Central South the Giant Spider was written down as more than seven times its real strength, so the game spent almost the whole budget summoning what it believed was the deadliest thing in the forest and was really the weakest -- and the Sword Spiders, Death Weepers and Black Spear Spiders behind it never got in. Dimholt was skipping the Thing of the Dark for the same reason.</div><div><br></div><div>124 of those notes were wrong across the module, and 516 encounters were also recorded as \"Very Easy\" while actually set to Hard or Impossible -- Mirkwood Central South and Dimholt among them. All of it is corrected, and the build now refuses to complete if any of it drifts again. No creature was made stronger or weaker, and no XP or gold reward changed: the encounters simply pick the right monsters now.</div>"
    impl_notes: "<div><b>Two stale caches in the encounter GFF, both fixed by data resync; no script change.</b> Encounters here are pure engine behaviour -- all 778 instances have empty OnEntered/OnExhausted/OnHeartbeat, there are no nw_e0_* overrides in unpacked/, and no scripted spawner touches them, so the stored fields are the whole of the behaviour.</div><div><br></div><div><b>1. CreatureList[].CR</b> caches the blueprint ChallengeRating, written once by the toolset when the creature was added to the list and never refreshed. 124 entries stale. The engine sorts the pool high-&gt;low and adds creatures while CR &lt;= the remaining budget, so a wrong cache misdirects the whole selection: spidgiant001 cached 147 vs blueprint 21 (21 entries), spiderboss001 45 vs 27 (20), thingofthedark 60 vs 40 (6). Worst absolute drift azagoth001 1691 vs 555.</div><div><br></div><div><b>2. Difficulty</b> caches encdifficulty.2da VALUE for the DifficultyIndex row (VeryEasy=0 Easy=1 Normal=2 Hard=5 Impossible=9). 516 encounters (44 .ute blueprints + 472 .git instances) carried Difficulty 0 against an index of Hard or Impossible -- hardspiders is index 4, dimwald index 3, both at 0.</div><div><br></div><div><b>bin/audit-encounter-crs.py</b> resyncs both from source (dry-run by default, --apply writes, --full lists every row). <b>tests/check_encounter_crs.py</b> imports its scan() as a build gate wired into tests/smoke-test, so gate and fixer can never disagree -- the arrangement check_map_notes.py uses with gen-map-notes.py. Entries whose resref has no .utc.json are skipped: 171 encounter resrefs are stock base-game creatures (nw_*, x2_*, zep_*) with no local blueprint.</div><div><br></div><div><b>Blueprint ChallengeRating deliberately untouched</b> -- it is read live on every kill for XP (sha_xpsystem.nss:649), gold (gpondeath.nss, iGP = iCR*8+d20), the bestiary (bst_ondeath.nss:25) and the boss board CR&gt;60 rule (gen-boss-registry.py). Only the encounter copy moved; gen-boss-registry.py output is byte-identical before and after, and the summanus instance now agrees with the 2938.0 brd_db.nss already seeded.</div><div><br></div><div><b>Caveat for UAT:</b> the engine CR-budget formula is hardcoded and undocumented (nwn.wiki gave up measuring it). The corrected data is right regardless, but only in-game observation shows whether it is <i>sufficient</i> at 41-60. If not, the next lever is NWNX_Encounter (not currently enabled: needs unpacked/nwnx_encounter.nss, NWNX_ENCOUNTER_SKIP=n, restart) whose Get/SetEncounterCreatureByIndex could rewrite the live CR list at module load, still without touching blueprint CR.</div><div><br></div><div>Separately noted, not fixed here: 230 of 778 encounter instances have an empty SpawnPointList, so the engine picks its own spawn spot (worst: shelobslair x12, ~37 across the northern-forest areas). Neither reported area is affected -- every hardspiders and dimwald instance has a spawn point -- so it is a placement-quality issue, not a selection one.</div>"
    manual_steps:
      - step: "UAT: Mirkwood Central South (mirkwoodcentrals) at level 60 -- trigger the hardspiders encounter repeatedly and record what spawns. Expect Sword Spider (CR 29), A Death Weeper Spider (45) and Black Spear Spider (45) to appear in the rotation, not only Giant Spider (21) and Spider-Queen (27)."
        status: open
        kind: uat
        tester: "level 60 any"
      - step: "UAT: Dimholt (area018) at level 60 -- trigger the dimwald encounter repeatedly. Expect Thing of the Dark to appear in the rotation alongside A Mangled Corpse, A Forgotten Soldier and Forgotten Warrior."
        status: open
        kind: uat
        tester: "level 60 any"
      - step: "UAT: repeat both areas in a party as well as solo -- party size feeds the engine level average, so the two cases can select differently. If the strong tier still will not appear, the NWNX_Encounter route in impl_notes is the next lever."
        status: open
        kind: uat
        tester: "level 60, solo and party"
  - id: shifter-weapon-stats-for-unarmed-shapes
    title: "Shifter weapon status for unarmed shapes"
    group: combat-classes
    status: confirmed
    type: Enhancement
    player: "Sync (Shync)"
    date: "2026-08-20"
    notes: "<div>Right now your bonuses on weapons before shift only trasnfer to the shifted shape if that shape/form is holding a weapon. </div><div>Even if the unshifted user has gloves that have damage bonus, this does not transfer to shapes that are considered unarmed -- this is what needs to change with this idea/story.</div>"
  - id: shifter-stats-defect
    title: "Shifter stats defect (stats go down after shifting)"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Defect
    player: "Sync (Shync)"
    date: "2026-08-20"
    commit: 818feba9819
    notes: "<div><b>Shifting now adds the shape's bonus to your own stats instead of replacing them.</b> Every form used to overwrite your Strength, Constitution and Dexterity with the animal's own scores, so on this server a geared character came out of the change weaker than they went in -- less attack, less damage, less AC. Now you keep your own scores and gain what the shape is worth on top: a brown bear is +15 Strength / +7 Constitution / +1 Dexterity over whatever you already had, Dragon Shape is +36 / +20 / +24. Weak shapes stay weak (a badger still gives no Strength), but no shape can ever leave you worse off than unshifted.</div><div><br></div><div><b>Your armour's own protection comes with you.</b> Plate and shield stop being worn while shifted, and only their magic used to carry over -- the armour's base protection was simply lost. It is handed back on top of the form's natural armour now, so your AC while shifted is your normal AC plus what the shape adds.</div><div><br></div><div><b>Claw and bite forms finally get your weapon's enhancement bonus.</b> A +9 weapon merged into a shape with no hands was paying out its extra damage but none of its +9 to hit or to damage, which is why unarmed forms felt so far behind the ones that carry a weapon. That +9 now lands on every natural attack.</div><div><br></div><div>All of it applies to druid Wild Shape and Elemental Shape, every Shifter shape, and to Polymorph Self, Shapechange and Tenser's Transformation. The bonuses end the moment the form does.</div>"
    impl_notes: "<div><b>Two independent causes, neither fixed by wildshape-shifter-item-merge (ed70869c581), which merged item properties only and left form base stats alone.</b></div><div><br></div><div><b>1. EffectPolymorph SETS base STR/CON/DEX from polymorph.2da</b> (wolf 13/15/15 natAC 4, brown bear 27/19/13 natAC 2, ancient dragon 48/32/36 natAC 20). With max-ability-bonus 24 (server.env, patched into settings.tml by bin/serve) and levels to 60, every form's numbers sit at or below a real character's base scores. The form's NATURALACBONUS also never repaid the BASE AC of armour and shield -- only their properties merge onto the hide.</div><div><br></div><div><b>2. Creature weapons ignore ITEM_PROPERTY_ENHANCEMENT_BONUS</b> for attack and damage rolls (it only buys DR bypass), so a merged +9 landed on the claws and did nothing. Confirmed by the reporters: enhancements pass through for shapes with weapons, the rest only get the damage.</div><div><br></div><div><b>New in shape_merge_inc.nss: ShapeMergeStatFloor(oShifter, nPoly, ePoly, gear).</b> Reads the form's own row with Get2DAString(\"polymorph\", ...) -- a blank column means the form keeps your score, so it is skipped. Per ability: target = own base + max(0, form - SHAPE_BASE_ANCHOR), top-up = target - form (the engine is about to set base to the form value). SHAPE_BASE_ANCHOR is 12, the stock-rules caster score each form's bonus is measured from -- the admin's rule for this item: a geared character gets the same shape bonus a naked one would get under stock rules, CON included in full. AC: EffectACIncrease(form natAC + GetItemACValue(armour) + GetItemACValue(shield), AC_NATURAL_BONUS) -- natural is the same type the form's own bonus uses and only the highest of a type counts, so it supersedes rather than stacks, and it sidesteps MAX_AC_DODGE_MOD 20 in hak_2da/ruleset.2da which would eat an AC_DODGE_BONUS.</div><div><br></div><div><b>Exploit-proofing.</b> Every top-up is EffectLinkEffects'd into the polymorph effect BEFORE it is applied, so unshifting, dispel, death or duration expiry removes them with the form -- there is no separate cleanup path to get wrong and nothing can survive into unshifted play. The three druid/shifter callers re-wrap the finished link in ExtraordinaryEffect so the top-ups are undispellable like the form itself; nw_s0_tenstrans floors its existing eLink (which already carries the polymorph).</div><div><br></div><div><b>Cap trap.</b> A single EffectAbilityIncrease counts against max-ability-bonus 24 -- the finding that made Legendary Feats switch to NWNX_Creature_SetRawAbilityScore (legfeat_inc.nss). Raw writes are unsafe while polymorphed (legfeat_inc refuses them: base scores are swapped out, and a wrong guess about what the engine restores would be a permanent free-stat exploit), so the top-up is emitted in SHAPE_TOPUP_CHUNK=6 stacked effects, the mw_unlock_inc.nss technique. UAT must confirm the sheet shows the full score, not a clamp.</div><div><br></div><div><b>ShapeCopyToCreatureWeapon()</b> replaces the three creature-slot IPWildShapeCopyItemProperties calls: same copy, plus each ITEM_PROPERTY_ENHANCEMENT_BONUS n re-expressed as ItemPropertyAttackBonus(n) + ItemPropertyDamageBonus(claw's physical type, n), keeping the original property for DR bypass. The amount maps through IP_CONST_DAMAGEBONUS_* (1-5 = 1..5, 6-10 = 16..20), NOT the DAMAGE_BONUS_* effect table that IPGetDamageBonusConstantFromNumber returns, where 6..15 are DICE -- the trap bonus_pool_inc documents. Ranged mismatch is still guarded, and manufactured right-hand weapons keep the plain vanilla copy since enhancement already works there (translating would double-count). Tunable SHAPE_MERGE_ENH_AS_ATTACK flips it off in one line.</div><div><br></div><div><b>Build.</b> Module-only -- no polymorph.2da in the hak, so no hak rebuild, no NWSync, no client download (a fixed 2DA number cannot floor an uncapped character anyway, and blanking the columns would nerf low-level druids). All six polymorph scripts compile; full repack green (28/28 smoke, check-dlg-integrity 0 failing); installed to the DEV realm only.</div>"
    manual_steps:
      - step: "Record STR/CON/DEX, AC and AB unshifted, then Wild Shape to a brown bear (form 27/19/13, natural AC 2). Sheet must read own STR +15, CON +7, DEX +1, and AC = unshifted AC + 2. Nothing may be lower than unshifted."
        status: open
        kind: uat
        tester: "druid 12+ in full plate with a shield and a +9 weapon"
      - step: "BLOCKER for the design, not for shipping: confirm the sheet shows the FULL floored score, not a value clamped at +24 over the form's. A clamp means the chunked EffectAbilityIncrease is not beating max-ability-bonus and SHAPE_TOPUP_CHUNK needs re-testing."
        status: open
        kind: uat
        tester: "level 50+ character (the bigger the base scores, the better the test)"
      - step: "Check the claw attack's AB and damage moved by exactly +9, not +18. +18 would mean the engine does honour creature-weapon enhancement after all - flip SHAPE_MERGE_ENH_AS_ATTACK to FALSE."
        status: open
        kind: uat
        tester: "druid or shifter with a +9 weapon, in a claw/bite form"
      - step: "Unshift and re-check the sheet: stats and AC must be EXACTLY the pre-shift values. This is the exploit check - the linked top-ups must all be gone. Repeat after dying while shifted."
        status: open
        kind: uat
        tester: "any"
      - step: "Dragon Shape: expect +36 STR / +20 CON / +24 DEX and a large HP jump - confirm it feels right in boss combat. Badger: expect NO Strength bonus and still no drop below your own base. Spot-check one arcane self-polymorph (Polymorph Self / Shapechange / Tenser's) for the same behaviour."
        status: open
        kind: uat
        tester: "shifter 30+ (Dragon Shape) and any low-level druid"
