    impl_notes: "<div>Documentation/text only — no script or blueprint behaviour changed. <b>Player-facing:</b> docs.manual/Customizations.html (#legendary-levels rewritten: HGLL vault link, \"Legendary Leveler\" NPC/placeable, Legendary Leveling area, the DO/DON'T-gain table and the \"stock HGLL charges 1.25x\" comparison all removed; replaced with an in-development tip-box, a real-levels explanation and the retained XP table); docs.manual/LevelingGuide.html (the \"Legendary Levelling Area\" dt deleted, folded into \"Levels 41 to 60 are ordinary levels\" with the in-development caveat); index.html (landing-page card and Leveling Guide tile no longer name HGLL); docs.manual/Draft/Gem-Socketing.html (hgll_cliententer.nss references rephrased as \"the module's Mod_OnClientEntr handler\"). <b>GFF strings:</b> unpacked/module.ifo.json Mod_Description cexolocstring and unpacked/module.jrl.json \"Character Progression\" (mod_progress) entry, which quoted the old per-level XP costs and the ~17.5M total; both re-verified as valid JSON and bin/season-brand.py reports no drift (it owns only the Connect:/Wiki: lines).</div><div><b>Repo docs:</b> CLAUDE-nwscript.md (hgll_* prefix row marked retired, pointing at hak_2da/exptable.2da and ll-hgll-remove-scripts), CLAUDE-gff-format.md (event-hook table now describes the real login/logout wiring instead of \"Letoscript apply on enter (HGLL)\"), CLAUDE-merit.md, QuestGuide-DM-Notes.md, Quest Ideas.md, TODO.txt, and README.md — new \"Levels 41–60\" section stating the table, the two remaining levers (hak publish, NWNX_MAXLEVEL_SKIP / classes.2da) and the retired-leveler rule, plus hak_2da/exptable.2da added to the lotr_rules.hak pack instructions (previously only ruleset.2da + baseitems.2da, which would silently drop the new table on a from-scratch rebuild). server.env comments de-HGLL'd; tests/check_season_brand.py still passes.</div><div><b>Deliberately left alone:</b> the hgll_* scripts, the servershout* floating text and the leveler area itself (ll-hgll-remove-scripts), and the freelegendary README example with SetXP(oPC, 17498600) (ll-freelegendary-code). Remaining references to hgll_cliententer.nss are factual — it is still the live Mod_OnClientEntr handler — and are annotated as a legacy name. docs/ and docs.manual/Roadmap.html untouched; no wiki refresh run. <b>Gates:</b> bare nwn-manager repack, 12/12 smoke tests, 1/1 script compiled.</div>"
