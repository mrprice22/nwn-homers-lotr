  - id: item-rename
    title: "Let players rename their weapons (e.g. a chisel item)"
    group: items-gear
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "Piskan (Alek Cain)"
    date: "2026-07-16"
    commit: f10e0d8
    notes: "<div>You can name your own weapons. The <b>Engraver's Chisel</b> is sold at the Well Mart in the Well of Eru for 25,000 gp: equip a weapon, activate the chisel, and speak the new name — nobody else sees you say it. Names stick through the vault, and renaming does not affect a weapon's forge legality. Say 'cancel' to back out without spending the chisel. Details: <a href=\"Customizations.html#weapon-rename\">Customizations → Weapon Renaming</a>.</div>"
    impl_notes: "<div>Tag WeaponChisel; infinite stock at the Well Mart, priced against the Bag of Holding (35k) and Rod of Fast Buffing (10k).</div><div><br></div><div>Flow: equip the weapon main-hand, activate the chisel, speak the new name in chat — applied with SetName, the chat line suppressed, and the chisel consumed only on a successful rename. Name rules: non-empty, &lt;=40 chars, no &lt; or &gt; (blocks colour codes and token markup); 'cancel' aborts without spending it.</div><div><br></div><div>The name persists on the item through the character vault — no DB. Renaming does not change the forge fingerprint, so renamed weapons stay forge-legal. Implemented by chaining the existing OnActivateItem (dmfi_activate) and OnPlayerChat (code_redeem) handlers; the Code: redemption path is untouched.</div>"
    manual_steps:
      - step: "UAT purchase: buy a chisel at the Well Mart (25,000 gp, Miscellaneous panel)."
        status: done
        kind: uat
      - step: "UAT guard: activate with no weapon equipped -> refusal."
        status: done
        kind: uat
      - step: "UAT happy path: with a weapon equipped, chat a name -> weapon renamed, chisel gone, and other players do not see the line."
        status: done
        kind: uat
      - step: "UAT name rules: 'cancel', 41+ chars, and a <b>-style name are all refused with the chisel kept."
        status: open
        kind: uat
      - step: "UAT regression: Code: redemption still works."
        status: done
        kind: uat
      - step: "UAT persistence: relog and confirm the name persists."
        status: open
        kind: uat
      - step: "Customize appearance/icon of the chisel item (looks like a bowl currently)"
        status: open
        kind: toolset
