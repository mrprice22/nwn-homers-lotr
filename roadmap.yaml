  - id: devcrit-roll
    title: "Convert Devastating Critical to a roll for bonus damage (or a new 'chaos' damage type)"
    group: combat-classes
    status: manual
    type: Enhancement
    player: "Piskan (Alek Cain)"
    date: "2026-08-02"
    commit: b2e7a2058fb
    notes: "<div><b>A devastating critical no longer kills you outright.</b> It now lands as a very large hit instead: <b>three extra dice of damage</b>, of the same kind your weapon already deals, scaled to the weapon you are swinging &mdash; <b>d6</b> for a small weapon, <b>d8</b> for a medium one, <b>d10</b> for a large one.</div><div><br></div><div><b>This cuts both ways.</b> The rule is the same for you and for everything you fight, so no more losing a level-60 character to a lucky swing from a random mob &mdash; and no more deleting a boss with one. Nothing else about the feat changed: same threat range, same prerequisites.</div><div><br></div><div>There is also a new level-60 feat for those who want to lean into it. <b>Legendary Butcher</b> adds <b>five more dice on any critical hit</b>, not just a devastating one, and it <b>stacks</b>. A large weapon in the hands of someone with both lands <b>eight extra d10</b>. It requires Devastating Critical with some weapon.</div><div><br></div><div>One cosmetic side effect of taking the instant kill out at the root: the combat log no longer announces a &quot;devastating critical&quot; by name. The hit shows as a critical hit, with the extra dice rolled into it.</div><div><br></div><div>Original request from Piskan (Alek Cain).</div>"
    impl_notes: "<div><b>SHIPPED 2026-08-02</b> (<code>b2e7a2058fb</code>), to the design below, with Legendary Butcher in the same change.</div><div><br></div><div><b>REOPENED AND REFIXED 2026-08-02 (<code>9ccb12a7087</code>) after UAT: the first fix did not remove the save-or-die at all.</b> A devastating critical against the Combat Dummy rolled its Fortitude save and killed it outright, even though the dummy also carries a permanent <code>EffectImmunity(IMMUNITY_TYPE_DEATH)</code>. Two independent death defences failing on the same hit means the engine's dev-crit kill is <b>not</b> an ordinary applied death effect, so <code>devcrit_eff.nss</code> &mdash; and the whole 'refuse the EffectDeath' theory this shipped on &mdash; never worked. It was silent because the bonus-dice half worked perfectly.</div><div><br></div><div><b>The real fix is upstream, in a 2DA.</b> The engine only considers a devastating critical when the wielder has the feat named in the weapon's <code>baseitems.2da</code> row, column <code>EpicWeaponDevastatingCriticalFeat</code> (<code>CNWSCreatureStats::GetEpicWeaponDevastatingCritical</code>). <b>That column is now blank on every row of <code>hak_2da/baseitems.2da</code></b>, so the check can never succeed: no save is rolled and no kill happens, for players and NPCs alike, with no NWNX and no C# involved. Overwhelming Critical, improved critical, weapon focus and specialisation are separate columns and are untouched &mdash; ordinary criticals behave exactly as before.</div><div><br></div><div><b>Consequence: <code>iAttackResult</code> 10 no longer occurs</b>, so the bonus dice now ride on an <b>ordinary critical</b> (result 3) for an attacker holding the Devastating Critical feat matching the weapon in hand. That mapping <i>was</i> the column we blanked, so <code>bin/gen-devcrit-map.py</code> moves it into a generated include, <code>unpacked/devcrit_map_inc.nss</code> (67 base items), and blanks the column in the same run &mdash; idempotent, and it reads the mapping back out of the include once the 2DA is blank. Same rule as <code>legfeat_ids_inc</code>: never hardcode the feat ids. Unarmed and creature attacks fall back to the UNARMED / CREATURE feat constants.</div><div><br></div><div><code>devcrit_eff.nss</code> and the no-kill flag are <b>kept as a safety net for a stale hak</b>: a server or client still running the old <code>baseitems.2da</code> can still resolve an engine devastating critical, and result 10 then grants the same dice (the two do not stack). Both files now say plainly that the flag route is not what stops the kill.</div><div><br></div><div><b>Gate.</b> <code>tests/check_devcrit.py</code> grew a sixth section: the column must be blank on every row, and the generated include must still hold ~67 mappings. Either half alone is a silent failure &mdash; re-extracting <code>baseitems.2da</code> from game data brings the instant kill back, and an empty include takes the replacement dice away from every weapon. <b>Deploy note: the 2DA change does nothing until the hak is rebuilt and republished</b> (<code>bin/build-lotr-rules-hak --install</code>, <code>bin/refresh-nwsync</code>, restart).</div><div><br></div><div>Also added <code>unpacked/dbg_combat.nss</code>: an admindb-gated <code>dm_runscript dbg_combat</code> toggle that turns on both this feature's effect-type diagnostic and the Combat Dummy's per-packet dump. Off at every reboot, and it is a diagnostic rather than a system &mdash; delete it and its two debug blocks once the questions are closed.</div><div><br></div><div><b>Files.</b> <code>devcrit_inc.nss</code> (constants + helpers), <code>devcrit_atk.nss</code> (NWNX Damage attack event, registered server-wide with no <code>oOwner</code> so the rule is symmetric), <code>devcrit_eff.nss</code> (<code>NWNX_ON_EFFECT_APPLIED_BEFORE</code>, skips the dev-crit <code>EffectDeath</code>), both registered from <code>onmoduleload.nss</code>. Plugin enabled: <code>nwnx_damage.nss</code> copied into <code>unpacked/</code> and <code>NWNX_DAMAGE_SKIP=n</code> added to <code>server.env</code>.</div><div><br></div><div><b>The death-effect discriminator.</b> <code>NWNX_ON_EFFECT_APPLIED_*</code>'s <code>TYPE</code> is the <i>internal</i> NWNXLib enum and does <b>not</b> match the NWScript <code>EFFECT_TYPE_*</code> constants. The value used, <b>19</b>, is <code>EffectTrueType::Death</code> read out of <code>NWNXLib/API/Constants/Effect.hpp</code> in nwnxee/unified &mdash; verified against the header, not inferred. Guessing it would either do nothing or silently suppress an unrelated class of effect server-wide. The handler additionally requires the attack handler's short-lived flag on the victim, so Finger of Death, Death Attack, scripted deaths and DM kills are untouched.</div><div><br></div><div><b>Deviation from the design note, recorded deliberately.</b> The design said the bonus dice would be subject to the target's physical damage reduction. They are <b>not</b>: <code>nwnx_damage.nss</code> documents that \"immunities and damage will have already been resolved by the time the attack event script is ran\", so damage added to the attack event's per-type fields lands <i>after</i> DR and resistance. The alternative, <code>NWNX_Damage_DealDamage</code>, would go through DR but applies as a <b>second</b> damage packet &mdash; a second combat-log line and, more seriously, a second <code>OnDamaged</code> firing, which the bestiary kill-tracker hooks. One packet was judged the safer trade. Net effect: the bonus is slightly stronger against heavily armoured targets than the note implied.</div><div><br></div><div><b>Legendary Butcher</b> is feat <b>1124</b> and the first <code>LEGFEAT_KIND_HOOK</code> feat &mdash; a new kind that grants nothing at pick time or at login, because the damage hook reads it with <code>GetHasFeat</code>. <code>LegFeat_ApplyAll</code> skips HOOK feats outright. Its prerequisite is Devastating Critical <i>with any weapon</i>, which is 40 separate feat ids (495-532 contiguous, plus 955 dwarven waraxe and 996 whip); the generator emits <code>LegFeat_HasAnyDevCrit()</code> for it, because <code>legfeat_ids_inc.nss</code> has no includes and a prereq expression may only use builtins.</div><div><br></div><div><b>Gates.</b> New <code>tests/check_devcrit.py</code>: the include and the env flip moved together, both handlers registered, the <code>iAttackResult</code> early-return still the first thing the attack handler does (it runs on every attack on the server), the death handler discriminating on both type <i>and</i> flag, and the dice constants still matching this card. Negative-tested both ways. <code>tests/check_legendary_feats.py</code> extended: a HOOK feat must be read by <i>something</i> under <code>unpacked/</code>, which is the mirror image of the existing \"EFFECT feat with no case in LegFeat_ApplyOne\" check &mdash; same silent failure, opposite cause.</div><div><br></div><div><b>The crit-immunity audit shipped as <code>CLAUDE-devcrit-immunity-audit.md</code></b>, generated by <code>bin/audit-crit-immunity.py</code>. Measured 2026-08-02: <b>91 item blueprints</b>, <b>178 creature blueprints</b> (215 rows) and 180 placed instances; <b>no script</b> grants it. Nothing was stripped &mdash; see <a href=\"#idea-remove-crit-immunity\">remove-crit-immunity</a>. Two droppable leaks turned up: the Witch King's Boots of Quickening (<b>allowed to stay, admin decision</b>, and the Witch King keeps his immunity) and <code>bilbobaggins</code>'s equipped <code>bilbosdefense</code> in <code>shirebilbohouse</code>, which has <b>not</b> been ruled on. The earlier first-pass figures on this card (181 creatures, one droppable item) were close but were counted with a coarser filter; the generated document supersedes them.</div><div><br></div><div>--- the design as settled 2026-08-01 ---</div><div><b>Design settled 2026-08-01</b>, alongside the Legendary Feats martial pass (<code>CLAUDE-legendary-feats-triage.md</code>). Devastating Critical stops being save-or-die and becomes <b>flat bonus physical damage on a devastating critical</b>, typed to the weapon's base damage type (bludgeoning / piercing / slashing).</div><div><br></div><div><b>The numbers, and the dice scale with the weapon:</b></div><ul><li><b>Devastating Critical: +3 dice.</b></li><li><b>Legendary Butcher: +5 dice</b>, and it <b>stacks</b> with Devastating Critical rather than replacing it (the legendary feat takes Devastating Critical as its prerequisite).</li><li><b>Die size by weapon size</b> — <b>d6</b> small, <b>d8</b> medium, <b>d10</b> large. So a large weapon wielded by a character with both lands <b>+8d10 physical</b> on a devastating critical.</li></ul><div><b>Route: the NWNX Damage plugin</b>, which this change is the reason to enable. The include is already staged at <code>.nwnx_includes/nwnx_damage.nss</code> and the server runs the nwnxee/unified image, which ships every standard plugin, so enabling is: copy the include into unpacked/, set <code>NWNX_DAMAGE_SKIP=n</code> in server.env, restart. <code>NWNX_Damage_AttackEventData.iAttackResult</code> reports <b>10 = devastating crit</b> (3 = ordinary critical), and the per-type damage values are modifiable before they land.</div><div><br></div><div><b>Killing the instant kill is a second mechanism, not the same one.</b> The engine applies the dev-crit kill as an <code>EffectDeath</code>, not as damage, so the damage event cannot suppress it. <code>NWNX_ON_EFFECT_APPLIED_BEFORE</code> plus <code>NWNX_Events_SkipEvent()</code> can — the module already subscribes the _AFTER variant of that same event for eff_dur_x2, so the pattern is proven here. Discriminating a dev-crit death from any other death effect: the attack event sets a short-lived flag on the target when iAttackResult is 10, and the effect handler skips a death effect only while that flag is set.</div><div><br></div><div><b>Weapon size</b> is not exposed by NWScript (there is no GetWeaponSize); read it from <code>Get2DAString(&quot;baseitems&quot;, &quot;WeaponSize&quot;, GetBaseItemType(oWeapon))</code>.</div><div><br></div><div><b>The caution:</b> the damage event script intercepts <b>every point of damage on the server</b>, so a bug in it is a bug in all combat. It wants its own build gate and a handler that returns early when nothing applies.</div><div><br></div><div>Related: <a href="
    design_questions:
      - question: "Should the reworked Devastating Critical apply to NPCs as well as players? Proposed: yes, symmetric. It is a straight quality-of-life win for players (no more losing a level-60 character to a random mob save-or-die), and an asymmetric rule is a second code path and a second thing to explain. The alternative — players keep the bonus damage while NPC dev crits still kill outright — keeps the danger but is the version players are asking to be rid of."
        status: answered
        answer: "Yes — symmetric. The rework applies to NPCs and players alike (admin, 2026-08-01)."
    manual_steps:
      - step: "Review the crit-immunity audit and decide which NPCs, if any, keep immunity to critical hits. The full table shipped as CLAUDE-devcrit-immunity-audit.md with a 'keep?' column per creature, sorted by CR. The recipe for keeping it on a hand-picked boss without a 178-creature sweep is in the document: strip the property from the shared blueprint, mint a variant (e.g. bossring_ci) for the bosses that keep it, and swap the resref on the .utc AND the .git instance in lockstep."
        status: open
        kind: toolset
      - step: "FIXED 2026-08-02: bilbobaggins's placed instance in shirebilbohouse had bilbosdefense equipped with Dropable=1 while the blueprint said undroppable - an instance/blueprint divergence, not a loot decision. The instance now matches. check_divergent_creatures.py could not catch it (it compares equipment by slot and resref and ignores Dropable); there are ~301 such Dropable-only divergences module-wide across 45 blueprints, so tightening that gate is its own piece of work."
        status: done
        kind: toolset
      - step: "Separately, Bilbo's instance also makes sting and item089 droppable where the blueprint does not. Left alone - those look like deliberate loot rather than an oversight, unlike the armour, but they are the same kind of divergence and revert on respawn."
        status: open
        kind: toolset
      - step: "Enable the NWNX Damage plugin: copy .nwnx_includes/nwnx_damage.nss into unpacked/, set NWNX_DAMAGE_SKIP=n in server.env, restart. Forgetting the env flip gives per-call 'Plugin not loaded' errors and nothing else."
        status: done
        kind: admin
        blocker: true
      - step: "REBUILD AND REPUBLISH THE HAK (blocker for the refix): the blank EpicWeaponDevastatingCriticalFeat column only takes effect once clients and the server load the new baseitems.2da. Run bin/build-lotr-rules-hak --install, then bin/refresh-nwsync, then restart the server. A client on a stale hak still resolves its own devastating criticals."
        status: open
        kind: publish
        blocker: true
      - step: "UAT (refix): a devastating critical no longer kills outright and instead adds the bonus dice, for a player AND for an NPC attacker (the rule is symmetric). The first UAT failed this - a dev crit killed the combat dummy through both its damage nulling and its death immunity - which is why the save-or-die is now disabled in baseitems.2da instead of intercepted."
        status: open
        kind: uat
      - step: "UAT (refix, the other side): confirm ORDINARY critical hits still work normally and that a character with Devastating Critical for the weapon in hand still gets the +3 dice on them, since attack result 10 no longer occurs. Check unarmed/monk and a creature-weapon NPC too."
        status: open
        kind: uat
      - step: "UAT: dice size tracks weapon size - d6 small, d8 medium, d10 large - and no other death effect in the module was suppressed by the EffectDeath skip (check a finger of death, a death attack, and a normal HP death)."
        status: open
        kind: uat
