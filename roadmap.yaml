  - id: ll-feats-ability-martial
    title: "Legendary Feats: ability score and martial feats"
    group: combat-classes
    epic: legendary-levels
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-03"
    notes: "<div>Ability-score and martial Legendary Feats.</div>"
    impl_notes: "<div>Draft sections <a>Ability Score Feats</a> and <a>Martial Feats</a>.</div><div><b>Blocked on <a href=\"#idea-ll-feats-picker\">ll-feats-picker</a></b> (phases 1-3 of the build order: lotr.tlk &rarr; feat.2da &rarr; picker NUI). Once that lands this is a pure content job: add rows to the feat table at the top of bin/gen-legendary-feats.py, then write the behaviour script. Full architecture and the content ordering: <code>CLAUDE-legendary-feats.md</code>.</div><div><br></div><div><b>Content order position: 1 of 7.</b> The six Ability Score feats ship earlier as the proof payload on ll-feats-2da; this item is the 23 Martial feats.</div><div><br></div><div><b>Do the triage pass first</b>, once, over the whole draft: classify every feat as plain effect / item property / spell-script branch / needs NWNX / cut, and dedupe (Legendary Shadow Step appears in both Ki and Exotic with different prereqs; the four Bard hybrid feats are duplicated verbatim in Performance &amp; Support).</div><div><br></div><div><b>Triage pass: done 2026-08-01</b> &mdash; <code>CLAUDE-legendary-feats-triage.md</code>. Every one of the draft's 139 entries has a route (RAW / plain effect / combat hook / spell-script branch / cut), the duplicates are resolved (Legendary Shadow Step is one feat, not two; the four Bard feats are one set, not two), and the pool lands at <b>133 distinct feats, ~119 after cuts, 34 of them a single permanent effect</b>. It also revises the content order: <b>defence next, not arcane</b> &mdash; 13 of its 16 feats are one effect each.</div><div><br></div><div><b>Shipped 2026-08-01: prerequisites, plus the first two effect feats.</b> <i>Legendary Prowess</i> (+5 AB, <code>EffectAttackIncrease</code>, prereq <b>BAB 35+ and Epic Prowess</b>) and <i>Legendary Onslaught</i> (+1 attack/round <b>in melee or unarmed only</b>, <code>EffectModifyAttacks</code>, prereq <b>BAB 30+ and Monk level 30+</b>) &mdash; rows 1122-1123, the first LEGFEAT_KIND_EFFECT feats in the pool and therefore the first real exercise of the login re-apply path. <b>Retuned 2026-08-01 before publishing:</b> originally Legendary Assault at BAB 20+, which is no prerequisite at all when levels 21-60 hand out +1 BAB every 2 levels. <b>Neither feat has final sign-off yet</b> and neither is published, so both are still freely changeable.</div><div><br></div><div><b>The pool's first CONDITIONAL feat</b>, and it needed new machinery: Legendary Onslaught's extra attack applies to melee and unarmed but not to a bow, so it goes stale the moment the player swaps weapons &mdash; silently, in the player's favour. <code>legfeat_equip.nss</code> (NWNX_ON_ITEM_EQUIP_AFTER / _UNEQUIP_AFTER) re-runs LegFeat_ApplyAll on a 0.5s delay, which rebuilds every effect from the pick records. The delay is load-bearing: at _AFTER the engine may not have finished moving the item, so an immediate check answers about the state being left rather than the one being entered. The handler exits early on the spent-picks count, because it fires on every item swap by every player and almost nobody holds a legendary feat. A gate asserts the subscription.</div><div><br></div><div><b>Prerequisite machinery.</b> A <code>Feat</code> now carries <code>prereq</code> (an NWScript boolean expression over oPC, rendered verbatim into the generated <code>LegFeat_MeetsPrereq</code>) and <code>prereq_text</code>; the generator refuses to run with one and not the other, since prose with no test behind it is a prerequisite that is not enforced. <b>Checked twice:</b> the picker greys the row and shows \"Requires: ...\" in the effect column, and <code>LegFeat_Take</code> re-checks &mdash; the window is a client-side snapshot, so the server-side check is the one that binds. Ability prerequisites read BASE scores; a requirement met by swapping a belt on for one button press is not a requirement.</div><div><br></div><div><b>Gate additions</b> (tests/check_legendary_feats.py, both negative-tested): LegFeat_Take must call LegFeat_MeetsPrereq, and <b>every EFFECT-kind feat with no ability payload must have a case in LegFeat_ApplyOne</b> &mdash; without one the pick is spent, the feat appears on the sheet with its real name, and the benefit simply never arrives, with no error anywhere.</div><div><br></div><div><b>Remaining in this item:</b> the other 21 martial feats. Six are engine-owned and cut (Cleave, Ambidexterity, Devastating Critical DC, Knockdown size, Precision, Parry); the rest need a combat hook or a spell script &mdash; per-feat routes in the triage doc.</div><div><br></div><div><b>SHIPPED 2026-08-03: the martial replacement set, nine feats, admin-approved that day.</b> Rows 1125-1133, taking the pool from 9 to 18. <i>Juggernaut</i> (four immunity effects + a disarm hook), <i>Grip</i> (+4 AB/+6 dodge AC, CONDITIONAL on a weapon in each hand), <i>Marksman</i> (+1 attack, CONDITIONAL on a bow or crossbow &mdash; the mirror of Onslaught), <i>Bulwark</i> (-10 damage behind a shield), <i>Riposte</i> (1/round counter-attack), <i>Reaping</i> (+2/+2 per kill, stacks 5), <i>Wrath</i> (+1 damage per 5% health missing, max +20), <i>Quarry</i> (+50% vs a favoured enemy below half health), <i>Sundering</i> (-3 target AC per hit, stacks 3, capped at its real armour+shield AC).</div><div><br></div><div><b>Three new pieces of machinery, and the cost model is the point.</b> <code>legfeat_atk_inc.nss</code> carries the attacker-side feats and is called from <code>devcrit_atk.nss</code> &mdash; the module's only sight of an attack result &mdash; behind ONE GetLocalInt on the attacker (<code>LEGFEAT_ATK_VAR</code>), because that script runs on every attack on the server. It treats the damage struct as READ-ONLY and adds its bonuses as separate EffectDamage: devcrit_atk owns the struct and only writes it back on the critical path, so a bonus written here would be dropped on every ordinary hit. <code>legfeat_dmg.nss</code> carries the defender-side feats and is registered PER CHARACTER (NWNX_Damage_SetDamageEventScript) only on someone holding Bulwark or Riposte; everyone else has no damage script at all. <code>legfeat_disarm.nss</code> exists because the engine has no IMMUNITY_TYPE_ for disarm &mdash; the only way to make a weapon unstrikable is to skip NWNX_ON_DISARM_BEFORE. All three are switched on and off by the new <code>LegFeat_ArmHooks</code>, called at the end of LegFeat_ApplyAll, which clears as readily as it sets so a respec takes the hook with it.</div><div><br></div><div><b>New gate</b> (negative-tested): every HOOK feat read by a GATED hook must be named in LegFeat_ArmHooks. The existing gate proves a reader exists; this one proves the reader is ever reached. Without it a feat can have a perfectly good handler that never runs, which looks exactly like the handler not existing.</div>"
    design_questions:
      - question: "Legendary Warcry, as designed, triggers on a passed INTIMIDATE check - but Intimidate is not an activated skill in NWN, and NWNX's use-skill event only fires for skills a player actually activates (Taunt, Heal, Animal Empathy, and so on). There is nothing to hook. Proposed: re-base it on TAUNT, which is the activated skill Intimidate feeds in this game, keep the +4 AB / +4 saves to allies within 10m for 3 rounds and the 60s cooldown, and keep Intimidate 25+ as the prerequisite. The alternative is to make it a bound token item the player activates, which costs ~2 in-game turns and is unusable mid-fight."
        status: open
        answer: null
      - question: "Legendary Called Shot's first clause - 'Called Shot loses its -4 attack penalty' - is engine-owned and cannot be scripted away: the penalty is applied inside the engine's own Called Shot resolution, and no NWNX event exposes it. The doubled-and-extended effects on a failed Discipline check ARE buildable on NWNX_ON_USE_FEAT_AFTER. Proposed: ship the second half only and reword the feat to promise just that, or cut the feat and let Legendary Sundering carry the armour-shredding role it overlaps with. Which?"
        status: open
        answer: null
    manual_steps:
      - step: "Publish: python3 bin/gen-legendary-feats.py --apply; bin/build-lotr-tlk --apply --install; bin/build-lotr-rules-hak --install; bin/refresh-nwsync; nwn-manager repack; bin/server-restart. The hak and the TLK must go together or the two new rows read as blank names."
