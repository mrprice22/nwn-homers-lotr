    commit: 58deb72400b
    notes: "<div>Improved Invisibility was quietly broken by the doubled-buff-duration feature: the icon stayed up for the full doubled time while the actual invisibility and 50% concealment had already been stripped, so you looked invisible, were not, and were still attacked. The whole invisibility and illusion family is now excluded from duration-doubling and behaves correctly. Details: <a href=\"Customizations.html#spell-duration\">Customizations → Spell Duration</a>.</div>"
    impl_notes: "<div><b>Root cause:</b> the invisibility exclusion added by the earlier fix (f9565ed4202) only inspected the <i>first</i> true-effect entry sharing the applied effect's UNIQUE_ID. Improved Invisibility is applied as a <i>linked</i> effect (EffectInvisibility + a duration visual) whose components share a single engine effect id, so the loop could land on the non-excluded linked visual, skip the guard, RemoveEffectById the <i>whole</i> link, and reapply only one component — splitting the link exactly as the exclusion was meant to prevent.</div><div><br></div><div><b>Fix:</b> exclude the whole invisibility/illusion family by SPELL_ID before the re-timing loop — Improved Invisibility (88), Invisibility (90), Invisibility Sphere (92), Sanctuary (154), Ethereal Visage (121), Etherealness (443) — the same robust approach that fixed Divine Might/Shield, and one that also covers item-cast sources (potions/wands/scrolls). Additionally hardened the effect-type guard to scan <i>every</i> component sharing the id (a guard pass before the apply pass), so script-applied invisibility with no spell id cannot regress the same way.</div>"
  - id: duration-divine-might-issue
    title: "divine might duration bug"
    group: qol
    status: awarded
    merit_awarded: true
    type: Defect
    player: "dc0960 (Dungeon_Crawler)"
    date: "2026-07-02"
    commit: ec0cfda3527
    notes: "<div>Divine Might had the wrong half of the doubled-duration feature applied to it: the buff itself reverted to its normal length, but the game still blocked you from re-casting it for the full doubled time. Divine Might and Divine Shield are now excluded from duration-doubling, so both the buff and the cooldown match again. Details: <a href=\"Customizations.html#spell-duration\">Customizations → Spell Duration</a>.</div>"
    impl_notes: "<div><b>Root cause:</b> the module's server-wide 'buffs last twice as long' feature (eff_dur_x2.nss, live since 2026-06-19, one day before this report) re-times every PC-created effect by removing it and re-applying a copy with double the duration. That same day a follow-up fix already excluded invisibility/concealment/sanctuary/ethereal, because remove+reapply splits <i>linked</i> effects (EffectLinkEffects) and corrupts their engine-dependent behavior.</div><div><br></div><div>Divine Might (feat 413 / spell 473) and Divine Shield (feat 414 / spell 474) build their buffs the same linked way, confirmed by disassembling the vanilla x0_s2_divmight / x0_s2_divshield scripts, but were not in that exclusion list — so the same link-splitting bug hit them. That matches the report exactly: the mechanical buff reverts to its natural duration once the link splits, while whatever GetHasFeatEffect() reads to block re-casting keeps running for the full doubled duration.</div><div><br></div><div><b>Fix:</b> excluded spell IDs 473 and 474 from the duration-doubling in eff_dur_x2.nss, same treatment as the invisibility family. Documented in docs.manual/Customizations.html#spell-duration alongside the existing invis exception.</div>"
  - id: wiki-missing-creature-numarockblackhand
    title: "Wiki Missing creature: Numanan Numerocks Second Hand (CARN DUM)"
    group: wiki-tools
    status: awarded
    merit_awarded: true
    type: Defect
    player: "Y a z k i r"
    date: "2026-06-23"
    notes: "<div>Two problems behind one report. On the wiki, differently-named creatures sharing a blueprint were collapsing into a single page, so Numanan Numerock's Second Hand had no page of its own; renamed placements now each get their own page (this recovered around 17 creatures, including Old Tagget and Sarah the Librarian). More seriously, in-game any creature placed with custom overrides — name, faction, abilities, gear, conversation — lost all of them the first time it died and respawned, which is why the same spawn point kept showing the wrong creature. Respawns now reproduce exactly what was placed.</div>"
    impl_notes: "<div><b>Fix 1 (wiki):</b> the generator deduped creatures by combat identity only, so one blueprint (cultmember002) placed under different FirstName overrides collapsed to a single page. nwn-wiki now folds the placement's display name into the canonical-creature key.</div><div><br></div><div><b>Fix 2 (root cause of the 'sometimes Numarok' part):</b> the respawn system (se_respawn_inc via nw_c2_default7 OnDeath) re-creates a dead creature from its BLUEPRINT, keeping only the tag — so every placement-level override (name, faction/hostility, abilities, classes, feats, special abilities, equipment, natural AC, race, conversation) was lost on first death. bin/split-divergent-creatures.py gives each diverging placement its own baked blueprint (123 new blueprints, ~245 placements across 60 areas) so respawn reproduces what was placed; tags untouched so no quest/script lookups change. Added tests/check_divergent_creatures.py to the build smoke-test so it cannot regress, plus TESTING-respawn-overrides.md for player validation.</div>"
