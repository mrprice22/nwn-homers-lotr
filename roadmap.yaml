    notes: "<div>Withdrawn for redesign. The class quest lines went out as one large batch and lean on each other too heavily — each line is being reworked individually, with its rewards retuned, before any of it returns.</div>"
    impl_notes: "<div>Journal category rng_path (@group 'Class Lines' @order 7). Giver q_rng_keep (Halbarad, Ranger 30, plot/immortal) in rangerwaystation; offer gated on GetLevelByClass(CLASS_TYPE_RANGER) &gt;= 1, non-rangers get a flavour brush-off. Structurally cloned from the shipped cleric-line-early template.</div><div><br></div><div>Three-node one-off arc; per-character state in the rnglinedb campaign DB (key path_stage 0-&gt;3, advance-only). Rewards q_rng_broc (+1 DEX amulet), q_rng_star (plot token), q_rng_bow (BaseItem 8 longbow, Enhancement +2 / +1 DEX); Use-Limitation:Class subtype 7 = Ranger, verified against existing ranger-restricted items.</div><div><br></div><div>Waystation OnEnter wrapped q_rng_enter (chains the existing leash_to_area) -&gt; q_rng_spawn; conversation q_rng_conv, StartingConditionals q_rng_c_off/s1w/s1r/s2w/s2r/dn, reply scripts q_rng_oath/tok/rtn. DLG follows the reply-gate rule (verified no action script in any Active field). Build passed all gates (7/7 smoke tests, dialog integrity).</div><div><br></div><div>Resumed half-built prior work from 0b71d6908a4, which had shipped the q_rng_* scripts and reward UTIs with no giver, dialog, journal or area wiring — nothing was reachable. Also fixed q_rng_bow, authored as BaseItem 6 (heavy crossbow) despite its name, to 8 (longbow). Kept the pre-existing q_rng_ prefix rather than q_rgr_ to avoid orphaning 15 committed files. No capstone built — deferred to ranger-line-mid/endgame.</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>implemented</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Uncrowned Path</b> — the first three chapters (L1, L8, L15) of the Ranger class line. Halbarad, Warden of the Grey Company, keeps a lonely watch at the Ranger Waystation for what is left of the Rangers of the North, and offers the grey vigil to those with the wandering in them: the <b>Brooch of the Grey Watch</b> at L1, the Star of the Dúnedain at L8, and the <b>Bow of the Uncrowned</b> at L15. Details: <a href=\"QuestGuide.html#uncrowned-path\">Quest Guide → The Uncrowned Path</a>.</div><div><br></div><div><b>Archived manual steps</b> — reinstate these when the line is redesigned:</div><ul><li>[toolset · done] Place waypoint AP_rangerlineearly_1 in rangerwaystation. Halbarad is script-spawn-only and no-ops gracefully until then — the entire quest line is invisible in-game until this is placed.</li><li>[uat] UAT gating: a Ranger at the Waystation sees Halbarad's offer of the vigil; a non-ranger gets only the civil brush-off.</li><li>[uat] UAT node 1: accept -&gt; journal rng_path opens + the ranger-restricted Brooch of the Grey Watch.</li><li>[uat] UAT level gates: below L8 and below L15 Halbarad turns you away.</li><li>[uat] UAT nodes 2-3: at L8 the Star of the Dunedain is granted; at L15 it is consumed and the Bow of the Uncrowned granted; journal advances 1-&gt;2-&gt;3(End).</li><li>[uat] UAT restrictions: brooch and bow are unusable by non-rangers; confirm the bow equips as a longbow and its model renders.</li><li>[uat] UAT regression: the Ranger Waystation leash still fires from the wrapped OnEnter.</li></ul>"

