  # ---- Endgame difficulty design brief (docs.manual/boss-updates.html) -----
  - id: boss-stat-tuning-pass
    title: "Per-boss stat tuning: close dumped saves, swap flat DR for % immunity gear, raise auto-hit AC into the ~85 gate window"
    group: bosses
    status: awarded
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    commit: f3ff201f85f
    notes: "<div>First deliverable of <a href=\"#idea-higher-difficulty-ceiling-revamp\">New end game bosses/higher difficulty ceiling</a> — pure blueprint data edits, no HP inflation and no CR-label changes. Full recipe, player-power math, and per-boss tables in the <a href=\"https://homerslotr.com/manual/boss-updates#recipe\">Endgame Difficulty design brief</a>.</div><div><br></div><div><b>Priority A</b> (glaring single hole): Smaug (Ref +0), Summanus (Will +0), Gwathdor Lord (Will +5), Sauron the Abhorred (Fort +4, AC 65), Gandalf the Gray (Will +10, AC 63) — Witch King is the worked example. <b>Priority B</b> (auto-hit AC / missing immunity gear): Boromir, Denethor, Temple Mistress, Legolas, Theoden's Chosen.</div><div><br></div><div><b>Fixed 2026-07-13:</b> applied the brief's recipe to all ten Priority A+B bosses — blueprint and placed instance edited in lockstep (encounter-spawned Summanus/Legolas are blueprint-only); no HP or CR changes. Highlights: Witch King worked example was marked DONE in the brief but had never been applied — applied now (NaturalAC 0→30, Fort 0→27, Ref 3→15, Will 13→22); Smaug Ref 0→25/Will 0→22; Summanus Will 0→30/Fort 0→20; Gwathdor Lord Will 0→27; Sauron Fort 0→28/AC+20; Gandalf Will 0→18/AC+22; Boromir AC+20; Denethor Ref 0→18/AC+13; Temple Mistress AC+18 and Legolas Fort 0→12 with npcbuffgear immunity skins; Theoden's Chosen given the real bossring + npcbuffgear skin. Follow-up noted, not done (beyond pure-data scope): a damage rider for Theoden's Chosen — his low AB offense remains.</div><div><br></div><div><b>UAT:</b> (1) Witch King should examine at ~AC 86 (was 56) and resist Knockdown/save-or-die; (2) Smaug no longer auto-fails Reflex spells; (3) Hold Monster on Summanus now needs a real DC; (4) a ~+70 AB character should whiff most swings on Sauron/Gandalf/Boromir/Denethor/Temple Mistress while a maxed +85–90 build still connects; (5) Temple Mistress/Legolas/Theoden's Chosen visibly resist ~50% of single-type physical damage; (6) kill + respawn one boss (e.g. Witch King) and confirm the respawned copy keeps the tuned stats.</div>"
  - id: boss-enrage-on-retreat
    title: "Enrage-on-retreat: registry bosses taunt, gain +2 all stats for that life, and heal 25% of missing HP when a player disengages"
    group: bosses
    status: awarded
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    commit: 044c61c14fa
    notes: "<div>Kills the potion-attrition and tank-and-retreat cheese: every retreat makes the boss stronger and undoes a quarter of the progress, so the winning line is one sustained, properly-geared engagement. Scope is strictly the CR&gt;60 single-instance Roll-of-the-Fallen registry bosses; the enrage never persists onto a respawn. Design: <a href=\"https://homerslotr.com/manual/boss-updates#enrage\">boss-updates#enrage</a>.</div><div><br></div><div><b>Ships together with</b> <a href=\"#idea-heal-soul-fatigue\">soul-fatigue on Heal</a> — this is what removes fatigue's \"retreat and wait out the stacks\" escape hatch. Open design detail: how \"left combat\" is detected (heartbeat aggro-list scan vs. per-PC engaged flag).</div><div><br></div><div><b>Fixed 2026-07-13:</b> pure script on existing plumbing (new enr_inc.nss + one call from bst_ondamage.nss). Registry scoping is a cached query against respawndb's boss_registry, so it always matches the Roll of the Fallen. Left-combat detection is a hybrid: engagement rides the bestiary's OnDamaged wrapper (summons/pets resolve to the owning PC), disengagement is a boss-side 6s pseudo-heartbeat that only runs while someone is engaged — an engaged PC out of the area, beyond 40m, or logged out for ~12s has retreated. Dying is not retreating; logging out is. Each retreat: shout taunt naming the PC, +2 all six abilities (supernatural, undispellable, stacks per retreat, dies with the creature so it can never persist onto a respawn), instant heal of 25% missing HP with a buff VFX.</div><div><br></div><div><b>UAT:</b> (1) damage a registry boss, run &gt;40m or leave the area — within ~12–18s it taunts you by name, flashes a VFX, regains HP, examines at +2 stats; (2) retreat again — the +2 stacks; (3) kill it and wait out the respawn — base stats, no carried enrage; (4) a second player still fighting while the first retreats — enrage still fires; (5) dying to it fires nothing; (6) retreating from a non-registry high-CR mob does nothing. Note: <a href=\"#idea-heal-soul-fatigue\">soul-fatigue</a> ships separately right after.</div><div><br></div><div>Tested and working!</div>"
  - id: heal-soul-fatigue
    title: "Soul-fatigue stacks on the Heal spell and potions: the heal lands first, then 10% max-HP damage per prior stack, 3-minute decay"
    group: bosses
    status: awarded
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-15"
    commit: f63d978a374, 9d44d0ccbb7
    notes: "<div>Turns reflexive full-heal spam into a timed resource: a heal from zero stacks is free, chain-healing gets progressively lethal (at 10 stacks the post-heal hit is 100% of max HP). Hook is the existing module override spellscript (stop_spellcheat via SetModuleOverrideSpellscript), which already sees potion activations. Design: <a href=\"https://homerslotr.com/manual/boss-updates#fatigue\">boss-updates#fatigue</a>.</div>"
    notes_h: 419
  - id: encounter-density-reused-mobs
    title: "Encounter density: bump per-instance spawn counts 1 to 2 for creatures used by more than one encounter (cap 2, never solo boss encounters)"
    group: bosses
    status: implemented
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-15"
    commit: 5243c14abc0
    notes: "<div>Thickens genuinely reused rank-and-file mobs (~144 of 382 encounter creatures qualify) while leaving one-off set-pieces alone. Must edit the placed encounter <i>instances</i> in the area .git.json files — the .ute templates are inert at runtime — and never touch the 19 solo (MaxCreatures == 1) encounters, which would silently drop a boss from the Roll of the Fallen tracker. Design: <a href=\"https://homerslotr.com/manual/boss-updates#density\">boss-updates#density</a>.</div><div><br></div><div>On-axis as a throughput multiplier on the healing economy (more incoming damage → more heals → faster <a href=\"#idea-heal-soul-fatigue\">soul-fatigue</a>), so it sequences after the two healing-economy levers land.</div><div><br></div><div><b>Fixed 2026-07-15:</b> data pass applied exactly per the brief: 144 of 382 encounter creatures qualify as genuinely reused; <b>32 placed encounter instances across 9 areas</b> (Alterwald, Bill Ferny's House, Greenway North, the three Kallrist shore/inner areas, Old Back Road, The Wold, Wold South) had their per-instance spawn count bumped 1 → 2 (23 creatures thickened; nothing already ≥2 touched, MaxCreatures never changed, .ute templates untouched). <b>Exclusion note:</b> the brief says 19 solo encounters, but the module actually has 61 solo instances (9 of them registry encounter-bosses) — all 61 were excluded, the strictly safer superset; the brief's figure should be corrected at the next design edit. Boss-registry gate confirmed unchanged (78 bosses) before and after. Design brief's #density section marked shipped.</div><div><br></div><div><b>UAT:</b> pairs of giant spiders in Alterwald / Old Back Road, denser packs in The Wold / Wold South and the Kallrist shores; regression — the Balrog of Moria and Summanus still spawn exactly one and track normally on the Roll of the Fallen. Perf impact negligible (+1 creature on 32 triggers module-wide).</div>"
  - id: forbidden-realms-key-tier
    title: "Forbidden Realms Key tier: journal quest and a Númenor gate opening the orphaned Tombs of the Lost Souls as the Weathertop court's barrow"
    group: bosses
    status: soon
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    notes: "<div>The Forbidden Realms Key already ships (pickpocket-only from Summanus) but is wired to nothing. Chain: acquire the key → journal quest (acquireditem_tag branch + retroactive OnClientEnter check for players who already stole it) → locked door in a Númenor hub keyed on tag ForbiddenRealmsKey → the Tombs of the Lost Souls (gravesofthelostk), a finished area with zero connections today, populated as the barrow-court of the unspawned Weathertop King/Queen/Archer blueprints. Design: <a href=\"https://homerslotr.com/manual/boss-updates#tier\">boss-updates#tier</a>.</div><div><br></div><div>Content anchor of the new tier and the first concrete slice of <a href=\"#idea-unlock-more-inacessible-creature\">Unlock Inacessible creatures</a>; apply the <a href=\"#idea-boss-stat-tuning-pass\">tuning recipe</a> to each court member on placement.</div>"
