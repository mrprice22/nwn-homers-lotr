  - id: MW-Bardsong-Bug
    title: "MW Companions/Henchmen can get stuck trying to use Bard Song over and over"
    group: meaningwave
    status: awarded
    merit_awarded: true
    type: Defect
    player: "Fugdish (Try_this)"
    date: "2026-07-07"
    commit: e745a3f4c60
    notes: "<div>Meaningwave companions could get stuck spamming Bard Song or Curse Song — flooding the log with 'no more bardsong uses left', burning their daily uses in seconds, and ignoring your tactics menu because the constant retries monopolised their action queue. They now sing once, keep the song up, and answer your orders. Details: <a href=\"Customizations.html#meaningwave\">Customizations → Meaningwave</a>.</div>"
    impl_notes: "<div><b>Root cause:</b> mw_sup_er (Campbell/McKenna OnEndCombatRound) issued song feats every combat round with no guards. Style 1 gated Curse Song on FEAT_CURSE_SONG, but Curse Song actually spends the <i>Bard Song</i> pool (x2_s2_cursesong decrements/checks FEAT_BARD_SONGS) — so the gate never tripped and it re-queued Curse Song every round, flooding the 'no more bardsong uses left' message, which names <i>bard</i> song, hence the confusing verbiage. Style 2 re-sang Bard Song every round with no 'already singing' guard, burning all daily uses in seconds; the constant feat attempts also pre-empted attack/tactics orders in the action queue.</div><div><br></div><div><b>Fix:</b> gate Curse Song on the real FEAT_BARD_SONGS pool and skip an already-cursed enemy; add !GetHasSpellEffect(411) to Bard Song so it is not re-sung while the buff is up, mirroring the module's canonical TalentBardSong().</div>"
