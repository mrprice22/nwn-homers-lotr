    notes: "<div>Ping Pong, the test NPC, can now set you to any of the new legendary levels. Pick \"Set my level.\", then \"Legendary Levels (41 - 60)\" from the high-level page, and choose anything from 41 up to 60. The experience granted matches the server's published legendary table exactly.</div>"
    impl_notes: "<div>unpacked/_pc_builder_v1.dlg.json: new entry 5 (\"Which legendary level do you want? (41 - 60)\") with replies 58-77 (levels 41-60) plus a Nevermind link; reached from entry 4 (the existing 21-40 page) via new reply 79 \"Legendary Levels (41 - 60)\". Note the original note was wrong that reply 16 was an unwired stub — the dialog already linked the 1-20 page to the 21-40 page.</div><div>New include unpacked/_build_lvl_inc.nss holds BuildLegendaryXP() / BuildSetLegendaryLevel(); the 20 new _build_level_41..60.nss are one-line wrappers. XP is read at runtime from Get2DAString(\"exptable\", \"XP\", nLevel - 1) so hak_2da/exptable.2da stays the single source of truth, with a transcribed fallback switch (828,800 … 3,581,000) for the case where the hak is absent. The new path uses GetPCSpeaker() for the XP set <i>and</i> the VFX/floating text (fixing the stock scripts' GetLastSpeaker() split), and the change is on the conversation, not on an instance, so both butcha placements (thewelloferu, houseofdispai001) pick it up.</div><div>Setting a level above 40 will not raise the character sheet until <a href=\"#idea-ll-maxlevel-cap\">ll-maxlevel-cap</a> lands; until then SetXP banks the XP but the engine caps the level. Gates: 11/11 smoke tests, dialog integrity 378 dialogs / 0 failing, 21 scripts compiled 0 errors.</div>"
    design_questions:
