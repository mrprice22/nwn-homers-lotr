  - id: ll-xp-award-balance
    title: "Retune XP awards for the 41-60 band"
    group: combat-classes
    epic: legendary-levels
    status: design
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-05"
    notes: "<div>Levelling from 41 to 60 is a real grind but a finishable one — endgame content pays out at a rate that matches the new table.</div><div><br></div><div><b>2026-08-05:</b> we measured both halves of the legendary XP economy. The climb from 41 to 60 costs 2,752,200 experience -- about three and a half times the entire journey from 1 to 40 -- and the kill rewards were never extended to match it, so above level 40 a Krenshar and a Balrog are worth the same. A concrete retune is now written up and waiting on one in-game measurement and the admin's sign-off.</div>"
    impl_notes: "<div>Once the table is fixed, check what the existing endgame creature/boss XP actually pays per hour against the 48,800-rising-x1.1 per-level costs, and adjust awards (or the table) rather than leaving the two to drift. Related: <a href=\"#idea-boss-tuning-post40\">boss tuning past 40</a>.</div><div><br></div><div><b>MEASUREMENT 2026-08-05 (analysis only -- no code changed, nothing committed; every number below is a balance decision and belongs to the admin).</b></div><div><b>Cost side, exact.</b> hak_2da/exptable.2da (packed into lotr_rules.hak via RULES_2DA in bin/build-lotr-rules-hak). The '48,800 rising x1.1' figure is confirmed: 40-&gt;41 is 48,800 and each step compounds x1.1 rounded to whole hundreds, ending at 299,200 for 59-&gt;60. <b>Cumulative 41-&gt;60 = 2,752,200 XP</b> (828,800 -&gt; 3,581,000); 40-&gt;60 = 2,801,000. For scale the whole 1-&gt;40 climb is 780,000, so the legendary band costs <b>3.53x the entire pre-epic game</b>. 3,581,000 is corroborated independently by bank_xp_*.nss, code_redeem.nss (XP_LEVEL_60) and the transcribed switch in _build_lvl_inc.nss -- no drift.</div><div><b>Income side -- the finding.</b> The cap raise extended exptable.2da (cost) but <b>never extended xptable.2da (award)</b>. Kill XP is xptable.2da[row = earned level][col = 'C' + creature CR] x XPScale x party penalty; the module sets Mod_XPScale 150 and zeroes XPPenalty in classes.2da. Extracted with nwn_resman_cat, the live xptable.2da is <b>stock: 40 rows (levels 1-40) x 41 columns (CR 0-40)</b>, and it is <b>not</b> in RULES_2DA, not in hak_2da/, and mentioned nowhere in the repo or any gate. So every level-41+ character indexes a row that does not exist, and every creature above CR 40 -- the entire endgame ladder (CR 45 Death Weeper Spiders, CR 115 Uruk Hai First Born, CR 260 Undead of Gondor, CR 650 Driders, CR 1461 Boromir) -- indexes a column that does not exist. The last real row (level 40) pays <b>4 XP for any CR &lt;= 32</b>, rising to 400 at CR 40: a ceiling of 400 x 1.5 = <b>600 XP per kill</b>, and 6 XP for anything under CR 33.</div><div><b>What the engine does with the out-of-range lookup is unresolved and decisive:</b> (A) returns 0 -- no combat XP at all past 40, 41-&gt;60 unfinishable; (B) clamps to the last row/column -- a flat 600/kill, about 4,587 kills, ~51 h at 90 kills/hr; (C) floors at the creature's CR -- 60 to 2,190/kill. <b>One 60-second in-game measurement settles it</b> and is filed as the blocking manual step. Even in the best case the shape is wrong exactly as this item predicted: a CR-1461 Boromir pays the same as a CR-40 Krenshar, and all endgame CR inflation is invisible to the XP economy.</div><div><b>Script-awarded XP is negligible.</b> All 74 journal categories in module.jrl.json total <b>7,750 XP</b> for the whole module (largest single quest 2,000). Every hard-coded RewardPartyXP / GiveXPToCreature constant across unpacked/*.nss sums to roughly <b>150,000</b>, of which 50,000 is mw_finale and 25,000 is code_redeem promo codes, and the q_*_finish induction grants are explicitly tiered for levels 6-16. Total one-time quest XP is about <b>5% of the 41-&gt;60 cost</b> and almost none of it is endgame. Flat on-death awards do exist and are the precedent for the fix: hotuxpfix (1,000 XP, gated GetHitDice &gt;= 21, on 7 Black Numenorean blueprints) and 550/350/250xpondeath + mountainondeath (250-550) on ~28 endgame Mordor/Uruk/Gate blueprints -- i.e. the highest-CR content in the game is hand-paid at roughly the level-40 engine ceiling.</div><div><b>Two dead XP hooks (findings, not defects to fix):</b> nw_c2_default7.nss:49 calls ExecuteScript(\"party_xp\") and <b>party_xp does not exist</b> (298 blueprints directly, 118 more via staticspawn); gpondeath.nss calls ExecuteScript(\"pwfxp\") with the comment 'pwfxp grants XP' and <b>pwfxp does not exist either</b> (10 blueprints). git log -S shows both were never present -- inherited PW-template dead code since the initial import, not a regression, and writing them <i>is</i> the balance decision. <b>Trap for the implementer:</b> in nw_c2_default7 the _NSP tag check returns <i>before</i> the ExecuteScript line, and 193 creatures use x2_def_ondeath with no hook at all, so party_xp is the wrong insertion point regardless. Also noted: attackxp.nss grants 50,000 XP to GetLastHostileActor() and is referenced by nothing -- harmless today, a live grenade if ever attached to an event.</div><div><b>Admin constraint recorded 2026-08-05:</b> there is a <b>module-wide 6,000 XP cap on creature kills</b>. It is not in unpacked/ or server.env (engine/server-side), and it bounds the proposal directly -- a 3,000 award under the premium 2x boost lands exactly on 6,000, and a x3 boss multiplier would be clipped.</div><div><b>Recommended lever (for approval, not implemented):</b> a level-gated, CR-based script award rather than a new xptable.2da. A 2DA fix would need 20 new rows <i>and</i> columns out to CR 1461, plus a hak build and an nwsync/client publish, and it cannot express a level gate; the script route needs only a .mod repack and the insertion point already exists and is already correct -- <b>bst_ondeath.nss</b>, the bestiary's runtime OnDeath wrapper installed on every creature by bst_install (from every OnSpawn plus the leash_to_area OnEnter safety net, idempotent via bst_hooked). It already loops over every valid PC contributor with summons, henchmen, DMs and trap/environmental deaths excluded, and already has fCR in hand: one GiveXPToCreature(m, nAward) inside that loop, gated on the recipient being level 41+, is the entire change. The 2x boost applies automatically via the NWNX_ON_SET_EXPERIENCE_BEFORE handler in boost_xp_evt.nss.</div><div><b>Assumptions behind the hours-to-60 figures</b> (sanity-check these against the admin's feel for the server): 90 kills/hour sustained including travel, respawn waits, rests and deaths -- justified by encounter ResetTime (median 300 s across 778 placed encounters, 60-600 s range) and the 900 s static respawn in se_respawn_inc.nss, with a player rotating mirrored zone pairs (Wold North/South, Angmar/Ettenmoors share pools); solo; no boost; quest XP ignored as measured above.</div><div><b>Alternatives costed and rejected:</b> softening the cost curve to x1.07 gives 41-&gt;60 = 1,951,700 (x1.05 gives 1,564,800) but breaks exptable's published figures, bank_xp_*, code_redeem and _build_lvl_inc.nss and needs a hak + nwsync publish; raising Mod_XPScale 150 -&gt; 200 adds 33% at <i>every</i> level including 1-40, multiplies a table that saturates at 400 so it cannot fix the CR-is-meaningless problem, and does nothing at all in case A; an endgame quest XP tier is worth doing for texture but arithmetically irrelevant (20 new quests at 50,000 each is 1M one-time against a 2.75M repeatable requirement).</div>"
    design_questions:
      - question: "THE RETUNE ITSELF -- approve the numbers. Target: 100-125 solo play-hours for 41-60 (about half that with the premium 2x boost), because the band costs 3.5x the whole 1-40 game and should feel like a long tail rather than a second full playthrough, while keeping 41-42 at roughly 2 h so the first legendary level lands quickly. Proposed award: XP = 5 x CR, clamped to [100, 3000], paid only when the recipient is level 41+, added inside the existing bst_ondeath contributor loop. Against the actual roster of the 41-60 zones (Wold, Gap of Rohan, Pelennor, Gondor West, Ettenmoors, Angmar, Mirkwood, Emyn, Mordor/Morannon, Minas Tirith -- 118 placed creatures, median CR 50) that pays: Dire Wolf CR 20 -> 100 (floor); Krenshar CR 41 -> 205; Ridermark Guardian CR 55 -> 275; Uruk Hai First Born CR 115 -> 575; Mordor Orc Lieutenant CR 200 -> 1,000; Undead of Gondor CR 260 -> 1,300; Black Numenorean Assassin CR 331 -> 1,655; Drider Militia and Boromir -> 3,000 (cap). Median award 250, mean 342 over the non-unique CR<=300 subset; a realistic mix averages 250-300/kill, so 2,752,200 / 275 = about 10,000 kills = about 111 hours at 90 kills/hr. Per level at 255/kill: 41-42 = 211 kills / 2.3 h; 50-51 = 497 kills / 5.5 h; 59-60 = 1,173 kills / 13.0 h; cumulative 119.9 h. Because the award is flat and the cost compounds x1.1, time-per-level rises 10% per level automatically -- the back-loaded shape falls out with no level scaling. NOTE the module-wide 6,000 XP kill cap you flagged: the 3,000 clamp is deliberately half of it, so a capped kill under the 2x boost lands exactly on 6,000 and is never clipped. Approve 5 x CR / [100, 3000], or set your own coefficient and clamp."
        status: open
        answer: null
      - question: "PARTY SPLIT OR FULL-TO-EACH? Proposal: the full award to each contributor in the party, matching the module's existing RewardPartyXP semantics and the party-loot-roll culture. The alternative is dividing by contributor count, which makes grouping strictly worse than soloing. Approve full-to-each, or set a split."
        status: open
        answer: null
      - question: "BOSSES -- do they get a multiplier? At a 15-minute respawn a boss-runner clears about 4 an hour, so at the 3,000 cap that is 12,000 XP/hr against roughly 23,000 XP/hr trash-grinding: bosses would be strictly worse XP than trash. Proposal: a x3 multiplier for the 78 registry bosses (brd_db.nss, CR > 60), i.e. up to 9,000 -- but note this collides with the module-wide 6,000 kill cap, so in practice it would clip to 6,000 (and to 3,000 pre-boost if the cap applies before the boost). Either raise/except the cap for registry bosses, settle for x2 (6,000), or accept that bosses are for loot and leave the cap at 3,000. Which?"
        status: open
        answer: null
      - question: "DOES THE SCRIPT AWARD STACK ON TOP OF THE ENGINE'S? If the blocking measurement below returns case B (a flat 600/kill from the clamped stock table), that is a free +600 on every kill and the 5x coefficient should drop to about 4x. If it returns case A (0), 5x stands as written. Proposal: take the measurement first, then set the coefficient -- do not build before that number exists."
        status: open
        answer: null
    manual_steps:
      - step: "BLOCKING MEASUREMENT (do this before anything is built): log a level-41+ character in, kill one CR-40+ creature (a Krenshar in Wold North, or a Ridermark Guardian on the Pelennor Fields) solo with no boost active, and report the exact XP gained. That single number selects between case A (0 XP past 40), case B (flat 600) and case C (CR-floored), and it fixes the coefficient in the fourth design question. Nothing should be built before it."
        status: open
        kind: admin
        blocker: true
      - step: "Decide whether xptable.2da should be added to hak_2da/ + RULES_2DA at all. It deliberately was NOT added: doing so would silently change live XP rates the next time anyone runs bin/build-lotr-rules-hak --install, and it cannot express a level gate. If the script-award route is approved, xptable.2da should stay stock and out of the hak -- confirm that is what you want."
        status: open
        kind: publish
      - step: "Housekeeping, admin's call: unpacked/attackxp.nss grants 50,000 XP to GetLastHostileActor() and is referenced by nothing. Harmless today but a live grenade if it is ever attached to an event -- delete it, or keep it deliberately?"
        status: open
        kind: admin
  - id: ll-hgll-remove-scripts
    title: "Remove the HGLL leveler scripts"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    hidden: true
    merit_awarded: true
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-07-25"
    commit: d212c3c2b0809a8983140d6b9995d5dd9403b984
    notes: "<div>The old legendary-leveller machinery is gone. Levels 41 to 60 are ordinary levels now — you earn them with experience, wherever you happen to be standing, with no statue to visit and no separate ritual. The statue in the Legendary Levelling Area no longer does anything but say so.</div>"
    impl_notes: "<div>Deleted all 21 unpacked/hgll_*.nss files (incl. the 250 KB hgll_classft_inc and 176 KB hgll_featreq_inc feat tables, hgll_func_inc, hgll_leto_inc, hgll_const_inc, hgll_dlg_leveler, hgll_start_dlg, hgll_struct_stat, hgll_featlist_01–11, and the two gutted login stubs) plus sha_leto_inc.nss — 14,572 lines removed.</div><div>Four live references de-referenced first: the single ExecuteScript(\"hgll_cliententer\") in mod_cliententer.nss and ExecuteScript(\"hgll_client_exit\") in mod_clientexit.nss were dropped; mw_mixtape_con.nss lost its #include \"hgll_leto_inc\" in favour of a local MixtapeRaiseStat() over NWNX_Creature_Get/SetRawAbilityScore plus a direct ExportSingleCharacter() (identical behaviour to the old HGLL_AddStatPoint/HGLL_FlushChanges); and the ZEP_STATUES026 placeable in legendarylevelli.git.json had its OnUsed moved from hgll_start_dlg to the new ll_leveler_gone.nss stub, so the retired statue explains itself instead of pointing at a deleted script.</div><div>hgll_const_inc.nss had no consumer outside the deleted set — no constants needed relocating; code_redeem.nss already sources XP_LEVEL_60 from hak_2da/exptable.2da. The dead Windows Letoscript path const string NWNPATH went with it.</div><div>Also removed tests/check_hgll_transactional.py and its block in tests/smoke-test (closes <a href=\"#idea-ll-hgll-retire-gate\">ll-hgll-retire-gate</a>) — it inspected hgll_client_exit.nss and would have reddened the build. Smoke runner now reports 11/11.</div><div>Verified post-delete: no hgll/sha_leto_inc include, ExecuteScript or GFF script-field reference remains anywhere in unpacked/, tests/, bin/ or nasher.cfg (comments only), and nwn_erf -l on the packed .mod lists zero such resources. Docs synced: README.md, CLAUDE-nwscript.md, QuestGuide-DM-Notes.md.</div><div>Still standing, owned by <a href=\"#idea-ll-hgll-retire-area\">ll-hgll-retire-area</a>: the legendarylevelli area set, its Well of Eru trigger and the legenarea waypoint.</div><div><b>Follow-up 2026-07-27 (commit 10940270ca5):</b> the de-referencing pass missed one consumer — sha_subr_methds.nss:44 (Shayan's Subrace Engine) also includes sha_leto_inc.nss, which was deleted here as a \"near-duplicate\" of hgll_leto_inc. That file is included by default.nss, nw_o0_respawn.nss, nw_s2_turndead.nss, several spell overrides and the _dm_subrace_* wands, so a <b>clean</b> repack failed with 56 compile errors; incremental repacks reused the cached .ncs and hid it for two days. sha_leto_inc.nss is restored verbatim as a documented no-op shim (it was already NWNX:EE-neutered — LetoScript() returns \"\", the LETO_* helpers only build strings for it), so no behaviour changed. Excising it instead would have meant surgery on a 227 KB third-party file. Verified with a full standalone compile of every unpacked/*.nss against the module's 19 haks: 3159 successful, 162 skipped, 0 errored.</div><div><b>Lesson:</b> deleting a shared include needs a clean build, not an incremental one — nasher's cached .ncs will happily pack a module whose sources no longer compile. repack-homers-lotr-clean, or the standalone nwn_script_comp sweep above, is the check.</div>"
    manual_steps:
      - step: "UAT login/logout: log a character in and back out, then reconnect — the character must load normally and keep its inventory, journals and persistent state (the login and logout handlers each lost a call to a now-deleted script)."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT mixtape: consume Akira's Mixtape on a test character and confirm all six ability scores rise by exactly 1 permanently — log out, log back in, and confirm the gain survived (the stat grant was re-implemented without the old leveller include)."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT mixtape anti-farm: drop the Mixtape ring mid-conversation on the Consume node — no stats may be granted."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT retired statue: in Legendary Levelling Area (legendarylevelli), use the statue and confirm it prints the message that levels 41-60 now come from experience, with no error in the server log about a missing script."
        status: open
        kind: uat
        step_h: 64
      - step: "Rebuild and redeploy the module to the live server (repack-homers-lotr wrapper) and restart, so the deleted scripts leave the running module — the autopilot build only produced dist/ and the OneDrive copy."
        status: open
        kind: publish
        step_h: 64
  - id: ll-hgll-split-cliententer
