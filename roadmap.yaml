    date: "2026-06-22"
    commit: f5e3f11072c
    notes: "<div><span>Also confirmed impact is from the Mirkwood Spiders, specifically:</span></div><ul><li><span>Lava Climber</span></li><li><span>Death Weeper</span></li><li><span>Black Spear Spider</span></li></ul>"
  - id: improved-invis-issues-part2
    title: "Issues with improved invisibility after buff duration exentsion (and exclusion)"
    group: qol
    status: awarded
    type: Defect
    player: "Y a z k i r"
    date: "2026-07-08"
    commit: 58deb72400b
    notes: "When casting imp invis, it now looks like 50% conceal isn't being applied (but you get the effect of it from combat log) And the invis icon stays up no matter what but it doesn’t actually stay once you do damage (but you are still attacked by mobs, so you're not really invis)<div><br></div><div><b>Root cause found 2026-07-08:</b> the invisibility exclusion added by the earlier fix (f9565ed4202) only inspected the <i>first</i> true-effect entry sharing the applied effect's UNIQUE_ID. Improved Invisibility is applied as a <i>linked</i> effect (EffectInvisibility + a duration visual) whose components share a single engine effect id, so the loop could land on the non-excluded linked visual, skip the guard, RemoveEffectById the <i>whole</i> link, and reapply only one component — splitting the link exactly as the exclusion was meant to prevent. That matches the report: the visual icon stayed up at doubled duration while the real improved-invisibility+concealment effect was stripped (not really invis, 50% conceal gone, still attacked by mobs).</div><div><br></div><div><b>Fix:</b> exclude the whole invisibility/illusion family by SPELL_ID before the re-timing loop — Improved Invisibility (88), Invisibility (90), Invisibility Sphere (92), Sanctuary (154), Ethereal Visage (121), Etherealness (443) — the same robust approach that fixed Divine Might/Shield, and one that also covers item-cast sources (potions/wands/scrolls). Additionally hardened the effect-type guard to scan <i>every</i> component sharing the id (a guard pass before the apply pass), so script-applied invisibility with no spell id can't regress the same way. Documented in docs.manual/Customizations.html#spell-duration.</div>"
  - id: duration-divine-might-issue
    title: "divine might duration bug"
    group: qol
    status: awarded
    type: Defect
    player: "dc0960 (Dungeon_Crawler)"
    date: "2026-07-02"
    commit: ec0cfda3527
    notes: "<div>I think divine might has a bug related to the double duration update, but instead of the dmg getting the duration it still lasts normal time but you can't re buff it till double the time</div><div><br></div><div><b>Root cause found 2026-07-02:</b> the module's server-wide \"buffs last twice as long\" feature (eff_dur_x2.nss, live since 2026-06-19 -- one day before this report) re-times every PC-created effect by removing it and re-applying a copy with double the duration. That same day, a follow-up fix already excluded invisibility/concealment/sanctuary/ethereal because remove+reapply splits <i>linked</i> effects (EffectLinkEffects) and corrupts their engine-dependent behavior. Divine Might (feat 413 / spell 473) and Divine Shield (feat 414 / spell 474) build their buffs the same linked way (confirmed by disassembling the vanilla x0_s2_divmight/x0_s2_divshield scripts) but weren't in that exclusion list -- so the same link-splitting bug hit them, matching the report exactly: the mechanical buff can revert to its natural duration once the link splits, while whatever GetHasFeatEffect() reads to block re-casting keeps running for the full doubled duration.</div><div><br></div><div><b>Fix:</b> excluded spell IDs 473 (Divine Might) and 474 (Divine Shield) from the duration-doubling in eff_dur_x2.nss, same treatment as the invisibility family. Documented the exception in docs.manual/Customizations.html#spell-duration alongside the existing invis exception.</div>"
  - id: wiki-missing-creature-numarockblackhand
    title: "Wiki Missing creature: Numanan Numerocks Second Hand (CARN DUM)"
    group: wiki-tools
    status: awarded
    type: Defect
    player: "Y a z k i r"
    date: "2026-06-23"
    notes: "<div>\"That spawn point is wacky, sometimes I see Numarok the black hand, and other times this guy. And Numarok the Black Hand has his own room to the left of the building, opposite way of the temple\"</div><div><br></div><div>FIX1: the wiki generator deduped creatures by combat identity only, so one blueprint (cultmember002) placed under different FirstName overrides collapsed to a single page. nwn-wiki now folds the placement's display name into the canonical-creature key, giving each renamed placement its own page (general fix — covered ~17 reused blueprints, e.g. Old Tagget, Sarah the Librarian).</div><div><br></div><div>Fix2: (root cause of the 'sometimes Numarok' part): the respawn system (se_respawn_inc via nw_c2_default7 OnDeath) re-creates a dead creature from its BLUEPRINT, keeping only the tag — so every placement-level override (name, faction/hostility, abilities, classes, feats, special abilities, equipment, natural AC, race, conversation) was lost on the first death. bin/split-divergent-creatures.py gives each diverging placement its own baked blueprint (123 new blueprints, ~245 placements across 60 areas) so respawn reproduces exactly what was placed; tags untouched so no quest/script lookups change. Added tests/check_divergent_creatures.py to the build smoke-test so it can't regress, plus TESTING-respawn-overrides.md for player validation.</div>"
