    notes: "<div>Withdrawn for redesign. The class quest lines went out as one large batch and lean on each other too heavily — each line is being reworked individually, with its rewards retuned, before any of it returns.</div>"
    notes_h: 149
    impl_notes: "<div>Journal category rog_shadow (@group 'Class Lines' @order 2). Giver q_rog_fenn, plot/immortal hooded rogue; offer gated on GetLevelByClass(CLASS_TYPE_ROGUE) &gt;= 1 (value 8 verified), non-rogues get a flavour line. Cloned structurally from fighter-line-early.</div><div><br></div><div>Three level-gated one-off nodes; per-character state in the roguelinedb campaign DB (key shadow_stage 0-&gt;3, advance-only). Reward properties use verified stock encodings (Use-Limitation:Class subtype 8 = Rogue).</div><div><br></div><div>Prancing Pony OnEnter wrapped q_rog_enter (chains the existing q_ftr_enter -&gt; q_hrp_ent1, preserving leash + Harper contact + Hallas's spawn) -&gt; q_rog_spawn; conversation q_rog_conv, reply-link Actives left blank, avoiding the fighter-line bug fixed in the same session. Build passed all gates. Capstone (Shelob / Cirith Ungol / dual-swords finale) deliberately deferred to rogue-line-mid/later.</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>implemented</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Long Shadow</b> — the first three chapters (L1, L8, L15) of the Rogue class line. Fenn the Shade runs a net of Bree-land watchers out of the Prancing Pony and swears in only those who know how to go unseen: the <b>Shadowmantle</b> at L1, a cipher-token at L8, and <b>Nightthorn</b> at L15. Details: <a href=\"QuestGuide.html#long-shadow\">Quest Guide → The Long Shadow</a>.</div><div><br></div><div>UAT: Fenn also spawns in naked and looks identical to the Shield Warden from fighter quest line also in bree tavern..</div><div>UAT: Dialogue when