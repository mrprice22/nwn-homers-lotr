  - id: legendary-caster-spells-on-level-up
    title: "casters not getting spells after level 40"
    group: combat-classes
    epic: legendary-levels
    status: confirmed
    type: Defect
    player: Szescian82
    date: "2026-07-29"
    notes: "<div>Past level 40 the level-up screen still asks a wizard to choose 2 new spells, but there is nothing to choose from: only the cantrip tab has anything in it, and cantrips have been fully learned since about level 5. Sorcerers and bards cannot re-pick their repertoire either. Continuing past the screen silently spends the picks, so they are lost.</div><div><br></div><div>This is a limit in the <b>game client</b> rather than in the server's rules tables, which is why it does not follow from the spell-slot fix that shipped alongside it (tracked separately as <b>casters gain no new spell slots past level 40</b>). Every avenue for repairing the game's own level-up screen has now been tried and none of it works — it needs a fix from the game's developers.</div><div><br></div><div><b>So we are building our own spell-choice window instead</b>, and it will open right after you finish levelling up, so choosing spells stays part of gaining a level. Planned: <b>wizards</b> choose their two new spells per level as normal; <b>sorcerers and bards</b> can swap a known spell for a better one when they level, exactly as the rules always allowed; and as a bonus, <b>sorcerers taking a prestige class that advances arcane casting</b> will finally be able to choose spells for it — something stock Neverwinter Nights never let you do, at any level.</div><div><br></div><div><b>Nothing you have earned will be forgotten.</b> Whatever form the fix takes, it will make up the picks your caster missed while levelling past 40, so there is no reason to hold off levelling in the meantime.</div><div><br></div><div><b>2026-08-05 -- wizards can choose their spells again.</b> A <b>Spellbook Study</b> window now opens a few seconds after you finish levelling, listing every arcane spell you do not yet know -- pick a spell level along the top and click Learn. You get the same two spells per level the level-up screen was quietly eating, and <b>nothing you already earned is lost</b>: the first time you log in you are paid for every wizard level you gained past 40 while it was broken (a wizard 53 is owed 26 spells), once and once only. Close the window and your picks stay banked -- finish a rest to reopen it, and a login message tells you how many are waiting. Specialist opposition schools, castable spell levels and spells you already know are all respected, and scroll-scribing is unaffected. <b>Sorcerers and bards are next</b>: their repertoire swap is the following piece of this work, and nothing is going missing for them in the meantime. See <a href=\"Customizations.html#spellbook-study\">Customizations -&gt; Spellbook Study</a>.</div>"
    impl_notes: "<div><b>Symptom, measured 2026-07-29 (UAT, fresh wizard, levels 1-40 normal).</b></div><ul><li>At level 41 the spell-selection panel appears and asks for the usual 2 picks, but <b>only the cantrip (spell level 0) tab is populated — every other spell-level tab is empty</b>, with stock engine string <b>strref 10278</b> \"There are no more spells available at this level\" (that is the <i>spell</i>-level tab, not character level). A level-41 wizard has known all <b>7</b> stock cantrips since ~level 5, hence an empty list.</li><li>Levels 1-40 behave normally on the same character, so the fault is exactly at the 40 boundary.</li><li>The level-up <b>completes without spending the picks</b> (OK → familiar page → summary), so they are silently lost. Any fix needs a <b>retroactive make-good</b>, not just a forward grant.</li></ul><div>So the client resolves max castable spell level as <b>0</b> at class level 41, <i>with correct data present</i>. This is MaxLevel's documented \"Spellcasters may not change spells when levelling up\"; the live upstream doc (still 8193.37.17) attributes it to the client and offers no fix.</div><div><br></div><div><b>Ruled out — do not re-investigate:</b></div><ul><li><b>Stale client data.</b> nwsync was refreshed at 20:03 after the 19:42 hak install; latest manifest d3f09ca35 contains cls_spgn_wiz, cls_spgn_sorc, exptable, classes, ruleset. The reporting client (a separate Windows PC) had correct rules.</li><li><b>cls_spgn data.</b> Row 40 reads 4 at all ten spell levels, and no row in the table is cantrips-only, so the client is not reading any valid row.</li><li><b>classes.2da Wizard row.</b> Nothing bounds it: MaxLevel 0, EpicLevel -1, MinCastingLevel 1, SkipSpellSelection 0, SpellKnownTable ****. The 2-picks-per-level count is engine-side and ruleset.2da does not expose it.</li><li><b>NWNX_Tweaks.</b> Full option list read out of NWNX_Tweaks.so in the running container — nothing touching level-up, spell selection or known spells.</li><li><b>Server-side lever.</b> nwnx_player has no GUI-panel opener beyond inventory/examine/character-sheet, and NWNX_ON_CLIENT_LEVEL_UP_BEGIN_BEFORE/_AFTER carries no event data.</li></ul><div><br></div><div><b>Diagnostic in the module now:</b> sk_probe_inc/pre/post.nss snapshot GetKnownSpellCount() on NWNX_ON_LEVEL_UP_BEFORE, diff on _AFTER, and report the delta to admins plus the log (Wizard/Sorcerer/Bard only — the three SpellbookRestricted classes). Deployed by the 21:04 repack; note it produced nothing in the first UAT because only the hak had been published and scripts need a <b>.mod repack</b>. Delete all three plus the two subscriptions in onmoduleload.nss once the fix lands.</div><div><br></div><div><b>Remaining native leads, in order (all cheap, all reversible).</b> Admin has ruled out scrolls/items outside the level-up screen as too janky, so these are tried before any substitute UI: (A) does the cap key on <i>class</i> level or <i>character</i> level — take one level in a fresh caster class at character level 41; if that is also empty, every multiclass caster is affected too and the blast radius is far larger. (B) pack cls_spkn_sorc/bard.2da — the last untried data lever, and the one upstream declared \"not worth changing\" without testing; if a table-driven class enumerates past 40 the client can do this. (C) only if B works: give Wizard a cls_spkn_wiz table with values far above any real cap (99) and point classes.2da SpellKnownTable at it, to route wizards through the working path — risky, because no stock class pairs MemorizesSpells 1 with a known table, so chargen and levels 1-40 must be re-verified before calling it a success. (D) classes.2da Wizard MaxLevel 0 -&gt; 60, one cell, thin rationale but near-zero cost. If B/C/D all fail the native page is dead and the choice (NUI picker / accept it and sell the power through Legendary Feats / park until upstream fixes the client) goes back to admin.</div><div><br></div><div>Reference for whatever ships: 179 wizard-learnable spells in stock spells.2da (L0:7 L1:22 L2:28 L3:23 L4:21 L5:18 L6:20 L7:13 L8:13 L9:14); no hak in the NWN home overrides spells.2da.</div><div><br></div><div><b>TEST RESULTS 2026-07-29 — the native level-up page is dead, and we now know why.</b></div><ul><li><b>Test A: PASS, and it bounds the blast radius.</b> Taking one level in a <i>fresh</i> caster class (sorcerer 1) on a character at level 41 works normally — expected spells offered. So the cap keys on <b>class level &gt; 40, not character level &gt; 40</b>. Multiclass casters are unaffected; only a character with 40+ levels in a single casting class hits this.</li><li><b>Test B: FAIL.</b> With cls_spkn_sorc.2da + cls_spkn_bard.2da packed and published (manifest 3705b2d03f2, verified to carry them), a <b>sorcerer</b> past class level 40 shows the identical failure — cantrips only, every other spell-level tab greyed. A genuinely table-driven class does not help, so no data lever reaches this. Both tables were removed from RULES_2DA and deleted.</li><li><b>Test C: MOOT, never run.</b> B was its precondition — giving Wizard a cls_spkn_wiz table to route it through the \"working\" path is pointless now that the table-driven path is proven broken too. Saved a risky change and a publish cycle.</li><li><b>Test D: FAIL.</b> classes.2da Wizard MaxLevel 0 -&gt; 60 changed nothing. Reverted (classes.2da is byte-identical to its pre-test state).</li></ul><div><b>The decisive observation (admin, unprompted): the spell-level tabs render ENABLED for roughly one frame, then are hidden/greyed.</b> That is the whole diagnosis. The client computes the correct tab set from the 2DA data on its first pass — so the data was never the problem, which is consistent with Tests B and D failing — and then a <i>later</i> pass in client code disables them. Nothing in a 2DA, a hak, a plugin option or a server script can intercept a client-side disable pass. <b>This is closed as unfixable from this repo</b> pending a client build.</div><div><br></div><div><b>Not tracked upstream.</b> Beamdog/nwn-issues has no report of it, and the NWNX MaxLevel doc (still 8193.37.17) lists it as a known issue with no workaround. Worth reporting upstream so a client fix is at least possible; a help request has been drafted for the nwnxee channel on the NWVault Discord.</div><div><br></div><div><b>DECIDED 2026-07-29 — build a custom NUI spell picker that pops up immediately after level up.</b> The native page is unreachable, so this is the closest thing to it: the window fires as part of finishing a level rather than sending the player off to an NPC, a scroll or an item, which is what admin objected to. Server-side, so it is immune to the client bug and works at any class level.</div><div><br></div><div><b>Scope — three jobs, one window:</b></div><ul><li><b>Wizards past class level 40:</b> pick 2 new spells per level, the stock entitlement the client eats.</li><li><b>Sorcerers/bards past class level 40:</b> re-pick (swap) known spells, which restores a stock rule rather than inventing one — dialog.tlk 64332: \"Sorcerers and bards may unlearn spells when gaining a level to get rid of a disliked spell in favor of a better one.\" This also retires the \"repertoire locks at 40\" wording now on Customizations.html.</li><li><b>BONUS, and it is not level-41+ specific: sorcerers re-picking when a prestige class advances arcane spellcasting.</b> That gap exists at <i>all</i> levels in stock NWN and has nothing to do with the level cap — other servers solved it with nwnx_patch, which we do not have. A server-side picker fixes it for free. Note NWNX_Tweaks ADD_PRESTIGECLASS_CASTER_LEVELS is deliberately OFF (see ll-nwnx-tweaks-audit: it also changes 1-40 balance), so decide whether this bonus is scoped to PrCs that already advance casting or is paired with flipping that option.</li></ul><div><b>Everything it needs already exists:</b> trigger from the NWNX_ON_LEVEL_UP_AFTER subscription already in onmoduleload.nss (chain, do not add a third subscriber); grant/remove with NWNX_Creature_AddKnownSpell / RemoveKnownSpell (nwnx_creature.nss:240/247); build the candidate list from spells.2da's per-class column keyed by classes.2da SpellTableColumn (Wiz_Sorc / Bard) with Name strref through GetStringByStrRef; filter what is known with the stock builtins GetKnownSpellCount / GetKnownSpellId / GetIsInKnownSpellList. NUI precedent is the party loot roll (buttons emit \"click\", sEventScript dispatch, nw_inc_nui via resman, 16-char resref limit, no &amp;-ref params). Counts: 179 wizard-learnable spells (L0:7 L1:22 L2:28 L3:23 L4:21 L5:18 L6:20 L7:13 L8:13 L9:14).</div><div><br></div><div><b>Guardrails:</b> respect specialist opposition schools (dialog.tlk 64459), never offer a spell above the caster's castable spell level, never allow the same spell twice (GetIsInKnownSpellList), and enforce the budget server-side rather than trusting the window. Bank the entitlement per character in a campaign DB keyed by GetObjectUUID() (bestiarydb pattern) so closing the window does not burn the picks — and <b>seed it from current level on first login</b>, which subsumes the retroactive make-good (picwizardrix's 26 picks) with no separate mechanism. Known spells live in the .bic, so verify they survive a relog.</div><div><br></div><div><b>SLICE 1 SHIPPED 2026-08-05 (commit 07374d5c569) -- wizard case + retroactive make-good. Sorcerer/bard swap and the prestige-class case remain, and are deliberately INERT (not half-wired):</b> CSP_PicksPerLevel returns 0 for every class but wizard and CSP_PickerClass returns CLASS_TYPE_INVALID, so for a sorcerer or bard no entitlement is banked, no window ever opens, and nothing can be spent or lost.</div><div><b>Files:</b> csp_db.nss (campaign DB cspelldb; csp_alloc(pid,class,paid_to,granted) + csp_learn(pid,class,spell), spent = COUNT of the latter, INSERT OR IGNORE so a double click cannot charge twice; CSP_SetAlloc takes MAX() on paid_to and granted so the mark can never regress), csp_inc.nss (entitlement, legality, the single grant path), csp_nui.nss / csp_evt.nss / csp_open.nss (window, per-spell-level tabs, event dispatch on 'click'), csp_lvl.nss (NWNX_ON_LEVEL_UP_AFTER, opening at 4.0 s so it does not stack on the legendary-feats window's 2.0 s at level 60; LEVEL_DOWN deliberately not subscribed -- banked picks are not revoked and cannot be re-earned).</div><div><b>Anti-farm:</b> the paid_to high-water mark IS the mechanism -- the retroactive payment is the same code path as an ordinary level, not a separate one. A never-seen character seeds at 40 and is paid for every level past it in one go, then paid_to is that level forever, so de-level/re-level pays nothing. CSP_Learn re-derives the entitlement server-side rather than trusting the window, re-checks already-known before charging, and charges <b>before</b> the engine write, so a failed NWNX_Creature_AddKnownSpell costs a pick with a loud message rather than granting a free spell.</div><div><b>Legality:</b> spells.2da filter Master blank + Wiz_Sorc set (reproduces the documented 179 rows exactly, L0:7 ... L9:14); the castable-level check is arithmetic (class level &gt;= 2L-1, INT &gt;= 10+L) rather than 2DA-derived; specialist opposition is read from spellschools.2da Opposition/Letter via GetSpecialization, not hard-coded; GetIsInKnownSpellList blocks duplicates; names and descriptions via GetStringByStrRef off the Name/SpellDesc strrefs.</div><div><b>Wiring:</b> subscription in onmoduleload.nss; login nudge CSPLoginCheck in mod_cliententer.nss at 8.5 s (after the UUID is forced -- the ledger is keyed on GetObjectUUID); rest re-entry in on_mod_rest.nss at 4.0 s. Also cleared the sk_probe_* cleanup step (3 scripts + 2 subscriptions deleted). Docs: Customizations.html -- the 'known limitation' warning box replaced with a new #spellbook-study section, and the wizards-use-scrolls / sorcerer-bard 'locked at 40' wording rewritten to what is true today. Build green: 20/20 smoke tests, 0 compile errors.</div><div><b>Remaining work (next iteration):</b> (3) sorcerer/bard repertoire swap -- needs a second UI mode (forget-then-replace); the swap budget needs no new decision, it is already stated in this item's manual_steps (sorcerer 1/level, bard 1 per 2 levels). (4) the prestige-class arcane-advancement bonus, still gated on this item's existing open design question about scoping to PrCs that already advance arcane casting versus flipping ADD_PRESTIGECLASS_CASTER_LEVELS.</div>"
    design_questions:
      - question: "Sorcerers and bards gain slots but reportedly cannot pick NEW spells known past 40 (upstream says no client UI). Ship slots only, or build a scripted picker?"
        status: answered
        answer: "Not sure what you mean by (no client UI) -- there is an existing UI for bards and sorcerers to re-pick their spells on level up for normal 1-40 levels. If we can't reuse that then fine, slots only. [Follow-up 1: wizards are affected too. Resolution: measure the native GUI before building anything. Follow-up 2, after the UAT: using scrolls or items outside the level-up screen feels janky -- keep digging on making the native level-up screen itself work. Hence tests A-D above.]"
    manual_steps:
      - step: "REPACK the .mod so sk_probe_*.nss actually runs. Publishing the hak alone does NOT deploy scripts; this was missed the first time and is why the first UAT produced no probe output. DONE 2026-07-29 21:04 (13/13 smoke, dialog integrity clean, both subscriptions verified present in the compiled onmoduleload.ncs)."
        status: done
        kind: publish
      - step: "DIAGNOSTIC (native GUI): DONE 2026-07-29 — at level 41 only the cantrip tab is populated, every other spell-level tab empty, strref 10278; levels 1-40 fine; level-up completes with the picks unspent."
        status: done
        kind: admin
      - step: "TEST A: DONE 2026-07-29 — PASS. A fresh caster class (sorcerer 1) taken at character level 41 offers spells normally, so the cap keys on CLASS level > 40, not character level. Multiclass casters are unaffected; only 40+ levels in one casting class hits this."
        status: done
        kind: uat
      - step: "TEST B: DONE 2026-07-29 — FAIL. With both cls_spkn tables packed and published (manifest 3705b2d03f2), a sorcerer past class level 40 shows the identical cantrips-only failure. No data lever reaches this. Tables removed from RULES_2DA and deleted."
        status: done
        kind: uat
      - step: "TEST C: MOOT, never run — B was its precondition and B failed, so routing Wizard through a known-spells table cannot help. Deliberately skipped to avoid a risky change and a publish cycle."
        status: done
        kind: uat
      - step: "TEST D: DONE 2026-07-29 — FAIL. classes.2da Wizard MaxLevel 0 -> 60 changed nothing; reverted, and classes.2da is byte-identical to its pre-test state."
        status: done
        kind: uat
      - step: "ROOT CAUSE FOUND (admin observation): the spell-level tabs render ENABLED for ~1 frame, then are hidden/greyed. The client computes the correct tab set from the 2DA data, then a LATER client-code pass disables it — which is why no 2DA, hak, plugin option or server script can fix it, and why B and D failed. Closed as unfixable from this repo pending a client build."
        status: done
        kind: publish
      - step: "RETROACTIVE make-good — SCOPED 2026-07-29, far smaller than first feared. The picks are not recoverable natively: nothing stores an 'owed picks' count (ComputeNumberKnownSpellsLeft is derived, and is exposed neither to NWScript nor NWNX), and a past level-up cannot be reopened. But the affected population is tiny: season 1 runs NWNX_MAXLEVEL_SKIP=y so it is capped at 40 and NONE of its 181 characters can be affected; only the season 2 test vault can. Audited all 17 season 2 .bic files — exactly ONE character is actually owed anything: picwizardrix (Wizard 53) has lost 2 x 13 = 26 picks. norisallennall (Sorcerer 44) is owed nothing under the shipped 'repertoire locks at 40' rule, and merinetaswift (Wizard 40) is at the boundary with nothing lost. Everyone else at level 60 is multiclass with no single class at 40+. So this needs a one-off top-up for one test character, not a system: if wizard scroll-scribing works past 40 (unverified, see the blocker above) hand that character 26 scrolls or the gold for them and the ledger is square."
        status: open
        kind: admin
      - step: "CLEANUP once the fix lands: delete unpacked/sk_probe_inc.nss, sk_probe_pre.nss, sk_probe_post.nss and the two NWNX_ON_LEVEL_UP_* subscriptions for them in onmoduleload.nss. The cls_spkn tables are already deleted."
        status: open
        kind: admin
      - step: "STOPPING RULE REACHED, DECISION MADE 2026-07-29: build a custom NUI spell picker that pops up immediately after level up (option a). Chosen because it fires as part of finishing a level rather than sending the player to an NPC, scroll or item, and because being server-side it also fixes the stock prestige-class arcane re-pick gap at every level."
        status: done
        kind: admin
      - step: "BUILD the post-level-up NUI spell picker. Three jobs in one window: wizards pick 2 new spells per level past class level 40; sorcerers/bards re-pick known spells past 40 (restoring the stock rule in dialog.tlk 64332); and sorcerers re-pick when a prestige class advances arcane spellcasting (a stock gap at ALL levels, unrelated to the cap). Design, reusable pieces and guardrails are in impl_notes. Budget: wizard 2/level, sorcerer 1/level, bard 1 per 2 levels."
        status: open
        kind: admin
        blocker: true
      - step: "DESIGN QUESTION to settle before building the bonus: scope the prestige-class re-pick to PrCs that ALREADY advance arcane casting, or pair it with flipping NWNX_Tweaks ADD_PRESTIGECLASS_CASTER_LEVELS (currently off on purpose — it also changes 1-40 balance, see ll-nwnx-tweaks-audit)?"
        status: open
        kind: admin
      - step: "WIKI follow-up when the picker ships: Customizations.html currently tells sorcerers/bards their repertoire is locked in at 40 and to pick deliberately. That becomes wrong the moment the picker lands — rewrite that bullet and the wizards-use-scrolls bullet at the same time."
        status: open
        kind: admin
      - step: "VERIFY THE WIZARD SCROLL CLAIM before players rely on it. Customizations.html now tells wizards to keep learning from scrolls past 40, but scroll-scribing above class level 40 has NOT been tested here. It is a different code path from the level-up panel so it probably works, but if it refuses with dialog.tlk 64457 'You have not achieved the required level to learn that spell' then wizards have no route at all and that wiki paragraph must be corrected. One arcane scroll the character does not know is the whole test."
        status: open
        kind: uat
        blocker: true
      - step: "REPORT UPSTREAM: not tracked at Beamdog/nwn-issues and listed as a known issue with no workaround in the NWNX MaxLevel doc. A help request for the nwnxee channel on the NWVault Discord has been drafted; file a Beamdog issue too if nobody there has a workaround, since only a client fix can restore the native page."
        status: open
        kind: admin
      - step: "UAT: log in a wizard already past class level 40 (picwizardrix, Wizard 53) and confirm the login message offers exactly 26 spells -- (class level - 40) x 2."
        status: open
        kind: uat
      - step: "UAT pays once: after spending or closing the Spellbook Study window, log out and back in -- the offer must be only what is unspent, never a fresh 26. Then level once more and confirm exactly 2 more are added."
        status: open
        kind: uat
      - step: "UAT non-farmable: drop a wizard below class level 41 and level back up -- the climb must grant no picks at all."
        status: open
        kind: uat
      - step: "UAT: level a wizard past 40 and confirm the Spellbook Study window opens on its own a few seconds after the level-up completes."
        status: open
        kind: uat
      - step: "UAT: learn a spell, then relog and confirm it is still in the spellbook (known spells live in the .bic)."
        status: open
        kind: uat
      - step: "UAT: close the window without picking, then Force Rest -- it must reopen with the picks intact."
        status: open
        kind: uat
      - step: "UAT specialist: on a specialist wizard, confirm the opposition school is absent from every spell-level list."
        status: open
        kind: uat
      - step: "UAT: confirm a spell already known is never listed, and that scribing from a scroll still works and consumes none of these picks."
        status: open
        kind: uat
      - step: "UAT inert cases: a sorcerer or bard past class level 40 must get NO window, no login message and no lost picks -- nothing may be silently spent while their half is unbuilt."
        status: open
        kind: uat
      - step: "UAT no collision: a pure wizard reaching level 60 gets the Legendary Feats window and then the Spellbook Study window, one after the other, both usable."
        status: open
        kind: uat
  - id: rancid-skinner-bark-still-not-working
    title: "Rancid Skinner is still shouting 'Helms Deep is under attack' on death"
    group: quests-areas
    status: manual
    type: Defect
    player: Szescian82
    date: "2026-08-05"
    commit: fae1fa45387a84dd563931c1d9e53c3a89d160d6
    notes: "<div>original idea: rancid-skinner-bark, did not resolve issue</div><div><br></div><div>maybe blueprint was updated but not the instance?</div><div><br></div><div><b>Fixed 2026-08-05 -- and the reporter's hunch was exactly right.</b> The earlier fix updated the Rancid Skinner's template but not the copy actually standing in Dol Guldur, which kept its own old death script, so nothing changed in game. The placed boss now runs the correct script and shouts <i>\"Dol Guldur is under attack! Rally Servants of Sauron to Dol Guldur!\"</i> As a bonus this also restores his 15-minute respawn: the old script skipped the respawn call, so once killed he stayed dead until the next reboot.</div>"
    impl_notes: "<div><b>Root cause:</b> the Rancid Skinner is a single placed static creature in unpacked/dolguldurcast001.git.json (Dol Guldur: Tower Of Black Magic Depths, TemplateResRef creature023_2, tag Skinner), and <b>that instance carried its own ScriptDeath value of eowyndeathalert</b>. eowyndeathalert.nss:45 is the offending bark -- SpeakString(\"Helm's Deep is under attack, rally Free People of Middle Earth to Helm's Deep!\", TALKVOLUME_SHOUT) -- reached because the Skinner is evil-aligned and its tag is not in that script's exempt list. The July fix (ebc4a27abcd / a379f902c8e) changed <b>only the blueprint</b> creature023_2.utc.json from eowyndeathalert to skinnerdeath. For a creature already placed in a .git the engine uses the instance's own event fields and never consults the blueprint, so the old script kept firing and the fix appeared to do nothing.</div><div><b>Why no gate caught it:</b> tests/check_divergent_creatures.py compares name, faction, conversation, combat stats, equipment, inventory and droppability -- <b>not event scripts</b>. Worth extending it to cover the Script* fields as a follow-up so this class of divergence fails the repack.</div><div><b>Fix:</b> repointed the instance's ScriptDeath to skinnerdeath so it matches its blueprint, and repointed the unplaced duplicate blueprint creature023.utc.json (an older copy of the same Rancid Skinner, and almost certainly where the instance override came from) so the trap cannot be re-placed. Those two were the only references to eowyndeathalert in the whole tree, so no other creature loses its death handler; the script is left in the tree, now unreferenced.</div><div><b>Bonus bug fixed:</b> skinnerdeath ends with SE_DoCreatureRespawn() and eowyndeathalert does not -- so the Skinner, registered in brd_db.nss:123 with a 900 s respawn for the Roll of the Fallen board, was <b>never respawning after its first kill per reboot</b>. That is now live.</div><div>Build: bare nwn-manager repack, 20/20 smoke tests, 1 script compiled, packed clean.</div>"
    manual_steps:
      - step: "This is a .git (placed instance) change, so it only takes effect on a fresh module load -- deploy and restart before testing."
        status: open
        kind: admin
        blocker: true
      - step: "UAT: travel to Dol Guldur: Tower Of Black Magic Depths (dolguldurcast001), kill The Rancid Skinner, and confirm the server-wide shout reads 'Dol Guldur is under attack! Rally Servants of Sauron to Dol Guldur!' and NOT the Helm's Deep line."
        status: open
        kind: uat
      - step: "UAT: confirm the kill announcement ('The Rancid Skinner was killed by ... in Dol Guldur ...') still broadcasts."
        status: open
        kind: uat
      - step: "UAT respawn regression: wait about 15 minutes in or near the area and confirm the Skinner respawns, and that the Roll of the Fallen board in the Well of Eru shows his countdown correctly."
        status: open
        kind: uat
  - id: shayan-subrace-revivial
    title: "Expore Shayan's Subrace Engine"
    group: combat-classes
    status: design
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-05"
    notes: "<div> sha_subr_methds.nss: Shayan's Subrace Engine is already present in the source code, but is not documented or exposed to the players</div><div><br></div><div>Is this system already wired up fully and ready to use?</div><div>need a subraces journal entry and info in docs.manual/cusotmizations</div><div><br></div><div><b>2026-08-05:</b> we audited the dormant subrace system that has been riding along in the module's code, and it is not connected to anything -- no character can take a subrace today, and nothing would happen if one tried. Whether Middle-earth subraces (Dunedain, Wood-elf, Dwarf of Erebor and the like) become a real feature, and what each one grants, is now a design decision on the table.</div>"
    impl_notes: "sha_leto_inc.nss was collateral damage from the HGLL purge (d212c3c2b08). That commit de-referenced every hgll_* consumer, but sha_leto_inc had a second consumer nobody checked: sha_subr_methds.nss:44, Shayan's Subrace Engine. That 227\n  KB file is included by default.nss, nw_o0_respawn.nss, nw_s2_turndead.nss, several spell overrides and the _dm_subrace_* wands — hence 56 errors from one missing file. Every repack since was incremental, so nasher reused cached .ncs and\n  packed a module whose sources no longer compiled.\n\n  Fix: restored the file verbatim. It was already an NWNX:EE no-op shim — LetoScript() returns \"\" and the LETO_* helpers only build strings to hand to it — so nothing about runtime behaviour changes; the subrace engine's Leto path has\n  been inert since the EE port regardless. I added a header recording that it's a shim, that it now belongs to the subrace engine alone, why it came back rather than being excised<div><br></div><div><b>Wiring audit 2026-08-05 (no code changes, no commit):</b> Shayan's Subrace Engine v2.5 is present but inert. <b>Root cause:</b> sha_on_modload.nss registers every subrace as module local vars (oStorer = GetModule(), sha_subr_methds.nss:49) and is executed by nothing -- Mod_OnModLoad is onmoduleload, which has no sha_* include or ExecuteScript. CheckIfPCMeetsAnySubraceCriteria therefore always falls through to SetSubRace(oPC, empty) at sha_subr_methds.nss:2133, so every subrace string is rejected 100% of the time. <b>Six of seven hooks unwired:</b> Mod_OnClientEntr=mod_cliententer, Mod_OnClientLeav=mod_clientexit, Mod_OnPlrLvlUp=mod_level, Mod_OnSpawnBtnDn=mod_respawn (so nw_o0_respawn.nss:97's call is dead), Mod_OnPlrEqItm is empty (so x2_mod_def_equ.nss:19 never fires), Mod_OnActvtItem=dmfi_activate (does not call x2_mod_def_act.nss:21). Only default.nss -&gt; SubraceHeartbeat runs, and it early-returns at sha_subr_methds.nss:5104 without SUBRACE_INFO_LOADED_ON_PC -- a permanently idle per-PC-per-round call. <b>Selection surface</b> is the character-creation Subrace text field (GetSubRace) only; dm_subrace_wand has zero acquisition sources, dmsubracehelper.utc is unplaced with an empty Conversation field, _subrace_book is unobtainable. <b>Leto path:</b> ENABLE_LETO=TRUE (sha_subr_consts.nss:26) routes to sha_leto_sraces1/2, whose stat/feat/skill/wing grants all go through LetoScript() in sha_leto_inc.nss:39, which returns empty under EE -- so only hide and unique-item grants could ever work. The ENABLE_LETO=FALSE branch calls sha_subraces1/sha_subraces2, which do not exist in unpacked/ (silent ExecuteScript failure). <b>Latent bugs:</b> sha_leto_sraces2.nss:532 references hide sha_pc_vamp001 but the blueprint is sha_pcl_vamp001; sha_leto_sraces1.nss:659 passes svirfneblin's ECL into the underground-damage arg slot; sha_subrace_dgno.uti is orphaned; sha_xpsystem.nss (the ECL XP penalty, 684 lines) is included by nothing so ECL is never charged; sha_subr_consts.nss still holds NWNX2-era NWNPATH / LETO_PORTAL_IP_ADDRESS and MAXIMUM_PLAYER_LEVEL=40 (this module goes past 40). Both core sha_subr_*.nss files contain non-ASCII colour-code bytes and are exempt from check_ascii_nss -- edit with care. <b>Roster:</b> 28 subraces defined across sha_leto_sraces1/2, all Forgotten Realms (illithid, pixie, genasi, tiefling, drow, lich, vampire...); only elf-wood and elf-wild are even loosely LOTR-compatible. <b>Bottom line:</b> turning this on is a feature build with a roster/balance decision at the front, not a documentation task -- hence the design questions below.</div>"
    impl_notes_h: 162
    design_questions:
      - question: "Do we revive the subrace system at all, or delete it? Proposed: revive, but as a small hand-built Middle-earth roster rather than by switching on Shayan's stock content -- the engine's registration/hide/unique-item plumbing is sound and reusable, but its 28 Forgotten Realms subraces are wrong for a Tolkien server and would have to be deleted anyway. Alternative if you would rather not spend the effort: delete sha_*, _dm_subrace_*, dmsubracehelper and _subrace_book outright and drop default.nss back to an empty body, removing a per-PC-per-round no-op call from every player's heartbeat. Approve one."
        status: open
        answer: null
      - question: "Which subraces should exist? Proposed starting roster of 6, all ECL 0: Dunedain (Human, +2 CON, +2 Heal/Search), Wood-elf (Elf, +2 DEX, +2 Move Silently/Spot), Noldor (Elf, +2 INT, +1 saves vs spells), Dwarf of Erebor (Dwarf, +2 CON, +2 Craft/Appraise, hardiness vs giants), Harfoot (Halfling, +2 DEX, +2 Hide/Listen), Uruk-hai (Half-Orc, +2 STR, -2 CHA, light sensitivity). Approve, cut, or replace the list -- no roster will be built without your explicit list."
        status: open
        answer: null
      - question: "What exactly does each subrace grant, and by what mechanism? Proposed: grants come from the per-subrace creature hide only (ability bonuses, damage resistances and save bonuses as item properties) plus an optional 1/day unique item -- the same shape as the existing sha_pcl_* / sha_subrace_* assets -- with ENABLE_LETO set FALSE and fresh sha_subraces1 definition scripts authored. The Leto path (permanent .bic edits to base stats, feats, skills and wings) is dead under NWN:EE and is not worth reviving. Approve, or say you want permanent stat changes instead (that needs a new NWNX_Creature-based applier, a much bigger job)."
        status: open
        answer: null
      - question: "Free, or paid for with ECL / a merit cost? Proposed: free and ECL 0 for a flavour-only roster, since the module already has legendary levels and a merit economy, and an XP tax would be an invisible, confusing penalty; sha_xpsystem.nss (the ECL charger) stays unhooked and gets deleted. Approve, or name an ECL value per subrace."
        status: open
        answer: null
      - question: "How does a player pick a subrace? Proposed: keep the engine's native mechanism -- the player types the subrace name into the Subrace box at character creation (zero new code) -- plus an in-game 'Lore of the Free Peoples' tome (reusing the existing _subrace_book blueprint, tag SUBRACE_LIST_BOOK) sold at the Well of Eru listing the valid names and requirements. Approve, or would you rather have an NPC/conversation selector (more work, but typo-proof and able to gate on level/alignment interactively)?"
        status: open
        answer: null
      - question: "Can a subrace be changed after creation, and by whom? Proposed: no self-serve respec -- the engine re-reads the Subrace field on every login, so a change means an admin edit; wire a 'Set player subrace' entry into the rest-menu Admin Options (_restemo_admin.nss, can_admin tier) rather than reviving the DM Subrace Wand, since you have no DM client. Approve, or say subraces are permanent at creation with no change path."
        status: open
        answer: null
  - id: concerning-pipeweed
    title: "Concerning Pipeweed"
    group: travel
    epic: quest-overhaul
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-05"
    commit: 9688943c964
    notes: "<div><b>Hobbiton is coming within reach, and the Shire's leaf is getting a great deal more interesting.</b></div><div><br></div><div><b>Fast travel to the Shire.</b> The Guardian of Light at the Well of Eru gains a thirteenth destination: <b>Hobbiton</b>. It is open to everyone at any level, like all the others. The walk was previously five hops out through Bree and the Old Forest, which is no road for the level-5 and level-1 characters that <a href=\"#idea-concerning-hobbits\">Concerning Hobbits</a> and the Wizard line send there. From the Hobbiton green it is one door to the Green Dragon Inn and one door to Bag End.</div><div><br></div><div><b>Odo Proudfoot will sell you leaf — once you have earned it.</b> Settle his genealogy dispute and win, and thereafter he keeps a counter for you at the Green Dragon. Five strains, each with its own character:</div><ul><li><b>Longbottom Leaf</b> — the honest standby, and the pouch he gives you for winning. Sharpens the senses, dulls the book-learning.</li><li><b>Old Toby</b> — the finest in the Southfarthing. Deep wisdom and old lore, at the cost of any charm you had.</li><li><b>Southlinch</b> — Bree-grown and a little disreputable. Loosens the tongue and clouds the judgement.</li><li><b>Hornblower's Garden</b> — rare and dear. Steadies the heart against fear, slows the hands.</li><li><b>Witch Weed</b> — Odo keeps this one under the counter and will not say where it came from. Clever, reckless, and it does something with chickens that nobody has satisfactorily explained.</li></ul><div>Every strain works in the <b>water pipes of the Smoking Chamber</b>, through the door at the Well of Eru. A pipe lasts a <b>full hour of real time</b> and — this is the point — <b>resting will not clear it</b>. The gift and the penalty both ride with you into the next fight, so choose your leaf before you set out. Lighting a second pipe replaces the first.</div><div><br></div><div>NPCs remarking on the state you are in is tracked separately as <a href=\"#idea-pipeweed-npc-reactions\">NPCs notice when you are under the influence</a>, and Odo's supply troubles as <a href=\"#idea-pipeweed-supply-line\">The Leaf Runs Short</a>.</div><div><br></div><div><b>Shipped 2026-08-05.</b> All of the above is now in: the thirteenth destination on the Guardian of Light, the five strains, the hour-long high that resting and logging out will not clear, and Odo's counter -- he sells leaf and buys nothing. Witch Weed comes ten smokes to the pouch. The full strain table is on <a href=\"Customizations.html#pipeweed\">Customizations -&gt; Pipe-weed</a>. Odo's counter stays shut until <a href=\"#idea-concerning-hobbits\">Concerning Hobbits</a> lands its win-flag; the pipes, the strains and the fast travel work now.</div>"
    impl_notes: "<div><b>There is a whole dormant substance-abuse system already in the tree &mdash; read it before writing <code>pw_inc.nss</code> from scratch.</b> (Noted 2026-08-02, turned up by the crit-immunity audit for <a href=\"#idea-devcrit-roll\">devcrit-roll</a>, which was scanning for anything that grants immunity to critical hits: <code>sas_include.nss</code> can construct <code>EffectImmunity(Random(33))</code>, and the only reason that is harmless is that nothing can reach it.)</div><div><br></div><div>The <code>sas_*</code> scripts are Michael G. Janicki's <b>Substance Abuse System</b> (2003), shipped in <code>unpacked/</code> and <b>completely unwired</b>: <code>Mod_OnActvtItem</code> is <code>dmfi_activate</code>, <code>Mod_OnHeartbeat</code> is <code>bleeding</code> and <code>Mod_OnModLoad</code> is <code>onmoduleload</code>, so <code>sas_activate</code>, <code>sas_hbeat</code> and <code>sas_modload</code> never run, and the <code>sasmonkey</code> placeable the withdrawal loop needs is not placed anywhere. It is dead weight today &mdash; but it is dead weight that already implements most of the machinery item (c) of this idea has to build: <b>per-PC addiction state, tolerance, withdrawal</b> (heartbeat-driven, via the <code>sasmonkey</code> user-defined event 6111), <b>overdose</b>, cures, and a <code>LookupRealEffect()</code> table that builds an arbitrary effect from an <code>EFFECT_TYPE_*</code> id, with separate good / bad / overdose effect sets per substance &mdash; which is exactly the shape of the five strains. See <code>unpacked/sas_include.nss</code> (<code>GetGoodEffectType</code> / <code>GetBadEffectType</code> / <code>LookupRealEffect</code>, around lines 1150-1310) and <code>unpacked/sas_monkeydefine.nss</code>.</div><div><br></div><div><b>The caveats are real, so this is a decision and not free functionality.</b> SAS is <b>rest-naive</b> &mdash; it applies ordinary temporary effects, which is precisely the problem (c) exists to solve, so the <code>PW_STRAIN</code>/<code>PW_EXPIRY</code> scheme still has to sit underneath it. Its effect lookup is randomised grab-bag (<code>EffectImmunity(Random(33))</code>, <code>EffectDisease(Random(17))</code>, &hellip;) and would have to be replaced with the fixed per-strain sets specified below. And adopting it means wiring a heartbeat and placing a placeable. The realistic reading is that <code>pw_inc.nss</code> <b>borrows the structure</b> (and perhaps the withdrawal loop later, if addiction is ever wanted) rather than <code>#include</code>-ing <code>sas_include</code>. <b>If it is judged not worth adopting, delete the <code>sas_*</code> files</b> rather than leaving unreachable code in the tree.</div><div><br></div><div><b>Design agreed 2026-07-30. Original free-prose card preserved at the bottom of this note.</b> The item was scoped down to travel + shop + strains + the smoke rework; the broad conversation pass and the follow-up quest were split out into their own ideas so this one can actually ship and be tested.</div><div><br></div><div><b>(a) Hobbiton fast travel.</b> New reply on goodtele.dlg.json after R12 'Bree.' — \"The Shire &mdash; Hobbiton.\" — pointing at a new one-line script cloned verbatim from breetele.nss. All 12 existing destinations are ungated, so this one is too. <b>No waypoint work needed:</b> shirehobbiton001 already carries a waypoint tagged <b>hobtele</b> (\"Hobbiton Teleport\"), so the script jumps to GetWaypointByTag(\"hobtele\"). Name the script something other than hobtele to keep the resref and the waypoint tag visually distinct (hobbittele.nss); neither name is taken. Hobbiton has doors to greendragoninn (Odo) and bagend001 (Findegil, <a href=\"#idea-wizard-line-early\">wizard-line-early</a>), so one destination serves both low-level lines. eviltele deliberately not touched.</div><div><br></div><div><b>(b) Five strain items.</b> Each gets its <b>own resref AND its own tag</b>. The first four are new, modelled on witchbud.uti.json (BaseItem 311, ModelPart1 75, PaletteID 23, no item properties — all effect comes from the bong script). The fifth is the salvaged item118, see (f):</div><ul><li><b>pw_longbottom</b> — Longbottom Leaf, 150 gp — WIS +4, INT -2, Spot/Listen +5 (today's witchbud behaviour; also the Concerning Hobbits quest pouch)</li><li><b>pw_oldtoby</b> — Old Toby, 600 gp — WIS +4, CHA -4, Lore +10</li><li><b>pw_southlinch</b> — Southlinch, 600 gp — CHA +4, WIS -4, Persuade +10</li><li><b>pw_hornblower</b> — Hornblower's Garden, 1200 gp — CON +4, DEX -2, +2 saves vs. fear</li><li><b>item118 retagged pw_witchweed</b> — Witch Weed, ~2000 gp — INT +4, WIS -4 (the inverse of Longbottom), and it keeps its Cast Spell: Grenade Chicken charges</li></ul><div>File all new blueprints with <code>python3 bin/file-palette-orphans.py --apply</code> — the check_palette_coverage smoke gate aborts the repack until every blueprint is filed.</div><div><br></div><div><b>(c) Rest-persistent high — new pw_inc.nss.</b> Plain DURATION_TYPE_TEMPORARY effects are scrubbed by rest, which makes the penalty half of every strain free and the whole trade-off meaningless. Instead: store PW_STRAIN (string) and PW_EXPIRY (real-world epoch, now+3600) on the PC, apply the strain's effect set, and <b>reapply on rest-finish and on client enter</b> while now &lt; PW_EXPIRY; strip once expired. One strain at a time — lighting a second pipe clears the first strain's effects before applying the new ones. Real hour, not in-game hour: the card said \"1 in-game hour\", but that is roughly 2 real minutes at the default clock and not worth 600 gp. Decide at build time whether PC locals are enough or whether PW_STRAIN/PW_EXPIRY need a campaign-DB row for cross-relog fidelity — locals survive the session, a DB row survives a reboot.</div><div><br></div><div><b>(d) Rework wg_bong.nss</b> (OnUsed on the six waterbong placeables in area024, The Smoking Chamber). Today it hard-checks GetItemPossessedBy(oMaster,\"witchbud\") and applies WIS+4 / INT-2 / Spot+2 / -20% move for HoursToSeconds(1). Change it to scan for any of the five strain tags, consume that one, and hand off to pw_inc. Keep the GestaltCameraMove cutscene and the smoke VFX — they are the good part. <b>Drop the 20-second forced EffectSleep()</b> at the end: it is a hard 20-second stun on a hub-area placeable and it fights the new hour-long buff. The 100-case ActionSpeakString table is modern song lyrics and off-colour movie quotes, is out of setting, and its colour codes are mojibake (<code>&lt;c ? &gt;</code>) from a bad encoding round-trip — several lines are not shippable on a public server. <b>Replace it wholesale</b> with a short per-strain Tolkien-flavoured line set; the mojibake is why this file needs a rewrite rather than a patch.</div><div><b>Two consumption details.</b> (i) Accept the legacy tag <b>witchbud</b> as an alias for Longbottom Leaf — QHOB_PayOut hands out witchbud today, and although the quest is not live yet this is one line of insurance against a stranded pouch. (ii) Witch Weed carries Charges: 10, so <b>consume a charge rather than destroying it</b> — ten smokes per pouch, which is what justifies its price. The other four are destroyed on use as today.</div><div><br></div><div><b>(e) Odo's shop.</b> New .utm stocking the five strains in <b>panel struct_id 1</b> (the panel item118 already occupies, so the store reads as a single tab). <b>Sell-only: MaxBuyPrice 0</b> — Odo takes no trade at all. That is deliberate, see (f). IdentifyPrice -1 (a hobbit tobacconist is not an identify shop; Dirty Hippie's 100 was copy-paste). MarkUp 100, StoreGold irrelevant once he buys nothing. Opened from a new reply on q_hob_conv.dlg.json behind a StartingConditional that tests the <b>concern_hob_won</b> questcddb key — see <a href=\"#idea-concerning-hobbits\">Concerning Hobbits</a>, which adds that key. Gating is on <i>winning</i>, not attempting: the existing concern_hob key is stamped win or lose and cannot serve. Odo is script-spawned at AP_concerninghobbits_1, which is moving into greendragoninn behind the merchant counter.</div><div><br></div><div><b>(f) Merging the Dirty Hippie store — reviewed 2026-07-30, decisions taken.</b></div><div>dirtyhippie.utm.json is placed in area024's StoreList but <i>nothing calls OpenStore on it</i> — no NPC, no placeable — so it has never been reachable. That is the real reason \"buy more pipe-weed\" is impossible today. <b>Its entire inventory is one line:</b> panel struct_id 1, item118 \"Witch Weed\", Infinite.</div><div><b>What item118 is:</b> BaseItem 311 / ModelPart1 75, visually identical to witchbud, and <b>tagged witchbud</b> — so it already works in the water pipes and is destroyed by them. Listed at 32,769 gp, but that price is fabricated: AddCost 32,767, the ceiling of a word, typed into the additional-cost box. Its only real property is a single Cast Spell: Grenade Chicken, 1 charge/use, with Charges 10. item_index reports accessible: false — it is obtainable nowhere in the module, so there are no live copies to strand.</div><div><b>Checked and cleared, do not re-investigate:</b> (i) <b>not forge-exploitable</b> — forge_inc's true-value pricing rebuilds a blank base item and re-applies only the non-cosmetic properties before reading GetGoldPieceValue, precisely to defeat inflated AddCost, so item118 prices out at its chicken grenade; (ii) <b>no gold loop</b> — the highest MarkDown in the module is 100% (darkstar, firstbankofmi001/002) against Dirty Hippie's MarkUp 100, so break-even at best.</div><div><b>The risk was never the inventory, it was the store settings.</b> Dirty Hippie is MaxBuyPrice -1, StoreGold -1, with WillOnlyBuy and WillNotBuy both empty — an unlimited-gold universal fence buying anything at 65%. Inheriting that wholesale would have installed a better-than-Well-Mart (30-48%) fence in the Green Dragon Inn, one teleport hop from the Well of Eru and reachable by a level-1 character on the new fast travel. <b>Merge the store slot, not the store settings</b> — hence sell-only in (e).</div><div><b>Decisions:</b> item118 is salvaged as the fifth strain — keep the resref (it is already filed in the palette), rename/keep \"Witch Weed\", <b>retag to pw_witchweed</b> (which also closes the long-standing witchbud/item118 tag conflict flagged in module-index/item_tag_conflicts.json), and strip AddCost so the price is ~2000 gp rather than 32,769. Odo stocks it. The <b>dirtyhippie entry is removed from area024's StoreList</b> and the store retired: the Shire grows and sells leaf, the Smoking Chamber is where you smoke it, which is what makes the fast travel and the quest gate matter.</div><div><br></div><div><b>--- original card as submitted 2026-07-26 ---</b></div><div>Depends on completion of concerning-hobbits quest. Both the concerning-hobbits, and the wizard class early line quests are low level and direct players to Hobbiton. However, Hobbiton is a LONG walk from well of eru, fastest path from bree through mirkwood which is too tough for low level players. <b>Add a fast travel option to the good teleporter from well of eru that takes people to Hobbiton.</b> Also, once concerning-hobbits is complete, you should be able to return to hobbiton to buy more pipe weed. The pipeweed from concerning-hobbits, as well as what you can buy afterword, should all be compatiable with the smoking chamber water pipes that are accessible from the well of eru. Review the scripts when the water pipe is used to smoke the pipeweed: confirm the the effects here and propose ways to improve/modify them. I'm interested in the hobbit offering multiple strains of pipeweed with different effects. E.g. maybe one that lowers your CHA by 4 and increases your WIS by 4, and it lasts for 1 in-game hour even after resting. Possibly alter/modify conversations frequently used NPCs can recognize when you are under the influence of pipe weed and make comments about it. Document a new draft followup quest idea that triggers once youve bought pipe weed from hobbit on 3 different real-word calendar days, on that third time he after purchasing, the hobbit tells you he's running low on supply and you have a quest to secure trade routes or stop hostile mobs from preventing his grow operation, etc.</div><div><br></div><div><b>BUILT 2026-08-05 (commit 9688943c964).</b> All six parts (a)-(f) shipped; build green, 20/20 smoke gates, dialog integrity clean.</div><div><b>(a)</b> hobbittele.nss cloned from breetele.nss, wired as the Script on a new goodtele.dlg reply \"The Shire -- Hobbiton.\" (ReplyList[13], linked second in EntryList[0].RepliesList, immediately after Bree). Jumps to GetWaypointByTag(\"hobtele\") in shirehobbiton001, GetIsObjectValid-guarded. Ungated; eviltele untouched; script resref deliberately distinct from the waypoint tag.</div><div><b>(b)</b> New .uti pw_longbottom / pw_oldtoby / pw_southlinch / pw_hornblower (BaseItem 311, ModelPart1 75, PaletteID 23, no item properties, AddCost=Cost 150/600/600/1200, full descriptions). item118 salvaged: resref and name Witch Weed kept, retagged witchbud -&gt; pw_witchweed (closes the witchbud/item118 tag conflict), AddCost 32767 -&gt; 2000, Grenade Chicken 10 charges kept. All filed by bin/file-palette-orphans.py --apply.</div><div><b>(c)</b> pw_inc.nss over a new <b>pipeweeddb</b> campaign DB, table pipeweed(uuid PK, strain, expires_at, cdkey, char_name), keyed on GetObjectUUID -- chosen over PC locals because a 1200 gp pipe lasting a real hour must survive a reboot, or a mid-hour restart silently refunds the penalty. PW_STRAIN/PW_EXPIRY are mirrored as PC locals for cheap reads by future consumers; the DB row is authoritative. Effects are a projection of stored state re-derived at each wipe boundary, every one TagEffect-marked PW_STRAIN_EFF so PW_StripEffects reclaims only ours. Hooks: PW_InitDb() in onmoduleload.nss; PW_Refresh(oPC) in on_mod_rest.nss on REST_EVENTTYPE_REST_FINISHED (delayed 0.5s past the engine's rest wipe, mirroring the existing SPFAIL_ZONE line) and in mod_cliententer.nss at +8.0s (past the login flood, after the UUID is forced).</div><div><b>(d)</b> wg_bong.nss rewritten (OnUsed on the 6 waterbong placeables in area024; verified on blueprint and all 6 instances). Scans all five strain tags plus the legacy witchbud alias -&gt; Longbottom, hands off to PW_Light. Witch Weed spends one of ten charges (destroyed at the last), the other four destroyed on use. Kept the smoke VFX and the GestaltCameraMove cutscene but <b>retargeted it from OBJECT_SELF (the pipe) to the smoker</b> -- the original assigned the cutscene to the placeable, so the camera swing could never reach the player. Dropped the 20s forced EffectSleep and the whole 100-case ActionSpeakString table (modern lyrics / film quotes with mojibake colour codes); replaced with four in-setting lines per strain. Unused lib_witchgrass include dropped.</div><div><b>(e)</b> pw_odostore.utm.json -- five strains in panel struct_id 1, MaxBuyPrice 0 (sell-only), IdentifyPrice -1, MarkUp 100, MarkDown 0, StoreGold 0, empty buy lists. Opened by pw_shop.nss (reply Script on q_hob_conv.dlg, added to both the fresh greeting and the already-settled-today greeting) behind StartingConditional pw_c_shop.nss, which tests the concern_hob_won questcddb key. The store object is CreateObject'd at Odo's feet on first use and cached in PW_ODO_STORE -- no store instance positioned in any .git.json. Plain OpenStore, not OpenStoreAppr (no buy cap to scale).</div><div><b>(f)</b> dirtyhippie removed from area024's StoreList and the parallel .gic slot, dirtyhippie.utm.json deleted, its storepalcus leaf removed. None of its fence settings (MaxBuyPrice -1, StoreGold -1, empty WillOnlyBuy/WillNotBuy) carried into pw_odostore.</div><div><b>Known-closed gate:</b> pw_c_shop returns FALSE for everyone until concerning-hobbits stamps concern_hob_won -- by design, recorded as the first manual step.</div><div>Docs in the same commit: Customizations.html#pipeweed (new section, TOC entry, strain table), QuestGuide.html (Concerning Hobbits card gains the shop-unlock and fast-travel paragraphs), QuestGuide-DM-Notes.md (admin section + the open point on the missing key). No Quest Ideas.html exists in docs.manual/.</div>"
    manual_steps:
      - step: "Odo's leaf counter is deliberately shut today: pw_c_shop.nss tests the concern_hob_won questcddb key, which concerning-hobbits does not yet stamp. To open it, add QCD_Stamp(oPC, \"concern_hob_won\") to the nWon branch of QHOB_Answer in q_hob_inc.nss (that is concerning-hobbits' remaining work item 2). Everything else -- pipes, strains, fast travel -- works now."
        status: open
        kind: admin
      - step: "UAT appearance: spawn pw_longbottom in The Smoking Chamber (area024) -- palette Miscellaneous > Other -- and confirm the pouch model, name and description read right."
