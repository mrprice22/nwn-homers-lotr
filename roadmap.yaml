    impl_notes: "<div><b>Unblocked 2026-08-02: the prerequisite shipped.</b> <a href=\"#idea-devcrit-roll\">devcrit-roll</a> is done &mdash; a devastating critical can no longer delete anything outright, so boss crit immunity has lost most of its reason to exist and this item is now reviewable. <b>The audit it required is in <code>CLAUDE-devcrit-immunity-audit.md</code></b> (regenerate with <code>bin/audit-crit-immunity.py</code>): 91 item blueprints, 178 creature blueprints, 180 placed instances, and <b>no script</b> grants it. It is concentrated &mdash; <code>npcbuffgear</code> alone covers 49 creatures and <code>bossring</code> 33 &mdash; so this is a handful of item edits, not a 178-creature sweep. The document carries a per-creature <b>keep?</b> column sorted by CR and the recipe for keeping immunity on a hand-picked boss (strip the shared blueprint, mint a variant like <code>bossring_ci</code>, swap the resref on the <code>.utc</code> <b>and</b> the <code>.git</code> instance together). <b>Waiting on the admin's keep/remove decisions</b> &mdash; nothing has been stripped.</div><div><br></div><div><b>Half of this is now designed</b> under <a href=\"#idea-devcrit-roll\">devcrit-roll</a> (2026-08-01): Devastating Critical stops being save-or-die and becomes flat bonus physical damage scaled by weapon size, via the NWNX Damage plugin. <b>Do that one first</b> — dropping boss critical-hit immunity only makes sense once a dev crit can no longer delete a boss outright, and once it cannot, the immunity has much less reason to exist. Revisit this item immediately after.</div>"
