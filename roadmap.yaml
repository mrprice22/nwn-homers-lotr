        status: open
        kind: uat
      - step: "UAT the CONDITIONAL feat: with Legendary Onslaught, confirm the extra attack is present unarmed and with a melee weapon, DISAPPEARS when a bow or crossbow is equipped, and comes back on switching to melee. This is the only feat in the pool whose effect depends on what is held, and legfeat_equip is the only thing keeping it honest."
        status: open
        kind: uat
      - step: "UAT, THE ONE THIS TRANCHE EXISTS TO TEST: relog and confirm both effects come back - this is the first exercise of the login re-apply path (LegFeat_ApplyAll from mod_cliententer). Then relog twice more and confirm the attack bonus is still +5 and not +10 or +15."
        status: open
        kind: uat
      - step: "UAT: re-pick via Ping Pong swaps the effect feats cleanly - take Legendary Prowess, respec, take Legendary Strength instead, and confirm no leftover +5 AB (a stale LEGFEAT_EFF effect would be the effect-kind equivalent of the stat farm)."
        status: open
        kind: uat
      - step: "PUBLISH THE MARTIAL SET (blocker): python3 bin/gen-legendary-feats.py --apply (done); bin/build-lotr-tlk --apply --install; bin/build-lotr-rules-hak --install; bin/refresh-nwsync; nwn-manager repack; bin/server-restart. The TLK and the hak must go together or the nine new rows read as blank names in the picker."
