  - id: harper-scout-quest
    title: "Prestige quest: Harper Scout (L6+)"
    group: quests-areas
    epic: prestige-quests
    status: planned
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-16"
    commit: 8543f22d6df
    notes: "<div>Withdrawn for redesign, along with the rest of the prestige-order trials. Halmir the Grey stays at the Well of Eru, but as a general quest guide rather than the keeper of the orders.</div>"
    impl_notes: "<div>Journal tag pc_harper. Offer requires 1+ Harper Scout level; non-Harper L6+ characters get an in-fiction pointer line rather than a dead placeholder.</div><div><br></div><div>Della Heathertoes is a plot NPC in a fern-green Lothlórien cloak, script-spawned at AP_harperscout_1; inn behavior otherwise untouched. Reversed-word cipher: Lore 8+ shortcuts, lower Lore enters a three-candidate hint loop that can never dead-end. One-off, relog-safe via the prestigedb stage idiom; all turn-ins stage-guarded.</div><div><br></div><div>Scope: the design card's Rivendell/Lothlórien contacts were folded into dialogue lore to keep it T1-compact (two fewer waypoints). Docs: card moved from Quest Ideas.html into QuestGuide.html.</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>implemented</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Cipher in the Inn</b> — the Harper Scout initiation, and the first live order at Halmir's prestige hub. Carry 1+ Harper Scout level and Halmir sends you to a contact in the Prancing Pony with a cipher to crack; high Lore reads it at a glance, everyone else works it out through hints. Pays 750 XP and the <b>Harper Pin</b> (Listen / Spot / Lore +3). Details: <a href=\"QuestGuide.html#harper-scout\">Quest Guide → Harper Scout</a>.</div><div><br></div><div><b>Archived manual steps</b> — reinstate these when the line is redesigned:</div><ul><li>[toolset · done] Place waypoint AP_harperscout_1 in theprancingpo001 (AP_prestigehub_1 is also required). Della is script-spawn-only; the quest is unreachable until both exist.</li><li>[uat] UAT: non-Harper L6+ character at Halmir gets the pointer line and no offer.</li><li>[uat] UAT full flow: Harper Scout accepts (journal 1) -&gt; Della, both the Lore &gt;=8 shortcut and the hint-loop path -&gt; counter-word (journal 2) -&gt; Halmir pays 750 XP + pin, journal ends, epilogue-only afterwards.</li><li>[uat] UAT persistence: relog mid-quest resumes; no second pin is ever granted.</li><li>[uat] UAT regression: Halmir's other eleven branches and summary line unchanged; Prancing Pony leash unchanged; Della brushes off non-questers.</li></ul>"

  - id: knight-westernesse-quest
    title: "Prestige quest: Knight of Westernesse (L6+)"
    group: quests-areas
    epic: prestige-quests
    status: planned
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-16"
    commit: 15357fe512b
    notes: "<div>Withdrawn for redesign, along with the rest of the prestige-order trials. Halmir the Grey stays at the Well of Eru, but as a general quest guide rather than the keeper of the orders.</div>"
    impl_notes: "<div>Journal tag pc_pdk. Offer requires 1+ Knight of Westernesse level via the prsg_inc framework; non-knights get an in-fiction pointer.</div><div><br></div><div>Wart, the Gondorian Gate Captain is an existing placed NPC that was previously conversation-less. Rally three of the seven placed gate guardsmen (pdk_command counter), then plant the standard at the Banner-Stone placeable spawned at AP_knightwest_1.</div><div><br></div><div>Deviations from the design card: guardsofconstant / bishobofconstant turned out to be Sauron's Mount Doom guards, so the Gondorian gate garrison is used instead. The guardsmen needed the split-blueprint pattern (they share a blueprint with ten Minas Tirith city placements) so respawns keep the dialog — divergence gate verified. The escort mechanic was compacted to the muster exercise: same fiction, same counter, no henchman AI at T1 scope. One-off, relog-safe (prestigedb pdk stages, hardened guards).</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>implemented</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Banner of the West</b> — the Knight of Westernesse initiation, the hub's second order. Halmir sends you to the Gondorian gate captain at Minas Tirith to muster the guard, take up the standard and plant it on the Pelennor Fields. Pays 750 XP and the <b>Banner of the West</b> tower shield (AC +3, saves vs. fear +3). Details: <a href=\"QuestGuide.html#knight-west\">Quest Guide → Knight of Westernesse</a>.</div><div><br></div><div><b>Archived manual steps</b> — reinstate these when the line is redesigned:</div><ul><li>[toolset · done] Place waypoint AP_knightwest_1 in thepelennorfield. The Banner-Stone is script-spawned; the quest cannot be completed until this exists.</li><li>[uat] UAT gating: non-knight L6+ gets the pointer; PDK level 1+ gets the offer.</li><li>[uat] UAT full flow: Wart -&gt; rally 3 gate posts (floaty count; a 4th post says already-mustered) -&gt; standard released -&gt; plant at the Banner-Stone -&gt; Halmir pays XP + shield, journal ends, epilogue-only afterwards.</li><li>[uat] UAT persistence: relog mid-quest resumes with the rally tally intact.</li><li>[uat] UAT regression: Harper branch and the ten placeholders unchanged; Minas Tirith city guards unchanged; gate guardsmen respawn identically; Pelennor OnEnter still clears trash and leashes.</li></ul>"

