    date: "2026-07-01"
    commit: 1204b88d546
    notes: "<div><span>So I logged in with the longsword of elrond in my inventory and I ended up in Jail.</span></div><div><span><br></span></div><div><span>Forge Warden also greets with \"<i>Hold Prisoner. The &lt;UNRECOGNIZED TOKEN&gt; you carry bears unlawful enchant</i>\" and later \"</span><span><i>&lt;UNRECOGNIZED TOKEN&gt; You will go no further until it is stripped back within the law</i>\"</span></div><div><span><br></span></div><div><span><b>Fixed 2026-07-01:</b> Root cause was a stale Forge legal-variant whitelist (forge_legal_inc.nss) — it was last regenerated 2026-06-11, 12 days before a balance fix (a026a118b6f, ab-enhance-stack-bug) changed the sword's stored properties, so the post-fix item no longer matched the whitelist's old fingerprint and got flagged as illegal. Regenerated the whitelist <font color=\"#26a269\">and hardened forge_ward_intro.nss so the Warden releases the PC instead of showing the broken &lt;UNRECOGNIZED TOKEN&gt; accusation when it can't confirm an illegal item.</font></span></div><div><span><br></span></div><div><span><b>Known residual risk:</b> re-ran bin/ab-enhance-audit.py against the live vault and it found zero out-of-sync .bic files — but that sweep (and the original repair) only touches carried/equipped inventory, not player bank storage. A sword stashed in a bank before the June 23 property fix and pulled out later would still carry the pre-fix shape, which genuinely deviates from the current blueprint and isn't in the whitelist (which only covers current, not legacy, fingerprints) — so it could still trip the contraband check on a technically-true but player-unfair basis. Bank storage isn't audited by the existing ab-enhance tooling; flagging as follow-up work if reports of this recur. --&gt; </span><a href=\"#idea-dedupe-item-tags\">Resolve all duplicate-tagged items (module-index/item_tag_conflicts.json) — give each variant a unique Tag/resref</a></div>"
