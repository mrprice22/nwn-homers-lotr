  - id: smith-can-disenchant-negative-abilities-exclude-negative-arcance-spell-failure
    title: "negative arcance spell failure (reduced spell failure) might count as negetive property on items for smithing, but it's a positive (good) thing to have"
    group: forge
    status: manual
    type: Defect
    player: Szescian82
    date: "2026-08-24"
    commit: b786cbc04e55df83cd7dabb2a834f40793063d28
    notes: "<div><b>A reduction of arcane spell failure is an enchantment again, not a curse.</b> The forge treats \"Arcane Spell Failure -30%\" and the like as what they are - a benefit you pay a smith for. They show in the strip list, they fill an enchantment slot, and a piece you lawfully stripped one from is no longer contraband. Reported by Szescian82, who was jailed for a <a href=\"https://homerslotr.com/items/cloth034\" target=\"_blank\" rel=\"noopener\">Mithral of Sauron</a> whose -30% he had removed at a forge months before the rule existed.</div><div><br></div><div><b>The forges' \"Minus 10%\" option really gives minus 10% now.</b> It was applying PLUS 10% arcane spell failure - a penalty - at every anvil, and since the drawback rule shipped no smith would take it back off. If you bought that option, speak to a Forge Warden or to the admin.</div><div><br></div><div><b>The law now says what it objects to.</b> Being jailed used to tell you only which item offended. It now names the bane that was struck from the piece, or the ceiling it breached (\"7 enchantments where the law allows 6\"), and the Forge Warden repeats the same detail. A true bane is still unliftable - that part has not changed.</div>"
    impl_notes: "<div><b>Root cause: ARCANE_SPELL_FAILURE is the one SIGNED type in the drawback list.</b> Stock iprp_arcspell.2da rows 0-9 are -50%..-5% (cost multiplier 1.25-4.0, i.e. they RAISE the item's worth); rows 10-19 are +5%..+50% at cost 0. ForgeIsDetrimentalProp covered the type flat, so a beneficial -X% was uncounted (a free slot since 4620a3d), unstrippable, and - the reported bug - fired ForgeMissingBlueprintDrawback on any copy a player had stripped back when that was legal, jailing the bearer. Fix: the ASF branch returns GetItemPropertyCostTableValue(ip) &gt;= IP_CONST_ARCANE_SPELL_FAILURE_PLUS_5_PERCENT. Everything else follows through ForgePropInSet - strip menus, caps, staged plan bit indices, ForgeProjectedPropCount, ForgeUnlistedNote. A sweep of unpacked/*.uti.json: 11 blueprints carry a beneficial ASF (Mithral of Sauron, Dragon Guard, Robes of Master Craft, Drider Plate of the Archmagi, Soulkeepers Robes, Tournament Armour x2, Shield of the Mage, Spellcaster's Choice, Gothmog's Mage Mail, x2_cus_fletcher3), ZERO carry a harmful one.</div><div><br></div><div><b>FORGE_CLEAN_VER deliberately NOT bumped (stays 6).</b> Unlike 4620a3d this change only ever LOOSENS the missing-bane rule, and the Warden re-judges unstamped items anyway, so no forced re-scan is needed to free wrongly-jailed gear. A bump would be actively harmful: a -X% ASF counts toward the 6-property cap again, so a forced re-scan could newly condemn a piece forged to the cap during the 2026-08-19 -&gt; 2026-08-24 window in which it cost no slot. Leaving the stamps grandfathers those; the anvil still re-counts live the next time the item is worked. PRICED untouched (unconditional return TRUE) - pricing and the blueprint fingerprint must not move, so no forge_legal_inc regen.</div><div><br></div><div><b>Second defect, same feature:</b> setasfminus10.nss set IP_CONST_ARCANE_SPELL_FAILURE_PLUS_10_PERCENT behind a reply reading \"Minus 10%.\" in all four anvil dialogs (bellnius_smith, kimli_forge, kallrist_forge, forge_item_mid); setasfminus20/30 were correct. Script fixed, dialogs untouched (the text was right). Confirmed decision: the sign gate keeps a +10% a bane, so an item already carrying one cannot be stripped - the cure is the Warden's revert-to-blueprint or an admin return. Nothing can enumerate affected items offline (the property lives in each player's .bic), so this is respond-on-report.</div><div><br></div><div><b>Explicitness (the reporter's other ask):</b> ForgeMissingBlueprintDrawback stashes the missing property's rendered name in FORGE_BANE_MISSING (ForgePropName already resolves the 2DA cost-table suffix, so it reads \"Arcane Spell Failure -30%\"), on the failure path only - one call, and the loop stops there. ForgeLegalStatus and ForgeJailForItem both name it; the jail line also names the breached cap, deriving the valuation only when the property count is not the offence, so the scan step's instruction budget is unchanged.</div><div><br></div><div><b>Part 2 of the report (Pipe of Gwathdor, jailed for an item he was not carrying) is NOT reproduced and no code changed for it.</b> Item 106 has five Cast Spell properties and no drawback, and its one placement (gwathdorlord001 inventory) is a plain blueprint reference with no overrides, so a stock pipe can never be judged illegal. ForgeEnqueueScan walks equipment, inventory and one bag level only - it cannot see an item left in a forge placeable, and nothing re-jails on login. The described sequence is what an EARLIER jailing looks like: the Pit Prison is where he logged out, so it is where he logs back in, and the fresh Warden scan then finds nothing and releases him. Diagnosis needs the ForgeLog line, which is gated on the module's FORGE_DEBUG - see the manual steps.</div><div><br></div><div><b>Gate:</b> tests/check_forge_disenchant.py now requires the sign gate inside ForgeIsDetrimentalProp and that each setasfminus&lt;N&gt; script names the matching MINUS constant. Verified both bite by reverting each change. Test build: 31/31 smoke tests, 58 scripts compiled, 0 errors.</div>"
    manual_steps:
      - step: "Deploy to the DEV realm and arm bin/reboot-on-empty (never force-restart dev). Module-only change: no hak rebuild, no NWSync refresh.\n\nDone 2026-08-24: repack-homers-lotr built homers_lotr_test_20260824_101554.mod (31/31 smoke tests, 381 dialogs clean), installed to the dev realm and OneDrive Test/, and reboot-on-empty is ARMED with the release message. Waiting for the realm to empty."
        status: done
        kind: publish
      - step: "UAT (the report): bring Mithral of Sauron (cloth034) to a forge anvil. 'Arcane Spell Failure -30%' must now appear in the strip list, must count toward the property cap, and the smith's 'bane' sentence must NOT mention it."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (the jailing): carry a Mithral of Sauron whose -30% arcane spell failure was stripped at a forge before 2026-08-19. Logging in must NOT jail you, and the Forge Warden must report the piece lawful."
        status: open
        kind: uat
        tester: "Szescian82, or any character holding a stripped Mithral of Sauron"
      - step: "UAT (the mislabelled option): buy 'Minus 10%' arcane spell failure at any anvil (Tagget / Kimli / Bellnius / Kallrist) and examine the item - it must read -10%, not +10%. Check Minus 20% and Minus 30% too."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (regression - real banes still hold): Basilisk Visage must still show 15 strip entries, not 20, and still refuse to have its penalties struck off. A piece stripped of a REAL bane before 2026-08-19 must still jail - now with the bane NAMED in both the jail message and the Warden's line."
        status: open
        kind: uat
        tester: "any"
      - step: "ADMIN: if a player reports a +10% arcane spell failure bought from the old 'Minus 10%' option, the cure is the Forge Warden's revert-to-blueprint or an admin return - the sign gate keeps a genuine +X% unliftable, and the property lives in the player's .bic so affected items cannot be found offline."
        status: open
        kind: admin
      - step: "DIAGNOSTIC for part 2 of the report (jailed for a Pipe of Gwathdor he was not carrying - unreproduced): set FORGE_DEBUG on the module in the dev realm so ForgeLog writes the 'Jailing ...' line (resref, props, value, fingerprint) to the server log, and ask Szescian82 to quote the exact floating text next time it happens. The most likely explanation is an earlier jailing plus logging out inside the Pit Prison - nothing re-jails on login."
        status: open
        kind: admin
  - id: more-shortcuts-for-testers-in-test-realm
    title: "accessibility shortcuts for testers in test realm"
    group: items-gear
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-24"
    commit: b8c6705fd0f
    notes: "<div><b>On the test realm only, testing no longer starts with a shopping trip.</b> Step into the Well of Eru and you leave with a <b>Forgekey</b> and six <b>Runes of Expansion</b> - topped back up to six every time you pass through, so you never run dry mid-session. No Balrog run first.</div><div><br></div><div>Your rest menu also opens up: the <b>Meaningwave guide teleports</b> and the full <b>Options of the Homeless</b> travel list (Balrog, Weathertop, Hobbiton, Angmar, Dunharrow, Castle of the Homeless, the Lord of the Dark Arts) are now there for every player, not just the admin. Getting to the thing you actually wanted to test takes seconds.</div><div><br></div><div><b>None of this exists on the live server</b>, and nothing about live play changes. The admin-only menu is unchanged on both realms.</div>"
    impl_notes: "<div><b>New generated flag SP_TESTER_KIT</b> in bin/season-profile.py (dev/test on, live/archive off), read in exactly one place: unpacked/sp_testkit_inc.nss. It is generated rather than authored because bin/season-promote.sh copies dev's tree over production on every release - a hand-edited FALSE in production would be reverted by the next successful deploy and the live season would quietly start giving away the Balrog's only drop. Four new WIRING rows make a consumer that reverts to a literal fail the repack.</div><div><br></div><div><b>sp_testkit_inc has no Admin_Can* fallback folded in</b>, unlike sp_devgate_inc. Its consumers guard different admindb tiers (can_homeless vs can_admin), so a shared 'or the admin' clause would have to pick one and would silently widen the other - handing every can_admin key the Homeless teleports on a live season. Each consumer keeps its own check beside the flag, so production behaviour is unchanged by construction.</div><div><br></div><div><b>welloferuenter.nss</b> (reached via the area's OnEnter wrapper prsg_enter) tops the PC back up to 6 slot_token and grants forgekey if absent, on <i>every</i> entry, not just GetXP()==0. Runes stack, so the count sums GetItemStackSize over the inventory - GetItemPossessedBy would report a stack of six as 'has one' and top up forever. The message only fires when something was actually granted, so re-entering is silent. Forgekey is matched by TAG (the Moria forge door is a native KeyName lock).</div><div><br></div><div><b>_cdkeyhome.nss</b> gets 'if (SP_TesterKit()) return TRUE;' ahead of Admin_CanHomeless. Scope is exact: that subtree holds the seven teleports and an Exit, nothing else.</div><div><br></div><div><b>emotewand.dlg.json</b> gains ReplyList[142] '[MW Teleports]' as a root entry under EntryList[0], gated on the new sp_testkit StartingConditional, linking with IsChild=1 to EntryList[10] - the MW destinations node ReplyList[81] already owns under Admin Options. A second parent link, not a copy; IsChild=1 was already used 8 times in this DLG. <b>Admin Options was deliberately NOT relaxed</b>: opening _cdkey would have handed every tester God Mode, DM Options, Grant me level 60, Merit Awards, Merit Redemptions and the legendary-feat reset. check-dlg-integrity reports emotewand clean (0 failing, no new warnings); 31/31 smoke gates and 90 scripts compiled.</div><div><br></div><div><b>No hak or NWSync work</b> - scripts, one DLG and the generated include only. Module-only change, so a restart is all it needs.</div>"
    manual_steps:
      - step: "Well of Eru kit: on the dev realm, take a character that is NOT on the admindb whitelist into the Well of Eru. Confirm 6 Runes of Expansion and a Forgekey arrive with the '[Test realm] Tester kit topped up' message. Walk out and back in: no second grant, no repeat message. Spend a rune at a forge, re-enter, confirm it tops back up to 6."
        status: open
        kind: uat
        tester: "any"
      - step: "Rest menu: same non-whitelisted character, open the rest menu. [MW Teleports] and [Options of the Homeless] must both be listed. Spot-check that 'To. Balrog' and two Meaningwave destinations actually land you in the right area. Confirm [Admin Options] is still NOT listed - that one must stay admin-only."
        status: open
        kind: uat
        tester: "any"
      - step: "Live-realm half: on season 2, confirm a non-admin's rest menu is unchanged - no [MW Teleports], no [Options of the Homeless] - and that entering the Well of Eru grants no runes and no Forgekey. This is the half that cannot be verified from the dev realm, and it is the whole point of the flag."
        status: open
        kind: uat
        tester: "any"
      - step: "Arm bin/reboot-on-empty on the dev realm so the new build loads. Never force-restart the dev realm."
        status: open
        kind: publish
      - step: "The season 2 repo's index.html test-realm grid gained a 'Teleports and forge kit, free' card (commit 98f5001b414, inside the season-brand:ignore region). It reaches homerslotr.com at that repo's next scheduled wiki refresh - nothing to do unless you want it sooner."
        status: open
        kind: admin
