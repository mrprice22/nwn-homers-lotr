      - step: "UAT effect (Cleric): wearing cg_amu_cleric, cast Implosion on a death-immune boss -- it must take divine damage and the floating text must appear; repeat with the amulet removed and confirm the ordinary no-effect Implosion behaviour returns."
        status: open
        kind: uat
      - step: "UAT effect (Druid): wearing cg_amu_druid, cast Finger of Death on a death-immune boss and confirm negative damage lands."
