    group: combat-classes
    epic: legendary-levels
    status: planned
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    notes: "<div>Hybrid caster feats for paladin, bard and ranger, plus the passive bonuses that reward staying pure-class.</div>"
    impl_notes: "<div>Draft sections <a>Hybrid Caster Feats</a> and <a>Pure Class Passive Bonuses</a>. This is where the pure-vs-mixed question on <a href=\"#idea-ll-feats-2da\">ll-feats-2da</a> actually bites — the pure-class bonuses were the original idea the whole feat set grew out of.</div><div><b>Blocked on <a href=\"#idea-ll-feats-picker\">ll-feats-picker</a></b> (phases 1-3 of the build order: lotr.tlk &rarr; feat.2da &rarr; picker NUI). Once that lands this is a pure content job: add rows to the feat table at the top of bin/gen-legendary-feats.py, then write the behaviour script. Full architecture and the content ordering: <code>CLAUDE-legendary-feats.md</code>.</div><div><br></div><div><b>Content order position: 5 of 7.</b></div><div><br></div><div><b>SCOPE CUT, decided 2026-08-01.</b> The 11 auto-granted pure-class packages are <b>dropped in full</b>. Every line of that draft table restated feats already in the pick lists (Fighter’s “+5 AB, +5 damage with EWS weapons, bonus attack per round” is Legendary Assault + Weapon Mastery + Onslaught, granted rather than chosen), and handing a pure Fighter its picks for free left “so what are its three picks for?” with no answer. <b>The 3/2/1 allotment is the pure-class reward</b>; further pure-class support will be <b>items</b>, not feats. This item is now Paladin + Ranger hybrid caster feats only — 8 feats, not 19 (the four Bard rows here duplicate the Performance &amp; Support set and ship with ll-feats-ki-perform-skill).</div><div><br></div><div><b>The rule that came with it, and it binds every ll-feats-* story: no legendary feat may test for purity</b> — not in a prerequisite, not in the picker, not in its effect. The draft’s <code>&lt;class&gt; level 60</code> prerequisites are purity tests in disguise at a level cap of 60 and must be rewritten to a threshold a multiclass can reach (house form: <code>&lt;class&gt; level 30+</code>). Class-level prerequisites themselves stay — “Monk level 30+” asks for the class the feat belongs to, and a 30/30 Monk/Rogue qualifying for it is intended.</div>"
