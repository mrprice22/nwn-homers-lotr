  - id: Ammo-shortage
    title: "Ammo shortage -> ammo replication item?"
    group: items-gear
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "dc0960 (Dungeon_Crawler)"
    date: "2026-07-24"
    commit: 0bd55d8feb117b52beaad62a0cbae036c5fbbb6b
    notes: "<div>Three fixes for the ammunition squeeze.</div><div><br></div><div><b>Unlimited ammo at the armoury.</b> The <a href=\"https://homerslotr.com/stores/heavensfoundry_x2_storeweap003\" target=\"_blank\" rel=\"noopener\">Númenórean armoury</a> previously stocked a single 99-arrow (and 99-bullet) stack that could be bought once and then ran dry. Divine Arrows and Divine Bullets now restock endlessly.</div><div><br></div><div><b>Divine Bolts.</b> The armoury sold crossbows but no bolts at all. It now stocks Divine Bolts, mirroring the arrows exactly — same enchantments, same price, same unlimited supply.</div><div><br></div><div><a href=\"https://homerslotr.com/items/ammoreplicator\" target=\"_blank\" rel=\"noopener\">The Quiver of Endless Flight</a><b>.</b> A new drop from <b>Legolas Greenleaf</b> and <b>Angmar</b>. Activate it and it lists every kind of arrow, bolt and bullet in your pack, richest first; choose one and <b>500 more</b> of that exact ammunition pour out. The weave holds only <b>two</b> such workings — after the second the quiver crumbles to dust. There is no recharge. The count belongs to the quiver, not to you: pass a half-used one to a friend and it still has just the one use left.</div>"
    impl_notes: "<div><b>2026-07-24 (Quiver of Endless Flight + Divine Bolts):</b> the ammo-replication item and the bolt gap, both per the answered design questions.</div><div><br></div><div><b>Item:</b> new blueprint ammoreplicator.uti.json (tag/resref ammoreplicator, \"Quiver of Endless Flight\"), base item 29 (MISCMEDIUM), ModelPart1 11 as a <b>provisional</b> icon — no CEP hak was readable at build time, so the model is UAT-tunable (see manual steps). Activation is the Unique Power property block (PropertyName 15 / Subtype 335 / CostTable 3 / CostValue 13) copied from mw_mixtape. Cursed 0 (tradeable) and Plot 0 (must be destroyable on the last use). PaletteID 0 = Special &gt; Custom 1, the repo convention for module-custom items; filed with bin/file-palette-orphans.py.</div><div><br></div><div><b>Charge tracking:</b> ammorep_db.nss — campaign DB ammorepdb, table replicators(uuid PK, uses_left, first_used), keyed on <b>GetObjectUUID of the ITEM</b>, not the PC. That is what makes remaining uses follow the quiver through drops, trades, pickpocketing and chest storage instead of resetting for each new owner. An unregistered quiver reports the full 2. AmmoRep_InitDb() hooked into onmoduleload.nss next to the other InitDbs. Deliberately not item charges — a widget's uses are client-visible and reset on a blueprint respawn.</div><div><br></div><div><b>Menu:</b> ammorep_inc.nss + conversation ammorep_conv.dlg.json, following the staged-forge (forge_stg_*) shape: cues primed in ammorep_open.nss BEFORE ActionStartConversation (a root entry renders its text before any script on the entry would run), 8 slots gated by ammorep_c0-c7 StartingConditionals and actioned by ammorep_p0-p7, plus ammorep_none gating an empty-pack entry that sits first in the StartingList. Tokens 6440-6447 = slot labels, 6448 = header. Pick replies are terminal (empty EntriesList) — no link-only fields, so the dialog-integrity gate stays green.</div><div><br></div><div><b>Sorting:</b> per-unit worth = GetGoldPieceValue / GetItemStackSize. GetGoldPieceValue is a whole-stack figure (same contract documented on ForgeItemValue in forge_inc.nss), so it must be normalised or a big cheap stack outranks a small rich one. Insertion sort into 8 slots; extra kinds are counted in the header, not shown.</div><div><br></div><div><b>Grant:</b> AmmoRep_Grant grows the <i>existing</i> stack first (SetItemStackSize clamps at the cap; ammo caps at 999 since roadmap ammo-stack999), then spills the remainder into CopyItem copies. Growing first guarantees every copy is made from a FULL source, so a copy can never stack-merge into a partial one and corrupt the tally. <b>CopyItem, not CreateItemOnObject</b> — divinearrows/divinebullets are inline store structs with no .uti blueprint on disk, so a resref create would fail; copying also preserves enchantments.</div><div><br></div><div><b>Drops:</b> appended to the ItemList of legolasgreenl001.utc.json and angmar.utc.json (Dropable 1). Angmar is a placed instance, so the fully-inlined item struct was also appended to his entry in area009.git.json — blueprint alone would not reach a placed creature. Legolas Greenleaf needs no .git edit: he is <b>encounter-spawned</b> (area023.git.json Encounter List/0/CreatureList/0), and encounters instantiate from the blueprint. Also added to the Castle Homeless cheat chest (hm_cheat_chest.nss) for testing — a chest copy is a fresh item so it always starts at 2 uses.</div><div><br></div><div><b>Promo code:</b> Code:GottaHaveMoreAmmo in code_redeem.nss grants one quiver, expiring <b>2026-08-08</b>. One redemption per CD key (the existing coderedeem DB rule). Because uses are keyed per item UUID, a redeemed quiver starts at the full 2.</div><div><br></div><div><b>Divine Bolts:</b> the divinearrows inline struct in the heavensfoundry store panel cloned with BaseItem 25, name/tag/resref divinebolts, Infinite 1, StackSize 99 — everything else byte-identical, so enchantments and price match the arrows. MarkUp untouched at 350 per the answered question. No .uti blueprint, matching how divinearrows/divinebullets already exist (inline store items only).</div><div><br></div><div>Gates: 10/10 smoke, dialog-integrity 0 failing across 378 dialogs, palette-coverage 4404/4404, boss-registry 78 bosses OK.</div><div><br></div><div><b>2026-07-23 (commit 50ff0ff):</b> the Númenor weapon/armour store x2_storeweap003 (opened by the “Numenorian Armorer” in <b>Númenor: The Great Forge Of Númenor</b> / heavensfoundry — the forge area adjoining Noirinan/falseheaven, which itself has no store) sold divinearrows (base item 20 = ARROW) and divinebullets (base item 27 = BULLET) as <b>finite</b> 99-stacks (no Infinite flag) — buyable once, then gone. Added \"Infinite\":{byte:1} to both StoreList entries in heavensfoundry.git.json, copied byte-for-byte from the same store's already-infinite items (e.g. divinekatana). No new blueprints, no script or price change. The store sells no bolt (base 25) ammo and there is no divine-tier bolt blueprint, so bolts + any pricing change were left as admin content/balance calls (see design question). Gates: 10/10 smoke, dialog-integrity + palette-coverage green.</div>"
    design_questions:
      - question: "Ammo-replication item (the original ask, still open per the admin's own DM note). The shop is now unlimited, which covers the immediate shortage, but the player also wanted a way to copy ammo. Proposed (admin's own two options): EITHER (A) an 'Ammo Replicator' boss-drop item that duplicates a stack a limited number of times before it breaks / needs recharging, OR (B) skip the item and instead raise ammo drop rates on bosses/mobs. Which (if either) do you want, and if (A), what recharge/charge mechanic and which boss drops it? If neither, the unlimited shop already resolves the shortage and this item can close."
        status: answered
        answer: "Add a limited ammo replicator item. It will be dropped by Leoglas and Angmar only. It can be used 2 times only before it breaks -- no recharge, tracked via campaign DB, not normal widget charges/uses. \nWhen you use it, a conversation appears, listing out the current stacks of ammo in your inventory (sorted by value descending of a single ammo of that stack, so normalized per unit value): when player picks an ammo type, they are granted 500x more of that type. Make sure to add this item to both instance and blueprints of legolas and angmar."
        question_h: 112
        answer_h: 102
      - question: "Cost + bolt coverage follow-ups (optional). Divine Arrows/Bullets stay at the store's MarkUp 350 (~6-7m each) — lower the MarkUp if the price is still a concern? And the store sells crossbows but no bolts; add a divine-tier bolt (base 25) ammo type so crossbow users are covered? Both are content/balance calls left untouched by the availability fix."
        status: answered
        answer: "Keep markup rate the same for that store. Add divine tier bolts that mirror the arrows."
        question_h: 64
        answer_h: 64
    manual_steps:
      - step: "ICON UAT/TUNE (Quiver of Endless Flight): pull ammoreplicator from the Castle Homeless cheat chest and look at its inventory icon. It is a misc-medium item (base item 29) currently on the placeholder ModelPart1 = 11. If that does not read as a QUIVER, cycle candidate misc-medium models in the toolset item editor until one does, then write the final value into unpacked/ammoreplicator.uti.json. No CEP hak was readable at build time, so the model could only be guessed."
        status: done
        kind: uat
        blocker: true
        step_h: 96
      - step: "UAT drop: kill Angmar (area009, Angmar's Lair) and confirm the Quiver of Endless Flight is on the corpse. Then kill Legolas Greenleaf (area023, Mirkwoods - Halls of Greenleafs, encounter-spawned) and confirm the same."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT menu: carry several kinds of arrows/bolts/bullets, activate the quiver, and confirm the list is sorted by PER-UNIT worth descending (a big stack of cheap arrows must NOT outrank a small stack of expensive ones) and the stack counts shown are correct."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT grant: pick one entry and confirm exactly 500 more of that same ammunition arrive, with enchantments intact, spilling into a second stack only if the 999 cap is exceeded."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT expiry: use the quiver a second time. The grant must land AND the quiver must then be destroyed; a third activation must be impossible. Relog between the two uses to prove the count survives in ammorepdb."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT transfer persistence: use a quiver once, then hand it to a second player (and separately: drop it / have it pickpocketed / leave it in a chest for another character). The new holder must see 1 use left, not a fresh 2, and using it must destroy it. Relog both characters first."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT independence: hold two quivers (one from each boss) and confirm each carries its own 2 uses."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT promo code: type Code:GottaHaveMoreAmmo in chat -> one Quiver of Endless Flight arrives, the line is not broadcast to the server, and a second attempt on the same CD key is refused. Code expires 2026-08-08."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT Divine Bolts: in Númenor: The Great Forge Of Númenor (heavensfoundry), buy Divine Bolts from the Numenorian Armorer repeatedly (unlimited), and confirm they load and fire from a crossbow and match the Divine Arrows' enchantments."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT: in Númenor: The Great Forge Of Númenor (heavensfoundry), open the Numenorian Armorer's store (x2_storeweap003) and confirm Divine Arrows and Divine Bullets can be bought repeatedly (more than one 99-stack) without the entry running out."
        status: open
        kind: uat
        step_h: 64
