    notes: "<div>Withdrawn for redesign. The class quest lines went out as one large batch and lean on each other too heavily — each line is being reworked individually, with its rewards retuned, before any of it returns.</div>"
    impl_notes: "<div>Journal wiz_colour. Giver q_wiz_find, plot/immortal grey wizard in bagend001; offer gated on GetLevelByClass(CLASS_TYPE_WIZARD) &gt;= 1 (value 10 verified), non-wizards get a flavour line. Cloned from the clean rogue-line-early template (q_wiz_* names).</div><div><br></div><div>Three-node one-off arc; per-character state in the wizlinedb campaign DB (key colour_stage 0-&gt;3, advance-only). Reward properties use verified stock encodings (Use-Limitation:Class subtype 10 = Wizard).</div><div><br></div><div>Bag End OnEnter wrapped q_wiz_enter (chains the existing leash_to_area) -&gt; q_wiz_spawn; conversation q_wiz_conv. The DLG follows the reply-gate rule — action scripts only in target Script fields, verified no action script in any Active block, so the fighter-line bug was NOT repeated. Build passed all gates.</div><div><br></div><div><b>Deferred to wizard-line-endgame:</b> the colour choice (White / Many-Colours / Brown via wizard_colour) and the +2 caster-level capstone — Findegil only foreshadows them here.</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>implemented</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Colour of Power</b> — the first three chapters (L1, L8, L15) of the Wizard class line. Findegil the Grey keeps a study in Bag End and takes on only those who work real magic: the <b>Apprentice's Amulet</b> at L1, the Loremaster's Tome at L8, and the <b>Staff of the Grey Study</b> at L15. He speaks of choosing a colour later, but will not be drawn on it yet. Details: <a href=\"QuestGuide.html#colour-of-power\">Quest Guide → The Colour of Power</a>.</div><div><br></div><div><b>Archived manual steps</b> — reinstate these when the line is redesigned:</div><ul><li>[toolset · done] Place waypoint AP_wizardlineearly_1 in bagend001. Findegil is script-spawn-only and no-ops gracefully until then.</li><li>[uat] UAT gating: a Wizard entering Bag End sees Findegil's offer; a non-wizard gets only the flavour line.</li><li>[uat] UAT node 1: accept -&gt; journal opens + the wizard-restricted Apprentice's Amulet.</li><li>[uat] UAT level gates: L8 and L15 gates hold.</li><li>[uat] UAT nodes 2-3: at L8 the tome is granted; at L15 it is consumed and the Staff granted; journal advances 1-&gt;2-&gt;3(End).</li><li>[uat] UAT restrictions: amulet and staff are unusable by non-wizards.</li><li>[uat] UAT regression: the Bag End leash still fires from the wrapped OnEnter.</li></ul>"

