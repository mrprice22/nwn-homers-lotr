    date: "2026-08-05"
    commit: aaf3e1c6f0b04adef552832cf65ad5f17a70107b
    notes: "<div>The Well of Souls quest was unfinishable — the Gondor Scribe you were sent to find had never actually been placed in the world. She now stands in the Tower of the High Wizard, and the whole arc works end to end: Hanee the Loon in Bree sends you north to kill Azagoth in the Ruins of Annúminas, pays you 5,000 XP for the news, and hands you on to the Gondor wizards, where the scribe pays 10,000 XP (up from 4,000) for Azagoth's head. You can also walk in cold and start from the scribe. Details: <a href=\"QuestGuide.html#well-of-souls\">Quest Guide → Well of Souls</a>.</div><div><br></div><div><b>2026-08-05:</b> the scribe now has one Annuminas Key per character, ever. The grant used to be remembered only for the current session, so logging out and back in earned a fresh key and let one character loot both warded chests. She will still point you to the portal once the key is spent -- but she has no second key to give.</div>"
    impl_notes: "<div><b>Root cause:</b> the quest-giver NPC was designed but never created or placed. The gondorscribe conversation, journal category, condition/action scripts and the boss all existed, but no creature in the module carried the gondorscribe conversation, and ruinsofannuminas.git.json had zero static creatures. A 2026-05-28 pass only fixed a DLG Quest field name and missed the absent NPC.</div><div><br></div><div><b>Built:</b> new gondorscribe.utc.json (base comfemale002, Tag GondorScribe, Conversation gondorscribe, FactionID 6, Plot=1 so the quest-giver cannot be killed), placed in area011 near the wizards via bin/place-helper.py (clearance verified, __struct_id 4 hardcoded). New sc_hanee_head.nss (StartingConditional: has azagothshead and not hanee_head_reward) + at_hanee_head.nss (RewardPartyXP 5000, set flag, journal entry 2, keeps the head), wired into Hanee's conversation. Ruin of Annuminas journal entry 2 added (End 1). at_008.nss scribe reward bumped 4000 -&gt; 10000, head consumed. Cold-start path at the scribe unchanged (accept -&gt; journal + Annuminas Key). Full draft in QUEST_FIX_well_of_souls_plan.md.</div><div><br></div><div><b>2026-07-23 (commit 08f763c57):</b> implemented the answered design-question follow-up. In ruinsofannuminas.git the two Chest1/KeyName=AnnuminasKey placeables at Placeable-List idx 7 (X71.23/Y50.06) and idx 8 (X76.24/Y49.98) are now KeyRequired=1+AutoRemoveKey=1, unpickable, with unique LocName/Description (Sorcerer's Warded Coffer / Wizard's Sealed Reliquary) and static caster-gear ItemLists; their OnOpen/OnClosed (chest_respawner/chest_relock) were cleared so the static loot survives and the chest stays open once the key is spent. idx 9/10 left pickable + GenerateMediumTreasure (no static loot existed to redistribute, so the caster gear is pure net-gain). 6 new .uti blueprints (sorc_robe_annu/sorc_amul_annu/sorc_ring_annu = CHA + Sorcerer bonus spell slots L6-9 + resists; wiz_robe_annu/wiz_amul_annu/wiz_ring_annu = INT + Wizard bonus spell slots L6-9 + resists) cloned from epicmagerobe/amuletofadaption/aegisoftorment and filed by PaletteID. Scribe key-give node (gondorscribe.dlg, script at_007) gained a non-branching in-character warning that the key opens only one warded chest; at_007 gained an anti-stockpile guard (annu_key_given PC local int, no second key while one is held). All 10 smoke gates passed (palette-coverage, reward-exploit, locked-container-keys). <b>Open:</b> residual relog key-farm vector — see design question below.</div><div><br></div><div><b>2026-08-05 (commit aaf3e1c6f0b):</b> implemented the answered relog-farm design question. at_007.nss dropped the session <code>annu_key_given</code> local int and now includes quest_cd_inc: it bails when <code>QCD_LastStamp(oPC,\"annu_key\") != 0</code> and calls <code>QCD_Stamp(oPC,\"annu_key\")</code> after CreateItemOnObject. Storage is the existing <b>questcddb</b> campaign DB (table quest_cd, PK uuid+quest, keyed on GetObjectUUID) — no new schema, no new init (QCD_InitDb already runs from onmoduleload.nss). New StartingConditional sc_annukey.nss (<code>QCD_LastStamp(GetPCSpeaker(),\"annu_key\") == 0</code>) is the Active on gondorscribe.dlg reply 7 -&gt; entry 8; when the stamp exists that link fails and the reply falls through to new entry 12, a Script-less clone of entry 8 that repeats the portal directions and says the key is spent. Entry 12 deliberately carries no Quest/QuestEntry so a returning player's journal cannot be rewound to entry 1. The \"not while one is held\" GetItemPossessedBy check is retained. <b>Admin's parenthetical answered:</b> yes — a quest-stage guard would have needed the same DB persistence, since the local ints that gate this scribe's StartingList are session-scoped; stamping questcddb is the same persistence with less blast radius on the journal flow. <b>Grandfather effect:</b> characters who already drew a key have no annu_key row, so each can draw exactly one more before the guard holds. Test reset: <code>QCD_Clear(oPC,\"annu_key\")</code>. Build passed (20/20 smoke tests, dialog integrity clean).</div>"
    design_questions:
      - question: "On the Hanee-first route the Annuminas Key still only comes from the scribe, so the ruins' four key chests (KeyRequired=0, pickable) are reached before the key exists. Leave as-is, grant the key at Hanee's handoff, or set KeyRequired=1?"
        status: answered
        answer: "Leave as is with key coming from scribe; set 2 of the chests to be keyRequired and unpickable -- add moderately high powered sorcerer gear in one and wizard gear in the other, a 3 pieces of +10 gear with some resistances, bonus spell slots, and relevant ability score boosts. The key should be destroyed on use, so player can only open 1 of the 2 locked chests. The scribe should offer an in game warning/explanation for why (something, something, magic) and the chests should be labeled with unique names and have unique descriptions that hint at what they are rewards for (sorcerer vs wizard). Move the original contents of the 2 chests we're locking with a key here to be split up among the other 2 chests that remain pickable so no net-loss of loot, only added loot for people who do the quest and come back with the key."
        question_h: 84
        answer_h: 128
      - question: "Residual relog key-farm on the new warded chests: the scribe accept node (StartingList entry 0) still fires whenever the PC lacks azagothshead and azagothdead!=1, so a player could open one warded chest, relog (which clears the session annu_key_given local int), re-accept for a fresh key, and open the second warded chest too. AutoRemoveKey + the same-session guard block casual double-dipping but not deliberate relog-farming. Proposed: leave as-is (low-value gear, high-effort setup), OR harden it — persist the guard as a roadmapdb/campaign-DB row keyed by CD-key/UUID, or advance the quest stage so accept-entry-0 stops firing after the first key grant. Which do you want?"
        status: answered
        answer: "Harden it: Okay to use the campign-db. Wouldn't advancing quest stage also need hardened if we went that approach to also use campaign db so the quest stage persisted through reboots?"
        question_h: 123
        answer_h: 64
