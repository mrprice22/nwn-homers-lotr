    date: "2026-07-15"
    commit: 17e53016aee
    notes: "<div><b>The Twentieth Plot of Mazarbul</b> — a new one-off T2 quest (L18+) in Moria. Frár the Restless, a shade of Balin's colony, asks you to re-seal a forgotten crypt: light three braziers, then put down the <b>Wraith of the Witch King</b> that rises on the third seal. Pays 1,200 gp, 2,000 XP and the <b>Seal of the Twentieth</b> ring. Once per character, ever. Details: <a href=\"QuestGuide.html#twentieth-plot\">Quest Guide → The Twentieth Plot</a>.</div>"
    impl_notes: "<div>Journal tag mazarbul_20. Frár is a ghostly-visage dwarf, plot, in the Chamber of Records. Three crypt-seal braziers (one in the Chamber of Records, two flanking Balin's Tomb); each grants a brief negative-energy ward. The Wraith is CR 21.</div><div><br></div><div>Party-aware kill credit; if the wraith dies unwitnessed, any brazier re-summons it. State is per-character campaign DB, relog-safe, genuinely one-off — no re-runs.</div><div><br></div><div>Elrond deliberately NOT wired in: his live Elrond's Request conversation stays untouched, and the lore tie is kept in the wiki card instead. Waypoints AP_mazarbul20_1-4 (ghost + three braziers) with _5 optional (wraith arena); until placed, the areas behave exactly as before. Existing leash/Meaningwave OnEnter scripts chained, not replaced. Docs: card moved from Quest Ideas.html into QuestGuide.html.</div>"
    manual_steps:
      - step: "Place waypoint AP_mazarbul20_1 in chamberofrecords &mdash; spawn point for the q_maz_ghost quest-giver Frar the Restless. Without it the quest cannot be started."
        status: done
        kind: toolset
        blocker: true
      - step: "Place waypoints AP_mazarbul20_2, _3 and _4 for the three crypt-seal braziers (one in chamberofrecords, two flanking Balin's Tomb). Without all three the quest cannot be completed."
        status: done
        kind: toolset
        blocker: true
      - step: "OPTIONAL: place waypoint AP_mazarbul20_5 anywhere with fighting room &mdash; the wraith arena. The quest is completable without it."
        status: done
        kind: toolset
      - step: "UAT spawning: enter the areas -> Frar and the braziers appear, no duplicates on re-entry."
        status: open
        kind: uat
      - step: "UAT gating: sub-18 refused; accept at 18+ -> stage 1; touching braziers before accepting gives a cold-brazier floaty."
        status: open
        kind: uat
      - step: "UAT seal sequence: light all three in any order &mdash; counts persist across relog, lit braziers refuse re-lighting, and the third seal raises the wraith."
        status: open
        kind: uat
      - step: "UAT kill credit: kill the wraith (a party member in the area also advances) -> stage 3."
        status: open
        kind: uat
      - step: "UAT turn-in: 1,200 gp / 2,000 XP / ring, journal ends, epilogue-only on re-talk, and no re-run after relog."
        status: open
        kind: uat
      - step: "UAT regression: Elrond's Request untouched; Chamber leash and Balin's Tomb Meaningwave spawn still work; Moria encounters unaffected."
        status: open
        kind: uat

