    notes: "<div><b>Beorn's Garden</b> — a new T2 daily (L12+). Grimbeorn the Old sets you to harvesting his three honey hives and driving off the wargs raiding the garden. Every hive you crack draws a pack, so the two halves of the job feed each other. Turn in six pelts and three combs for 250-450 gp, 700 XP and <b>Beorn's Honeycomb</b>. Details: <a href=\"QuestGuide.html#beorns-garden\">Quest Guide → Beorn's Garden</a>.</div>"
    impl_notes: "<div>Journal tag beorn_garden. Fifth consumer of the quest-cooldown library. Grimbeorn is an existing placed NPC that was previously conversation-less.</div><div><br></div><div>Scouting found no wargs living near the Carrock, so the kill leg comes from the hives themselves: each harvest spawns a pack of 2 Garden-Raiding Wargs (new CR-6 blueprint) at that hive, with a rattle-the-empty-hive re-spawn if pelts run short (capped at 4 live wargs per area) so the day is always completable. Hives are CEP hollow-stump placeables spawned at AP_beornsgarden_1 (beorn), _2 (carrok) and _3 (carrokgreater).</div><div><br></div><div>Per-hive harvests are per-character per-day (questcddb calendar keys, relog-safe); pelts only drop while active, capped at 6. Honeycomb is a new Cure Moderate consumable, with a 40% chance of a bonus comb or a Cure Serious potion instead. Warg deaths are bestiary-safe (bst_install chains the blueprint death script). Docs: card moved from Quest Ideas.html into QuestGuide.html.</div>"
    manual_steps:
      - step: "Place waypoints AP_beornsgarden_1 (beorn), _2 (carrok) and _3 (carrokgreater). The hives are script-spawned and the quest is not completable without all three."
        status: open
        kind: toolset
      - step: "UAT gating: a sub-12 character is refused; L12+ is offered -> journal stage 1."
        status: open
        kind: uat
      - step: "UAT spawning: enter each area -> one stump hive at each waypoint, no duplicates on re-entry."
        status: open
        kind: uat
      - step: "UAT harvest loop: use a hive -> comb floaty + 2 wargs spawn; the same hive again today -> already-drawn message; kills only drop pelts while active and under 6."
        status: open
        kind: uat
      - step: "UAT: the bestiary records Garden-Raiding Warg kills."
        status: open
        kind: uat
      - step: "UAT completability: empty hives with pelts short -> rattling re-spawns a pack, stopping at the cap."
        status: open
        kind: uat
      - step: "UAT turn-in: 6 pelts + 3 combs -> gold/XP/honeycomb (drink it: Cure Moderate), journal ends, come-back timer until UTC midnight then re-offers."
        status: open
        kind: uat
      - step: "UAT regression: Grimbeorn still fights and respawns as a tracked boss with the conversation intact; Beornings and deer unaffected."
        status: open
        kind: uat

  - id: twentieth-plot-mazarbul
