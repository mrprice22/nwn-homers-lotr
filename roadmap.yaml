      - step: "UAT at level 60: the Legendary Feats re-pick reply still appears on Halmir and still reopens the picker."
        status: open
        kind: uat
        tester: "level 60"

  - id: devcrit-unarmed-save-or-die
    title: "Devastating Critical still killed outright on unarmed and creature attacks"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Exploit
    player: "-Methonash-"
    date: "2026-08-15"
    commit: 61ddececaae
    notes: "<div><b>Devastating Critical could still kill you outright — but only bare-handed.</b> When the feat was reworked into bonus damage, the change reached every weapon in the game and missed fists and monsters' claws. A monk, or anything fighting unarmed, was still landing the old save-or-die on a lucky swing, and so was any creature that attacks with claws or a bite.</div><div><br></div><div>Unarmed Devastating Critical now behaves exactly like every other one: <b>three extra dice of damage</b> instead of a Fortitude save, for you and for everything you fight. See <a href=\"#idea-devcrit-roll\">the original rework</a> for the full rule.</div>"
    impl_notes: "<div><b>Reported on season 2 (live) by -Methonash-. High priority — a live save-or-die on the feat that was announced as fixed.</b></div><div><br></div><div><b>Root cause: the engine has TWO ways of deciding whether an attacker has Devastating Critical, and devcrit-roll only closed one.</b> An attack made with an ITEM looks the feat up in the weapon's baseitems.2da row, which is the column devcrit-roll blanked. An UNARMED or CREATURE-WEAPON attack never reads that column — the engine reaches for FEAT_EPIC_DEVASTATING_CRITICAL_UNARMED (506) / _CREATURE (532) itself. No 2DA edit can reach that path, so possession of the feat is the only thing left to take away.</div><div><br></div><div><b>Evidence.</b> The reporter's character (servervault Q6UY7GCH, \"Methonash, -Divine Tunes-\", level 59) is bard 29 / monk 21 / fighter 6 / prestige 3 with <b>nothing in either hand</b>, gloves in the ARMS slot, and exactly one devastating-critical feat: <b>506, unarmed</b>. No weapon devcrit feats at all. The installed haks were ruled out first: the EpicWeaponDevastatingCriticalFeat column is blank on all 510 rows in both the season 2 hak (Aug 13 23:07) and the dev hak (Aug 13 21:23); only the season 1 archive's home carries the old populated hak, which is expected since s1 never received devcrit-roll. No stray baseitems.2da in any override/ or development/ folder, and lotr_rules is first in Mod_HakList.</div><div><br></div><div><b>Why UAT missed it:</b> the original refix was validated against the Combat Dummy, punched by a weapon-wielding tester. The one attack form the blanked table cannot cover is the one form that was never tested.</div><div><br></div><div><b>Fix.</b> New DevCrit_ArmNoDevCrit() in devcrit_inc.nss records the entitlement in a local (DEVCRIT_HAD_UNARMED / DEVCRIT_HAD_CREATURE) and then removes feats 506/532 with NWNX_Creature_RemoveFeat. Armed from mod_cliententer.nss (login), legfeat_lvl.nss (a level-up hands the feat back, because the engine offers a feat the character no longer holds) and nw_c2_default9.nss via the new one-line devcrit_arm.nss (creature spawn, behind two GetHasFeat calls so the ~500 blueprints holding neither feat pay nothing; 24 blueprints hold 506, 13 hold 532). DevCrit_HasDevCrit() resolves the unarmed and creature branches through the snapshot, so the replacement dice are unchanged. bin/gen-legendary-feats.py teaches LegFeat_HasAnyDevCrit to accept the snapshot — without that, stripping the feat would quietly cost every monk the Legendary Butcher prerequisite. feat.2da is unchanged: <b>module-only, no hak rebuild and no NWSync</b>.</div><div><br></div><div><b>New alarm.</b> devcrit_atk.nss's iAttackResult==10 branch is now DevCrit_AlarmEngineCrit(): one unconditional WriteTimestampedLogEntry (plus a message to any admin online — there is no DM console) naming the attacker, target, weaponAttackType, weapon resref/base item and which of feats 0/506/532 the attacker holds. That branch is meant to be unreachable, so if it ever fires it is the whole diagnosis in one line instead of another round of guessing — in particular it distinguishes this cause from the secondary theory that the engine reads a blank cell as feat 0 (Alertness, which the reporter also has).</div><div><br></div><div><b>devcrit_eff.nss deleted</b>, with its NWNX_ON_EFFECT_APPLIED_BEFORE subscription and its section of tests/check_devcrit.py. It was already documented as a safety net that never caught the kill, and it was the source of the admin's second clue: the \"devcrit_eff ERROR too many instructions\" spam is <b>collateral, not a devcrit bug</b>. In nwnxee-homer-s2/logs.1 (2026-08-15 05:48:45, 14 hits, tag GateAxeman) the lines always come as a triple — eff_dur_x2 (level 1, 2450us), devcrit_eff (level 1, 17us), X2_S2_CurseSong (level 0, 73196us). Curse Song walks a RADIUS_SIZE_COLOSSAL sphere applying a linked temporary effect per target (x2_s2_cursesong.nss:372-406); every one of those fires the two per-effect subscribers nested inside the song's already-exhausted VM budget, and the children are charged for the parent's overrun. Removing devcrit_eff takes a per-effect global hook off every effect applied on the server and halves that noise. <b>The real overrun — Curse Song's loop multiplied by eff_dur_x2's remove-and-reapply — is untouched here and needs its own item.</b></div><div><br></div><div><b>Gate.</b> tests/check_devcrit.py section 4 was replaced: the helper exists, NWNX_CREATURE_SKIP=n is set, all three arming hooks call it, the dice still resolve through the snapshot, and the two local names in the GENERATED legfeat_ids_inc.nss still match the constants in devcrit_inc.nss (a typo there is silent in both directions). It also now fails if the deleted devcrit_eff subscription ever comes back.</div>"
    design_questions:
      - question: "Stripping feats 506/532 takes them off the character sheet, and they will be absent from the .bic the next time that character is saved. Proposed: accept. The feat's only remaining function is to say 'this attacker earns the +3 replacement dice', which the snapshot preserves exactly - the character loses nothing mechanically, including the Legendary Butcher prerequisite. The alternative is leaving fist builds on save-or-die, since no 2DA edit can reach that engine path."
        status: open
        answer: null
      - question: "Should the WEAPON path be hardened too, by pointing the baseitems column at a sentinel feat row nobody can hold instead of blanking it? Proposed: not yet. It would guard against the engine reading a blank cell as feat 0 (Alertness), but it costs a feat.2da row, a TLK string, a hak rebuild and an NWSync publish. The new alarm will convict that theory in one log line if it is ever true - do it only if the alarm fires for an attack made with a weapon."
        status: open
        answer: null
    manual_steps:
      - step: "UAT - the reported bug. On dev, with an unarmed character holding Devastating Critical (Unarmed) (picfister.bic or picfingerofdeath.bic both have feat 506), punch a normal creature until criticals land: NO Fortitude save line in the combat log and no instant kill, and the critical still carries the +3 bonus dice (d6, unarmed)."
        status: open
        kind: uat
        tester: "monk or unarmed build with Devastating Critical (Unarmed)"
      - step: "UAT - both engine paths. Repeat the punching test twice, once with gloves or bracers equipped in the ARMS slot and once with that slot empty. The reporter was wearing gloves; the bare-armed case is the other lookup."
        status: open
        kind: uat
        tester: "monk or unarmed build with Devastating Critical (Unarmed)"
      - step: "UAT - the half that already worked, as a regression check. A weapon-wielding character with Devastating Critical for that weapon still gets +3 dice on an ordinary critical, and the Combat Dummy's DPR/APR readout is unchanged."
        status: open
        kind: uat
        tester: "level 60 melee with Devastating Critical"
      - step: "UAT - the prerequisite. A character whose only devastating critical is the unarmed one can still qualify for Legendary Butcher in the picker after the feat has been stripped at login."
        status: open
        kind: uat
        tester: "level 60 monk with Devastating Critical (Unarmed)"
      - step: "After the dev session, grep the dev nwengineLog.txt: the new [DEVCRIT ALARM] line must be ABSENT (it means the engine resolved a devastating critical anyway), and there must be no 'devcrit_eff ... TOO MANY INSTRUCTIONS' lines. The eff_dur_x2 / X2_S2_CurseSong pair WILL still appear - that is the separate Curse Song item, not a regression here."
        status: open
        kind: uat
        tester: "any"
      - step: "Promotion to season 2 is NOT done and must not happen without the admin's explicit word - the live realm is where -Methonash- reported this. Module-only change, so promotion is repack + restart there; no hak rebuild and no NWSync."
        status: done
        kind: publish
  - id: store-blueprint-audit
    title: "Store audit: 19 store blueprints are placed in no area, and 44 merchant scripts open a store tag that no placed store answers to"
    group: quests-areas
    status: later
    type: Defect
    player: "HomelessSon (Server Admin)"
    notes: "<div>Housekeeping pass over the module's shops, spun out of the store-divergence build gate. Two separate piles, both found by scanning rather than by anyone reporting a broken merchant, so the player impact still has to be confirmed shop by shop.</div>"
    impl_notes: "<div><b>Pile 1 — 19 local .utm blueprints placed in no area.</b> A store blueprint that is never placed is unreachable unless a script creates it, so editing it does nothing (the same class of trap as <a href=\"#idea-heal-soul-fatigue-rebalance\">the Well-Mart potions</a>, which went into the blueprint and never appeared in game). Three sub-cases: <b>(a) legitimately runtime-created</b> — pw_odostore is built by CreateObject in pw_shop.nss and cached on Odo, so the blueprint IS live; <b>(b) real stock, no way in</b> — houseofhealarmor (215 items), watchmans4real (184), tournamentmercha (129), houseofhealmage (123), houseofhealtempe (110), darkstar (10), marks_shop (10); <b>(c) empty shells</b> — blueprint, blueprint001, deadmenguild, gondormerc, gondortemple, minasarc, minasarc001, stealstore, the three firstbankofmi* (0 items each), which are probably just retired.</div><div><br></div><div><b>Pile 2 — 44 store-opener scripts whose tag matches no placed store</b> (case-insensitive). Every one of them falls through to ActionSpeakStringByStrRef(53090), i.e. the merchant says he has nothing rather than opening a shop. Includes three openers each for houseofhealarmor and watchmans4real (openstore021/030/035, openstore024/031/032), openstore022/023/033/034 for the other two House of Healing counters, openstore053 (firstbankofmiddleearth), openstore054 (deadmenguild), openstore058/059/060 (WellMart — note the live Well-Mart opener is openstore061, tag wellshop, which does work), plus at_056, at_062, at_074, at_lagnar02, dunharrow_shop, radagastshopys, tagget_merchant and the NW_STORE* family. Most are wired to a conversation node, so each needs checking against whether that NPC is even placed before deciding between placing the store, retiring the script, or repointing the tag.</div><div><br></div><div>Neither pile fails the build: tests/check_divergent_stores.py only reports unplaced blueprints as an advisory line, and does not look at opener scripts at all. Worth a gate of its own once the piles are cleared, otherwise it would fail on day one.</div>"
    manual_steps:
      - step: "Decide per shop in pile 1(b) whether the stock is meant to be reachable — place the store in the right area, or retire the blueprint. 215-item houseofhealarmor is the big one."
        status: open
        kind: admin
      - step: "For pile 2, cross-check each opener against its conversation and the NPC's placement before touching anything: a dead script on an unplaced NPC needs no fix."
        status: open
        kind: admin
      - step: "UAT any shop that gets placed or repointed: talk to the merchant, confirm the store opens and the buy cap/mark-up behave."
        status: open
        kind: uat
        tester: "any"
  - id: gondor-scribe-findability
    title: "Well of Souls Quest: cannot find the Gondor Scribe in the High Wizard tower"
    group: quests-areas
    status: awarded
    merit_awarded: true
    type: Defect
    player: Szescian82
    date: "2026-08-15"
    commit: 1413efac746
    notes: "<div><b>The Gondor Scribe is easy to find now.</b> She was always there — she was just standing around the corner by the stairs, wearing the wrong body. The game had her down as a halfling villager, which also meant her scribe's robe never appeared on her at all, so what you actually walked past was a small woman in plain clothes tucked out of sight in a Gondorian wizard's tower. She is now a robed human woman standing out in the open on the tower's ground floor, and she looks like what she is.</div><div><br></div><div><b>Your journal also tells you who to ask for.</b> Hanee's entry used to send you to \"the fancy wizard folk at the Tower of the High Wizard\" and leave it there — so people quite reasonably went hunting for a wizard, found four of them with nothing to say, and climbed to the top of the tower for nothing. It now names the Gondor Scribe and says she is on the ground floor.</div><div><br></div><div>Nothing about the quest itself changed: the head still turns in for 10,000 XP, and starting cold at the scribe still works. Details: <a href=\"QuestGuide.html#well-of-souls\">Quest Guide → Well of Souls</a>.</div>"
    impl_notes: "<div><b>She was never missing, and nothing was corrupt.</b> gondorscribe has been placed in area011 since 580bfd30ca4 (2026-07-13) and was never removed. Confirmed by extracting area011.git out of all three built .mod files — dev, S1 and the live S2 module — with nwn_erf; she is in the creature list of all three, so this was not a stale deploy. Her conversation was intact throughout (StartingList: entry 10 / sc_003 → at_008 head turn-in, entry 9 / sc_007, unconditional fallback entry 0), no spawn script, no encounter, no gating. Structural audit came back clean on every axis: the blueprint's field set is identical to its base comfemale002 (68 fields, 27-entry SkillList like 750 of 779 blueprints), the instance did not diverge from the blueprint, area011.gic.json was aligned with __struct_id 4 on all four creature comments, and her palette leaf was well-formed (CR/FACTION/NAME/RESREF, the shape 224 of 238 siblings use) and filed in the category whose ID is 44, matching her PaletteID.</div><div><br></div><div><b>Root cause 1 — a static NPC model.</b> Appearance_Type was <b>250 = \"Halfling: Female\"</b> (hak_2da/appearance.2da, model c_ynpc_a_f01). Static NPC models do not render equipment, so her equipped nw_cloth024 robe was invisible — she was a halfling villager standing among two appearance-6 (Dynamic) Human Gondorian Wizards. Her PortraitId 92 was already hu_f_99_ (human female), so the portrait and the model had disagreed since she was created. Fixed by copying the appearance block verbatim from <b>gondorianwiza001 (Sarah the Librarian)</b> — a human female one floor up in the same tower, so the look is already proven in this tileset: Appearance_Type 6, Appearance_Head 104, Color_Hair 7, Color_Skin 0, Color_Tattoo1/2 53, and her full BodyPart_* set (Torso/Pelvis/Neck/L+R Bicep/FArm/Hand/Shin/Thigh + LFoot = 1, L+R Shoul and Belt = 0). <b>Equipment deliberately untouched:</b> nw_cloth024 is stock BaseItem 16 (robe) with zero properties, so it simply starts rendering — no loot or balance change. Sarah's own gondorianrobe001 was rejected as a donor robe: 1.19M gold, 9 properties. Applied to the blueprint <b>and</b> the area011 instance, because the instance wins at runtime and the blueprint is what se_respawn_inc.nss rebuilds from — and tests/check_divergent_creatures.py does <b>not</b> gate appearance, portrait or voiceset, so that sync is manual and ungated.</div><div><br></div><div><b>Root cause 2 — position.</b> X40/Y11 put her around the corner by the stairs, off to the side of the two wizards. Moved to the admin-supplied X33.8 / Y47.47 / Z0, bearing 181.4° (XOrientation -0.999701, YOrientation -0.024432 = cos/sin). Nearest instance is gondorianguar0_3 at 8.75 units; area011 is 7×6 tiles (70×60). No .gic change and no gen-map-notes.py re-run needed — she is not a transition or a teleporter.</div><div><br></div><div><b>Root cause 3 — the journal never named her.</b> Ruin of Annuminas entry 2 said only \"the fancy wizard folk at the Tower of the High Wizard in Gondor\". Every other NPC in the tower — both gondorianwizar_2, gondorianwiza001 (Sarah) and highwizardofgo_2 (High Wizard of Gondor) — has an <b>empty Conversation field</b>, so a player looking for \"wizard folk\" clicks four mute NPCs and climbs to a dead end. Entry 2 now names the Gondor Scribe and the ground floor. The mute wizards were left mute by decision — the journal does the signposting.</div><div><br></div><div><b>Admin's toolset error was the old module, not corruption.</b> The \"corrupt or missing blueprint/creature\" message and the scribe's absence from the toolset came from a pre-July .mod, which predates 580bfd30ca4 and therefore has neither gondorscribe.utc nor its palette leaf. That copy must not be saved or repacked — it would revert a month of work.</div><div><br></div><div>Repack passed 25/25 smoke tests with dialog integrity clean; the packed dev module was re-extracted to confirm appearance 6 / head 104 / X33.8 / Y47.47 / bearing 181.40. Module-only — no hak, TLK or NWSync rebuild.</div>"
    manual_steps:
      - step: "UAT (closes the report): enter the Tower of the High Wizard ground floor from Minas Tirith. The Gondor Scribe must be visible in the open — not around the corner by the stairs — at roughly X33.8/Y47.47, and must render as a ROBED HUMAN WOMAN, not a halfling. Her name plate reads 'Gondor Scribe'."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (head turn-in unchanged): carrying azagothshead, talk to her — entry 10 fires at_008, awards 10,000 XP and consumes the head."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (cold start unchanged): talk to her WITHOUT the head — the Well of Souls briefing still runs and the Annuminas Key path (sc_annukey / at_007) still grants exactly one key per character, ever."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (still unkillable): attack her and confirm Plot=1 survived the reskin — she cannot be killed."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT (journal): after handing Azagoth's head to Hanee in Bree, read Ruin of Annuminas entry 2 — it must name the Gondor Scribe and say she is on the tower's ground floor."
        status: open
        kind: uat
        tester: "any"
      - step: "Repack and restart the server. Module-only — no hak, TLK or NWSync rebuild is needed."
        status: open
        kind: publish
  - id: ambiguous-transition-tags
    title: "Duplicate and generic area-transition tags: one Dol Guldur exit may lead to the wrong area, and 16 Gwathdor transitions have no destination map pins"
    group: travel
    status: confirmed
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-08-15"
    notes: "<div>Two related problems with the way some area transitions are labelled. In <b>Dol Guldur</b>, the exit from the Tower of Black Magic Main Hall points at a destination name that exists in two different places at once, so it is not certain which one it actually drops you in. In the <b>Gwathdor</b> deeps, tombs and caves, sixteen transitions all share the same generic name, which is why those doorways show no destination label on your map — you cannot tell where a passage goes until you walk through it.</div>"
    impl_notes: "<div>Surfaced by bin/gen-map-notes.py, which reports them as \"ambiguous source tags\" and skips them (no pin written). Confirmed by hand 2026-08-15; <b>no .nss script references any of these tags</b>, so retagging is safe.</div><div><br></div><div><b>1. Dol Guldur — a real routing risk, not cosmetic.</b> The door Dolin2Dolout in dolguldurcastle (Dol Guldur: Tower Of Black Magic Main Hall) at (25.0, 10.0) has LinkedTo = Dolout2Dolin, and <b>two different objects carry that tag</b>: a newtransition trigger in dolguldur001 (Dol Guldur) at (89.5, 70.8), and an nw_door_ttr_18 door in dolguldurcity (Dol Guldur City) at (65.0, 127.0). NWN resolves LinkedTo by tag, so the destination is whichever the engine finds first. LinkedToFlags = 1 (door) probably biases it toward the Dol Guldur City door, but that is an inference, not a guarantee — it needs an in-game check before anything is changed.</div><div><br></div><div><b>2. Gwathdor — cosmetic, map pins only.</b> Sixteen triggers across four areas all carry the toolset default tag AreaTransition. Every one has a distinct and correct LinkedTo, so <b>gameplay is fine</b>; only the map-note generator is defeated, because it keys pins by source tag and cannot tell two same-tagged triggers apart. Affected: gwathdorcave (Gwathdor: Cave) 2 triggers → GwathTW0 (Outskirts), GwathTW3 (East Deeps); gwathdordeeps (Gwathdor: East Deeps) 6 → GwathTW2 (Cave) + GwathTW5a-e (West Deeps); gwathwest (Gwathdor: West Deeps) 6 → GwathTW4a-e (East Deeps) + GwathTW7 (Tomb); gwathtomb (Gwathdor: Tomb) 2 → GwathTW6 (West Deeps), GwathTW9 (Throne of the Lord).</div><div><br></div><div>Unrelated to the Gwathdor Labyrinth: that maze is area025 and is driven by GwathLab* tags plus the MAZE_DEST local string in gwathlab_wire/door/trig.nss. It shares no tags with these four areas.</div><div><br></div><div>AreaTransition is used 27 times across 12 areas in total. The other 11 instances are single-per-area (area012, castleexterior, gwaththrone, hennethannun, hennethannun002, roadtoharad, thewelloferu) or all share one destination (cryptsofthelosts, 4), so they resolve unambiguously and are not part of this defect — though retagging them too would make the convention uniform.</div>"
    manual_steps:
      - step: "UAT FIRST (do this before any edit): walk out of Dol Guldur: Tower Of Black Magic Main Hall through the Dolin2Dolout door and record which area you actually land in — Dol Guldur (dolguldur001) or Dol Guldur City (dolguldurcity). Everything else about the Dol Guldur half depends on this answer."
        status: open
        kind: uat
        tester: "any"
      - step: "Decide which area the Tower main hall is SUPPOSED to exit to, then rename the losing Dolout2Dolin instance to something unique (suggested: Dolcity2Dolin on the dolguldurcity door, or Dolout2Dolin_city) and repoint anything that links to it. Renaming the one the door should NOT use is the smaller change."
        status: open
        kind: toolset
        blocker: true
      - step: "UAT: after the rename, walk the Dol Guldur loop in both directions and confirm each transition lands where its map pin says."
        status: open
        kind: uat
        tester: "any"
      - step: "Retag the 16 generic AreaTransition triggers in gwathdorcave / gwathdordeeps / gwathwest / gwathtomb to unique names. Suggested scheme, mirroring the destination waypoints they already point at: gwath_to_GwathTW0, gwath_to_GwathTW5a, and so on — one trigger, one tag, name derived from LinkedTo. No script reads these tags, so this is a pure .git.json edit."
        status: open
        kind: toolset
      - step: "Re-run python3 bin/gen-map-notes.py --apply afterwards and confirm the ambiguous-source-tag list drops from 5 to 0 and the Gwathdor passages gain destination pins."
        status: open
        kind: admin
      - step: "Optional consistency pass: retag the remaining 11 generic AreaTransition instances (area012, castleexterior, cryptsofthelosts x4, gwaththrone, hennethannun, hennethannun002, roadtoharad, thewelloferu). They already resolve correctly, so this is tidiness rather than a fix."
        status: open
        kind: toolset
  - id: soul-fatigue-not-working-while-shapeshifted
    title: "Soul fatigue not working while shapeshifted"
    group: items-gear
    status: manual
    type: Exploit
    player: "Sync (Shync)"
    date: "2026-08-21"
    commit: f1bbb743474
    notes: "<div><div><div><span>im pretty sure the soul fatigue doesn't work while in dragon shape</span></div></div><div><div></div></div></div><div><div> <div><span>Used like 3 pots earlier and was still getting 100%</span></div></div></div><div><br></div><div><b>Fixed 2026-08-21.</b> Soul-fatigue now bites in every shape. The fatigue hit is deliberately a straight loss of hit points rather than damage, so that no amount of resistance can soak it — but while you were polymorphed the game keeps a second pool of hit points for the form, and the loss was landing on the wrong one. Dragon shape (and every other wild shape, shifter shape and polymorph) could therefore chain Heal potions for free. The drain is now written through both hit-point layers, so it lands whichever form you are wearing, and the message tells you what it actually took. Unshifted behaviour is unchanged: the first heal is still free, each stack you were already carrying still costs 8% of your maximum hit points, and your Heal skill still cuts the bill. Full detail: <a href=\"https://homerslotr.com/manual/Customizations#soul-fatigue\">Customizations — Soul-fatigue on Heal</a>.</div>"
    impl_notes: "<div>Root cause: heal-soul-fatigue-rebalance switched the hit from EffectDamage to a raw SetCurrentHitPoints() write so gear resistances could not soak it. A script-layer HP write does not reliably land on a polymorphed creature — the engine keeps a separate hit-point pool for the form. The module already works around the same split elsewhere: pers_state_inc.nss skips HP capture for morphed shifters (\"their morphed HP would stomp the real value\") and pc_export_inc.nss refuses to export them at all.</div><div><br></div><div>Fix is contained to fat_inc.nss. New FAT_DrainHP() writes the drain through both the script layer and NWNX_Object_SetCurrentHitPoints(). Both writes are ABSOLUTE (set to the target value, never subtract), so issuing both unconditionally is idempotent and can never double-charge; whichever layer is authoritative for the shape, one lands. It then verifies the HP actually moved and only then falls back to EffectDamage(DAMAGE_TYPE_MAGICAL, DAMAGE_POWER_ENERGY) — soakable, but better than the free heal it replaces — and returns what was really taken, which is what the floating text now reports.</div><div><br></div><div>Also hardened the percentage basis: it now uses max(current, maximum) hit points, so a form whose own pool exceeds the character sheet cannot shrink the bill and a 0 returned on error cannot silently zero the whole hit, and a carried stack's cost is floored at 1 HP. The hook itself was never the problem — Potion of Heal (it_mpotion029/032) carries item property Cast Spell: Heal, so it runs the real spell script and reaches the stop_spellcheat override in every shape.</div><div><br></div><div>Noted but deliberately not changed: a shifter in <b>Undead Shape</b> still gets no stack, because EffectPolymorph overrides racial type and Heal harms undead rather than healing them — there is no heal to charge for. Separately, rm_healingscript.nss and gddrink2.nss heal via EffectHeal without casting a spell and so bypass fatigue entirely; unrelated to shapes, worth its own item if it matters.</div>"
    manual_steps:
      - step: "UAT the reported case: in dragon shape, drink a Potion of Heal (free, 1 stack), then drink a second one within 3 minutes. The second must top you off and then take 8% of max HP straight back off, with the \"Soul-fatigue tears at you for N damage\" message. Before the fix HP never moved."
        status: open
        kind: uat
        tester: "shifter with Dragon Shape (or any polymorph), 2+ Potions of Heal"
      - step: "UAT a second, non-dragon form (wild shape / elemental / greater wildshape) the same way, to confirm the fallback chain is not dragon-specific."
        status: open
        kind: uat
        tester: "shifter, any wild shape"
      - step: "UAT unshifted regression: same two-potion test in your own form. The bill must be unchanged from before (8% of max HP per prior stack, less the healer's Heal skill), and the number in the message must match the HP actually lost."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT the lethal path in shape: chain heals until the fatigue hit exceeds current HP. It must kill (you respawn still carrying the stacks), not floor you at 1 HP."
        status: open
        kind: uat
        tester: "shifter, expendable character or a healthy margin"
  - id: encounter-empty-spawn-points
    title: "230 encounters have no spawn points (engine picks the spot)"
    group: combat-classes
    status: planned
    hidden: true
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-08-24"
    notes: "<div>An encounter can carry a SpawnPointList naming where its creatures appear. <b>230 of the 778 placed encounter instances (29.6%) have that list empty</b>, so the engine falls back to choosing its own point inside the encounter geometry polygon -- which is where the \"monsters appeared on top of me / inside the scenery / somewhere I could not reach\" class of report comes from.</div><div><br></div><div>Worst clusters: shelobslair x12; ~37 across northernfores001/004/005 and northernforestso (ithilien rangers and mordorithilien); deadmarshes x9; cardolan NW_HILLGIANTGRP x9; enchantedcave001 x9; oldforestroad x8; woodoflegolas x7; ruinsofannuminas X2_GOLEM001 x7; mistymountainsa x6; eredduathroada x6.</div>"
    impl_notes: "<div>Found while fixing [[encounter-spawns-levels-41-60]] and deliberately left out of it: <b>neither reported area is affected</b> -- every hardspiders instance in mirkwoodcentrals and every dimwald instance in area018 has a spawn point -- so this cannot be the cause of <i>wrong mobs spawning</i>. It is a placement-quality issue with its own fix and its own UAT.</div><div><br></div><div>Reproduce the list by walking Encounter List -&gt; SpawnPointList over every unpacked/*.git.json. Fixing it means picking reachable coordinates per encounter (bin/place-helper.py) and appending SpawnPointList entries -- roughly triples the size of the CR fix, hence separate.</div>"
