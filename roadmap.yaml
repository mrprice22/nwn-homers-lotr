  - id: ll-xp-award-balance
    title: "Retune XP awards for the 41-60 band"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-13"
    commit: 05fb2d8e3ac
    notes: "<div><b>Update 2026-08-13 (second pass): low-level kills now pay properly too.</b> The first pass fixed the top of the range and broke the bottom of it in a quieter way -- a brand-new character killing the creatures it is actually meant to fight was paid the same token 60 as a level 55 killing the same thing. Starter content now pays real experience: about <b>300 XP</b> for the weakest creature in the game at level 1, ~650 for a CR 1 and ~1,100 for a CR 2, rising smoothly to the 2,000 a CR 5 already paid. Nothing at level 21 or above changes, and the 6,000 cap is untouched.</div><div><br></div><div>Levelling from 41 to 60 works again. Kill experience above level 40 was awarding <b>nothing at all</b> -- the level cap was raised without extending the table that decides what a kill is worth, so the legendary band could not be finished by fighting. It now pays properly, and the whole 1-60 experience curve was rebuilt around it.</div><div><br></div><div>What you will notice:</div><div>• <b>Kills pay at most 6,000 XP</b>, at every level -- 12,000 with a premium 2x boost active.</div><div>• <b>Challenge Rating matters again past CR 40.</b> It used to stop counting there, so a CR 45 spider and a CR 1,461 boss were worth the same.</div><div>• <b>You are never paid less for being a lower level.</b> The old table could pay a level 1 character less than a level 6 for the identical kill.</div><div>• <b>You outgrow content.</b> Each level raises the CR needed for a full payout, walking you from the Wold and Ettenmoors up through Mordor and Gondor.</div><div>• <b>At level 60 experience keeps accumulating</b> on your character rather than stopping.</div><div><br></div><div>The full table is on the <a href=\"Customizations.html#kill-xp\">Customizations page</a>.</div>"
    impl_notes: "<div><b>SECOND PASS 2026-08-13 -- the low-CR knee.</b> Measured in game: a level 55 killed a CR 0.5 Bree skeleton for 60 (correct -- tier(55) is CR 250, so the knee sits at CR 12.5), then the same character de-levelled to 1 killed it for 60 as well (wrong). Root cause: LLXP_KNEE was a flat 0.05 of tier at EVERY level, and tier(1) is CR 30, so at level 1 the knee landed on CR 1.5 -- it swallowed the starter content itself. The level-1 row jumped 12x between CR 1 (60) and CR 2 (746).</div><div>• <b>bin/gen-xptable.py</b> NEW, and now the owner of the levels 1-40 model. The first pass shipped hak_2da/xptable.2da with no generator, so the model existed only as 8,040 numbers -- which is why this was invisible. It solves knee(1), E(1), E(21) and tier(21) from the anchors at run time; nothing is transcribed.</div><div>• <b>The knee fades in</b> rather than being flat: ~0.0118 of tier at level 1, reaching the shipped 0.05 at level 21. The exponent is interpolated alongside it, because one exponent cannot serve both the level 1 and level 21 anchors once the knee moves. Result: level 1 pays 300 at CR 0.5, 649 at CR 1, 1,096 at CR 2, and still exactly 2,000 at CR 5 and 6,000 at CR 30.</div><div>• <b>Levels 21-60 are unchanged</b> by design -- the flat knee is correct up there, where the tier is high enough that it only ever catches genuine trash. Rows 21-40 move by at most 1 XP per cell, from reconstructing the original fit in float; the anchors themselves land exactly.</div><div>• <b>New admin anchor:</b> level 1 / CR 0.5 = 300. The four original anchors are untouched.</div><div>• <b>Accepted consequence:</b> at a fixed CR 0.5 the award falls 300 (L1) -&gt; 202 (L2) -&gt; 60 (L3), because the ramp is near-vertical at the knee (E &lt; 1). CR 0.5 is the bottom of the game and a level 3 character should not be farming it, but the drop is steep and is recorded here rather than hidden.</div><div>• <b>tests/check_epic_tables.py</b> gains three checks: the 2DA must equal what gen-xptable.py produces (imported, not transcribed, same as the caster-slot gate), a level 1 character must be paid at least 250 for the lowest-CR kill, and the level-1 row must have no adjacent-CR jump above 3x. Verified to fire against the pre-fix table.</div><div><br></div><div><b>FIRST PASS.</b></div><div><b>Root cause.</b> Raising the cap to 60 extended exptable.2da (the COST of a level) but never xptable.2da (the AWARD for a kill), which is stock at 40 rows x 41 CR columns. A level 41+ character indexed a row that does not exist and the engine paid zero. Season 1 was unaffected (-maxlevel 40, never indexes past the table); the bestiary kept logging kills because bst_ondeath is independent of the award, which is why this looked like a season-2 cutover regression for a while.</div><div><br></div><div><b>Blocking measurement, now resolved: case A.</b> A level 55 character killing endgame content gained nothing, which selects case A (0 XP past 40) from the three this item listed.</div><div><br></div><div><b>CORRECTION to this item's earlier analysis.</b> Two things recorded here on 2026-08-04 were wrong and were load-bearing for the old proposal. (1) The \"Target: 100-125 solo play-hours for 41-60\" was never approved by the admin -- he first saw it on 2026-08-13 and rejected it; the coefficient, clamp, boss multiplier and party rule had all been derived from it. (2) The \"module-wide 6,000 XP cap on creature kills\" was not a separate constraint: 6,000 is xptable.2da's level-40 row (400) x Mod_XPScale/10 (x15), i.e. the top of the stock table at the level everyone plays at. CLAUDE-autopilot.md gained guardrails for both classes of mistake (commit eb7a19bb91d).</div><div><br></div><div><b>What shipped.</b> One CR-versus-level model across all 60 levels: each level has a difficulty tier (the CR paying full value) and the award falls off below it. Tier ladder 30 (L1) -&gt; 99.8 (L21) -&gt; 150 (L41) -&gt; 300 (L60). tier(60)=300 because that is what is FARMABLE -- measured against bosses.json, non-boss content tops out at CR 701 and everything above CR 800 is a registry boss on a respawn timer.</div><div>• <b>hak_2da/xptable.2da</b> NEW, added to RULES_2DA, and extended to CR column C200: the engine clamps CR to the last column, so with stock's C40 ceiling the 6,000 cap became unreachable from level 9 once the tier ladder passed 40. Caught by a new gate before it shipped.</div><div>• <b>unpacked/ll_xp_inc.nss</b> NEW, levels 41-60, paid from bst_ondeath's existing contributor loop. nw_c2_default7 is the wrong hook (its _NSP check returns before the ExecuteScript line, and 193 creatures use x2_def_ondeath with no hook at all). party_xp and pwfxp are confirmed inherited dead code, never in git history.</div><div>• <b>6,000 hard cap</b> baked into the table and enforced again in boost_xp_evt.nss for engine awards, applied BEFORE the boost so a boosted kill tops out at 12,000. The handler recognises an engine award as a delta in (6000, 9000] -- nothing in unpacked/ grants in that window -- and quest XP is marked xp_script in nw_i0_tool.nss so a computed reward is never clamped.</div><div>• <b>Past level 60</b> XP stays on the character. GiveXPToCreature can decline to carry a character past the top of exptable.2da, so the grant is measured and written directly with SetXP if it did not land.</div><div>• <b>XP tracing</b> gated on SP_DEV_TOOLS, so it is on for the test realm and off for a live season automatically rather than depending on a hand-set flag surviving promotion.</div><div><br></div><div><b>Pacing.</b> ~9.9 h solo unboosted for 41-60 at 90 kills/hr, ~5 h boosted, measured against the real endgame roster. A 20 h target was costed and declined as arithmetically impossible alongside the other requirements: 2,752,200 XP at a 6,000 cap is a 5.1 h floor, so 20 h needs an average of 1,529/kill, which contradicts full value being reachable on farmable content. The only lever that delivers it is raising the 41-60 cost curve, which de-levels every existing 41+ character.</div><div><br></div><div><b>Gates.</b> tests/check_epic_tables.py gains four checks: the 6,000 cap, column monotonicity (a lower level is never paid less), every level being able to reach the cap at some CR, and the sub-40 curve. All verified to fire against the stock table. 24/24 smoke tests.</div><div><br></div><div><b>Deployed to the TEST realm only</b> (hak installed, NWSync published, module repacked, server restarted 2026-08-13 20:14). Production gets it at the next season-promote.</div>"
    design_questions:
      - question: "THE RETUNE ITSELF -- approve the numbers. Target: 100-125 solo play-hours for 41-60, with a 5 x CR award clamped to [100, 3000] paid only at level 41+."
        status: answered
        answer: "REJECTED, and the target with it -- it was never approved and was seen for the first time on 2026-08-13. The admin set the shape instead: a 6,000 hard cap per kill (12,000 boosted), an award that scales with CR versus the player's own level, and a curve fitted to four anchors he chose directly -- level 1/CR 5 = 2,000, level 1/CR 30 = 6,000 (full), level 21/CR 5 = 100, level 41/CR 30 = 500. Resulting pace is ~9.9 h solo unboosted; a 20 h target was costed and declined as incompatible with full value being farmable."
      - question: "PARTY SPLIT OR FULL-TO-EACH? Proposal: the full award to each contributor."
        status: answered
        answer: "APPROVED as proposed -- the full award to each contributor, matching RewardPartyXP semantics. Paid from bst_ondeath's existing contributor loop, which already excludes summons, henchmen, DMs and environmental deaths."
      - question: "BOSSES -- do they get a multiplier?"
        status: answered
        answer: "NO multiplier. Bosses are for loot; the CR-versus-level curve already pays them the full 6,000 at any level where they are on-tier."
      - question: "DOES THE SCRIPT AWARD STACK ON TOP OF THE ENGINE'S?"
        status: answered
        answer: "No -- the measurement came back case A (the engine pays literally zero past level 40), so there is nothing to stack on. The award is gated at level 41+ so it never doubles with the engine below that, and levels 1-40 are handled by the rebuilt xptable.2da rather than by script."
    manual_steps:
      - step: "UAT: on the TEST realm, kill one creature with a level 41+ character and confirm XP is granted. The dev realm logs an [xpdbg] line per XP write (gated on SP_DEV_TOOLS, so this is silent on a live season) -- the line should show the award and, if a boost is active, the doubling."
        status: open
        kind: uat
        tester: "level 41+"
      - step: "UAT: with a level 60 character, kill something and confirm the XP total keeps climbing PAST 3,581,000 rather than stopping. This is the case GiveXPToCreature can silently refuse, so it has a direct SetXP fallback -- worth confirming in game."
        status: open
        kind: uat
        tester: "level 60"
      - step: "UAT: with a low-level character, confirm the rebuilt 1-40 table pays as documented -- e.g. at level 1 a CR 30 kill should pay the full 6,000 and a CR 5 kill 2,000. Clients must have pulled the new hak over NWSync for the table to apply."
        status: open
        kind: uat
        tester: "any"
      - step: "Promote to production: the fix is deployed to the TEST realm only. Production needs bin/season-promote.sh, then bin/build-lotr-rules-hak --install, bin/refresh-nwsync and a restart on that realm -- xptable.2da is a hak change, so clients re-download. See CLAUDE.md 'Publishing to clients'."
        status: open
        kind: publish
      - step: "Housekeeping, admin's call: unpacked/attackxp.nss grants 50,000 XP to GetLastHostileActor() and is referenced by nothing. Harmless today but a live grenade if it is ever attached to an event -- delete it, or keep it deliberately?"
        status: open
        kind: admin
      - step: "SECOND PASS publish to the TEST realm -- xptable.2da changed, so a client holding the old hak silently reads the old awards: bin/build-lotr-rules-hak --install, then bin/refresh-nwsync (run DETACHED, 10+ min), then bin/server-restart."
        status: open
        kind: publish
      - step: "SECOND PASS UAT: with a LEVEL 1 character, kill a Bree graveyard skeleton (CR 0.5, blueprint skeleton001) and confirm roughly 300 XP rather than 60. This doubles as proof the new hak reached the client -- the old table pays exactly 60 here."
        status: open
        kind: uat
        tester: "any"
      - step: "SECOND PASS UAT: the same CR 0.5 skeleton killed by a level 41+ character must STILL pay the 60 floor. That half of the curve was never wrong and must not move."
        status: open
        kind: uat
        tester: "level 41+"
  - id: ll-hgll-remove-scripts
    title: "Remove the HGLL leveler scripts"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    hidden: true
    merit_awarded: true
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-07-25"
    commit: d212c3c2b0809a8983140d6b9995d5dd9403b984
    notes: "<div>The old legendary-leveller machinery is gone. Levels 41 to 60 are ordinary levels now — you earn them with experience, wherever you happen to be standing, with no statue to visit and no separate ritual. The statue in the Legendary Levelling Area no longer does anything but say so.</div>"
    impl_notes: "<div>Deleted all 21 unpacked/hgll_*.nss files (incl. the 250 KB hgll_classft_inc and 176 KB hgll_featreq_inc feat tables, hgll_func_inc, hgll_leto_inc, hgll_const_inc, hgll_dlg_leveler, hgll_start_dlg, hgll_struct_stat, hgll_featlist_01–11, and the two gutted login stubs) plus sha_leto_inc.nss — 14,572 lines removed.</div><div>Four live references de-referenced first: the single ExecuteScript(\"hgll_cliententer\") in mod_cliententer.nss and ExecuteScript(\"hgll_client_exit\") in mod_clientexit.nss were dropped; mw_mixtape_con.nss lost its #include \"hgll_leto_inc\" in favour of a local MixtapeRaiseStat() over NWNX_Creature_Get/SetRawAbilityScore plus a direct ExportSingleCharacter() (identical behaviour to the old HGLL_AddStatPoint/HGLL_FlushChanges); and the ZEP_STATUES026 placeable in legendarylevelli.git.json had its OnUsed moved from hgll_start_dlg to the new ll_leveler_gone.nss stub, so the retired statue explains itself instead of pointing at a deleted script.</div><div>hgll_const_inc.nss had no consumer outside the deleted set — no constants needed relocating; code_redeem.nss already sources XP_LEVEL_60 from hak_2da/exptable.2da. The dead Windows Letoscript path const string NWNPATH went with it.</div><div>Also removed tests/check_hgll_transactional.py and its block in tests/smoke-test (closes <a href=\"#idea-ll-hgll-retire-gate\">ll-hgll-retire-gate</a>) — it inspected hgll_client_exit.nss and would have reddened the build. Smoke runner now reports 11/11.</div><div>Verified post-delete: no hgll/sha_leto_inc include, ExecuteScript or GFF script-field reference remains anywhere in unpacked/, tests/, bin/ or nasher.cfg (comments only), and nwn_erf -l on the packed .mod lists zero such resources. Docs synced: README.md, CLAUDE-nwscript.md, QuestGuide-DM-Notes.md.</div><div>Still standing, owned by <a href=\"#idea-ll-hgll-retire-area\">ll-hgll-retire-area</a>: the legendarylevelli area set, its Well of Eru trigger and the legenarea waypoint.</div><div><b>Follow-up 2026-07-27 (commit 10940270ca5):</b> the de-referencing pass missed one consumer — sha_subr_methds.nss:44 (Shayan's Subrace Engine) also includes sha_leto_inc.nss, which was deleted here as a \"near-duplicate\" of hgll_leto_inc. That file is included by default.nss, nw_o0_respawn.nss, nw_s2_turndead.nss, several spell overrides and the _dm_subrace_* wands, so a <b>clean</b> repack failed with 56 compile errors; incremental repacks reused the cached .ncs and hid it for two days. sha_leto_inc.nss is restored verbatim as a documented no-op shim (it was already NWNX:EE-neutered — LetoScript() returns \"\", the LETO_* helpers only build strings for it), so no behaviour changed. Excising it instead would have meant surgery on a 227 KB third-party file. Verified with a full standalone compile of every unpacked/*.nss against the module's 19 haks: 3159 successful, 162 skipped, 0 errored.</div><div><b>Lesson:</b> deleting a shared include needs a clean build, not an incremental one — nasher's cached .ncs will happily pack a module whose sources no longer compile. repack-homers-lotr-clean, or the standalone nwn_script_comp sweep above, is the check.</div>"
    manual_steps:
      - step: "UAT login/logout: log a character in and back out, then reconnect — the character must load normally and keep its inventory, journals and persistent state (the login and logout handlers each lost a call to a now-deleted script)."
