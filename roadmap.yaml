      - step: "UAT appearance: same for cg_amu_wiz (Dreamshard of Dol Guldur; palette Miscellaneous > Jewelry > Amulets)."
        status: open
        kind: uat
      - step: "UAT effect (Cleric): wearing cg_amu_cleric, cast Implosion on a death-immune boss -- it must take divine damage and the floating text must appear; repeat with the amulet removed and confirm the ordinary no-effect Implosion behaviour returns."
        status: open
        kind: uat
      - step: "UAT effect (Druid): wearing cg_amu_druid, cast Finger of Death on a death-immune boss and confirm negative damage lands."
        status: open
        kind: uat
      - step: "UAT effect (Sorcerer): wearing cg_amu_sorc, cast Wail of the Banshee into a group and confirm negative damage lands on up to caster-level targets and that allies are not hit."
        status: open
        kind: uat
      - step: "UAT effect (Wizard): wearing cg_amu_wiz, cast Weird on a mind-immune, death-immune boss and confirm magical damage lands."
        status: open
