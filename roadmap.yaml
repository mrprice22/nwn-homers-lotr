  - id: boss-enrage-on-retreat
    title: "Enrage-on-retreat: registry bosses taunt, gain +2 all stats for that life, and heal 25% of missing HP when a player disengages"
    group: bosses
    epic: difficulty-increase
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    commit: 044c61c14fa
    notes: "<div>Retreating from a boss now costs you. Every time you disengage from a Roll-of-the-Fallen boss, it taunts you by name, permanently gains +2 to all stats for the rest of that life, and heals a quarter of the damage you had done. Potion-attrition and tank-and-retreat no longer work — the winning line is one sustained, properly-geared engagement. Dying is not retreating; logging out is. The enrage never carries onto a respawn. Design: <a href=\"https://homerslotr.com/manual/boss-updates#enrage\">boss-updates#enrage</a>.</div>"
    impl_notes: "<div>Pure script on existing plumbing: new enr_inc.nss plus one call from bst_ondamage.nss. Scope is strictly the CR&gt;60 single-instance Roll-of-the-Fallen registry bosses; registry scoping is a cached query against respawndb's boss_registry so it always matches the board.</div><div><br></div><div>Left-combat detection is a hybrid: engagement rides the bestiary's OnDamaged wrapper (summons/pets resolve to the owning PC); disengagement is a boss-side 6s pseudo-heartbeat that only runs while someone is engaged. An engaged PC out of the area, beyond 40m, or logged out for ~12s counts as retreated.</div><div><br></div><div>Each retreat: shout taunt naming the PC, +2 all six abilities (supernatural, undispellable, stacks per retreat, dies with the creature so it can never persist onto a respawn), instant heal of 25% missing HP with a buff VFX. Ships with <a href=\"#idea-heal-soul-fatigue\">soul-fatigue on Heal</a>, which is what removes fatigue's 'retreat and wait out the stacks' escape hatch.</div>"
    manual_steps:
      - step: "UAT: damage a registry boss, then run >40m or leave the area &mdash; within ~12-18s it should taunt you by name, flash a VFX, regain HP and examine at +2 stats."
        status: done
        kind: uat
      - step: "UAT stacking: retreat again and confirm the +2 stacks."
        status: done
        kind: uat
      - step: "UAT respawn: kill it and wait out the respawn &mdash; base stats, no carried enrage."
        status: done
        kind: uat
      - step: "UAT party: a second player still fighting while the first retreats &mdash; enrage still fires."
        status: done
        kind: uat
      - step: "UAT negatives: dying to it fires nothing, and retreating from a non-registry high-CR mob does nothing."
        status: done
        kind: uat
  - id: heal-soul-fatigue
    title: "Soul-fatigue stacks on the Heal spell and potions: the heal lands first, then 10% max-HP damage per prior stack, 3-minute decay"
    group: bosses
    epic: difficulty-increase
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-15"
    commit: f63d978a374, 9d44d0ccbb7
    notes: "<div>Turns reflexive full-heal spam into a timed resource: a heal from zero stacks is free, chain-healing gets progressively lethal (at 10 stacks the post-heal hit is 100% of max HP). Hook is the existing module override spellscript (stop_spellcheat via SetModuleOverrideSpellscript), which already sees potion activations. Design: <a href=\"https://homerslotr.com/manual/boss-updates#fatigue\">boss-updates#fatigue</a>.</div>"
    notes_h: 419
  - id: heal-soul-fatigue-rebalance
    title: "Soul-fatigue rebalance: 8% per stack instead of 10%, Greater Restoration now stacks it too, the Heal skill reduces the hit, and stacks now persist across logout and death"
    group: bosses
    epic: difficulty-increase
    status: awarded
    merit_awarded: true
    type: Defect
    player: Tukwut
    date: "2026-08-15"
    commit: 6efc792a43e, 637b8ece7eb
    notes: "<div>Soul-fatigue eases up, closes a loophole and finally gives the Heal skill a reason to exist at high level. Three changes: each stack you were already carrying now costs <b>8%</b> of your maximum HP instead of 10%; <b>Greater Restoration</b> now leaves a stack like Heal and Mass Heal do (it is a full HP restore, and was a clean way around the whole mechanic); and the <b>caster's Heal skill</b> — ranks plus Wisdom plus item bonuses, the number on your sheet — now cuts the fatigue damage by 0.5% per point up to 60 points, for 30% off at the cap. Drinking your own potion counts your own skill, so it protects solo healers too. In practice chain-healing kills you on the 14th heal inside a three-minute window with no Heal skill, and on the 19th at the cap (it was the 11th). Plain <i>Restoration</i> is untouched — it restores ability damage, not hit points.</div><div><br></div><div>Balancing that, soul-fatigue is now a debt you cannot walk away from. Stacks are <b>saved to your character</b>, so they survive a logout — and the timers <b>pause while you are offline</b>, so logging out to wait them down does nothing. <b>Dying does not clear them either</b>; you respawn carrying exactly what you had. The only thing that removes a stack is three minutes of being in the world. Full detail: <a href=\"https://homerslotr.com/manual/Customizations#soul-fatigue\">Customizations — Soul-fatigue on Heal</a>.</div><div><br></div><div><b>Update 2026-08-15 — two fixes.</b> Soul-fatigue stacks were <b>freezing after a relog</b>: they came back with you as intended, but their timers never ran again, and every stack you added afterwards was stuck too. They now resume decaying the moment you are back in the world. And soul-fatigue <b>no longer survives a server reboot</b> — a restart resets every boss and creature that ran your stacks up, so it now resets the healing debt with them. Logging out still does not shed stacks, and the timers still pause while you are away.</div>"
    impl_notes: "<div>All in unpacked/fat_inc.nss; no other script needed touching, since stop_spellcheat.nss (the module override spellscript installed by onmoduleload.nss) already calls FAT_OnOverrideSpellCast() first thing.</div><div><br></div><div>FAT_PCT 10 -&gt; 8. New FAT_SKILL_PER = 5 (reduction per Heal point, in <i>tenths</i> of a percent) and FAT_SKILL_CAP = 60. The reduction is done in integer thousandths — nDmg = nDmg * (1000 - nHeal * FAT_SKILL_PER) / 1000 — so 0.5%/point is exact with no float rounding. SPELL_GREATER_RESTORATION (70) routes through the same single-target branch as SPELL_HEAL, same 1.0s landing delay.</div><div><br></div><div>The caster's skill is read <b>once at cast time</b> (GetSkillRank(SKILL_HEAL, OBJECT_SELF) in FAT_OnOverrideSpellCast, clamped at 0 because GetSkillRank returns -1 for an untrained non-class skill) and passed as a parameter into the delayed FAT_ApplyToPC(oPC, nHeal), so it still applies if the healer dies or logs out before the fatigue lands. The direct SetCurrentHitPoints + explicit EffectDeath path is deliberately unchanged (commit 8f4095e22c2): the cost must bypass DR, resistance and immunity.</div><div><br></div><div><b>Persistence rework.</b> The old decay — one independent 180s DelayCommand per stack, count in a PC local int — ran in real time whether or not the player was logged in, and a relog wiped everything. Replaced by a queue of <i>remaining seconds</i> (fat_queue, one comma-terminated int per stack, e.g. \"180,174,12,\") aged by a single per-PC self-rescheduling ticker at 6s granularity (fat_tick.nss + FAT_Tick/FAT_AgeQueue/FAT_Kick, in the _spfail_cycle.nss shape). The ticker's DelayCommand rides on the <b>PC, not the module</b> — that is the whole pause-while-offline mechanism, since a logged-out PC's delayed commands never fire, and FAT_LoginRestore re-arms it at login.</div><div><br></div><div>New campaign DB fatiguedb, table fatigue(uuid PK, stacks, queue, cdkey, char_name, updated_at), keyed on GetObjectUUID per the bestiary/pipeweed convention. FAT_InitDb() from onmoduleload.nss and again from mod_cliententer.nss; FAT_LoginRestore at the 9.0s login slot (after the UUID-forcing call); FAT_Save from mod_clientexit.nss before ExportSingleCharacter. Saves also happen on every add and every expiry, so a crash can't be used to shed stacks. Nothing clears the queue on death — the stack is added even when the fatigue hit is what killed the PC.</div><div><br></div><div><b>2026-08-15 relog fix (637b8ece7eb).</b> Root cause was the ticker's own double-start guard, the <i>fat_ticking</i> PC local. NWN:EE keeps a <b>player TURD</b> — the serialised PC object, local variables included — for the rest of the server session and restores it on reconnect. The delayed-command chain doing the ticking died with the old object, but the guard came back TRUE, so FAT_Kick no-opped permanently: neither FAT_LoginRestore nor any later FAT_ApplyToPC could re-arm the ticker. Stacks froze for the life of the character. A fresh character has no TURD, which is why the clean-character test passed. (Checked and ruled out first: PC locals are <i>not</i> written to the .bic — the top-level struct of a character exported with three live stacks has no VarTable field at all.)</div><div><br></div><div>Fix: new FAT_ClearLocals() called <b>undelayed</b> from mod_cliententer.nss, ahead of any spell the player could cast in the login window, plus FAT_ClearTickGuard() from mod_clientexit.nss so the guard is never serialised into the TURD in the first place. FAT_LoginRestore now treats the campaign DB as authoritative instead of trusting the object: it clears the guard, reads the row, and <i>merges</i> (new FAT_CountQueue) any stack earned inside the 9s login window rather than clobbering it, deleting the locals entirely when the merged queue is empty. Reboot wipe is FAT_WipeAll() (DELETE FROM fatigue) from onmoduleload.nss, right after FAT_InitDb().</div>"
    manual_steps:
      - step: "UAT baseline: with a caster who has no Heal skill, chain two Heal potions. The second must cost 8% of max HP and the floating text must read \"x 8% of max HP\" with no mitigation clause."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT Heal skill: repeat with a caster at 60+ total Heal skill. The floating text must name \"-30% from the healer's Heal skill\" and the damage must be 0.7x the unmitigated figure."
        status: open
        kind: uat
        tester: "cleric/druid 40+ with 60+ total Heal skill"
      - step: "UAT partial mitigation: a caster at an odd Heal skill (e.g. 45) must show \"-22.5%\" — confirms the tenths-of-a-percent formatting."
        status: open
        kind: uat
        tester: "any caster with Heal skill between 1 and 59"
      - step: "UAT Greater Restoration: cast it on a PC already holding stacks. It must both deal the fatigue hit and add a stack, exactly like Heal."
        status: open
        kind: uat
        tester: "cleric 26+ (Greater Restoration is a 7th-level cleric spell)"
      - step: "UAT decay unchanged: a stack must still fall off 3 minutes after it was applied, with the \"a stack of soul-fatigue fades\" message (now up to 6s late, the ticker granularity)."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT persistence: take 2-3 stacks, log out, wait well past 3 minutes, log back in. The login message must report the same stack count, and the timers must resume from where they stopped rather than having decayed while away."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT death: take 2-3 stacks, die, respawn. The stacks must still be there and still decaying."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT clean exit: let all stacks decay to zero, then log out and back in. No stale \"you return still soul-weary\" message, and the fatiguedb row for that character must have been deleted."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT relog decay (the 2026-08-15 fix): take 2-3 stacks, log out and back in WITHOUT a reboot in between (the player TURD must still be live — that is the exact reproduction). The login message must report the same count, and then each stack must fade on its own timer with the \"A stack of soul-fatigue fades\" message, ending in \"The soul-fatigue lifts\". Before the fix no fade message ever arrived."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT stacking after a relog: immediately after the relog check above, take one more stack and confirm it decays on its own 3-minute timer too."
        status: open
        kind: uat
        tester: "any"
      - step: "UAT reboot wipe: take stacks, reboot the server, log back in. No \"soul-weary\" message, and the next heal must be free (no fatigue damage). The fatigue table in fatiguedb.sqlite3 must be empty straight after load."
        status: open
        kind: uat
        tester: "any"
  - id: encounter-density-reused-mobs
    title: "Encounter density: bump per-instance spawn counts 1 to 2 for creatures used by more than one encounter (cap 2, never solo boss encounters)"
    group: bosses
    status: awarded
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-15"
    commit: 5243c14abc0
    notes: "<div>The world is a little more crowded. Rank-and-file creatures that appear across several encounters now spawn in pairs rather than singly, in nine areas — Alterwald, Bill Ferny's House, Greenway North, the three Kallrist shores, Old Back Road, The Wold and Wold South. One-off set-pieces and every solo boss encounter were deliberately left alone. Design: <a href=\"https://homerslotr.com/manual/boss-updates#density\">boss-updates#density</a>.</div>"
    impl_notes: "<div>Must edit the placed encounter <i>instances</i> in the area .git.json files — the .ute templates are inert at runtime — and never touch solo (MaxCreatures == 1) encounters, which would silently drop a boss from the Roll of the Fallen tracker.</div><div><br></div><div>Data pass applied per the brief: 144 of 382 encounter creatures qualify as genuinely reused; 32 placed encounter instances across 9 areas had their per-instance spawn count bumped 1 -&gt; 2 (23 creatures thickened; nothing already &gt;=2 touched, MaxCreatures never changed, .ute templates untouched).</div><div><br></div><div><b>Exclusion note:</b> the brief says 19 solo encounters, but the module actually has 61 solo instances (9 of them registry encounter-bosses) — all 61 were excluded, the strictly safer superset. Boss-registry gate confirmed unchanged (78 bosses) before and after. Sequenced after the two healing-economy levers because it acts as a throughput multiplier on them (more incoming damage -&gt; more heals -&gt; faster <a href=\"#idea-heal-soul-fatigue\">soul-fatigue</a>).</div>"
    manual_steps:
      - step: "Correct the design brief's solo-encounter figure at the next design edit: it says 19, the module actually has 61 solo instances (9 registry encounter-bosses)."
        status: open
        kind: admin
      - step: "UAT: look for pairs of giant spiders in Alterwald and Old Back Road, and denser packs in The Wold, Wold South and the Kallrist shores."
        status: open
        kind: uat
      - step: "UAT regression: the Balrog of Moria and Summanus still spawn exactly one each and track normally on the Roll of the Fallen."
        status: open
        kind: uat
      - step: "UAT perf: impact should be negligible (+1 creature on 32 triggers module-wide)."
        status: open
        kind: uat
  - id: forbidden-realms-key-tier
    title: "Forbidden Realms Key tier: journal quest and a Númenor gate opening the orphaned Tombs of the Lost Souls as the Weathertop court's barrow"
    group: bosses
    epic: difficulty-increase
    status: confirmed
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-18"
    commit: 6b2999e550b
    notes: "<div>The Forbidden Realms Key has been stealable from Summanus for as long as anyone can remember, and until now it opened precisely nothing. It opens something now. Come by the key and a journal opens telling you what the seven marks cut into its ward actually are — grave-wards. The stone that answers it is a sealed slab in Númenor: Noirinan, and beyond it lie the <b>Tombs of the Lost Souls</b>: not a ruin but a court, whose lords have not gone quiet. The Weathertop King, his Queen and their Archer still hold their places. Bring a party. Full walkthrough: <a href=\"QuestGuide.html#forbidden-realms\">QuestGuide → The Forbidden Realms</a>.</div>"
    impl_notes: "<div>Opens gravesofthelostk, which had zero connections of any kind, and spawns three previously-unspawned blueprints. New: q_frk_inc.nss (all logic), q_frk_enter/q_frk_tomb (OnEnter wrappers on falseheaven/gravesofthelostk, chaining ent and leash_to_area), q_frk_gate.utp + q_frk_gate.nss (one gate blueprint serving both ends; direction via local string FRK_DEST; the return leg deliberately does not demand the key so a lost key cannot entomb a player), q_frk_death.nss (ScriptDeath on weathertopkin003/que003/arc002, chaining x2_def_ondeath, party-credited). Journal category frk_tombs (@group 'Lord of the Rings', @order 90), entries 1/2/3/10. Hooks: acquireditem_tag on Tag ForbiddenRealmsKey, plus a retroactive FRK_LoginCheck in hgll_cliententer for characters who stole the key before this shipped. Persistence: campaign DB forbiddendb, per character (frk_stage 0-3, advance-only).</div><div><br></div><div>Court picked as the highest non-outlier CR variant of each: King weathertopkin003 (454, rejecting the CR-1514 kin004), Queen weathertopque003 (594), Archer weathertoparc002 (337) — one-line constants at the top of q_frk_inc.nss. Spawn guards are area-scoped by resref, not module-wide by tag, because the court tags are shared with the placed Weathertop variants. Script-spawned creatures are not in gen-boss-registry.py's placed-instance registry, so the court does not appear on the Roll of the Fallen. No new loot was authored — the court drops whatever is on the blueprints, which may be thin for an end-game tier. Gates passed: 7/7 smoke tests, check_boss_registry unchanged at 78, dialog integrity clean. Admin half documented in QuestGuide-DM-Notes.md.</div><div><br></div><div><b>2026-08-15 — route replaced by hand-built areas.</b> The admin built the tier in the toolset in a module copy taken at 5705c158032 (2026-07-25) and it has now been migrated in. This <b>replaces</b> the Noirinan-gate routing above; the AP_forbiddenrealmskeytier_1-5 waypoints will never be placed. New: <b>area026 \"Weather Top (Amon Sûl)\"</b> (tag WeatherTopAmonSul, ttr01, 12x12, 70 placeables — ruined pillars, defaced statue, evil altar, waterfall, fog) linked to weatherhills by three newtransition triggers in each direction, carrying 11 wtop_spawn + 4 wtop_zombie spawn waypoints and two doors (wtop_wolfcave to area027, wtop_hiddencave still unlinked and reserved for the royal court area); and <b>area027 \"Forbidden Realms: Enter\"</b> (tag ForbiddenRealmsEnter, tdm01, 5x5, night) holding ForbiddenRealmsDoor — a plain locked+KeyRequired door that opens the far half of the room rather than an area transition, so a party without the key just walks back. Migration fixes: OnEnter/OnExit set to leash_to_area/cleanup on both new areas (they came out of the toolset blank), close_door added to both transition doors by bin/fix-door-autoclose.py, and ForbiddenRealmsDoor's KeyName corrected from the resref forbiddenrealmsk to the item Tag ForbiddenRealmsKey. Rejected from the merge: a Mod_Entry_Area change pointing new characters at area026 instead of thewelloferu, plus toolset churn in falseheaven/heavensdisdain (GenericType to GenericType_New, encounter CR recalcs) that would have rolled back later repo work. 25/25 smoke tests pass, area list 291 to 293.</div><div><br></div><div><b>2026-08-17 — Amon Sûl is populated and the entry room talks.</b> New <b>wtop_spawn.nss</b> (garrison spawner) fires from <b>wtop_enter.nss</b>, now area026's OnEnter, which chains leash_to_area first. It walks the repeated waypoint tags with the nth-object form (GetObjectByTag(sTag, n) — GetWaypointByTag only ever returns the first) and fills each post once per server run, flagged by a WTOP_FILLED local int on the waypoint; respawn is then owned by the module-standard 900s path (x2_def_ondeath → nw_c2_default7 → SE_DoCreatureRespawn), and without that once-per-run guard a re-entry inside the 900s window would double each post up. Each created creature also gets its \"spawn\" LocalLocation pinned to the waypoint, so leash_to_area sends it back to its post and respawns land there rather than wherever it died.</div><div><br></div><div><b>Composition settled from the forks.</b> Both nwn_homers_lotr_2009 and nwn_lordoftherings carry a \"wheathertop\" area this module never had, and they agree: 11–12 weathertoparc001 archers to 7–8 weathertopfighte fighters, with the King (weathertopkin004) and Queen (weathertopque003) side by side at the far end. weathertoparc001 is also the archer in this module's own never-placed weathertop.ute. So the 11 wtop_spawn posts alternate 6 archers / 5 fighters, and the King and Queen are deliberately <b>not</b> spawned here — they belong to the unbuilt royal court behind wtop_hiddencave. The forks' beefier stat lines for the same resrefs (fork Fighter CR 199 / HP 3550 vs live CR 100 / HP 1450, Archer CR 272 vs 198) were <b>not</b> adopted — that is a balance call for the tuning pass.</div><div><br></div><div><b>New blueprint wtop_zombie.utc</b> (\"Barrow-wight of Amon Sûl\", Tag WtopBarrowWight) fills the 4 wtop_zombie posts on the low ground: a reskin of zombieofdolguldu moved to Hostile, <b>WalkRate 1 (VerySlow)</b> and HP 990 → 4000 with Str 107 → 120 and NaturalAC 13 → 24 — per the admin's brief, \"more for flavour, should just move super slow but be really strong\". CR 200 keeps it in band with the garrison, and it is multi-instance so it stays off the Roll of the Fallen. Filed to Monsters &gt; Undead &gt; Zombie by bin/file-palette-orphans.py.</div><div><br></div><div><b>wtop_taunt.nss</b> is now ScriptAttacked on weathertopfighte and weathertoparc001, chaining x2_def_attacked first. Six lines (\"For the royal court!\", \"You will not pass the ring of stones!\", …) gated by a 1-in-8 roll <i>and</i> a 30-second per-creature cooldown, so a whole garrison chatters but no single guard spams. SpeakString, not ActionSpeakString, which would queue onto the combat action list and interrupt attacks.</div><div><br></div><div><b>The three area027 stub triggers now have OnEnter scripts</b>, all once-per-character FloatingTextStringOnCreature in the module's existing narrative-trigger idiom (phe4r.nss / icehi.nss) — no effects, no saves, no journal changes. <b>wtop_fr_welcome</b> (ForbiddenRealmsWelcome, near half, just short of the door) describes the sealed door and branches its last sentence on whether the player carries the key, reusing FRK_HasKey rather than inventing state. <b>wtop_fr_shaft</b> (ForbidRealmsLghtShaft) is the light shaft beside the x3_plc_ylights placeable. <b>wtop_fr_deep</b> (ForbidRealms_TBD) sits at the deepest point and foreshadows the unbuilt royal court — a wall raised in haste from the other side. The placeholder tag stays until that area exists; renaming it is toolset work. Gates: 25/25 smoke tests, 7 scripts compiled / 0 errors, check_boss_registry unchanged at 78, check_palette_coverage 4441 blueprints all filed.</div>"
    design_questions:
      - question: "Should the barrow-court respawn? It currently re-forms whenever a PC enters and that member is not standing — so the fight is farmable, though the journal completes only once. One guard swap in FRK_SpawnCourtMember makes it a once-per-server or once-per-character kill instead."
        status: answered
        answer: "1.5 hr respawn"
      - question: "Should the court appear on the Roll of the Fallen board? Script-spawned creatures are invisible to the boss registry; tracking them needs real placed instances (toolset work) instead of waypoint spawns."
        status: answered
        answer: "Add the king and queen to the board; they should be made strong enough to well overpass requirements to be on the board, and be tougher than summunus boss. \nThere should be multiple other minions (archers/fighters) supporting the king and queen, but their multiplicity will prevent them from showing up on the board."
      - question: "Are the CR picks right? The highest non-outlier variant of each was taken (King 454 / Queen 594 / Archer 337), skipping the CR-1514 King. Related: no new loot was authored for the tier."
