  - id: thirteenth-ent
    title: "The Thirteenth Ent"
    group: quests-areas
    epic: quest-overhaul
    status: manual
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-08-05"
    commit: 0b976273d741f968197494f41bb05e786e0bbb8d
    notes: "<div>Deep in Fangorn Forest stands a thirteenth Ent, so long rooted that he has forgotten his own name -- and only two kinds of people can still reach him. A <b>druid of 20 levels</b> must wild shape into a boar to find the truffles of the deep loam (they hide from eyes and hands alike), then race back and cast <b>Nature's Balance</b> over his roots before the truffle crumbles. A <b>bard of 20 levels</b> must instead play him awake in a two-stage concert: watch for the old Ent to stir, answer with your Bard Song, and pass both a Lore and a Perform check each time (DC 30, then DC 40) -- every roll is shown to you. Either way the thirteenth Ent wakes, remembers that he is called Leaflock, and presses a horn cup of ent-draught into your hands: the <b>Draught of the Ent</b>, a permanent +1 Strength and +1 Constitution, earned once per character and never again. Each branch may be attempted once per real-world day. Full walkthrough: <a href=\"QuestGuide.html#thirteenth-ent\">Quest Guide -&gt; The Thirteenth Ent</a>.</div>"
    impl_notes: "<div>Self-contained (no faction/world-state dependency; areas exist). Mechanically buildable once the branch content + reward are approved: a giver NPC (Ent) with a conversation offering three solution paths gated on skill/class, a persistent per-character completion stamp (quest_cd_inc or a simple advance-only flag), and a reward item. The creative/balance decisions below are the admin's call.</div><div><br></div><div><b>BUILT 2026-08-05 (commit 0b976273d74).</b> Area: <b>Fangorn Forest (fangornforest)</b> -- its OnEnter became the wrapper q_ent_enter (chains leash_to_area) and its previously-empty OnHeartbeat became q_ent_hb. Journal tag thirteenthent (@group 'Lord of the Rings' / @order 31).</div><div><b>Scripts:</b> q_ent_inc (all logic), q_ent_spawn, q_ent_enter, q_ent_hb, q_ent_pick, q_ent_song; conditionals q_ent_cdone / q_ent_cdru / q_ent_cbrd / q_ent_ccd; actions q_ent_adru / q_ent_abrd; item script q_ent_drink. <b>Blueprints:</b> q_ent_13th.utc (appearance <b>1492 'Treant 1'</b>, read from hak_2da/appearance.2da and unused elsewhere -- the ordinary Fangorn Ents are 1057; Commoner, Plot+Immortal, <b>no gear at all</b>, so nothing for the Jasperre AI to strip and no loot divergence), q_ent_truff.uti, q_ent_trufp.utp (OnUsed q_ent_pick), q_ent_drght.uti. Conversation q_ent_conv.dlg, five start nodes; the cooldown node fills token 6390.</div><div><b>Detection is by non-destructive listeners only -- no stock script replaced.</b> Nature's Balance via ENT_OnSpellCast() called from stop_spellcheat.nss (the module's existing SetModuleOverrideSpellscript handler, the same route fat_inc uses), filtered on SPELL_NATURES_BALANCE with the spell target location within 10 m of the Ent. Bard Song via ExecuteScript(\"q_ent_song\") added to the module's own nw_s2_bardsong override (verified as the real ImpactScript). Boar form via GetAppearanceType == APPEARANCE_TYPE_BOAR, polled by the area heartbeat, which spawns and destroys the truffle placeables.</div><div><b>State</b> in questcddb via quest_cd_inc: ent13_druid_try / ent13_bard_try (rolling 24 h, stamped <b>at accept</b> so a failure costs the day), ent13_restored, ent13_draught, ent13_draught_drunk; per-attempt scratch in PC locals with a sequence int that invalidates stale DelayCommands. Timers: truffle freshness 180 s, cue pause 8 s, cue window 90 s.</div><div><b>Reward:</b> NWNX_Creature_SetRawAbilityScore +1 STR / +1 CON on the base scores (the LEGFEAT_KIND_RAW route) plus ExportSingleCharacter, and 4000 XP once. <b>Anti-farm at three independent points</b> -- grant-time GetItemPossessedBy re-check before the reward (check_reward_exploit passes), an advance-only handed-out stamp, and an advance-only already-drunk stamp checked before any score is touched. Because the stat gain is permanent this is the item's most important correctness property.</div><div>Docs in the same commit: QuestGuide.html card + TOC + summary row, QuestGuide-DM-Notes.md section, and the idea retired from Quest Ideas.md and docs.manual/Draft/Quest Ideas.html per the burndown rule.</div>"
    design_questions:
      - question: "THREE-BRANCH SOLUTION (approve/tweak the content). The quest restores a 'tree-still' Ent via a Druid / Bard / Lore branch. Proposed shape: DRUID branch - a skill/class-gated dialogue + cast (or a component gathered nearby) that channels growth into the Ent; BARD branch - perform/Perform-gated to sing the Ent awake (Entish is song); LORE branch - Lore/Knowledge check to recall the Ent's true name and speak it. Each branch reaches the same restoration but with different flavour. Approve these three, or change the gating skills/classes? What Perform/Lore/skill DCs (suggest scaling to L32: e.g. Lore/Perform DC ~40)?"
        status: answered
        answer: "Druid branch: (Requires level 20 druid) is sent to gather magic invisible truffles (nearby), player must wildshape into a boar before the truffles will spawn/be visible, and once obtained , druid must cast nature's balance with truffle in inventory and in area of effect overlapping the Ent. Confirm proposed in-game dialogue/hints for this. Once the truffles are picked, the druid has a short time to make it back to the ent and complete the ritual/cast the spell, or else fails and needs to get another truffle (can only be attempted once per 24 hrs real world time)\n\nBard branch: (Requires level 20 bard): bard must pass 2 stages of PERFORM+LORE checks of increasing difficulty; putting on a short concert for the ent/guiding through stages of reawakening and remembrance of who the ent is. There should be a short pause between each stage where the ent gives a cue (like it stirs, or mumbles, or starts to speak..) after which the bard should execute a perform action (use bard song feat), which causes server to roll a Lore and a Perform check for the bard (results/outcome visible). \nStage 1: Lore DC30, Perform DC30\nStage 2: Lore DC40, Perform DC40. \nA failure on any of the 4 checks means ritual fail the the bard must wait 24 hours (real world time) before attempting again\n\nChange from 3 to 2 branch solution: only open to druid and bard casters for the moment.. may add another one like ranger: propose an idea for this."
        question_h: 86
        answer_h: 117
      - question: "REWARD (power decision). Proposed: a one-time 'Draught of the Ent' consumable granting a PERMANENT +1 STR and +1 CON (as asked). Permanent stat boosts are strong end-game power creep - confirm +1 STR / +1 CON permanent is intended, or would you prefer a smaller/temporary buff, a once-per-character cap only, or a non-stat reward? (It must be non-farmable: advance-only per-character stamp so the draught can be earned once.)"
        status: answered
        answer: "Yes, permanent bonus"
        question_h: 92
        answer_h: 83
      - question: "CONFIRM THE DRUID BRANCH DIALOGUE AND HINTS -- shipped as written 2026-08-05, change any line you like. Ent's offer: 'What you took for a tree is not a tree. Bark cracks like an old door, and two green lights open in the knot of its face. Hoom... hom. Twelve of us still walk in Fangorn. I am the thirteenth, and I have been standing a very long while. Root-sleep is warm, little druid, and I have nearly forgotten my own name. Hoo -- but there is one taste that wakes me. The truffles of the deep loam. They hide from eyes and from hands; only a boar's nose has ever found one. Bring me a truffle with the earth-smell still on it, and set the Balance of green things about my roots, and I will remember who I am.' On accepting: 'Wear the boar, then. Go on four feet among my roots and snuff the loam -- what is hidden will show itself to a snout and to nothing else in the world. And do not dawdle. A truffle out of the earth dies quickly, and a dead truffle wakes nobody. Come back to me with it, put off the beast-shape, and sing the Balance of Nature over my roots -- close, mind. My hearing is all in my bark.' In-play hints: on accept 'Leaflock's riddle: a boar's nose in Fangorn's loam, then Nature's Balance cast over his roots -- and be quick about it.'; on entering boar form near the spots 'The loam sharpens under your snout. Pale knots of truffle are pushing up through the leaf-mould.'; on picking 'You root up a truffle of Fangorn. Its earth-smell is already fading -- get back to Leaflock, put off the beast-shape, and cast Nature's Balance over his roots.'; on expiry 'The truffle blackens in your hand and crumbles to dry earth.'; on casting too far away 'Your Balance settles over the wood -- but not over Leaflock's roots.' Approve as-is, or send replacement lines? Also confirm the two tunable numbers: truffle freshness 180 s and ritual reach 10 m."
        status: open
        answer: null
      - question: "PROPOSED THIRD BRANCH -- ranger (design only, nothing built). 'The Long Watch': requires ranger level 20, and is a listening test rather than a combat one. Leaflock wants neither a gift nor a song from a ranger -- he wants news of his wood. The ranger walks the three marches of Fangorn (Fangorn Forest, Fangorn: Outskirts, and one Isengard-border area) and brings back proof of what is eating it: an axe-haft or a burned Ent-sapling taken from Saruman's timber crews, gathered by tracking rather than by slaughter. Mechanically it reuses everything already built -- a Search or Survival check (suggest DC 35) at each of three AP_ marker spots to find a sign, each sign spawning a small Isengard lumber-crew patrol that may be avoided rather than killed, then a return to Leaflock inside the same 24-hour attempt window; reward, cooldown, journal and draught plumbing unchanged. It also sets up the existing lumber-ent-tugofwar item without duplicating it. Approve this shape, change the skill/DCs, or pick a different ranger flavour (leading the Entwives' trail, healing a wounded Huorn)?"
        status: open
        answer: null
