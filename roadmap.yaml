  - id: pipeweed-npc-reactions
    title: "NPCs notice when you are under the influence of pipe-weed"
    group: quests-areas
    epic: quest-overhaul
    status: wip
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    notes: "<div>Walk into a conversation with a pipe still on you and people will say so. Barliman, the hobbits of the Shire, the guides at the Well of Eru, the quest-givers of the great lines — they all get a word for the state you are in, and which leaf you are on, before the usual talk begins. Follows on from <a href=\"#idea-concerning-pipeweed\">Concerning Pipeweed</a>.</div>"
    impl_notes: "<div>Split out of <a href=\"#idea-concerning-pipeweed\">concerning-pipeweed</a> on 2026-07-30 so that item could ship without waiting on a pass over ~40 conversation files.</div><div><br></div><div><b>Mechanism (agreed):</b> a conditional greeting node, not ambient floating text. New StartingConditional <b>pw_is_high.nss</b> returns TRUE while the PC's PW_EXPIRY (set by pw_inc, see concerning-pipeweed) is still in the future, and sets a custom token carrying the strain name so one node covers all four strains. Then a <b>repeatable, idempotent</b> bin/add-pipeweed-remarks.py inserts <b>exactly one</b> StartingList entry at index 0 of each targeted .dlg.json — remark text drawn from the token, a single \"...\" reply linking to the conversation's existing root — leaving every existing start untouched below it. Idempotency keyed on the inserted node so a re-run is a no-op.</div><div><br></div><div><b>Target list (per the admin):</b> Well of Eru hub — New Player's Guide, Well-Mart, Guardian of Light, Guardian of Darkness. Shire — Odo Proudfoot, Posco Whitfoot, both Green Dragon Inn Keepers, the Green Dragon Cook. Bree — Barliman and the merit NPC in theprancingpo001. Plus every main-quest-line and prestige-class quest giver, Old Maggot, Bill Ferny, Old Tagget, and every Meaningwave quiz giver (see <a href=\"MeaningWave.html\">MeaningWave</a> / CLAUDE-meaningwave.md for that roster).</div><div><br></div><div><b>Risk to respect:</b> link-only fields (IsChild/Index) on DLG nodes make the engine refuse to load the whole conversation — the NPC turns to face you and no window opens. nwn-manager repack gates on tests/check_dialog_integrity.py, so the generator must emit fully-formed nodes, and the gate must be green before this ships. Patch a couple of files by hand first and prove them in-game before running the script over the whole list.</div>"
    manual_steps:
      - step: "UAT patched NPC: talk to a patched NPC while high — the remark fires and names the strain; talk sober — the normal greeting is unchanged."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT unpatched NPC: an NPC not on the list behaves exactly as before, high or sober."
        status: open
        kind: uat
        step_h: 64
      - step: "UAT idempotency: re-run bin/add-pipeweed-remarks.py --apply and confirm no duplicate node is added and the dialog-integrity gate stays green."
        status: open
        kind: uat
        step_h: 64
      - step: "Confirm the Meaningwave quiz-giver roster is complete before the bulk run — those conversations are the ones most likely to break unnoticed."
        status: open
        kind: uat
        step_h: 64

  - id: pipeweed-supply-line
    title: "Quest: The Leaf Runs Short (Shire supply line)"
    group: quests-areas
    epic: quest-overhaul
    status: later
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    notes: "<div>Buy from Odo Proudfoot often enough and he will admit, a little sheepishly, that his stores are running low — and that it is not his growing that is at fault, but what has been happening on the road the leaf travels. A Shire quest to put the Southfarthing supply back in order. Follows on from <a href=\"#idea-concerning-pipeweed\">Concerning Pipeweed</a>.</div>"
    impl_notes: "<div>Drafted 2026-07-30 from the concerning-pipeweed card, recorded as its own item so it is tracked and creditable without blocking that one. <b>Depends on concerning-pipeweed's shop shipping first.</b></div><div><br></div><div><b>Trigger:</b> count the number of <b>distinct real-world calendar days</b> on which the PC has bought leaf from Odo — a questcddb-style per-day key, so the count cannot be farmed in a single sitting. On the <b>third</b> such day, the purchase conversation ends with Odo admitting his stores are low, which opens the quest. Counting purchases rather than days would let a player buy three pouches in a row and skip the whole point.</div><div><br></div><div><b>Shape:</b> a one-off (not daily) Shire quest to clear whatever is choking the Southfarthing crop — hostiles on the growing land, or on the road the leaf travels from the Southfarthing to Bywater. Sits on the same quest_cd_inc / journal skeleton as its siblings (<a href=\"#idea-hobbit-post\">Hobbit Post</a>, <a href=\"#idea-concerning-hobbits\">Concerning Hobbits</a>). Reward should be leaf-flavoured rather than gold. Note that \"a strain he does not otherwise sell\" is no longer available as a reward — Witch Weed, the obvious candidate, went onto Odo's counter when the Dirty Hippie store was merged in. So: a standing discount at the counter, a strain that is genuinely new, or restoring a strain that has gone out of stock while the supply line is broken.</div><div><br></div><div><b>Open design points</b> — which area hosts the trouble (Frogmorton and Bywater are the reachable Shire neighbours), whether it reuses existing hostile blueprints or needs new ones, and and whether the reward is a discount, a brand-new strain, or both.</div>"

