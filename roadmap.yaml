  - id: item-slot-tokens
    title: "Increase an item's property slots using boss-drop 'tokens' or a rare boss drop"
    group: forge
    status: manual
    type: Enhancement
    player: "dc0960 (Dungeon_Crawler)"
    date: "2026-07-17"
    commit: c79fe8ab669
    notes: "<div><b>Fixed 2026-07-17:</b> shipped the <b>Rune of Expansion</b> (item tag SlotToken, resref slot_token) - a consumable that permanently raises a single target item's forge property-slot ceiling by +1, up to a hard cap of <b>FORGE_TOKEN_MAX_SLOTS = 3</b> extra slots (a single admin-tunable constant in forge_inc.nss). The rune is a targeted Unique-Power widget (Cast Spell prop 15, subtype 329 - the same activation the module's dmfi widgets use); on activation the module OnActivateItem handler (dmfi_activate) branches on the SlotToken tag and ExecuteScripts slot_token.nss, which stores the earned count as the item-local int FORGE_EXTRA_SLOTS on the targeted item (persists with the item in the .bic, exactly like the existing FORGE_CEIL) and consumes one rune. forge_inc.nss now exposes a single ceiling helper <b>ForgeItemMaxProps(oItem) = ForgeLegalMaxProps() + ForgeItemExtraSlots(oItem)</b>, and every place the prop-count ceiling is enforced (modifyitem apply loop, the anvil legality/contraband scan, the projected-count guard) routes through it - so the extra slots are honored AND the item is never jailed as contraband for the extra enchantment it may now hold. Only the slot-COUNT ceiling changes; the true-value pricing, value cap, and disenchant staging invariants are untouched. Build passed all gates (6/6 smoke, dialog-integrity 0 failing, boss-registry 78/78, 58 scripts compiled 0 errors). <b>Drop-source and rarity are a deferred admin decision</b> - the mechanic ships fully wired and DM-testable but the rune is placed in no loot table yet.</div><div><br></div><div><b>UAT (DM spawn to test):</b> (1) DM-spawn a Rune of Expansion (resref slot_token / tag SlotToken); (2) activate it and target a carried item - confirm the item's allowed forge property count rises by 1 (a forge that was capped at 4/5/6 now allows 5/6/7 on that item), the rune is consumed, and repeat up to 3 runes then the 4th refuses without consuming; (3) forge the newly-allowed extra property onto the item, then confirm the contraband/legality scan does NOT jail it; (4) regression: an un-attuned item still caps at the normal per-forge limit, and the forge value cap / pricing / disenchant behavior are unchanged; (5) decide which boss(es) drop the rune and at what rarity, then add it to loot."
    manual_steps:
      - "LOOT PLACEMENT - no waypoint. The Rune of Expansion consumable (blueprint resref `slot_token`, tag `SlotToken`) is fully wired and testable but is not placed in any loot table yet - deliberately, because drop-source and rarity are your taste. Decide which boss(es) drop it and at what rarity, then add `slot_token` to their loot via the toolset / the module's loot system. To test the mechanic meanwhile: DM-spawn `slot_token`, activate it, target an item in your pack, then work that item at a forge - it should allow one extra enchantment slot per rune bound (up to 3). The hard ceiling is `FORGE_TOKEN_MAX_SLOTS = 3` in `unpacked/forge_inc.nss` - retune there if +3 is too generous/stingy (a fully-runed item at a top-tier forge can reach 10 enchantments). No CR>60 boss was modified."
  - id: forge-limits-progressive
    title: "Tie forge limits to boss-kill progress (kill more bosses to earn a slight gear edge)"
    group: forge
    status: implemented
    type: Enhancement
    player: Tukwut
    date: "2026-07-16"
    commit: 9d5519b
    notes: "<div>related to <a href=\"#idea-wiki-kill-counts\">Show per-character kill counts on creature pages, with KD ratio and total deaths</a></div><div>related to <a href=\"#idea-wiki-top-killers\">On each creature page, show the top players/characters by kills</a></div><div>related to <a href=\"#idea-bestiary-tracking\">Bestiary kill-tracking with both PARTY and SOLO credit</a></div><div><br></div><div>Looking for way to reward players for boss-kill progress: like higher GP max value crafting and more max attributes, but need items to be transferable to different characters without jailing recipients for holding illegal items (stronger than they could have made) -- </div><div><br></div><div><b>Fixed 2026-07-16:</b> forge caps now scale with <b>distinct Roll-of-the-Fallen bosses slain</b> per character (solo or party credit; bestiarydb joined against the boss registry). Tiers (one tunable table in forge_inc.nss): 10+ bosses → +5% forge value cap; 25+ → +10%; 50+ → +15%; all 78 → +20% <b>plus a 7th property slot at the top-tier forges</b> (Moria/Kallrist). Bonuses apply at forge time only; the <b>contraband law now judges everyone against the maximum-achievable ceiling</b> (900,000 gp / 7 props), so boss-slayer gear traded to a fresh character can never jail the recipient — exactly the transferability this note asked for. Staged disenchant lawfulness uses the same ceiling functions, so it still cannot mint an illegal item. Existing FORGE_CLEAN stamps stay valid (ceiling only loosened, no rescan). Anvil use shows your current tier/progress as floating text. Customizations.html updated (tier table + new 900k/7-prop law).</div><div><br></div><div><b>UAT:</b> (1) a character with under 10 registry boss kills: progress hint, unchanged caps; (2) a 10+ distinct-boss character: +5% floating text and raised ceiling quoted by the smith (Tagget 262,500); (3) trade an above-750k forged piece to a fresh character and walk into the Well of Eru — must NOT jail; (4) Warden still jails genuinely tampered gear above 900k/7 props; (5) disenchant status lines cite the 900k figure.</div>"
    dupe_of: achievements

