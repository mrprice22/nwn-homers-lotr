    notes: "<div>Merit redemptions 201-204 now grant a real, temporary <b>2x gold &amp; XP</b> boost (1 week or 1 month, for yourself or the whole server).</div><ul><li>Applies to creature kill gold/XP and quest turn-in gold/XP only. Bank withdrawals (Bree gold/family/XP banks) and selling items to merchants are <b>never</b> boosted.</li><li>Merchant per-item buy caps were doubled separately (WellMart, First Bank of Middle-earth, methmart) so genuinely valuable items can fetch their full price.</li><li>Buying more of the same kind never runs two clocks at once — extra time <b>queues and slow-burns</b>. A live server-wide boost <b>pauses</b> everyone's personal boost (their time is preserved).</li><li>On login the server reports every active and pending subscription, who bought each, and the estimated end date of the chain.</li></ul>"
