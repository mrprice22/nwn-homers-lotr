    date: "2026-08-14"
    commit: 7f387560d69
    notes: "<div>Halmir the Grey at the Well of Eru no longer keeps the prestige orders — he now points you at the quests worth your level. Tell him your measure and he names the quest, who gives it and where to find them, across five bands from first-steps to endgame, plus the ones that keep no reckoning of your level at all. He still handles the Legendary Feats re-pick at 60. Full detail: <a href=\"QuestGuide.html#halmir\">Quest Guide → Halmir the Grey</a>.</div>"
    impl_notes: "<div>Reply-side rework of prsg_conv.dlg.json only; no new NPC, blueprint or waypoint. Root entry 0 got a short new intro (the old one was a 60-word wall about the twelve disciplines) and five new band replies (112-116) each leading to a new answer entry (87-91) and a \"Tell me of another road\" reply (117-121) that links back to entry 0 with IsChild=1.</div><div><br></div><div>The twelve order branches and the order-summary reply are left wired but never show: their StartingConditionals (prsg_c_*.nss, plus the new prsg_c_off.nss for the summary line) bail on QL_LineOff(\"prsg\"). Gating the conditionals rather than deleting the replies keeps every subtree linked, so there are no orphan nodes for the repack's dialog-integrity gate to trip on, and re-enabling is one token in qline_gate_inc.nss.</div><div><br></div><div>prsg_spawn.nss is deliberately NOT gated — Halmir must keep spawning. The Legendary Feats re-pick (reply 111, legfeat_cond / legfeat_respec) is untouched; it has to live on Halmir because Ping Pong is destroyed by onmoduleload wherever SP_DEV_TOOLS is off.</div><div><br></div><div>Quest list is taken from the QuestGuide summary table with the class-line and prestige rows removed. Any quest added or retired later has to be reflected in the five band entries by hand — the list is authored text, not generated.</div>"
