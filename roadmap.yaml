    commit: c8d85dc109b
    notes: "<span>Early nodes (L1/8/15) of the Rogue line.</span><div><br></div><div><b>Fixed 2026-07-17:</b> shipped the early arc of the Rogue line, <b>The Long Shadow</b>, cloned structurally from fighter-line-early. Giver <b>Fenn the Shade</b> (q_rog_fenn, plot/immortal hooded rogue) runs a Bree-lander net of watchers out of the Prancing Pony and offers the oath only to Rogues (GetLevelByClass(CLASS_TYPE_ROGUE)&gt;=1, value 8 verified); non-rogues get a flavour line. Three level-gated one-off nodes, per-character state in campaign DB roguelinedb key shadow_stage (0-&gt;3, advance-only). <b>Node 1 (L1):</b> swear into the net -&gt; journal opens + Shadowmantle (cloak +1 AC, Rogue-only). <b>Node 2 (L8):</b> receive the Long Shadow Cipher-Token (plot). <b>Node 3 (L15):</b> return it -&gt; token consumed, Nightthorn (short sword +2, Rogue-only), journal End. Reward properties use verified stock encodings (Use-Limitation:Class subtype 8 = Rogue). Journal category rog_shadow (@group 'Class Lines' @order 2). Wired end-to-end: Prancing Pony OnEnter wrapped q_rog_enter (chains the existing q_ftr_enter -&gt; q_hrp_ent1, preserving leash + Harper contact + Hallas's spawn) -&gt; q_rog_spawn; conversation q_rog_conv on the giver, reply-link Actives left blank (avoiding the fighter-line bug fixed in the same session). Build passed all gates (6/6 smoke, dialog-integrity 0 failing, boss-registry 78/78, scripts compiled 0 errors). Capstone (Shelob/Cirith Ungol/dual-swords finale) deliberately deferred to rogue-line-mid/later.</div><div><br></div><div><b>Blocked in-game until the admin places waypoint AP_roguelineearly_1 in theprancingpo001</b> - Fenn is script-spawn-only and no-ops gracefully until then.</div><div><br></div><div><b>UAT (after waypoint placed + deploy/restart):</b> (1) a Rogue sees Fenn's oath offer, a non-rogue gets only the flavour line; (2) accept -&gt; journal rog_shadow opens + rogue-restricted Shadowmantle; (3) L8/L15 gates hold (below-level shows a 'come back' line); (4) at L8 the token is granted, at L15 consumed and Nightthorn granted, journal advances 1-&gt;2-&gt;3(End); (5) cloak/blade unusable by non-rogues; (6) regression: Prancing Pony leash + Harper (Della) + Fighter-line (Hallas) spawns all still fire from the chained OnEnter.</div>"
    manual_steps:
      - "create waypoint tag `AP_roguelineearly_1` in `theprancingpo001` (The Prancing Pony ground floor - in or beside a doorway/shadowed corner, clear of Barliman, the merit NPC, the Harper contact spot, Hallas's corner and the door) - spawn point for `q_rog_fenn` (Fenn the Shade, the Rogue class-line I giver; plot/immortal hooded rogue). Spawned by `q_rog_spawn` from the inn's OnEnter wrapper `q_rog_enter` (which chains the fighter-line wrapper `q_ftr_enter`, itself chaining `q_hrp_ent1` - leash + Harper contact - and Hallas's spawn); scripts no-op gracefully until the waypoint exists and never double-spawn. Until placed, \"The Long Shadow\" (Rogue line I, nodes L1/8/15) is invisible in-game. Rogue-only offer; non-rogues get a flavour greeting. Tag is hyphen-less and byte-for-byte identical to the literal in q_rog_inc.nss / q_rog_spawn.nss."

