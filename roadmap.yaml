  - id: boss-stat-tuning-pass
    title: "Per-boss stat tuning: close dumped saves, swap flat DR for % immunity gear, raise auto-hit AC into the ~85 gate window"
    group: bosses
    epic: difficulty-increase
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    commit: f3ff201f85f
    notes: "<div>Ten of the server's bosses had a glaring hole in their defences — a dumped save or an auto-hit AC that made them far easier than their reputation. They have been tuned: no HP inflation, no CR changes, just closing the gaps. Expect the Witch King, Smaug, Summanus, the Gwathdor Lord, Sauron, Gandalf, Boromir, Denethor, the Temple Mistress, Legolas and Theoden's Chosen to punish a mediocre build far more than they used to. Full per-boss numbers: <a href=\"https://homerslotr.com/manual/boss-updates#recipe\">Endgame Difficulty design brief</a>.</div>"
    impl_notes: "<div>First deliverable of <a href=\"#idea-higher-difficulty-ceiling-revamp\">the higher-difficulty-ceiling umbrella</a> — pure blueprint data edits, no HP inflation and no CR-label changes.</div><div><br></div><div>Priority A (glaring single hole): Smaug (Ref +0), Summanus (Will +0), Gwathdor Lord (Will +5), Sauron the Abhorred (Fort +4, AC 65), Gandalf the Gray (Will +10, AC 63), with the Witch King as the worked example. Priority B (auto-hit AC / missing immunity gear): Boromir, Denethor, Temple Mistress, Legolas, Theoden's Chosen.</div><div><br></div><div>Applied to all ten: blueprint and placed instance edited in lockstep (encounter-spawned Summanus/Legolas are blueprint-only). Witch King had been marked DONE in the brief but was never actually applied — applied now (NaturalAC 0-&gt;30, Fort 0-&gt;27, Ref 3-&gt;15, Will 13-&gt;22); Smaug Ref 0-&gt;25 / Will 0-&gt;22; Summanus Will 0-&gt;30 / Fort 0-&gt;20; Gwathdor Lord Will 0-&gt;27; Sauron Fort 0-&gt;28 / AC+20; Gandalf Will 0-&gt;18 / AC+22; Boromir AC+20; Denethor Ref 0-&gt;18 / AC+13; Temple Mistress AC+18 and Legolas Fort 0-&gt;12 with npcbuffgear immunity skins; Theoden's Chosen given the real bossring + npcbuffgear skin.</div>"
    manual_steps:
      - step: "Follow-up noted but not done (beyond pure-data scope): a damage rider for Theoden's Chosen &mdash; his low AB offense remains."
        status: open
        kind: admin
        step_h: 64
