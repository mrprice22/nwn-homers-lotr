  - id: toolset-cost-override-wipe
    title: "Investigate: a toolset save can wipe an item blueprint's Cost override"
    group: wiki-tools
    status: later
    hidden: true
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-07-25"
    notes: "<span>Internal investigation - not player-facing.</span>"
    impl_notes: "<div>Found while changing the appearance of the Quiver of Endless Flight (ammoreplicator). In one toolset save its Cost went <b>250,000 -&gt; 3</b> alongside the intended ModelPart1 11-&gt;226 change. engraverchisel, edited in the same session with the same kind of change (ModelPart1 11-&gt;91), kept its Cost 25,000 - because it carries AddCost 24,997 and 25,000 is its genuine property-derived value. Working hypothesis: <b>the toolset recomputes Cost from base item + properties + AddCost on save and discards any hand-set override</b>; the appearance edit is only what triggered the save, not the cause.</div><div>Why it matters: unpacked/forge_inc.nss (ForgeRebuildValue, ~line 339) documents that GetGoldPieceValue returns the blueprint's fixed Cost override and <i>ignores</i> properties. So that field is the live in-game value, and a silent reprice moves an item relative to the Forge's FORGE_MAX_VALUE caps and changes vendor prices. AddCost is a word capped at 32,767 and cannot carry large values - 284 of 3,401 items use it; the other 3,117 rely on Cost alone and are exposed.</div><div>Restored ammoreplicator to Cost 250,000 in the blueprint and in the inline copy on the Angmar instance (area009.git.json Creature List[0] ItemList[15]).</div><div>To investigate: confirm the recompute rule against a controlled toolset save; work out which items already lost an override historically (git log over unpacked/*.uti.json for Cost drops); decide whether a build gate should flag a Cost that disagrees with its derived value by more than some margin.</div>"
    manual_steps:
      - step: "Reproduce: open a high-Cost item with AddCost 0 in the toolset, change nothing, save the module, and diff its .uti.json to confirm Cost is recomputed."
        status: open
        kind: toolset
      - step: "UAT: in-game, confirm the Quiver of Endless Flight reads 250,000 gp again."
        status: open
        kind: uat
