  - id: dedupe-item-tags
    title: "Resolve all duplicate-tagged items (module-index/item_tag_conflicts.json) — give each variant a unique Tag/resref"
    group: items-gear
    status: awarded
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-07-05"
    commit: 74803a6f53a
    notes: "Items that share a Tag but differ in properties break tag-based lookups and confuse the Forge contraband whitelist (a single resref can only represent one blueprint fingerprint). Surfaced by the Longsword of Elrond false-jailing bug: Elrond's Rivendell copy and Card Mennard's Edoras copy both use resref/tag handofpaladine/LongswordofElrond with different properties, which is why that item needed a whitelist entry at all. Audit every entry in module-index/item_tag_conflicts.json and give each variant its own unique Tag (and resref where the conflict is resref-level), then regenerate forge_legal_inc.nss and the wiki.<br><br><b>Fixed:</b> new reusable tool bin/dedupe-item-tags.py scans unpacked/ directly, groups each shared tag's members by property signature, keeps one canonical signature on the tag and gives every other a unique tag with the cheapest safe rewrite — retag blueprint (367), promote an inline override to its own .uti (211), re-point to a same-signature blueprint (11), retag-in-place for creature-equipped overrides so respawns stay faithful (90), and retag module blueprints that borrowed a base-game resref as their tag (13). 361 of 369 conflicts resolved. The remaining <b>8</b> are left intact on purpose: their tag is used as a live quest/script lookup key (e.g. BossRing, DyeKit, DenethorsPlate, EpicRing, witchbud, nw_wplmsc004, BlackGalvornPlate, X2_IT_MGLOVE018), so renaming the item would break a quest — the tool detects and defers these for manual, per-quest reconciliation. Because promotions change an item's resref, bin/gen-forge-legal.py now re-whitelists each migration's pre-dedup fingerprint from the committed map, so items players already carry are never jailed after the rename lands (no player .bic edit required). Verified: 0 remaining source-scan conflicts (besides the 8), idempotent re-apply, all build gates pass, and every one of the 750 changed resources round-trips through nwn_gff. The wiki's conflict report and item pages update on the next scheduled refresh."
