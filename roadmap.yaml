    impl_notes: "<div>Journal pc_shadowdancer; prestigedb order key 'shadow', one-off. Offer requires 1+ Shadowdancer level; others get a pointer line.</div><div><br></div><div>Uses the existing DeepWell placeable. The light check covers a carried torch, any light-property item in any slot, and an active Light/Continual Flame effect; failure is a flavor message with retry allowed, and the well's original splash-sound script still chains for everyone. Skein of the Unlit Deep is plot+cursed, re-given if lost. No new placements or waypoints.</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>implemented</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Unlit Deep</b> — the Shadowdancer initiation, the hub's fourth order. Approach the deep well beside Balin's Tomb carrying no light at all: no torch, no light-bearing gear, no Light spell running. Pays 1,000 XP and the <b>Boots of the Unlit Road</b> (Hide / Move Silently / Tumble +3). Details: <a href=\"QuestGuide.html#shadowdancer\">Quest Guide → Shadowdancer</a>.</div><div><br></div><div><b>Archived manual steps</b> — reinstate these when the line is redesigned:</div><ul><li>[uat] UAT gating: non-SD L11+ character sees only the pointer line.</li><li>[uat] UAT: SD character accepts, journal 1, stage survives relog.</li><li>[uat] UAT at the DeepWell: lit -&gt; fail message and nothing granted; unlit -&gt; skein + journal 2. The well still plays its sounds for uninvolved players.</li><li>[uat] UAT turn-in: skein consumed, XP + boots granted, journal ends; epilogue only afterwards, no second reward.</li></ul>"

