    impl_notes: "<div>server.env: NWNX_MAXLEVEL_SKIP flipped y-&gt;n with NWNX_MAXLEVEL_MAX=60 (the plugin's env var, valid range 41-60; cached readme at ~/Documents/nwn_docs/NWNX_EE_ MaxLevel.html). The env-flag lever was chosen over NWNX_Administration_SetMaxLevel() so there is exactly one writer — unpacked/nwnx_admin.nss:173 warns about the conflict. Needs a container restart, which is fine.</div><div><b>Undocumented dependency found:</b> MaxLevel also requires the <b>NWNX_ELC plugin to be loaded</b> to bypass the engine's level-40 restriction (\"merely loading this plugin is sufficient\", no configuration). Added NWNX_ELC_SKIP=n. This is <i>not</i> the server's own character validation: NWN_ELC/NWN_ILR stay 0 and nothing in unpacked/ subscribes to the NWNX ELC validation events, so no connecting character is re-validated — see ll-elc-validation. Both plugins are present in the Anvil image (NWNX_MaxLevel.so, NWNX_ELC.so).</div><div><b>classes.2da needs no change</b> — the earlier claim in these notes and in the README was wrong and has been retracted: all 11 player base classes already carry MaxLevel 0 / EpicLevel -1.</div><div><b>Known upstream quirks.</b> (1) The character sheet's \"Next Level\" XP figure is wrong from 40 up — the engine extrapolates its own hardcoded curve instead of reading exptable.2da. <b>Worked around</b> in unpacked/nextlvl_inc.nss (commit b922e25d38a): NextLevel_FixTlk() sets a per-player TLK override on strref 315 (\"Next Level\", confirmed against dialog.tlk) to \"Next Level: &lt;real requirement&gt;\\n\", the trailing newline pushing the engine's wrong figure onto an unseen second line. The number is read live from exptable.2da row nLevel, so it cannot disagree with what the server levels off; the override is cleared below level 40, shows \"Max\" at 60, and no-ops if the row is unreadable (missing hak) rather than printing 0. Applied at login (mod_cliententer.nss, 2s delay) and re-applied on NWNX_ON_LEVEL_UP_AFTER / NWNX_ON_LEVEL_DOWN_AFTER (nextlvl_evt.nss, subscribed in onmoduleload.nss) — death XP loss can drain a level back below 40. (2) Spellcasters may be unable to re-pick known spells on an epic level-up: not worked around.</div>"
    design_questions:
      - question: "Which lever raises the cap — the MaxLevel plugin (NWNX_MAXLEVEL_SKIP=n in server.env) or NWNX_Administration_SetMaxLevel(60) from onmoduleload.nss? They write the same value, so using both is a conflict waiting to happen. Proposal: the plugin env flag, because server.env already documents the enabled plugin set in one place and it takes effect without a script change; the tradeoff is that it lives outside git-tracked module source and needs a container restart to apply."
        status: answered
        answer: "I only found docs for NWNX_MAXLEVEL_MAX, cached locally as \"/home/james/Documents/nwn_docs/NWNX_EE_ MaxLevel.html\"\ncontainer restart is fine\nI want to use the normal level up screen that players get for levels 2-40 already\nI want the in-game server browser to advertise max level 60 using the native nwn level range display on servers.. I have seen others with 60 so I know this is possible."
        answer_h: 99
    manual_steps:
      - step: "Restart the season 2 server so the new NWNX env vars are read (bin/server-restart). The plugin load line for MaxLevel and ELC should appear in the startup log; \"Server: Invalid argument to -maxlevel\" at startup is expected and safe to ignore per the plugin readme."
        status: done
        kind: admin
        blocker: true
      - step: "UAT: with the rebuilt hak published, take a level-40 test character past 40 (Ping Pong → Set my level → Legendary Levels 41-60, or award XP) and confirm level 41 is actually granted rather than silently refused."
        status: done
        kind: uat
      - step: "UAT: confirm the in-game server browser advertises the level range up to 60."
        status: done
        kind: uat
      - step: "If level 41 is refused, the ELC dependency is the first thing to check — confirm NWNX_ELC actually loaded in the startup log before touching anything else."
        status: done
        kind: admin
      - step: "UAT: at level 40+ open the character sheet and confirm \"Next Level\" shows the exptable figure (828,800 at level 40) on one line with no second number visible. Check again at 41 and at 60, where it should read \"Max\"."
        status: done
        kind: uat
      - step: "UAT: drain a level 40 character below 40 (death XP loss or Ping Pong) and confirm the sheet goes back to the stock \"Next Level\" display rather than sticking on the override."
        status: open
        kind: uat
  - id: ll-cls-progression
    title: "Class progression tables for levels 41-60"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-27"
    commit: 5828f534322
    notes: "<div>Levels past 40 advance your class properly: attack bonus, saves and the feat / ability-score cadence all keep going, and your caster level keeps rising with every level — so spell DCs, durations and damage caps keep scaling too. Spell slots stay where they were at 40, the same way epic levels 21-40 already work; the extra casting power will be sold through Legendary Feats instead.</div>"
    impl_notes: "<div><b>No 2DA work needed for MARTIAL progression</b> — the earlier scope (\"needs cls_*.2da work in hak_2da/\") was wrong for BAB/saves/feats. Stock NWN:EE tables already carry 60 rows, so classes.2da keeps pointing at them and 41-60 progresses on its own. Verified against the live install with nwn_resman_cat (row index = level - 1):</div><ul><li>cls_atk_1: BAB 30 at level 39 → 40 at level 59; cls_atk_3: 20 → 30. +0.5/level continues.</li><li>cls_savthr_fight: 21/15/15 → 31/25/25. Saves keep climbing.</li><li>cls_bfeat_fight: the 1/0 epic alternation runs through row 58.</li></ul><div>General feats (1 per 3 levels) and ability increases (+1 per 4) are engine-side and continue past 40 per the MaxLevel readme (\"Feats and Ability Points follow their normal progression\") — the one part that must be confirmed empirically. Findings recorded in README.md \"Levels 41-60\".</div><div><br></div><div><b>RETRACTED 2026-07-29 — casters DID need 2DA work.</b> This item originally concluded \"cls_spgn_wiz and cls_spkn_sorc are identical at levels 39 and 59 — no new slots past 20, which is exactly the agreed 'caster level scales, slots don't' answer.\" The observation was right but the conclusion was not: the design answer recorded on this very item says caster level keeps scaling \"in all the regular ways: <b>spell slots</b>, caster DC, duration, damage caps.\" Shipping flat tables meant casters gained nothing for twenty levels, which players then reported. Fixed in <b>legendary-caster-spells-on-level-up</b> (commit 192f9dde8b6): all seven cls_spgn_*.2da now ship in lotr_rules.hak on a +1-per-castable-spell-level cadence at 44/48/52/56/60 (50/60 for paladin/ranger).</div>"
    design_questions:
      - question: "Does caster level keep scaling from 41 to 60? Spell DCs, durations and damage caps all key off it, so 20 more caster levels is the single biggest balance lever in the whole epic. Proposal: caster level keeps rising but spell slots stop at the level-40 table, so casters gain reach and reliability without another 20 levels of raw slots — and the extra power gets sold through Legendary Feats instead, where it can be priced per feat."
        status: answered
        answer: "yes caster level keep scaling in all the regular ways: spell slots, caster DC, duration, damage caps."
      - question: "What cadence do bonus feats and ability-score increases follow from 41 to 60? HGLL gave 1 feat per level and let you buy stat points. Proposal: keep the stock epic cadence (a feat every 3 levels, +1 ability every 4) rather than HGLL's 1-per-level, so the Legendary Feat pool stays scarce enough to matter."
        status: answered
        answer: "HGLL did NOT give 1 feat ever level: it followed the stock epic cadence (a feat every 3 levels, +1 ability every 4) which is what we will do for 41-59. \n\nThe Legendary feats can ONLY be taking at exactly level 60 though, not simply levels 41-60 at every 3 levels frequency (those use the normal /epic feat pool)"
    manual_steps:
      - step: "UAT: with the cap live, level a test character 40 → 41 → 45 → 60 with Ping Pong and record per level: BAB, the three saves, hit points, skill points, caster level, bonus feats and ability increases. Compare against the stock tables in the impl notes."
        status: done
        kind: uat
        blocker: true
      - step: "UAT: confirm the general feat pick lands at 42/45/48... (every 3 levels) and the ability point at 44/48/52... (every 4)."
        status: done
        kind: uat
      - step: "UAT (casters): confirm caster level rises with each level past 40 — check a level-scaling spell's duration or damage cap — and that spell slots are unchanged from level 40."
        status: done
        kind: uat
      - step: "Feed the recorded table into the Leveling Guide rewrite (ll-hgll-purge-docs / ll-wiki-leveling-docs); the per-level gains section is waiting on exactly this data."
        status: done
        kind: admin
