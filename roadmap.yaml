  - id: attack-bonus-cap-20
    title: "Attack bonus capped at +20 once a weapon is equipped"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Defect
    player: "Sync (Shync)"
    date: "2026-08-21"
    commit: 6f4594491ff
    notes: "<div><b>The server's attack-bonus ceiling has been raised from +20 to +40.</b> If you were wielding a high-plus weapon, everything else that adds to your attack - Bard Song, Legendary Prowess, Legendary Grip, Legendary Reaping, War Cry, Bless, Prayer, Divine Favor and the rest - stopped counting the moment your total reached +20. That is why the recent bard song work looked perfect unarmed and looked broken again the second you drew a +15 weapon: unarmed you had room under the ceiling, armed you had five points of it.</div><div><br></div><div>Nothing about the buffs themselves changed - the ceiling did. Reported by Sync.</div>"
    impl_notes: "<div><b>Root cause: the engine's attack-bonus limit, not the module.</b> NWN:EE clamps the SUM of item attack bonus and effect attack bonus to settings.tml [ruleset.combat] max-attack-bonus, engine default 20 (NWScript GetAttackBonusLimit / SetAttackBonusLimit; ini label AttackBonusLimit, Server Options). A +15 weapon therefore left +5 of headroom for the whole bonus ledger, and the engine truncates silently - no log line, no feedback. Unarmed testing never hit it, which is exactly why the bard-song round-2 UAT passed while play did not.</div><div><br></div><div><b>Fix:</b> server.env NWN_MAX_ATTACK_BONUS=40, patched into settings.tml by bin/serve in the same replace-or-insert block that already forces max-ability-bonus=24, with the same g&lt;1&gt; discipline (a bare backreference there is an octal escape - the stray-T bug). The schema constraint on this key is already max=255, so unlike max-character-level there is no second line to bump. Verified idempotent: patching a live copy twice changes exactly one line, 20 -&gt; 40.</div><div><br></div><div><b>Not a ruleset.2da row</b> - nothing in the stock or hak table exposes this limit - so no hak rebuild and NO NWSync refresh. The value is read at server start, so it needs a restart and nothing else. Deliberately attack only: max-saving-throw-bonus (20), max-skill-bonus (50), max-damage-bonus (100) left alone.</div><div><br></div><div><b>Doc correction (bonus_pool_inc.nss header):</b> it claimed item attack bonus was max-of against the pooled total. It is not - item AB and the pooled effect ADD, and the engine clamps the sum. The header now says so, and names the ceiling, so the next reader does not re-derive this from a bug report.</div>"
    manual_steps:
      - step: "Arm bin/reboot-on-empty so the dev realm picks up the new settings.tml. The cap is read at server start, so nothing changes in game until the realm cycles. Never force-restart the dev realm.\n\nArmed 2026-08-21 (bin/reboot-on-empty). Waiting for the realm to empty; mark done once the server has come back up and GetAttackBonusLimit reads 40."
        status: done
        kind: publish
        blocker: true
      - step: "UAT the reported bug: equip a +15 weapon, note the logged attack roll, then stack Bard Song / Legendary Prowess / War Cry and confirm the roll keeps climbing past +20 of bonus instead of flatlining. Read the COMBAT LOG, not the character sheet."
        status: done
        kind: uat
        tester: "Sync, level 60 melee or bard with a +15 weapon"
      - step: "UAT the new ceiling itself: pile on enough sources to exceed +40 of attack bonus and confirm it stops there rather than somewhere lower. This is the check that proves the setting took, not just that something improved."
        status: open
        kind: uat
        tester: "level 60 with a high-plus weapon and full buffs"
      - step: "UAT the character sheet: the sheet is drawn client-side, so check whether its attack number tracks the new ceiling or still clamps at the old one. If the two disagree the combat log is the source of truth - report it rather than treating it as a regression."
        status: done
        kind: uat
        tester: "any"
  - id: bard-song-issues-round-2
    title: "Bard song issues round 2"
    group: combat-classes
    status: awarded
    merit_awarded: true
    type: Defect
    player: "Sync (Shync)"
    date: "2026-08-21"
    commit: d4a25792b2a
    notes: "<div><b>Bard Song's attack bonus lands again, and so does every buff spell's.</b> Singing was showing the bonus on your character sheet but not applying it to a single attack roll, and War Cry's +2 appeared for about two seconds and then went away. Everything else the song gives - saves, AC, skills, temporary hit points - was working the whole time, which is why it was hard to see.</div><div><br></div><div>The cause was the module's spell-duration doubler. When it stretched a buff to twice its length it was quietly re-issuing it as an anonymous effect, so the system that adds your attack bonuses up no longer recognised the song (or Bless, Aid, Prayer, War Cry, Divine Favor, Divine Power, Divine Wrath) as still running, and dropped its share about a second after you sang. Your buffs keep their identity now.</div><div><br></div><div>Two related problems went with it: a bard carrying <b>Legendary Prowess</b> could find themselves unable to re-sing on themselves, and casting <b>War Cry</b> could strip every pooled attack bonus you had, not just its own.</div><div><br></div><div>The attack-bonus icon staying up through a rest or a death is not a bug - that buff is deliberately built to survive both.</div>"
    notes_h: 276
    impl_notes: "<div><b>Root cause: the duration doubler was stripping the identity off every buff it re-timed.</b> eff_dur_x2.nss re-times an effect by removing it and re-applying a copy, and since curse-song-too-many-instructions (2026-08-20) it rebuilds a LINKED effect as a link - which is correct, and is also the first time that remove+re-apply has actually run, since it was previously being killed by TOO MANY INSTRUCTIONS on exactly these paths. EffectLinkEffects builds a NEW parent effect, in a delayed script with no spell context, and the engine hands the parent's creator / spell id / subtype down to its children. So a faithful per-component copy came back out as \\\\\\\\\\\\\\\"spell -1, cast by nobody\\\\\\\\\\\\\\\".</div><div><br></div><div><b>What that broke:</b> the bonus ledger keeps a transient entry alive by a WITNESS - BPool_Revalidate deletes a source whose spell effect is no longer on the creature (GetHasSpellEffect 411 for Bard Song, 373 for War Cry). bpool_eff schedules that revalidate 1.0s after any effect removal. The doubler's own removal fires it; one second later the witness reads FALSE and the entry is gone. That 1s is exactly the reported \\\\\\\\\\\\\\\"shows on char sheet for like 2 seconds\\\\\\\\\\\\\\\". The song's saves/AC/skills/temp HP are unaffected because they ride in the link, not the ledger - \\\\\\\\\\\\\\\"rest of the buffs seemed normal\\\\\\\\\\\\\\\". The stale char-sheet number is the client's cached effect list; the combat log was right.</div><div><br></div><div><b>Fix 1 (eff_dur_x2.nss):</b> capture nSpellId / nSubType / nCasterLevel / oCreator off the first component and stamp them back onto the finished link (NWNX_Effect_UnpackEffect -&gt; set -&gt; PackEffect) before applying. Fixes every GetHasSpellEffect consumer at once - the ledger's witness, both songs' \\\\\\\\\\\\\\\"already sung on\\\\\\\\\\\\\\\" guards, RemoveSpellEffects, dispel attribution - not just the bard. The x2dur_debug line now prints the re-applied spell id.</div><div><br></div><div><b>Fix 2 (bpool_eff.nss):</b> ignore removals inside the doubler's x2dur_busy window. A remove-and-immediately-re-apply is not an effect ending, and revalidating off it reads the witness in the one instant it is deliberately absent. Defence in depth behind fix 1.</div><div><br></div><div><b>Two further defects found in the same read</b>, both from BPool_Rebuild rendering the pooled effect inline in a caller's SPELL context. An effect is stamped with the spell id of the script that creates it, and the pooled effect is PERMANENT, so it kept that identity forever: (a) it satisfied the ledger's own witness - GetHasSpellEffect(411) is true forever if the pooled effect IS a spell-411 effect - and the song's re-sing guard, so a bard carrying Legendary Prowess could be silently unable to re-sing on themselves; (b) nw_s0_warcry opens every cast with RemoveSpellEffects(GetSpellId(), ...), which would sweep the WHOLE pooled bonus - every source, not just War Cry's - while leaving the ledger untouched. A second, independent path to \\\\\\\\\\\\\\\"War Cry takes the AB away\\\\\\\\\\\\\\\". <b>Fix 3 (bonus_pool_inc.nss):</b> the render moves into BPool_Render, called through DelayCommand(0.0, ...) - a script situation with no spell context - so the pooled effect belongs to nobody but the ledger. BPOOL_BUSY is set before the strip and cleared in a command queued after the render, so it still covers our own churn.</div><div><br></div><div><b>Not a bug, do not chase it:</b> the AB icon surviving rest and death is by design - the pooled effect is permanent and supernatural, and mod_respawn re-renders it deliberately.</div><div><br></div><div><b>Gates.</b> check_effect_doubler now asserts the rebuilt link is re-stamped with nSpellId and oCreator before the apply; check_bonus_pool asserts the render is deferred and that bpool_eff keeps the x2dur_busy guard. Both invariants are invisible in review: the broken version compiles, runs, logs a cheerful \\\\\\\\\\\\\\\"doubled\\\\\\\\\\\\\\\" line, and the only symptom is an ability quietly doing less than it says.</div><div><br></div><div><b>Build.</b> Module-only - no hak, TLK or 2da, so no NWSync. Repack green (29/29 smoke, 0 failing dialogs), installed to the DEV realm only.</div><div><br></div><div><b>If UAT still shows no attack bonus</b>, the remaining reading is that the ledger and its effect are intact but the engine is not counting the pooled EffectAttackIncrease in attack rolls, which needs a different render (attack bonus as an item property on a hidden hide). Scope that separately - the three fixes above are correct either way.</div><div><br></div><div><b>UAT follow-up (5af4e117937): the buff ICON, one field further in the same root cause.</b> A running buff kept working but lost its icon after an area transition (reported on teleporting into the Well of Eru), and re-casting could not bring it back - only resting or dying first. bExpose and bShowIcon are part of the identity the rebuilt link does not inherit, and they are the half the CLIENT reads. The icon on screen right after casting is stale, because the NWNX removal never told the client, so nothing looks wrong until the next area load rebuilds the client's effect list from the server. Re-casting correctly refuses because the spell really is still running - that guard only started working again with the spell-id restore above, which is why this surfaced now. X2Dur_ReTime now captures bExpose/bShowIcon off the first component alongside the spell id and creator and stamps them back onto the finished link; check_effect_doubler covers both new fields. Expect the effect to be area-load-wide rather than Well of Eru-specific - any area transition rebuilds that list.</div><div><br></div><div><b>UAT follow-up 2 (0a1806b637e) - the icon loss was the TELEPORT, not the doubler.</b> Retest showed icons surviving every ordinary area transition and dying only on the rest menu's \\\\\\\"To. The Well of Eru.\\\\\\\" option, so the bExpose/bShowIcon restore above was not the cause (it is still correct, and stays). tele_woe.nss was a faithful copy of the legacy _teleportpvp reply script, which does three things tele_db.nss's own Tele_DoJump deliberately refuses to do: (1) EffectDisappear on the PC - it vanishes and re-materializes the character, so the client tears the object down and rebuilds it, and the effect-icon list is only refilled by an AREA LOAD; tele_db already avoided it for a second reason, that it leaves the PC non-commandable and a queued ActionJumpToLocation then never runs; (2) TWO jumps - \\\\\\\"pvp\\\\\\\" then \\\\\\\"secondchance\\\\\\\" a second later, the second hop being inside the destination area, so the character moves with no area load behind it to resync the client; (3) fire-and-forget VFX applied as PERMANENT effects ON the PC, a pair of junk effects per teleport for the life of the session. tele_woe now calls Tele_DoJump with the same destination and a depart/arrive burst either side, so the look survives. _teleportbree / _teleportlake carry the identical pattern but hang off the DM emote wand, not the rest menu, and were left alone.</div><div><br></div><div><b>UAT follow-up 3 (f28351184e0 revert, 99772648efc fix) - the no-casting zone, not the teleport.</b> The tele_woe rewrite was reverted at the admin's call: it made the teleport faster and lost its landing animation without fixing the icons. The differentiator is the <b>spellfailarea</b> trigger (the Well's \\\"silence\\\" zone, which is EffectSpellFailure(100), not EffectSilence). Its polygon covers the whole southern body of the area - everything below y ~51 - and the rest-menu teleport lands on <b>secondchance</b> (24.95, 4.89) deep inside it, while every DOOR arrives outside it (Bree door y 80, buff-room transition y 55), about 44m away. So a teleport fires _spfailenter in the same frame as the area load and a door arrival never does: teleport in and the icons go, walk in and they stay. Nothing else in the area touches a PC's effects - the OnEnter chain (prsg_enter -&gt; welloferuenter) has no Effect*/Remove* call at all. Applying an effect to a PC while the client is still building the character object for the newly loaded area leaves the client's effect-ICON list desynced: the effects stay (correct sheet, correct combat log) but the icons are gone and nothing resyncs them, and re-casting correctly refuses because the buff really is still running. _spfailenter now applies on a 1.5s delay, re-checking the PC is still in the zone. Fixed alongside: the apply was unguarded and permanent, so a player stacked one 100% spell-failure effect per crossing (twice per trip on the legacy two-hop teleport, plus one per rest inside the zone via on_mod_rest) and every NPC in the hub collected them too - now one per visit, PCs only; and _spfailexit removed effects inside a GetFirstEffect/GetNextEffect walk, which invalidates the walk and can leave a permanent 100% spell failure on a player who then carries it out of the Well - it now restarts the walk after each removal. If the icons still vanish after this, the timing is innocent and the effect itself is what the client chokes on: the answer then is to drop the effect entirely and block the cast through NWNX_ON_CAST_SPELL_BEFORE (arcane-only, keyed off the SPFAIL_ZONE local the trigger already maintains).</div>"
    manual_steps:
      - step: "UAT, THE REPORTED BUG - read it off the COMBAT LOG, not the character sheet. Level-60 bard, 120 Perform: note the logged attack roll unbuffed, sing, and confirm the roll rises by the tier amount (+6) AND is still risen 10 seconds later. The sheet was never the problem; the log was.\n\nConfirmed: No buffs, AB 68/63/58, after bard song: 74, 69, 64 --> Also shows correctly on character sheet"
        status: done
        kind: admin
        step_h: 113
      - step: "UAT with Legendary Prowess: the song's attack bonus must be ON TOP of the feat's +5, not instead of it (the invariant from bard-legendary-prowess-conflict).\n\nWith bard song and legendary prowess, AB now 79, 74, 69, exactly 5 more than with bard song but no legendary prowess. Char sheet and combat log aligned."
        status: done
        kind: admin
        step_h: 120
      - step: "UAT the buff spells, broken the same way: War Cry, Bless, Prayer and Divine Favor must each move the logged attack roll and KEEP it for the spell's full (doubled) duration.\n\nWar cry cranks ab from 79  to 81 -- duration seems okay, but not gonna wait 60 rounds"
        status: done
        kind: admin
      - step: "UAT the re-sing guard: with a song already running on yourself, singing again must do nothing. This was broken while the pooled effect masqueraded as the song."
        status: done
        kind: uat
        tester: "bard 30+"
      - step: "UAT War Cry does not sweep other bonuses: with a bard song running (or Legendary Prowess), cast War Cry and confirm the total attack bonus GOES UP by 2 rather than collapsing."
        status: done
        kind: uat
        tester: "bard 30+ with War Cry"
      - step: "UAT expiry still works: let the song lapse and confirm the attack bonus drops by exactly the song's share while permanent feat bonuses remain. Then die and confirm transients clear and the feat bonuses come back.\n\nResult: This has some visual issues: When I die, or rest, the buff icons go away and char sheet returns to looking unbuffed. However, if, while buffed with bard song, I teleport to WELL OF ERU, the buff icons go away, but my char sheet remains buffed as expected. This seems to only happen if I teleport into well of eru. When buff icons are gone like this, re-casting the effect (bard song) does not make them re-appear, I have to rest or die first, and then recast to get the visual indicators back."
        status: wip
        kind: admin
        step_h: 193
      - step: "UAT yesterday's fix did not regress: set the module local int x2dur_debug, sing, and confirm the [x2dur] lines still show parts greater than 1, doubled durations, and now reappliedSpellId=411 (not -1). Curse Song must still land all seven components with no TOO MANY INSTRUCTIONS."
        status: open
        kind: uat
        tester: "bard 30+"
      - step: "Publish: already repacked and installed to the DEV realm; bin/reboot-on-empty is armed so the realm picks it up when it next empties. Script-only change - no hak, TLK or NWSync."
        status: done
        kind: publish
