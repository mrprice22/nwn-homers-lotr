        kind: uat
      - step: "Do NOT set NWN_ELC=1 or NWN_ILR=1 while levels 41-60 are live; that is the server's own validation and would re-check legendary characters against the 2DAs. The NWNX_ELC plugin being loaded is unrelated and must stay."
        status: open
        kind: admin
      - step: "Hak rebuild: lotr_rules.hak now packs ruleset + baseitems + classes + exptable, and bin/build-lotr-rules-hak verifies that list on every build. Installed and verified 2026-07-27."
