  - id: ll-exptable-2da
    title: "Epic XP table: levels 41-60"
    group: combat-classes
    epic: legendary-levels
    status: awarded
    hidden: true
    merit_awarded: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-27"
    commit: 5828f534322
    notes: "<div>Levels 41–60 now cost real experience on a published table instead of the leveling system's private accounting — so your XP bar and your character sheet finally agree past level 40. Level 41 sits at 828,800 total XP and level 60 at 3,581,000; level 41 costs 48,800 over level 40, and every level after that costs 10% more than the one before it. The full table is in <a href=\"Customizations.html#legendary-levels\">Customizations → Legendary Levels</a>.</div><div><br></div><div>Approved: CLAUDE to pack HAKs, take down season 2 server, refresh nwnsync, and then bring server back online</div>"
    impl_notes: "<div>Table itself shipped earlier (commit 83848c05cc63256a657e46eb426988a22decf475): hak_2da/exptable.2da, rows 0-39 byte-identical to stock, row 40 (level 41) 828800 replacing the 0xFFFFFFFF sentinel, rows to level 60 = 3,581,000 (delta 48,800 compounding x1.1, the <i>step</i> rounded to whole hundreds each level, half up), and a new row 60 carrying the sentinel above the cap.</div><div><b>Delivery (2026-07-27):</b> the table was never actually packed — the installed lotr_rules.hak held only ruleset/baseitems/classes, so levels 41-60 did not exist in game. Added bin/build-lotr-rules-hak: packs the four rules 2DAs from hak_2da/, verifies the pack with nwn_erf -t against its own file list before install, backs up the hak it replaces, and installs into $NWN_HOME_DIR/hak (--home for extra NWN homes). Hand-packing from the README recipe had dropped a 2DA twice; the list now lives in the script. hak_2da/ruleset.2da (MULTICLASS_LIMIT 4) is now tracked so the hak is reproducible from the repo without re-extracting game data. Built and installed into the season 2 home; nwsync publish + restart are the remaining steps.</div><div><b>Gate:</b> new tests/check_epic_tables.py in the smoke test — exptable.2da must stay on the stock curve to 40 and the compounding curve to 60 with the level-61 sentinel intact, and the transcribed fallback switch in unpacked/_build_lvl_inc.nss must match it value-for-value (the curve was transcribed twice with nothing tying the copies together). Also asserts classes.2da XPPenalty stays zeroed. 11/11 smoke tests pass.</div>"
    manual_steps:
      - step: "Pack exptable.2da into lotr_rules.hak. DONE 2026-07-27 via bin/build-lotr-rules-hak --install (verified: baseitems, classes, exptable, ruleset). Rebuild with that script from now on — never by hand."
        status: done
        kind: publish
      - step: "Run bin/refresh-nwsync so clients receive the updated lotr_rules.hak, then restart the server. Clients with a stale hak read the old table and their character sheet clamps at 40."
        status: done
        kind: publish
        blocker: true
      - step: "UAT: log in with a level 40 character and confirm the XP bar / character sheet shows the next-level requirement as 828,800 rather than treating 40 as the cap. Note the MaxLevel plugin has a known upstream bug where the sheet's \"Next Level\" figure is wrong past 40 — judge by whether levelling actually happens, not only by that number."
        status: done
        kind: uat
      - step: "UAT: verify the level-40 threshold is unchanged (780,000) and that no character below 40 sees a shifted XP requirement — rows 1-40 are byte-identical to stock, this is a regression check."
        status: open
        kind: uat
      - step: "UAT: spot-check three mid-table levels against Customizations.html — L44 1,006,600, L52 1,825,100, L60 3,581,000."
        status: open
        kind: uat
      - step: "UAT: confirm a character cannot be pushed past level 60 (the level-61 row is the 0xFFFFFFFF unreachable sentinel)."
        status: open
        kind: uat
