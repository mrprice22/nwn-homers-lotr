  - id: concerning-hobbits
    title: "Quest: Concerning Hobbits (Shire genealogy)"
    group: quests-areas
    epic: quest-overhaul
    status: confirmed
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-30"
    commit: 7ed910b39b3
    notes: "<div><b>Concerning Hobbits</b> — a new T1 daily (L5). Odo Proudfoot keeps a counter at the <b>Green Dragon Inn</b>, one door off the Hobbiton green, and he is deep in a genealogy dispute that wants five questions of Shire lineage settled. Four right pays <b>500 gp, 500 XP</b> and a pouch of Longbottom Leaf; a perfect five upgrades the keepsake to a <b>Greater Ring of Scholars</b>. The dispute — and the answers — change with the season, and the whole server argues over the same one.</div><div><br></div><div>Win once and you have proved yourself hobbit-knowledgeable, and Odo will thereafter <b>sell you pipe-weed</b> — see <a href=\"#idea-concerning-pipeweed\">Concerning Pipeweed</a>, which also brings fast travel to the Shire. Details: <a href=\"QuestGuide.html#concerning-hobbits\">Quest Guide → Concerning Hobbits</a>.</div>"
    impl_notes: "<div>Journal tag concern_hob; custom tokens 6420-6428; all logic in q_hob_inc.nss. Built on the established riddle-game pattern (token-driven dialogue, StartingConditional Active scripts, quest_cd_inc/questcddb, journal wiring).</div><div><br></div><div>Odo Proudfoot (q_hob_odo) draws five questions from a bank of 16 canon Tolkien-genealogy questions; question set and answer order are seeded from the in-game calendar season (GetCalendarYear()*4 + season, stride walk over the bank), so the correct answer rotates each season and the whole server shares one seasonal dispute. Daily gate (QCD_IsDoneToday) applies win or lose, finalized atomically on the fifth answer so escape-closing cannot dodge the stamp or double-pay. Giver spawns at AP_concerninghobbits_1; conversation q_hob_conv on the blueprint.</div><div><br></div><div><b>STILL TO BUILD — agreed 2026-07-30, three changes on top of commit 7ed910b39b3:</b></div><div><br></div><div><b>1. Reward.</b> QHOB_PayOut becomes a flat GiveGoldToCreature(oPC, 500) and QHOB_XP goes 100 -&gt; 500 (was 40 + Random(61) gp and 100 XP). Keepsake logic is unchanged in shape: grscholar at a perfect 5/5, otherwise the pouch — but the pouch resref moves from witchbud to the new <b>pw_longbottom</b> from <a href=\"#idea-concerning-pipeweed\">Concerning Pipeweed</a>, so the quest reward and the shop stock are the same item. This closes the item's design question: the original card's Bag End housing reward is dropped in favour of gold, XP and pipe-weed-shop access.</div><div><br></div><div><b>2. A persistent \"has ever won\" flag.</b> The shop gate needs to know you <i>won</i>, and the existing concern_hob questcddb key is stamped win or lose, so it cannot serve. On a win, additionally QCD_Stamp(oPC, \"concern_hob_won\"); the test is QCD_LastStamp(oPC, \"concern_hob_won\") != 0. Same trick <a href=\"#idea-spider-silk-harvest\">Spider Silk Harvest</a> uses — a second calendar key as an item-free persistent flag — so no new table and no new library.</div><div><br></div><div><b>3. Odo moves to the Green Dragon Inn</b>, behind the merchant counter, because a shopkeeper belongs at a counter and because he was never placed in Hobbiton in the first place. Mechanically: move the q_hob_enter wrapper off shirehobbiton001.are.json OnEnter and onto <b>greendragoninn.are.json</b>, whose OnEnter is currently a bare leash_to_area — so the wrapper chains identically to how it does in Hobbiton today — and restore Hobbiton's OnEnter to plain leash_to_area. q_hob_spawn itself needs no change: it keys on waypoint tag AP_concerninghobbits_1, which simply gets placed in the inn instead. Note greendragoninn is one door off shirehobbiton001, which is where the new fast travel lands.</div><div><br></div><div><b>Docs to follow:</b> docs.manual/QuestGuide.html#concerning-hobbits says \"Hobbiton\" and \"40-100 gp + 100 XP\" in three places — the TOC row, the summary table row, and the quest card itself.</div>"
    design_questions:
      - question: "The original card's reward was 'Bag End housing access (owner-check workaround, no instancing)'. That is design-sensitive &mdash; which door and interior, persistent housing entry vs. a campaign flag, and what eviction semantics apply &mdash; so a concrete gold/XP/keepsake reward shipped instead and the housing piece was deferred. Should housing access be added later as a win-hook in QHOB_PayOut, and if so on what terms?"
        status: answered
        answer: "Replace reward with new access to pipeweed shop as described in concerning-pipeweed idea. Increase reward from 100gp/xp to 500gp/xp."
        question_h: 64
        answer_h: 135
      - question: "This is a daily quest with a bank of 16 questions, 5 asked per game. What is the pool per season, and are questions re-used within a season? Should it be weekly or one-off instead if the pool is too shallow?"
        status: answered
        answer: "Answered by the shipped design: the bank is 16, five are drawn per game, and both the drawn set and the position of the correct answer are seeded from (year, season) — so within a season the dispute is fixed and server-wide, and it rotates every season. Stays a daily; one attempt per UTC day, win or lose. No change needed."
        question_h: 64
        answer_h: 135
    manual_steps:
      - step: "Place waypoint AP_concerninghobbits_1 in greendragoninn, behind the merchant counter. Odo is script-spawn-only and the scripts no-op gracefully until the waypoint exists, so the quest is unreachable without it. (Supersedes the earlier plan to place it in shirehobbiton001 — do not place it there.)"
        status: open
        kind: toolset
        blocker: true
        step_h: 64
      - step: "UAT: enter the Green Dragon Inn, talk to Odo, accept -> journal concern_hob opens. Confirm Hobbiton's own OnEnter still runs the leash after the wrapper is moved off it."
