      - step: "UAT: the picker lists 18 feats at level 60, and each of the nine new rows greys correctly for a character that fails its prerequisite (Grip without Ambidexterity, Quarry below Ranger 30, Riposte below 60 Parry ranks, Sundering without Called Shot)."
        status: open
