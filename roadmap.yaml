  - id: Gear-to-boost-specific-mage-spells
    title: "Gear to boost specific mage spells"
    group: items-gear
    status: manual
    type: Enhancement
    player: "dc0960 (Dungeon_Crawler)"
    date: "2026-08-05"
    commit: ec2e949abf3816bc4e4a6c165da83c9f156ad84d
    notes: "<div><em>Original ask:</em> \"An item to improve epic summons would be nice, not to make them more tanks, but more dps so they do something vs higher bosses. Or a way to improve spells in general, obviously there are a lot of spells that can't be used as they are — mobs are just immune to them. Like an item to change implosion to do 'chaos' dmg instead of death. As a whole for casters there are very little ways to kill something, its either damage shields, IGMS or epic spell lucky rolls for the majority. So some boosting to lvl 9 spells would be nice.\"</div><div><br></div><div><strong>The problem.</strong> Against high-tier bosses casters hit a wall: bosses are immune to death/instant-kill and to whole swaths of spells, so the only reliable answers left are damage shields, IGMS, and lucky epic-spell rolls. There is no way to make a favourite spell — or your epic summons — actually matter at the top of the roster.</div><div><br></div><div><strong>Concept: caster gear that <em>drops from high-tier bosses</em>.</strong> Each piece is a single equippable that flags its wearer on equip; a scripted hook then reads that flag plus the spell being cast and adjusts the outcome. Four archetypes:</div><ul><li><strong>Spell / School Amplifier</strong> — multiplies a chosen spell's or school's damage by a capped % (e.g. \"Evocation +25%\", or a single named spell). Rides the same spell-id effect-scaling machinery the module already uses to double spell durations.</li><li><strong>Damage Retyper</strong> — rewrites a spell's damage <em>type</em> to an <strong>existing</strong> type the target isn't immune to (e.g. Implosion's death damage → magical or negative), so immune bosses still take the hit. <em>No new damage type is being invented here</em> — this maps only onto existing NWN types; the separate forge \"true damage type\" idea is out of scope for this item.</li><li><strong>Summoner's Gear</strong> — pushes a summon's attack/damage output (DPS, not tankiness — exactly as asked) up to where it matters against high-CR bosses, extending the existing summon-scaling that already boosts summons at spawn.</li><li><strong>Focus / Caster-Level Gear</strong> — temporarily bumps caster level or save DC for a chosen school so save-based level-9 spells can actually land on high-CR targets. The trickiest to balance — treat as a stretch tier.</li></ul><div><strong>Feasibility.</strong> No native item property can boost a specific spell, so all four are scripted — but the plumbing already exists in the module: tag-based equip markers, the spell-cast hook (the same one that runs the Meaningwave counterspell), the spell-id effect-scaling handler that doubles durations, and the summon-boost hook. Reuse, not new engine work.</div><div><br></div><div><strong>Open questions.</strong> One dedicated slot with hard % caps and no stacking of the same effect; which specific spells/schools ship first; and the drop sources / rarity across the boss roster.</div><div><br></div><div><strong>Starter catalogue (2026-07-09).</strong> A concrete first draft of <strong>20 items — five each for Cleric, Druid, Sorcerer and Wizard</strong> is written up, with signature effects, damage dice / caster-level scaling, stat lines tiered to each source boss's challenge rating, and a thematic boss drop for every one (all existing, reachable bosses — no new areas needed). A new design pillar rewards <strong>pure single-class casters</strong> with a stronger version of every effect. See the full table on the wiki: <a href=\"https://homerslotr.com/manual/CasterGear\" target=\"_blank\" rel=\"noopener\">Caster Signature Gear</a> (linked from <a href=\"https://homerslotr.com/manual/Customizations#caster-gear\" target=\"_blank\" rel=\"noopener\">Customizations → Notable Custom Systems</a>).</div><div><br></div><div><b>Shipped 2026-08-05 -- the first piece of Caster Signature Gear is in the module: four Damage Retyper amulets, one for each caster class.</b> Against high-tier bosses your best spell is often the one they are simply immune to; these turn a command to die into damage they actually have to survive. <b>Reliquary of the Unmaking</b> (Cleric) makes Implosion deal divine damage; <b>Heartwood of the Blighted Grove</b> (Druid) makes Finger of Death deal negative damage; <b>Sorrow of the Nine</b> (Sorcerer) makes Wail of the Banshee deal negative damage; <b>Dreamshard of Dol Guldur</b> (Wizard) makes Weird deal magical damage and drops its mind-affecting gate. All four are worn at the neck -- the one dedicated slot for this system, so only ever one retype is active and a second copy does not stack. Damage is one die per caster level (d6; d8 for Finger of Death), capped at 40 dice and 300 per target (400 for Finger of Death); metamagic and spell resistance still apply, and the target now rolls an ordinary Fortitude save for half instead of the death save an immune creature passes for free. <b>Where these drop has not been decided yet, so none of them is obtainable in-game yet.</b></div>"
    notes_h: 460
    impl_notes: "<div><b>Feasibility re-confirmed (autopilot 2026-07-23):</b> no native item property boosts a specific spell, so all four archetypes are scripted, but the plumbing already exists — tag-based equip markers, the module spell-cast hook (same one running the Meaningwave counterspell), the spell-id effect-scaling handler that doubles durations, and the summon-boost hook (summon_boost.nss). The Damage Retyper is the most mechanically contained archetype (a single OnCast interception that swaps an existing damage type) and directly answers the core complaint (bosses immune to death/instant-kill). This is parked rather than built because every archetype shifts high-tier boss balance and the slot/cap/drop policy is the admin's call — see the design questions; on approval the MVP is a small, well-scoped build.</div><div><br></div><div><b>MVP BUILT 2026-08-05 (commit ec2e949abf3).</b> New include cg_retype_inc.nss, called from stop_spellcheat.nss -- the module's SetModuleOverrideSpellscript handler installed by onmoduleload.nss, the same hook fat_inc and q_ent_inc ride. It runs at spell impact immediately before the spell's own impact script; when a retype fires it calls SetModuleOverrideSpellScriptFinished(), so X2PreSpellCastCode() aborts the original nw_s0_* script and the death version never runs -- nothing runs twice.</div><div><b>Hook choice -- why not the equip hook:</b> Mod_OnPlrEqItm and Mod_OnPlrUnEqItm in module.ifo.json are <b>empty / unwired</b>, so an equip-time flag would never have fired. Rather than wire a new module event, the wearer's amulet is re-read from GetItemInSlot(INVENTORY_SLOT_NECK, oCaster) on each cast -- the same live hook the feature already uses, with no persistent flag to desync on relog, death or item swap.</div><div><b>Anti-stacking is structural, not bookkept:</b> (1) only the neck slot is read, and a creature has one -- spares in the pack do nothing; (2) each amulet names exactly one spell id, so two retypes can never touch the same cast; (3) damage is re-derived from scratch each cast, nothing accumulates; (4) hard caps CGR_DICE_CAP=40, CGR_CAP_AOE=300, CGR_CAP_SINGLE=400 per target per cast.</div><div><b>The retype is honest:</b> each branch re-implements the original spell's shape and gating from the real BioWare source (nw_s0_implosion MEDIUM sphere + DC+3, nw_s0_fingdeath single target, nw_s0_wailbansh 10 m / caster-level headcount, nw_s0_weird COLOSSAL sphere with LOS), keeps SignalEvent(EventSpellCastAt), MyResistSpell, metamagic and spellsIsTarget faction filtering, and replaces EffectDeath with EffectDamage of the substituted type. The crux: the save moves from SAVING_THROW_TYPE_DEATH (which death-immune creatures auto-pass -- the actual reason these spells do nothing to bosses) to SAVING_THROW_TYPE_SPELL, success = half damage. PCs only, DMs excluded, NPC casters unaffected; the amulet is inert without a level in its class.</div><div><b>Blueprints:</b> cg_amu_cleric / cg_amu_druid / cg_amu_sorc / cg_amu_wiz, Tag == TemplateResRef, base item 19 (amulet), +6 casting stat, in-character descriptions, priced 9-12 M, filed by PaletteID into Miscellaneous &gt; Jewelry &gt; Amulets. <b>Deliberately not placed</b> on any creature or in any container -- acquisition is design question 4.</div><div><b>Deviations from the draft catalogue:</b> the Wizard piece became an amulet (the dedicated-slot call) and took Weird; Finger of Death moved to a newly-invented Druid amulet (the draft had no Druid retyper); the Destruction / Circle of Death second-spells and the pure-caster upgrade pillar were not built; Wail retypes to negative (the accepted slice) rather than the draft's magical.</div><div>Docs in the same commit: docs.manual/Draft/CasterGear.html (Built/Draft badges, shipped-summary box, four rows rewritten or added) and docs.manual/Customizations.html#caster-gear.</div>"
    impl_notes_h: 115
    design_questions:
      - question: "MVP SCOPE - which archetype ships first? Proposed: the DAMAGE RETYPER as the pilot (most contained + directly fixes the immunity wall). Concrete first slice = 3 amulets that retype a chosen death/instant-kill spell's damage to an existing type the boss is not immune to: (a) Implosion death->magical, (b) Wail of the Banshee death->negative, (c) Finger of Death death->negative. Each is one equippable that sets a PC flag on equip; the existing spell-cast hook reads the flag + the spell id and rewrites the damage. Approve Damage Retyper as MVP, or start with Summoner's Gear (extend summon_boost.nss for DPS) / Spell Amplifier instead?"
        status: answered
        answer: "accept proposed -- add draft backlog ideas for the other types of items (if they don't exist yet)"
        question_h: 87
        answer_h: 64
      - question: "SLOT / CAP / STACKING POLICY (needed before any archetype ships). Proposed: ONE dedicated equip slot for this whole system (suggest amulet OR ring - which?), a hard per-effect cap (e.g. Amplifier +25% max, Focus +2 caster level / +2 DC max), and NO stacking of the same effect (two Evocation amplifiers do not add). This keeps casters relevant without trivialising bosses. Approve the slot choice + caps, or set your own numbers?"
        status: answered
        answer: "yes, dedicated equip slot: amulet"
        question_h: 76
        answer_h: 64
      - question: "CATALOGUE SOURCE. A 20-item 'Caster Signature Gear' starter catalogue (5 each for Cleric/Druid/Sorcerer/Wizard, with signature effects, scaling, per-boss drops, and a pure-single-class bonus pillar) already exists on the wiki (Customizations -> Caster Signature Gear). Should the MVP build a scoped SUBSET of that catalogue (e.g. just the 3 Damage Retyper amulets above, each from its listed boss), or do you want to revise the catalogue first? Confirm the drop sources are still the intended bosses before anything is placed."
        status: answered
        answer: "the 20 catalog draft is a decent starting point but nothing in there has to be final: I want a damage retyper for each class with the first shipment. Propose new item(s) to fill the gap to meet this, and review draft boss drops for these and suggest if you think they make sense, or if not then propose other places or methods to get the items. We do have class-specific quest lines WIP that we could lean on or integrate with, e.g. at level 40 the quest lines tell you which boss has that class gear (and when you fight that boss with the quest active; the boss fight is changed slightly, maybe the boss as dialogue lines it says in combat, or has additional minions, or player has to use a specific item they got earlier in their class quest line to make the boss vulnerable before it can be damaged) -- could also be a new unique boss or bringing in an otherwise unused/inaccessible boss."
        question_h: 84
        answer_h: 98
      - question: "ACQUISITION -- how do players get the four Damage Retyper amulets? They are built and unplaced, awaiting this call. RECOMMENDATION: integrate with the WIP class quest lines rather than plain boss drops. The pieces are class-locked by design (each is inert without levels in its class), so a plain boss drop hands 3 of 4 players a useless item and creates loot-council friction; a class quest line already guarantees the right class gets the right piece, and the level-40 'the quest tells you which boss has your class gear, and the fight changes while the quest is active' beat you described is exactly the shape this item wants. Concretely: cg_amu_cleric -> Heir of Haldor (Dimholt) as the draft suggested (an undead barrow-lord versus a reliquary reads well, and a death-immune boss is the perfect first test of the item's own mechanic); cg_amu_sorc -> Khamul the Ringwraith (Carn Dum: Throne) as drafted (the Nine, exactly on theme); cg_amu_wiz -> Gwathdor Lord of the Dark Arts (Gwathdor: Throne), the draft's home for the wizard necromancy piece and already a marquee endgame area; cg_amu_druid -> no draft source existed, so either Radagast the Brown (Rhosgobel Tower) for a same-area second reward, or a new/unused boss in a blighted-grove setting if you would rather not double up. Also decide: does the 'make the boss vulnerable first with an earlier class-quest item' gate apply to all four, and should the amulets be Plot (undroppable/unsellable) once granted? Approve this mapping, name different sources, or commit to the class-quest route for all four."
        status: open
        answer: null
      - question: "MISSING BACKLOG ITEMS for the other three archetypes. You asked for draft backlog ideas for the other item types; none exist -- roadmap.yaml has nothing for the Spell/School Amplifier, the Summoner's Gear caster item, or the Focus / Caster-Level archetype. (summons-boost is awarded and is the existing at-spawn summon scaling, not an item; boss-caster-dc-spellpen is the NPC-side DC question, not gear.) Autopilot may not mint ideas: entries, so please create three -- caster-gear-amplifier, caster-gear-summoner, caster-gear-focus -- and they will be worked the same way."
        status: open
        answer: null
      - question: "PURE-CASTER BONUS -- build it or drop it? The draft catalogue's design pillar gives single-class casters a stronger version of every effect (bigger dice, higher caps). It was NOT implemented, because it is a balance call rather than a mechanical one. Proposal: implement it as a die-size step only -- d6 to d8 and d8 to d10 for a character whose every level is in the amulet's class, with the damage caps unchanged so the ceiling does not move. Approve, set different numbers, or drop the pillar?"
        status: open
        answer: null
    manual_steps:
      - step: "On approval this becomes a scripting build (equip-flag include + spell-cast-hook interception + the approved item blueprints + boss-drop placement) - re-promote to confirmed. The item blueprints will need palette filing and appearance/equip UAT; boss-drop placement is a per-boss .utc ItemList edit (existing bosses, no new areas)."
        status: done
        kind: uat
        step_h: 64
