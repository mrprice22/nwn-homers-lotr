    commit: ca197e41e9f
    notes: "<div>Withdrawn for redesign. The class quest lines went out as one large batch and lean on each other too heavily — each line is being reworked individually, with its rewards retuned, before any of it returns.</div>"
    impl_notes: "<div>Journal category drd_breath (@group 'Class Lines' @order 8). Giver q_drd_keep (Naldor the Green, Druid 30, plot/immortal) in rhosgobel; offer gated on GetLevelByClass(CLASS_TYPE_DRUID) &gt;= 1, non-druids get a flavour brush-off. Structurally cloned from the shipped ranger-line-early template.</div><div><br></div><div>Three-node one-off arc; per-character state in the drdlinedb campaign DB (key breath_stage 0-&gt;3, advance-only, so rewards are not farmable). Rewards q_drd_amul (+1 WIS amulet, BaseItem 19), q_drd_seed (plot token, BaseItem 24), q_drd_staf (BaseItem 45 quarterstaff, Enhancement +2 / +1 WIS). Use-Limitation:Class subtype 3 = Druid, consistent with the previously verified Cleric 2 / Ranger 7 rows of iprp_classes; staff model parts copied from the existing Ancient Mallorn Staff.</div><div><br></div><div>Rhosgobel OnEnter wrapped q_drd_enter (chains the area's existing leash_to_area) -&gt; q_drd_spawn; conversation q_drd_conv, StartingConditionals q_drd_c_off/s1w/s1r/s2w/s2r/dn, reply scripts q_drd_oath/tok/rtn. DLG follows the reply-gate rule (verified programmatically: Active fields hold only StartingConditionals, action scripts only in Reply Script fields). Build passed all gates (7/7 smoke tests, dialog integrity, 12 scripts compiled / 0 errors).</div><div><br></div><div>Radagast was deliberately not reused as the giver — he already exists as a shopkeeper blueprint with its own store dialog — so Naldor is authored as his pupil. No capstone built; deferred to druid-line-mid/endgame, where the brief's Tom Bombadil and Old Man Willow authoring remains available.</div><hr><div><b>Pulled back for creative rework 2026-08-14</b> (was <i>implemented</i>). Disabled in-game rather than deleted: the giver no longer spawns (QL_LineOff in qline_gate_inc.nss), the journal category is @hidden, and every script, blueprint, conversation, reward item, campaign DB and placed AP_ waypoint is left in the tree. Re-enable by removing this line's token from qline_gate_inc.nss. Pull-back commit 7f387560d69.</div><div><br></div><div><b>Release note as shipped:</b></div><div><b>The Breathing of the World</b> — the first three chapters (L1, L8, L15) of the Druid class line. Naldor the Green, an old Woodman of the vales of Anduin and a pupil of Radagast, keeps the trees about Rhosgobel and teaches the <b>Green Listening</b> — the craft of hearing the slow turning of leaf and root and beast that most folk never hear a note of: the <b>Amulet of the Green Listening</b> at L1, the Seed of the Elder Wood at L8, and the <b>Staff of the Breathing World</b> at L15. Details: <a href=\"QuestGuide.html#breathing-world\">Quest Guide → The Breathing of the World</a>.</div><div><br></div><div><b>Archived manual steps</b> — reinstate these when the line is redesigned:</div><ul><li>[toolset · done] Place waypoint AP_druidlineearly_1 in rhosgobel. Naldor the Green is script-spawn-only and no-ops gracefully until then — the entire quest line is invisible in-game until this is placed.</li><li>[uat] UAT gating: a Druid at Rhosgobel sees Naldor's offer of the Green Listening; a non-druid gets only the civil word about the wood.</li><li>[uat] UAT node 1: accept -&gt; journal drd_breath opens + the druid-restricted Amulet of the Green Listening.</li><li>[uat] UAT level gates: below L8 and below L15 Naldor turns you away.</li><li>[uat] UAT nodes 2-3: at L8 the Seed of the Elder Wood is granted; at L15 it is consumed and the Staff of the Breathing World granted; journal advances 1-&gt;2-&gt;3(End).</li><li>[uat] UAT restrictions: the amulet and the staff are unusable by non-druids.</li><li>[uat] UAT regression: the Rhosgobel leash still fires from the wrapped OnEnter (creatures stay pinned to the area).</li></ul>"

